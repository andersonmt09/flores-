      controls.zoomSpeed = 0.8;
      controls.minDistance = 2.5;
      controls.maxDistance = 24;
      controls.minPolarAngle = 0.3;
      // se puede inclinar la vista hacia arriba para mirar el cielo
      controls.maxPolarAngle = Math.PI * 0.56;
      controls.target.set(0, 1.9, 0);
      controls.autoRotateSpeed = 0.3;
      controls.update();
      const START_TARGET = controls.target.clone();
      const START_CAMERA = camera.position.clone();

      let isPaused = reduceMotion;
      let idleTimer = null;

      function setMotionState(paused) {
        isPaused = paused;
        controls.autoRotate = false;
        motionToggle.setAttribute("aria-label", paused ? "Reanudar movimiento" : "Pausar movimiento");
        motionToggle.title = paused ? "Reanudar movimiento" : "Pausar movimiento";
        pauseIcon.innerHTML = paused
          ? '<path d="m8 5 11 7-11 7V5Z"/>'
          : '<path d="M8 5v14M16 5v14"/>';
      }
      setMotionState(isPaused);

      motionToggle.addEventListener("click", () => setMotionState(!isPaused));

      function hideHint() {
        gestureHint.style.opacity = "0";
        gestureHint.style.transform = "translateY(8px)";
      }
      controls.addEventListener("start", hideHint);
      setTimeout(hideHint, 12000);

      // Teclado: WASD o flechas para caminar, Shift para ir más rápido
      const keys = new Set();
      window.addEventListener("keydown", (e) => {
        if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
        if (document.querySelector(".full-screen-overlay.active")) return;
        const k = e.key.toLowerCase();
        if (["w", "a", "s", "d", "arrowup", "arrowdown", "arrowleft", "arrowright", "shift"].includes(k)) {
          keys.add(k);
          if (k.startsWith("arrow")) e.preventDefault();
          hideHint();
        }
      });
      window.addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
      window.addEventListener("blur", () => keys.clear());

      // Control táctil: joystick para caminar
      const stick = { x: 0, y: 0, active: false, id: null };
      if (joystick && joystickKnob) {
        const radius = 42;
        const moveKnob = (e) => {
          const rect = joystick.getBoundingClientRect();
          let dx = e.clientX - (rect.left + rect.width / 2);
          let dy = e.clientY - (rect.top + rect.height / 2);
          const len = Math.hypot(dx, dy);
          if (len > radius) { dx *= radius / len; dy *= radius / len; }
          stick.x = dx / radius;
          stick.y = -dy / radius;
          joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
        };
        joystick.addEventListener("pointerdown", (e) => {
          stick.active = true;
          stick.id = e.pointerId;
          joystick.setPointerCapture(e.pointerId);
          joystick.classList.add("active");
          moveKnob(e);
          hideHint();
        });
        joystick.addEventListener("pointermove", (e) => { if (stick.active && e.pointerId === stick.id) moveKnob(e); });
        const release = () => {
          stick.active = false;
          stick.x = stick.y = 0;
          joystickKnob.style.transform = "translate(0px, 0px)";
          joystick.classList.remove("active");
        };
        joystick.addEventListener("pointerup", release);
        joystick.addEventListener("pointercancel", release);
      }

      // Volver a la entrada del jardín con un vuelo suave
      let flyHome = null;
      if (homeButton) {
        homeButton.addEventListener("click", () => {
          flyHome = { t: 0, fromT: controls.target.clone(), fromC: camera.position.clone() };
        });
      }

      const forward = new THREE.Vector3();
      const right = new THREE.Vector3();
      const step = new THREE.Vector3();
      function walk(delta) {
        let mx = stick.x, my = stick.y;
        if (keys.has("w") || keys.has("arrowup")) my += 1;
        if (keys.has("s") || keys.has("arrowdown")) my -= 1;
        if (keys.has("a") || keys.has("arrowleft")) mx -= 1;
        if (keys.has("d") || keys.has("arrowright")) mx += 1;
        const len = Math.hypot(mx, my);
        if (len < 0.05) return false;
        if (len > 1) { mx /= len; my /= len; }
        camera.getWorldDirection(forward);
        forward.y = 0;
        forward.normalize();
        right.crossVectors(forward, camera.up).normalize();
        const speed = keys.has("shift") ? 9 : 4.2;
        step.copy(forward).multiplyScalar(my * speed * delta).addScaledVector(right, mx * speed * delta);
        const next = controls.target.clone().add(step);
        const r = Math.hypot(next.x, next.z);
        if (r > GARDEN.edge) {
          // no salir del jardín: se desliza por el borde
          next.x *= GARDEN.edge / r;
          next.z *= GARDEN.edge / r;
          step.subVectors(next, controls.target);
        }
        controls.target.add(step);
        camera.position.add(step);
        return true;
      }

      function resize() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        const aspect = width / height;
        camera.aspect = aspect;
        camera.fov = aspect < 1 ? Math.min(80, 50 * Math.pow(1 / aspect, 0.45)) : 50;
        camera.updateProjectionMatrix();
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, maxPixelRatio));
        renderer.setSize(width, height);
        particleUniforms.uPixelRatio.value = renderer.getPixelRatio();
        starUniforms.uPixelRatio.value = renderer.getPixelRatio();
        if (composer) {
          composer.setPixelRatio(renderer.getPixelRatio());
          composer.setSize(width, height);
        }
      }

      window.addEventListener("resize", resize, { passive: true });
      window.addEventListener("orientationchange", () => window.setTimeout(resize, 120));
      resize();

      const clock = new THREE.Clock();
      let elapsed = 0;
      let bloomClock = 0;
      let lampTimer = 0;
      let cullTimer = 0;
      const lastLampCenter = new THREE.Vector3(1e9, 0, 0);

      function animate() {
        requestAnimationFrame(animate);

        // No renderizar mientras el reproductor cubre la escena (ahorra batería)
        const isOverlayActive =
          document.getElementById("playlistOverlay")?.classList.contains("active") ||
          document.getElementById("musicOverlay")?.classList.contains("active");
        const delta = Math.min(clock.getDelta(), 0.05);
        if (isOverlayActive) return;

        if (!isPaused) elapsed += delta;
        bloomClock += delta;
        windUniforms.uTime.value = elapsed;
        particleUniforms.uTime.value = elapsed;
        skyUniforms.uTime.value = elapsed;
        starUniforms.uTime.value = elapsed;

        walk(delta);
        if (flyHome) {
          flyHome.t = Math.min(1, flyHome.t + delta * 0.6);
          const e = flyHome.t * flyHome.t * (3 - 2 * flyHome.t);
          controls.target.lerpVectors(flyHome.fromT, START_TARGET, e);
          camera.position.lerpVectors(flyHome.fromC, START_CAMERA, e);
          if (flyHome.t >= 1) flyHome = null;
        }

        const wind = Math.sin(elapsed * 0.18) * 0.5 + 0.5;
        const windAmplitude = (0.018 + 0.016 * wind) * (isPaused ? 0 : 1);
        for (const plant of plants) {
          const phase = plant.phase + plant.group.position.x * 0.35;
          plant.group.rotation.z = Math.sin(elapsed * 1.1 + phase) * windAmplitude * plant.sway;
          plant.group.rotation.x = Math.cos(elapsed * 0.8 + phase * 1.3) * windAmplitude * 0.7 * plant.sway;
          if (plant.bloomProgress < 1) {
            const t = bloomClock - plant.bloomDelay;
            if (t > 0) {
              plant.bloomProgress = Math.min(1, plant.bloomProgress + delta * plant.bloomSpeed);
              const ease = 1 - Math.pow(1 - plant.bloomProgress, 3);
              plant.group.scale.set(0.6 + ease * 0.4, Math.max(0.0001, ease), 0.6 + ease * 0.4);
            }
          }
        }

        controls.update();
        // la cámara nunca baja del suelo
        const minY = groundHeight(camera.position.x, camera.position.z) + 0.45;
        if (camera.position.y < minY) camera.position.y = minY;

        // el cielo acompaña a la cámara, como en la realidad
        skyGroup.position.copy(camera.position);

        // sombras de la luna y faroles alrededor de donde estás
        moonLight.target.position.copy(controls.target).setY(0);
        moonLight.position.copy(moonLight.target.position).addScaledVector(moonLightDir, 45);
        lampTimer -= delta;
        if (lampTimer <= 0 || lastLampCenter.distanceToSquared(controls.target) > 4) {
          lampTimer = 0.4;
          lastLampCenter.copy(controls.target);
          updateLampLights(controls.target);
        }
        // solo se dibuja lo que está cerca: la niebla oculta lo lejano
        cullTimer -= delta;
        if (cullTimer <= 0) {
          cullTimer = 0.25;
          for (const mesh of chunkedMeshes) {
            mesh.visible = mesh.userData.center.distanceToSquared(camera.position) < 85 * 85;
          }
        }

        if (composer) composer.render();
        else renderer.render(scene, camera);

          src: "assets/music/HFQp-PZptFg.m4a"
        },
        {
          title: "Vivir el Tiempo",
          artist: "Penyair",
          cover: "https://i.ytimg.com/vi/Ay9h07Z2vcI/hqdefault.jpg",
          src: "assets/music/Ay9h07Z2vcI.m4a"
        },
        {
          title: "Volando bajo (ft. Ruzto)",
          artist: "Penyair",
          cover: "https://i.ytimg.com/vi/6ovduwVuclc/hqdefault.jpg",
          src: "assets/music/6ovduwVuclc.m4a"
        },
        {
          title: "Zenit",
          artist: "Penyair",
          cover: "https://i.ytimg.com/vi/scSt7nVbeC8/hqdefault.jpg",
          src: "assets/music/scSt7nVbeC8.m4a"
        }
      ];

      let currentSongIndex = 0;
      let isPlaying = false;
        let isShuffle = false;
        let isLoop = false;
        
        const shuffleBtn = document.getElementById('shuffleBtn');
        const loopBtn = document.getElementById('loopBtn');
        
        if (shuffleBtn) {
          shuffleBtn.addEventListener('click', () => {
            isShuffle = !isShuffle;
            shuffleBtn.style.opacity = isShuffle ? '1' : '0.5';
            shuffleBtn.style.color = isShuffle ? 'var(--gold)' : 'var(--cream)';
          });
        }
        
        if (loopBtn) {
          loopBtn.addEventListener('click', () => {
            isLoop = !isLoop;
            loopBtn.style.opacity = isLoop ? '1' : '0.5';
            loopBtn.style.color = isLoop ? 'var(--gold)' : 'var(--cream)';
          });
        }

      const audioPlayer = document.getElementById('audioPlayer');
      const playBtn = document.getElementById('playBtn');
      const playIcon = document.getElementById('playIcon');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const albumArt = document.getElementById('albumArt');
      const dynamicBg = document.getElementById('dynamicBg');
      const songTitle = document.getElementById('songTitle');
      const songArtist = document.getElementById('songArtist');
      const progressContainer = document.getElementById('progressContainer');
      const progressBar = document.getElementById('progressBar');
      const currentTimeEl = document.getElementById('currentTime');
      const durationTimeEl = document.getElementById('durationTime');
      const playlistItemsContainer = document.getElementById('playlistItems');
      const playlistSearch = document.getElementById('playlistSearch');
      const playlistCount = document.getElementById('playlistCount');
      const nowPlayingBtn = document.getElementById('nowPlayingBtn');
      const nowPlayingCover = document.getElementById('nowPlayingCover');
      const nowPlayingTitle = document.getElementById('nowPlayingTitle');
      const STORAGE_KEY = 'jardin-musica';

      // Recordar la última canción y el punto donde iba (si el navegador lo permite)
      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ src: playlist[currentSongIndex].src, time: audioPlayer.currentTime || 0 }));
        } catch (e) {}
      }
      function readState() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        } catch (e) {
          return null;
        }
      }
      // Búsqueda sin importar tildes ni mayúsculas
      const normalize = (text) => text.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

      function updateNowPlaying() {
        if (!nowPlayingBtn) return;
        const song = playlist[currentSongIndex];
        nowPlayingTitle.textContent = song.title;
        nowPlayingCover.style.backgroundImage = 'url("' + song.cover + '")';
        const started = !audioPlayer.paused || audioPlayer.currentTime > 0;
        nowPlayingBtn.classList.toggle('visible', started);
        nowPlayingBtn.classList.toggle('playing', !audioPlayer.paused);
      }

      const musicOverlay = document.getElementById('musicOverlay');
      const closeMusicBtn = document.getElementById('closeMusicBtn');
      const openMusicBtn = document.getElementById('openMusicBtn'); 

      
        const playlistOverlay = document.getElementById('playlistOverlay');
        const closePlaylistBtn = document.getElementById('closePlaylistBtn');

        if(openMusicBtn) {
          openMusicBtn.addEventListener('click', (e) => {
            e.preventDefault();
            playlistOverlay.classList.add('active');
            if (document.getElementById('topMenuPanel')) document.getElementById('topMenuPanel').classList.remove('active'); 
          });
        }
        if(closePlaylistBtn) {
          closePlaylistBtn.addEventListener('click', () => {
            playlistOverlay.classList.remove('active');
          });
        }
        if(closeMusicBtn) {
          closeMusicBtn.addEventListener('click', () => {
            musicOverlay.classList.remove('active');
            playlistOverlay.classList.add('active');
          });
        }
function loadSong(index) {
          if(loadingSpinner) loadingSpinner.classList.add("active");
          currentSongIndex = index;
          const song = playlist[currentSongIndex];
          songTitle.textContent = song.title;
          songArtist.textContent = song.artist;
          audioPlayer.src = song.src;
          albumArt.style.backgroundImage = 'url("' + song.cover + '")';
          dynamicBg.style.backgroundImage = 'url("' + song.cover + '")';
          
        if ('mediaSession' in navigator) {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: song.title,
            artist: song.artist,
            album: 'Catálogo Penyair',
            artwork: [
              { src: song.cover, sizes: '512x512', type: 'image/jpeg' }
            ]
          });

          navigator.mediaSession.setActionHandler('play', function() { playAudio(); });
          navigator.mediaSession.setActionHandler('pause', function() { audioPlayer.pause(); });
          navigator.mediaSession.setActionHandler('previoustrack', function() { prevSong(); });
          navigator.mediaSession.setActionHandler('nexttrack', function() { nextSong(false); });
        }
        updateActivePlaylistSong();
        }

        function updateActivePlaylistSong() {
          const items = document.querySelectorAll('#playlistItems .playlist-item');
          items.forEach(item => {
            if (parseInt(item.dataset.index) === currentSongIndex) {
              item.classList.add('active-song');
            } else {
              item.classList.remove('active-song');
            }
          });
        }

      function playAudio() {
        // play() devuelve una promesa que falla si el navegador bloquea el audio
        const attempt = audioPlayer.play();
        if (attempt && attempt.catch) attempt.catch(() => updatePlayState());
      }

      function togglePlay() {
        if (audioPlayer.paused) {
          playAudio();
        } else {
          audioPlayer.pause();
        }
      }

      function updatePlayState() {
        if (audioPlayer.paused) {
          isPlaying = false;
          playIcon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"></polygon>';
          albumArt.classList.remove('playing');
        } else {
          isPlaying = true;
          playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';
          albumArt.classList.add('playing');
        }
        updateNowPlaying();
        saveState();
      }

      function prevSong() {
        const idx = (currentSongIndex - 1 + playlist.length) % playlist.length;
        const wasPlaying = !audioPlayer.paused;
        loadSong(idx);
        if (wasPlaying) playAudio();
      }

      function nextSong(fromEnded) {
        // Repetir solo aplica cuando la canción termina sola; el botón siempre avanza.
        if (isLoop && fromEnded === true) {
          audioPlayer.currentTime = 0;
          playAudio();
          return;
        }
        // Al terminar, el navegador ya marcó el audio como pausado: hay que seguir sonando.
        const wasPlaying = fromEnded === true || !audioPlayer.paused;
        let idx;
        if (isShuffle) {
          idx = Math.floor(Math.random() * playlist.length);
          if (idx === currentSongIndex && playlist.length > 1) {
            idx = (idx + 1) % playlist.length;
          }
        } else {
          idx = (currentSongIndex + 1) % playlist.length;
        }
        loadSong(idx);
        if (wasPlaying) playAudio();
      }

      function updateProgress(e) {
        const duration = e.target.duration;
        const currentTime = e.target.currentTime;
        if(isNaN(duration)) return;
        if (!seeking) progressBar.style.width = (currentTime / duration) * 100 + '%';

        let currentMins = Math.floor(currentTime / 60);
        let currentSecs = Math.floor(currentTime % 60);
        if (currentSecs < 10) currentSecs = '0' + currentSecs;
        currentTimeEl.textContent = currentMins + ':' + currentSecs;
        
        let durationMins = Math.floor(duration / 60);
        let durationSecs = Math.floor(duration % 60);
        if (durationSecs < 10) durationSecs = '0' + durationSecs;
        durationTimeEl.textContent = durationMins + ':' + durationSecs;
      }

      // Tocar o arrastrar la barra (también con el dedo) para mover la canción
      let seeking = false;
      function seekTo(clientX) {
        const rect = progressContainer.getBoundingClientRect();
        const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
        progressBar.style.width = ratio * 100 + '%';
        if (isFinite(audioPlayer.duration)) audioPlayer.currentTime = ratio * audioPlayer.duration;
      }

      function renderPlaylist(filter) {
        filter = filter || "";
        if(!playlistItemsContainer) return;
        playlistItemsContainer.innerHTML = '';
        const query = normalize(filter.trim());
        let shown = 0;
        playlist.forEach((song, index) => {
          if (normalize(song.title).includes(query) || normalize(song.artist).includes(query)) {
            shown += 1;
            const li = document.createElement('li');
            li.className = 'playlist-item ' + (index === currentSongIndex ? 'active-song' : '');
              li.dataset.index = index;
            const img = document.createElement('div');
            img.className = 'playlist-item-img';
            img.style.backgroundImage = 'url("' + song.cover + '")';
            const info = document.createElement('div');
            info.className = 'playlist-item-info';
            const titleEl = document.createElement('p');
            titleEl.className = 'playlist-item-title';
            titleEl.textContent = song.title;
            const artistEl = document.createElement('p');
            artistEl.className = 'playlist-item-artist';
            artistEl.textContent = song.artist;
            info.append(titleEl, artistEl);
            li.append(img, info);
            li.addEventListener('click', () => {
                if (index !== currentSongIndex || audioPlayer.paused) {
                  if (index !== currentSongIndex) {
                    loadSong(index);
                  }
                  playAudio();
                }
                document.getElementById('playlistOverlay').classList.remove('active');
                document.getElementById('musicOverlay').classList.add('active');
              });
            playlistItemsContainer.appendChild(li);
          }
        });
        if (playlistCount) {
          playlistCount.textContent = query ? shown + ' de ' + playlist.length + ' canciones' : playlist.length + ' canciones';
        }
        if (shown === 0) {
          const empty = document.createElement('li');
          empty.className = 'playlist-empty';
          empty.textContent = 'No encontré esa canción';
          playlistItemsContainer.appendChild(empty);
        }
      }

      

      if(playlistSearch) {
        playlistSearch.addEventListener('input', (e) => {
          renderPlaylist(e.target.value);
        });
      }

      if(playBtn) playBtn.addEventListener('click', togglePlay);
      
        const loadingSpinner = document.getElementById('loadingSpinner');
        
        if (audioPlayer) {
          audioPlayer.addEventListener('waiting', () => {
            if (loadingSpinner) loadingSpinner.classList.add('active');
          });
          audioPlayer.addEventListener('playing', () => {
            if (loadingSpinner) loadingSpinner.classList.remove('active');
          });
          audioPlayer.addEventListener('canplay', () => {
            if (loadingSpinner) loadingSpinner.classList.remove('active');
          });
          audioPlayer.addEventListener('loadedmetadata', () => {
            if (loadingSpinner && audioPlayer.paused) loadingSpinner.classList.remove('active');
          });
          audioPlayer.addEventListener('error', () => {
            if (loadingSpinner) loadingSpinner.classList.remove('active');
          });
        }

        if(audioPlayer) {
        audioPlayer.addEventListener('play', updatePlayState);
        audioPlayer.addEventListener('pause', updatePlayState);
        audioPlayer.addEventListener('timeupdate', updateProgress);
        audioPlayer.addEventListener('ended', () => nextSong(true));
        audioPlayer.addEventListener('loadedmetadata', () => {
          let durationMins = Math.floor(audioPlayer.duration / 60);
          let durationSecs = Math.floor(audioPlayer.duration % 60);
          if (durationSecs < 10) durationSecs = '0' + durationSecs;
          if(!isNaN(durationMins)) {
            durationTimeEl.textContent = durationMins + ':' + durationSecs;
          }
        });
      }
      // Toque corto: cambia de canción. Mantener presionado: retrocede o adelanta
      // la canción mientras el dedo siga en el botón; al soltar, se detiene.
      function holdButton(button, onTap, direction) {
        if (!button) return;
        let holdTimer = null;
        let seekTimer = null;
        let held = false;
        const stop = () => {
          clearTimeout(holdTimer);
          clearInterval(seekTimer);
          holdTimer = seekTimer = null;
          button.classList.remove('holding');
        };
        button.addEventListener('pointerdown', (e) => {
          held = false;
          button.setPointerCapture(e.pointerId);
          holdTimer = setTimeout(() => {
            held = true;
            button.classList.add('holding');
            seekTimer = setInterval(() => {
              if (!isFinite(audioPlayer.duration)) return;
              audioPlayer.currentTime = Math.min(Math.max(0, audioPlayer.currentTime + direction * 3), audioPlayer.duration - 0.5);
            }, 150);
          }, 420);
        });
        button.addEventListener('pointerup', () => {
          const wasHeld = held;
          stop();
          if (!wasHeld) onTap();
          else saveState();
        });
        button.addEventListener('pointercancel', stop);
        button.addEventListener('contextmenu', (e) => e.preventDefault());
        // teclado: Enter / Espacio siguen funcionando como un toque
        button.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onTap(); }
        });
      }
      holdButton(prevBtn, () => {
        // como en cualquier reproductor: si ya avanzó, vuelve al inicio de la canción
        if (audioPlayer.currentTime > 4) { audioPlayer.currentTime = 0; return; }
        prevSong();
      }, -1);
      holdButton(nextBtn, () => nextSong(false), 1);
      if (progressContainer) {
        progressContainer.addEventListener('pointerdown', (e) => {
          seeking = true;
          progressContainer.setPointerCapture(e.pointerId);
          seekTo(e.clientX);
        });
        progressContainer.addEventListener('pointermove', (e) => { if (seeking) seekTo(e.clientX); });
        const endSeek = () => { seeking = false; saveState(); };
        progressContainer.addEventListener('pointerup', endSeek);
        progressContainer.addEventListener('pointercancel', endSeek);
      }
      if (nowPlayingBtn) {
        nowPlayingBtn.addEventListener('click', () => musicOverlay.classList.add('active'));
      }
      // Barra espaciadora: reproducir/pausar mientras el reproductor está abierto
      document.addEventListener('keydown', (e) => {
        if (e.code !== 'Space' || !musicOverlay.classList.contains('active')) return;
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON')) return;
        e.preventDefault();
        togglePlay();
      });
      let lastSaved = 0;
      audioPlayer.addEventListener('timeupdate', () => {
        if (Date.now() - lastSaved > 5000) { lastSaved = Date.now(); saveState(); }
      });
      
      
      renderPlaylist("");
      // Retoma la última canción escuchada, en el mismo punto
      const saved = readState();
      const savedIndex = saved ? playlist.findIndex((song) => song.src === saved.src) : -1;
      loadSong(savedIndex >= 0 ? savedIndex : 0);
      if (savedIndex >= 0 && saved.time > 0) {
        audioPlayer.addEventListener('loadedmetadata', () => {
          if (audioPlayer.currentTime === 0 && saved.time < audioPlayer.duration) audioPlayer.currentTime = saved.time;
        }, { once: true });
      }
      updateNowPlaying();

      animate();
    </script>
  </body>
</html>
