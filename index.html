<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#030714" />
    <meta
      name="description"
      content="Una experiencia floral tridimensional de luz, movimiento y color."
    />
    <title>Jardín en 3D</title>
    <style>
      :root {
        color-scheme: dark;
        --cream: #fff7df;
        --muted: rgba(255, 247, 223, 0.68);
        --gold: #ffd45a;
        --line: rgba(255, 224, 126, 0.24);
        --glass: rgba(9, 29, 29, 0.32);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }

      body {
        background: #030714;
        color: var(--cream);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      #app,
      canvas,
      .atmosphere,
      .vignette,
      .grain {
        position: fixed;
        inset: 0;
      }

      #app {
        z-index: 1;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      .atmosphere {
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse 42% 30% at 50% 38%, rgba(255, 201, 58, 0.15), transparent 70%),
          radial-gradient(ellipse 28% 22% at 18% 78%, rgba(92, 177, 130, 0.12), transparent 75%);
      }

      .vignette {
        z-index: 2;
        pointer-events: none;
        background:
          linear-gradient(180deg, rgba(2, 12, 13, 0.22), transparent 30%, transparent 68%, rgba(2, 12, 13, 0.5)),
          radial-gradient(ellipse at center, transparent 36%, rgba(1, 10, 11, 0.54) 100%);
      }

      .grain {
        z-index: 2;
        pointer-events: none;
        opacity: 0.09;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
        mix-blend-mode: soft-light;
      }

      .ui {
        position: fixed;
        inset: 0;
        z-index: 3;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding:
          max(1.25rem, env(safe-area-inset-top, 0px))
          clamp(1.15rem, 4vw, 3.5rem)
          max(1.25rem, env(safe-area-inset-bottom, 0px));
        pointer-events: none;
        opacity: 0;
        animation: arrive 1.15s cubic-bezier(0.22, 1, 0.36, 1) 180ms forwards;
      }

      @keyframes arrive {
        to {
          opacity: 1;
        }
      }

      .masthead {
        max-width: min(31rem, 80vw);
        animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) 280ms both;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(0.8rem);
        }
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        margin: 0 0 0.8rem;
        color: var(--gold);
        font-size: clamp(0.61rem, 1.5vw, 0.72rem);
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 1.75rem;
        height: 1px;
        background: currentColor;
        content: "";
        opacity: 0.76;
      }

      h1 {
        max-width: 11ch;
        margin: 0;
        color: var(--cream);
        font-family: Iowan Old Style, Baskerville, "Times New Roman", Georgia, serif;
        font-size: clamp(2.5rem, 7.1vw, 5.35rem);
        font-weight: 500;
        letter-spacing: -0.052em;
        line-height: 0.91;
        text-wrap: balance;
        text-shadow: 0 0 42px rgba(255, 208, 79, 0.11);
      }

      .message {
        max-width: 24rem;
        margin: 1rem 0 0;
        color: var(--muted);
        font-family: Iowan Old Style, Baskerville, Georgia, serif;
        font-size: clamp(1rem, 2vw, 1.18rem);
        font-style: italic;
        letter-spacing: 0.01em;
        line-height: 1.45;
      }

      .footer {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 1rem;
        width: 100%;
      }

      .interaction {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        max-width: 24rem;
        padding: 0.62rem 0.84rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--glass);
        box-shadow: 0 0.5rem 2.2rem rgba(0, 0, 0, 0.14);
        color: rgba(255, 247, 223, 0.76);
        font-size: clamp(0.68rem, 1.8vw, 0.78rem);
        letter-spacing: 0.025em;
        line-height: 1.2;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition: opacity 500ms ease, transform 500ms ease;
      }

      .interaction svg {
        flex: 0 0 auto;
        width: 1rem;
        height: 1rem;
        color: var(--gold);
      }

      .footer-controls {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        pointer-events: auto;
      }

      .round-button {
        display: inline-grid;
        width: 2.45rem;
        height: 2.45rem;
        place-items: center;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: var(--glass);
        color: var(--cream);
        cursor: pointer;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
      }

      .round-button:hover {
        border-color: rgba(255, 224, 126, 0.52);
        background: rgba(255, 218, 109, 0.13);
        transform: translateY(-2px);
      }

      .round-button:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 3px;
      }

      .round-button svg {
        width: 1rem;
        height: 1rem;
      }

      .top-menu-container {
        position: relative;
        display: block; margin: 0 auto 2rem; width: 250px; height: 250px;
        pointer-events: auto;
      }

      .music-panel {
        position: absolute;
        top: 3.2rem;
        left: 0;
        width: 200px;
        background: var(--glass);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 1rem;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-10px);
        transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
      }

      .music-panel.active {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      .music-panel .panel-title {
        margin: 0 0 0.5rem;
        font-size: 0.85rem;
        color: var(--gold);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .music-panel .song-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .music-panel .song-list li {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.8rem;
        color: var(--muted);
        padding: 0.5rem 0;
        border-bottom: 1px solid rgba(255, 224, 126, 0.1);
        cursor: pointer;
        transition: color 0.2s ease;
      }

      .music-panel .song-list li:hover {
        color: var(--cream);
      }

      .music-panel .song-list li:last-child {
        border-bottom: none;
      }

      .play-icon {
        width: 1rem;
        height: 1rem;
        color: var(--gold);
        flex-shrink: 0;
      }

      .splash-screen {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: radial-gradient(ellipse 120% 80% at 50% 110%, #1b2d55 0%, #0b1736 45%, #030714 100%), #030714;
        opacity: 1;
        visibility: visible;
        transition: opacity 1100ms ease, visibility 1100ms ease;
      }

      .splash-screen.hidden {
        opacity: 0;
        visibility: hidden;
      }

      /* cielo estrellado del inicio */
      .splash-stars,
      .splash-stars::after {
        position: absolute;
        inset: -10%;
        background-image:
          radial-gradient(1.2px 1.2px at 12% 18%, #fff, transparent 60%),
          radial-gradient(1px 1px at 27% 62%, #dfe8ff, transparent 60%),
          radial-gradient(1.6px 1.6px at 41% 24%, #fff6e8, transparent 60%),
          radial-gradient(1px 1px at 58% 78%, #fff, transparent 60%),
          radial-gradient(1.3px 1.3px at 66% 35%, #e6eeff, transparent 60%),
          radial-gradient(1px 1px at 79% 12%, #fff, transparent 60%),
          radial-gradient(1.5px 1.5px at 88% 56%, #fff3df, transparent 60%),
          radial-gradient(1px 1px at 7% 84%, #fff, transparent 60%),
          radial-gradient(1.1px 1.1px at 35% 90%, #dfe8ff, transparent 60%),
          radial-gradient(1px 1px at 93% 88%, #fff, transparent 60%);
        background-size: 360px 360px;
        content: "";
        animation: twinkle 4s ease-in-out infinite alternate;
      }
      .splash-stars::after {
        inset: 0;
        background-size: 230px 230px;
        background-position: 70px 40px;
        animation-delay: -2s;
        opacity: 0.7;
      }
      @keyframes twinkle {
        from { opacity: 0.55; }
        to { opacity: 1; }
      }

      .splash-moon {
        position: absolute;
        top: 14%;
        right: 16%;
        width: clamp(58px, 11vw, 96px);
        aspect-ratio: 1;
        border-radius: 50%;
        background:
          radial-gradient(circle at 35% 38%, rgba(140, 138, 132, 0.28) 0 12%, transparent 13%),
          radial-gradient(circle at 62% 58%, rgba(140, 138, 132, 0.22) 0 16%, transparent 17%),
          radial-gradient(circle at 48% 72%, rgba(140, 138, 132, 0.18) 0 8%, transparent 9%),
          radial-gradient(circle at 38% 35%, #fffdf6, #e8e3d6 70%, #cbc5b6);
        box-shadow: 0 0 40px 10px rgba(190, 210, 255, 0.28), 0 0 120px 40px rgba(120, 150, 230, 0.16);
        animation: moonRise 2.4s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes moonRise {
        from { transform: translateY(30px); opacity: 0; }
      }

      .splash__card {
        position: relative;
        text-align: center;
        padding: 0 1.5rem;
        animation: rise 1.4s cubic-bezier(0.22, 1, 0.36, 1) 200ms both;
      }

      .splash__card h1 {
        max-width: none;
        margin: 0;
        color: #fff7df;
        font-size: clamp(2.6rem, 9vw, 5rem);
        font-weight: 400;
        letter-spacing: 0.18em;
        line-height: 1;
        text-shadow: 0 0 30px rgba(255, 212, 140, 0.35);
      }

      /* control para caminar (pantallas táctiles) */
      .joystick {
        display: none;
        position: relative;
        width: 78px;
        height: 78px;
        flex: 0 0 auto;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 247, 223, 0.06), rgba(9, 20, 40, 0.35));
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        pointer-events: auto;
        touch-action: none;
      }
      .joystick.active { border-color: rgba(255, 212, 90, 0.6); }
      .joystick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 30px;
        height: 30px;
        margin: -15px 0 0 -15px;
        border-radius: 50%;
        background: radial-gradient(circle at 40% 35%, rgba(255, 247, 223, 0.55), rgba(255, 212, 90, 0.25));
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
        transition: transform 80ms linear;
      }
      @media (pointer: coarse) {
        .joystick { display: block; }
      }
      .hint-touch { display: none; }
      @media (pointer: coarse) {
        .hint-touch { display: inline; }
        .hint-desktop { display: none; }
      }
      .footer-left {
        display: flex;
        align-items: end;
        gap: 0.8rem;
        min-width: 0;
      }

      @media (max-width: 540px) {
        .ui {
          padding-left: 1.15rem;
          padding-right: 1.15rem;
        }

        .masthead {
          max-width: 16rem;
        }

        .footer {
          align-items: center;
        }

        .interaction {
          max-width: calc(100vw - 5.5rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
      

      

      /* ---------- MÚSICA ---------- */
      .now-playing {
        display: none;
        align-items: center;
        gap: 0.5rem;
        max-width: min(13rem, 46vw);
        height: 2.45rem;
        padding: 0 0.85rem 0 0.3rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--glass);
        color: var(--cream);
        font: inherit;
        font-size: 0.78rem;
        cursor: pointer;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .now-playing.visible { display: inline-flex; }
      .now-playing-cover { flex: 0 0 auto; width: 1.85rem; height: 1.85rem; border-radius: 50%; background: #1b2436 center / auto 134% no-repeat; }
      .now-playing.playing .now-playing-cover { animation: spin 8s linear infinite; }
      .now-playing-title { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      @keyframes spin { to { transform: rotate(360deg); } }

      .mp-overlay {
        position: fixed;
        inset: 0;
        z-index: 60;
        overflow: hidden;
        background: #060b18;
        color: var(--cream);
        opacity: 0;
        visibility: hidden;
        transform: translateY(14px);
        transition: opacity 260ms ease, transform 260ms ease, visibility 0s linear 260ms;
      }
      .mp-overlay.active {
        opacity: 1;
        visibility: visible;
        transform: none;
        transition: opacity 260ms ease, transform 260ms ease;
      }
      .mp-bg {
        position: absolute;
        inset: -60px;
        background: #0b1430 center / cover no-repeat;
        filter: blur(38px) saturate(1.25) brightness(0.5);
        transform: scale(1.1);
      }
      .mp-overlay::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(4, 8, 20, 0.35) 0%, rgba(4, 8, 20, 0.55) 55%, rgba(4, 8, 20, 0.9) 100%);
        pointer-events: none;
      }
      .mp-sheet {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 30rem;
        height: 100%;
        margin: 0 auto;
        padding: max(0.8rem, env(safe-area-inset-top)) 1.25rem max(1.2rem, env(safe-area-inset-bottom));
      }
      .mp-top {
        display: grid;
        grid-template-columns: 2.75rem 1fr 2.75rem;
        align-items: center;
        flex: 0 0 auto;
        min-height: 3rem;
      }
      .mp-top-title {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.1rem;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(255, 247, 223, 0.8);
      }
      .mp-top-title small {
        font-size: 0.72rem;
        font-weight: 400;
        letter-spacing: 0.02em;
        text-transform: none;
        color: var(--muted);
      }
      .mp-icon-btn {
        display: grid;
        place-items: center;
        width: 2.75rem;
        height: 2.75rem;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--cream);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .mp-icon-btn:active { background: rgba(255, 255, 255, 0.1); }
      .mp-icon-btn svg { width: 1.4rem; height: 1.4rem; }

      /* lista */
      .mp-search {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        flex: 0 0 auto;
        margin: 0.6rem 0 0.8rem;
        padding: 0 0.95rem;
        height: 2.75rem;
        border-radius: 0.9rem;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .mp-search svg { flex: 0 0 auto; width: 1.1rem; height: 1.1rem; color: var(--muted); }
      .mp-search input {
        flex: 1;
        min-width: 0;
        height: 100%;
        border: 0;
        background: transparent;
        color: var(--cream);
        font: inherit;
        font-size: 1rem;
        outline: none;
      }
      .mp-search input::placeholder { color: rgba(255, 247, 223, 0.45); }
      .mp-items {
        flex: 1 1 auto;
        min-height: 0;
        margin: 0 -0.5rem;
        padding: 0 0 1rem;
        list-style: none;
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
      }
      .playlist-item {
        display: grid;
        grid-template-columns: 3.1rem 1fr auto;
        align-items: center;
        gap: 0.85rem;
        padding: 0.45rem 0.5rem;
        border-radius: 0.8rem;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      .playlist-item:active { background: rgba(255, 255, 255, 0.08); }
      @media (hover: hover) { .playlist-item:hover { background: rgba(255, 255, 255, 0.06); } }
      .playlist-item-img {
        width: 3.1rem;
        height: 3.1rem;
        border-radius: 0.55rem;
        background: #1b2436 center / auto 134% no-repeat;
      }
      .playlist-item-info { min-width: 0; }
      .playlist-item-title, .playlist-item-artist {
        margin: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .playlist-item-title { font-size: 0.98rem; line-height: 1.3; }
      .playlist-item-artist { margin-top: 0.15rem; font-size: 0.8rem; color: var(--muted); }
      .playlist-item-eq { display: none; gap: 2px; align-items: end; height: 0.9rem; padding-right: 0.3rem; }
      .playlist-item-eq i { width: 3px; background: var(--gold); border-radius: 1px; animation: eq 0.9s ease-in-out infinite; }
      .playlist-item-eq i:nth-child(2) { animation-delay: -0.3s; }
      .playlist-item-eq i:nth-child(3) { animation-delay: -0.6s; }
      @keyframes eq { 0%, 100% { height: 30%; } 50% { height: 100%; } }
      .playlist-item.active-song .playlist-item-title { color: var(--gold); }
      .playlist-item.active-song .playlist-item-eq { display: flex; }
      .playlist-item.active-song:not(.is-playing) .playlist-item-eq i { animation-play-state: paused; }
      .playlist-empty { padding: 2.5rem 0; text-align: center; color: var(--muted); }

      /* reproductor */
      .mp-player { justify-content: space-between; }
      .mp-art-wrap {
        position: relative;
        flex: 0 1 auto;
        width: min(100%, 44vh, 22rem);
        aspect-ratio: 1;
        margin: 1.2rem auto 0;
      }
      .mp-art {
        width: 100%;
        height: 100%;
        border-radius: 1.1rem;
        background: #1b2436 center / auto 134% no-repeat;
        box-shadow: 0 1.5rem 3.5rem rgba(0, 0, 0, 0.5);
        transform: scale(0.94);
        transition: transform 400ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      .mp-art.playing { transform: none; }
      .mp-spinner {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 2.6rem;
        height: 2.6rem;
        margin: -1.3rem 0 0 -1.3rem;
        border: 3px solid rgba(255, 255, 255, 0.25);
        border-top-color: var(--gold);
        border-radius: 50%;
        opacity: 0;
        animation: spin 0.8s linear infinite;
        transition: opacity 200ms ease;
        pointer-events: none;
      }
      .mp-spinner.active { opacity: 1; }
      .mp-bottom { display: flex; flex-direction: column; gap: 1.1rem; padding-top: 1.2rem; }
      .mp-meta { min-width: 0; }
      .mp-meta h2 {
        margin: 0;
        overflow: hidden;
        font-family: inherit;
        font-size: 1.35rem;
        font-weight: 600;
        line-height: 1.25;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .mp-meta p { margin: 0.25rem 0 0; font-size: 0.95rem; color: var(--muted); }
      .mp-track {
        position: relative;
        height: 1.6rem;
        cursor: pointer;
        touch-action: none;
      }
      .mp-track::before, .mp-fill {
        content: "";
        position: absolute;
        left: 0;
        top: 50%;
        height: 4px;
        margin-top: -2px;
        border-radius: 2px;
      }
      .mp-track::before { right: 0; background: rgba(255, 255, 255, 0.18); }
      .mp-fill { width: 0; background: var(--cream); }
      .mp-fill::after {
        content: "";
        position: absolute;
        right: -6px;
        top: -4px;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--cream);
        box-shadow: 0 0 6px rgba(0, 0, 0, 0.4);
      }
      .mp-times {
        display: flex;
        justify-content: space-between;
        margin-top: -0.2rem;
        font-size: 0.75rem;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }
      .mp-controls {
        display: grid;
        grid-template-columns: 1fr 1fr auto 1fr 1fr;
        align-items: center;
        justify-items: center;
      }
      .btn-control {
        display: grid;
        place-items: center;
        width: 3rem;
        height: 3rem;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--cream);
        cursor: pointer;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        transition: transform 120ms ease, color 120ms ease, background 120ms ease;
      }
      .btn-control svg { width: 1.6rem; height: 1.6rem; }

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { mergeGeometries, mergeVertices } from "three/addons/utils/BufferGeometryUtils.js";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

      const container = document.getElementById("app");
      const motionToggle = document.getElementById("motionToggle");
      const pauseIcon = document.getElementById("pauseIcon");
      const gestureHint = document.getElementById("gestureHint");
      const splashScreen = document.getElementById("splashScreen");
      const topMenuToggle = document.getElementById("topMenuToggle");
      const topMenuPanel = document.getElementById("topMenuPanel");
      const joystick = document.getElementById("joystick");
      const joystickKnob = document.getElementById("joystickKnob");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const compactViewport = window.matchMedia("(max-width: 640px)").matches;
      const coarsePointer = window.matchMedia("(pointer: coarse)").matches;
      const lowPower = compactViewport || coarsePointer || (navigator.hardwareConcurrency || 8) <= 4;
      // Escala de cantidades: el móvil recibe el mismo jardín pero más ligero.
      const Q = lowPower ? 0.45 : 1;
      // Ajustes por tipo de equipo. En celulares todo lo caro (sombras, luces
      // reales, cielo y suelo calculados en cada píxel) se precalcula una vez.
      const TIER = lowPower
        ? { prStart: 1, prMax: 1.25, prMin: 0.6, fog: [16, 72], flowerCull: 48, grassCull: 22, lodNear: 13, lampLights: 0, shadows: false }
        : { prStart: 1.5, prMax: 1.75, prMin: 0.75, fog: [22, 95], flowerCull: 85, grassCull: 40, lodNear: 24, lampLights: 4, shadows: true };
      // Material base: Lambert es mucho más barato en GPUs de gama baja
      const lit = (params) => {
        if (lowPower) {
          const { roughness, metalness, ...rest } = params;
          return new THREE.MeshLambertMaterial(rest);
        }
        return new THREE.MeshStandardMaterial(params);
      };

      if (topMenuToggle && topMenuPanel) {
        topMenuToggle.addEventListener("click", () => {
          topMenuPanel.classList.toggle("active");
        });
      }

      // La pantalla de inicio se va cuando el jardín ya está construido
      function hideSplash() {
        if (splashScreen) splashScreen.classList.add("hidden");
      }

      // ---------- RENDER ----------
      const renderer = new THREE.WebGLRenderer({
        antialias: !lowPower,
        powerPreference: "high-performance"
      });
      // Resolución adaptable: empieza moderada y se ajusta sola según los FPS reales
      const dpr = window.devicePixelRatio || 1;
      const maxPixelRatio = Math.min(dpr, TIER.prMax);
      const minPixelRatio = Math.min(dpr, TIER.prMin);
      let pixelRatio = Math.min(dpr, TIER.prStart);
      renderer.setPixelRatio(pixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.25;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.shadowMap.enabled = TIER.shadows;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);
      document.documentElement.classList.add("webgl-ready");

      const scene = new THREE.Scene();
      const fogColor = new THREE.Color("#0d1b38");
      scene.fog = new THREE.Fog(fogColor, TIER.fog[0], TIER.fog[1]);
      scene.background = fogColor;

      const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 600);
      camera.position.set(0.6, 3.1, 15.5);

      // Luna baja delante de la entrada: se ve desde la vista inicial
      const moonSkyDir = new THREE.Vector3(-0.3, 0.3, -1).normalize();
      const moonLightDir = new THREE.Vector3(-0.35, 0.75, -1).normalize();

      // ---------- RUIDO (JS) ----------
      function hash2(x, z) {
        const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453;
        return s - Math.floor(s);
      }
      function valueNoise(x, z) {
        const ix = Math.floor(x), iz = Math.floor(z);
        const fx = x - ix, fz = z - iz;
        const ux = fx * fx * (3 - 2 * fx), uz = fz * fz * (3 - 2 * fz);
        const a = hash2(ix, iz), b = hash2(ix + 1, iz), c = hash2(ix, iz + 1), d = hash2(ix + 1, iz + 1);
        return a + (b - a) * ux + (c - a) * uz + (a - b - c + d) * ux * uz;
      }
      function fbm(x, z) {
        let v = 0, amp = 0.5, f = 1;
        for (let i = 0; i < 4; i += 1) {
          v += valueNoise(x * f, z * f) * amp;
          f *= 2.03;
          amp *= 0.5;
        }
        return v;
      }
      function groundHeight(x, z) {
        const r = Math.hypot(x, z);
        const rise = THREE.MathUtils.smoothstep(r, 64, 110);
        return rise * (fbm(x * 0.03 + 7, z * 0.03 - 3) * 12 - 1.5);
      }

      function seededRandom(seed) {
        let state = seed % 2147483647;
        if (state <= 0) state += 2147483646;
        return () => {
          state = (state * 16807) % 2147483647;
          return (state - 1) / 2147483646;
        };
      }
      const random = seededRandom(20260921);

      // ---------- DISEÑO DEL JARDÍN ----------
      // Centro: macizo de tulipanes, sendero en anillo y seis parterres con seto.
      // Alrededor: un gran jardín con avenidas en cruz, dos anillos de paseo,
      // campos de tulipanes en franjas de colores y praderas de lirios araña.
      const GARDEN = {
        centerBed: 3.2,
        pathInner: 3.45,
        pathOuter: 4.65,
        bedInner: 5.0,
        bedOuter: 8.7,
        hedge: 10.3,
        sectorCount: 6,
        walkHalf: 0.55,
        ring1: [12.2, 13.6],
        ring2: [34.4, 35.8],
        avenueHalf: 1.1,
        tulipField: [15.5, 33.2],
        lilyField: [37.5, 58],
        edge: 62
      };
      const SECTOR = (Math.PI * 2) / GARDEN.sectorCount;

      function sectorInfo(x, z) {
        const r = Math.hypot(x, z);
        // desfase de 30°: los pasillos quedan en el eje z, donde están las entradas
        const theta = Math.atan2(z, x) - SECTOR / 2;
        let a = theta % SECTOR;
        if (a < 0) a += SECTOR;
        const index = Math.round((theta - a) / SECTOR + 6) % 6;
        const local = a - SECTOR / 2;
        const edge = (SECTOR / 2 - Math.abs(local)) * r;
        return { r, theta, index, edge };
      }
      function onAvenue(x, z, margin = 0) {
        const r = Math.hypot(x, z);
        const half = GARDEN.avenueHalf + margin;
        const zAxis = Math.abs(x) < half && r > GARDEN.pathOuter - 0.2 && r < GARDEN.edge + 1;
        const xAxis = Math.abs(z) < half && r > GARDEN.ring1[0] && r < GARDEN.edge + 1;
        return zAxis || xAxis;
      }
      function onPath(x, z, margin = 0.12) {
        const r = Math.hypot(x, z);
        if (r > GARDEN.pathInner - margin && r < GARDEN.pathOuter + margin) return true;
        if (r > GARDEN.ring1[0] - margin && r < GARDEN.ring1[1] + margin) return true;
        if (r > GARDEN.ring2[0] - margin && r < GARDEN.ring2[1] + margin) return true;
        if (r < GARDEN.hedge + 1) return Math.abs(x) < 0.62 && r > GARDEN.pathOuter - 0.2;
        return onAvenue(x, z, margin);
      }
      function inBed(x, z, margin = 0) {
        const s = sectorInfo(x, z);
        if (s.r < GARDEN.centerBed - margin) return "center";
        if (s.r > GARDEN.bedInner + margin && s.r < GARDEN.bedOuter - margin && s.edge > GARDEN.walkHalf + margin) {
          return s.index;
        }
        return null;
      }
      // Franjas de tierra de los campos de tulipanes (en los cuatro cuadrantes)
      const STRIPE = 2.3;
      const STRIPE_SOIL = 1.45;
      function tulipStripe(x, z, margin = 0) {
        const r = Math.hypot(x, z);
        if (r < GARDEN.tulipField[0] + margin || r > GARDEN.tulipField[1] - margin) return -1;
        if (Math.abs(x) < GARDEN.avenueHalf + 1.4 + margin || Math.abs(z) < GARDEN.avenueHalf + 1.4 + margin) return -1;
        const v = (Math.abs(z) % STRIPE);
        if (v < margin || v > STRIPE_SOIL - margin) return -1;
        return Math.floor(Math.abs(z) / STRIPE);
      }

      // ---------- CIELO NOCTURNO ----------
      const NOISE_GLSL = `
        float gHash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float gNoise(vec2 p) {
          vec2 i = floor(p); vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          float a = gHash(i), b = gHash(i + vec2(1.0, 0.0));
          float c = gHash(i + vec2(0.0, 1.0)), d = gHash(i + vec2(1.0, 1.0));
          return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
        }
        float gFbm(vec2 p) {
          float v = 0.0; float a = 0.5;
          for (int i = 0; i < 5; i++) { v += gNoise(p) * a; p = p * 2.03 + 17.0; a *= 0.5; }
          return v;
        }
      `;

      const skyUniforms = {
        uMoonDir: { value: moonSkyDir },
        uTop: { value: new THREE.Color("#030714") },
        uMid: { value: new THREE.Color("#0b1736") },
        uHorizon: { value: fogColor.clone() },
        uTime: { value: 0 }
      };
      const sky = new THREE.Mesh(
        new THREE.SphereGeometry(400, 48, 24),
        new THREE.ShaderMaterial({
          uniforms: skyUniforms,
          side: THREE.BackSide,
          depthWrite: false,
          fog: false,
          vertexShader: `
            varying vec3 vDir;
            void main() {
              vDir = normalize(position);
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform vec3 uMoonDir; uniform vec3 uTop; uniform vec3 uMid; uniform vec3 uHorizon;
            uniform float uTime;
            varying vec3 vDir;
            ${NOISE_GLSL}
            void main() {
              vec3 dir = normalize(vDir);
              float h = dir.y;
              vec3 col = mix(uHorizon, uMid, smoothstep(-0.02, 0.22, h));
              col = mix(col, uTop, smoothstep(0.2, 0.9, h));
              // resplandor de la luna sobre el cielo
              float md = max(dot(dir, uMoonDir), 0.0);
              col += vec3(0.35, 0.45, 0.75) * (pow(md, 6.0) * 0.18 + pow(md, 60.0) * 0.35);
              // Vía Láctea: banda difusa inclinada atravesando el cielo
              vec3 axis = normalize(vec3(0.55, 0.35, 0.76));
              float band = 1.0 - abs(dot(dir, axis));
              float milky = pow(band, 14.0);
              vec2 muv = vec2(atan(dir.z, dir.x) * 3.0, dir.y * 6.0);
              float dust = gFbm(muv * 1.4) ;
              float lanes = smoothstep(0.35, 0.75, gFbm(muv * 3.1 + 5.0));
              float clumps = gFbm(muv * 7.0 - 3.0);
              milky *= (0.4 + dust * 0.9 + clumps * 0.35) * (1.0 - lanes * 0.6);
              float core = pow(band, 40.0) * smoothstep(0.3, 0.8, dust);
              vec3 milkyCol = mix(vec3(0.42, 0.46, 0.66), vec3(0.62, 0.55, 0.48), core);
              col += milkyCol * (milky * 0.3 + core * 0.12) * smoothstep(0.02, 0.3, h);
              // nubes nocturnas muy tenues, iluminadas por la luna
              vec2 cuv = dir.xz / (h + 0.15);
              float n = gFbm(cuv * 0.7 + vec2(uTime * 0.004, 0.0));
              float cloud = smoothstep(0.58, 0.85, n) * smoothstep(0.02, 0.2, h) * (1.0 - smoothstep(0.4, 0.8, h));
              col = mix(col, vec3(0.07, 0.09, 0.17) + vec3(0.2, 0.22, 0.3) * pow(md, 4.0), cloud * 0.45);
              col = mix(col, uHorizon, smoothstep(0.0, -0.1, h));
              gl_FragColor = vec4(col, 1.0);
              #include <tonemapping_fragment>
              #include <colorspace_fragment>
            }
          `
        })
      );
      sky.renderOrder = -10;
      // el cielo entero (estrellas, luna) viaja con la cámara
      const skyGroup = new THREE.Group();
      scene.add(skyGroup);
      // El cielo (degradado, Vía Láctea, nubes) se pinta UNA sola vez en un cubemap:
      // así cada cuadro solo lee una textura en vez de calcular ruido por píxel.
      {
        const skyRT = new THREE.WebGLCubeRenderTarget(lowPower ? 512 : 1024, { generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter });
        skyRT.texture.colorSpace = THREE.SRGBColorSpace;
        const skyScene = new THREE.Scene();
        skyScene.add(sky);
        const cubeCamera = new THREE.CubeCamera(1, 1000, skyRT);
        cubeCamera.update(renderer, skyScene);
        skyScene.remove(sky);
        sky.geometry.dispose();
        sky.material.dispose();
        scene.background = skyRT.texture;
      }

      // Estrellas: brillo y color según su magnitud, con titileo suave
      const starUniforms = { uTime: { value: 0 }, uPixelRatio: { value: renderer.getPixelRatio() } };
      const starMaterial = new THREE.ShaderMaterial({
        uniforms: starUniforms,
        transparent: true,
        depthWrite: false,
        fog: false,
        blending: THREE.AdditiveBlending,
        vertexShader: `
          attribute float size; attribute vec3 tint; attribute float seed;
          uniform float uTime; uniform float uPixelRatio;
          varying vec3 vColor;
          void main() {
            float tw = 0.75 + 0.25 * sin(uTime * (1.5 + seed * 3.0) + seed * 50.0);
            vColor = tint * tw;
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            gl_PointSize = size * uPixelRatio;
            gl_Position = projectionMatrix * mv;
          }
        `,
        fragmentShader: `
          varying vec3 vColor;
          void main() {
            float d = length(gl_PointCoord - 0.5);
            float core = exp(-d * d * 60.0);
            float halo = exp(-d * d * 12.0) * 0.25;
            gl_FragColor = vec4(vColor * (core + halo), 1.0);
            #include <tonemapping_fragment>
            #include <colorspace_fragment>
          }
        `
      });
      const SKY_R = 330;
      function skyDirection(azimuthDeg, altitudeDeg) {
        // azimut 0 = hacia la luna (-z), positivo hacia la derecha (+x)
        const az = THREE.MathUtils.degToRad(azimuthDeg);
        const alt = THREE.MathUtils.degToRad(altitudeDeg);
        return new THREE.Vector3(Math.sin(az) * Math.cos(alt), Math.sin(alt), -Math.cos(az) * Math.cos(alt));
      }
      function starColor(t) {
        // de azulado a dorado, como las temperaturas reales
        const c = new THREE.Color();
        if (t < 0.25) c.setRGB(0.75, 0.82, 1.0);
        else if (t < 0.75) c.setRGB(1.0, 0.97, 0.92);
        else c.setRGB(1.0, 0.82, 0.62);
        return c;
      }
      {
        const count = lowPower ? 2600 : 5000;
        const positions = [], sizes = [], tints = [], seeds = [];
        const v = new THREE.Vector3();
        for (let i = 0; i < count; i += 1) {
          // uniformes en la esfera, solo sobre el horizonte
          const y = random() * 0.98 + 0.02;
          const a = random() * Math.PI * 2;
          const rr = Math.sqrt(1 - y * y);
          v.set(Math.cos(a) * rr, y, Math.sin(a) * rr).multiplyScalar(SKY_R);
          positions.push(v.x, v.y, v.z);
          const mag = Math.pow(random(), 7);
          sizes.push(1.2 + mag * 5.5);
          const c = starColor(random()).multiplyScalar(0.35 + mag * 1.6);
          tints.push(c.r, c.g, c.b);
          seeds.push(random());
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        g.setAttribute("size", new THREE.Float32BufferAttribute(sizes, 1));
        g.setAttribute("tint", new THREE.Float32BufferAttribute(tints, 3));
        g.setAttribute("seed", new THREE.Float32BufferAttribute(seeds, 1));
        const stars = new THREE.Points(g, starMaterial);
        stars.renderOrder = -9;
        skyGroup.add(stars);
      }

      // Constelaciones reales (ascensión recta en horas, declinación en grados),
      // colocadas alrededor del cielo conservando su forma.
      const CONSTELLATIONS = [
        {
          name: "Orión", az: -48, alt: 24, scale: 1.05,
          stars: [[5.919, 7.41, 0.5], [5.418, 6.35, 1.6], [5.679, -1.94, 1.7], [5.604, -1.2, 1.7], [5.533, -0.3, 2.2], [5.796, -9.67, 2.1], [5.242, -8.2, 0.1], [5.585, 9.93, 3.4]],
          lines: [[7, 0], [7, 1], [0, 2], [1, 4], [2, 3], [3, 4], [2, 5], [4, 6]]
        },
        {
          name: "Osa Mayor", az: 30, alt: 26, scale: 1.0,
          stars: [[11.062, 61.75, 1.8], [11.031, 56.38, 2.3], [11.897, 53.69, 2.4], [12.257, 57.03, 3.3], [12.9, 55.96, 1.8], [13.399, 54.93, 2.2], [13.792, 49.31, 1.9]],
          lines: [[0, 1], [1, 2], [2, 3], [3, 0], [3, 4], [4, 5], [5, 6]]
        },
        {
          name: "Casiopea", az: 105, alt: 34, scale: 1.2,
          stars: [[0.153, 59.15, 2.3], [0.675, 56.54, 2.2], [0.945, 60.72, 2.4], [1.43, 60.24, 2.7], [1.907, 63.67, 3.4]],
          lines: [[0, 1], [1, 2], [2, 3], [3, 4]]
        },
        {
          name: "Cisne", az: 160, alt: 40, scale: 1.0,
          stars: [[20.69, 45.28, 1.3], [20.37, 40.26, 2.2], [20.77, 33.97, 2.5], [19.75, 45.13, 2.9], [19.512, 27.96, 3.1]],
          lines: [[0, 1], [1, 4], [2, 1], [1, 3]]
        },
        {
          name: "Cruz del Sur", az: -105, alt: 20, scale: 1.4,
          stars: [[12.443, -63.1, 0.8], [12.795, -59.69, 1.3], [12.519, -57.11, 1.6], [12.252, -58.75, 2.8]],
          lines: [[0, 2], [1, 3]]
        },
        {
          name: "Escorpión", az: -150, alt: 30, scale: 0.95,
          stars: [[16.091, -19.81, 2.6], [16.006, -22.62, 2.3], [15.981, -26.11, 2.9], [16.49, -26.43, 1.0], [16.598, -28.22, 2.8], [16.836, -34.29, 2.3], [16.864, -38.05, 3.0], [16.91, -42.36, 3.6], [17.202, -43.24, 3.3], [17.622, -43.0, 1.9], [17.793, -40.13, 3.0], [17.708, -39.03, 2.4], [17.56, -37.1, 1.6]],
          lines: [[0, 1], [1, 2], [1, 3], [3, 4], [4, 5], [5, 6], [6, 7], [7, 8], [8, 9], [9, 10], [10, 11], [11, 12]]
        },
        {
          name: "Lira", az: 72, alt: 52, scale: 1.6,
          stars: [[18.616, 38.78, 0.0], [18.746, 37.6, 4.3], [18.908, 36.9, 4.3], [18.982, 32.69, 3.2], [18.835, 33.36, 3.5]],
          lines: [[0, 1], [1, 2], [2, 3], [3, 4], [4, 1]]
        }
      ];
      {
        const linePositions = [];
        const pts = [], sizes = [], tints = [], seeds = [];
        for (const c of CONSTELLATIONS) {
          const ra0 = c.stars.reduce((s, st) => s + st[0], 0) / c.stars.length;
          const dec0 = c.stars.reduce((s, st) => s + st[1], 0) / c.stars.length;
          const center = skyDirection(c.az, c.alt);
          // base tangente: derecha y arriba en el cielo
          const right = new THREE.Vector3().crossVectors(new THREE.Vector3(0, 1, 0), center).normalize().negate();
          const up = new THREE.Vector3().crossVectors(center, right).normalize().negate();
          if (up.y < 0) up.negate();
          const world = c.stars.map(([ra, dec, mag]) => {
            let dra = ra - ra0;
            if (dra > 12) dra -= 24;
            if (dra < -12) dra += 24;
            // el este queda a la izquierda al mirar el cielo
            const dx = -dra * 15 * Math.cos(THREE.MathUtils.degToRad(dec0)) * c.scale;
            const dy = (dec - dec0) * c.scale;
            const p = center.clone()
              .addScaledVector(right, Math.tan(THREE.MathUtils.degToRad(dx)))
              .addScaledVector(up, Math.tan(THREE.MathUtils.degToRad(dy)))
              .normalize()
              .multiplyScalar(SKY_R - 2);
            pts.push(p.x, p.y, p.z);
            const bright = Math.max(0.25, 1.0 - mag / 4.5);
            sizes.push(3.5 + bright * 7);
            const col = starColor(mag < 1 ? 0.1 : 0.5).multiplyScalar(0.8 + bright * 1.6);
            tints.push(col.r, col.g, col.b);
            seeds.push(random());
            return p;
          });
          for (const [a, b] of c.lines) {
            linePositions.push(world[a].x, world[a].y, world[a].z, world[b].x, world[b].y, world[b].z);
          }
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.Float32BufferAttribute(pts, 3));
        g.setAttribute("size", new THREE.Float32BufferAttribute(sizes, 1));
        g.setAttribute("tint", new THREE.Float32BufferAttribute(tints, 3));
        g.setAttribute("seed", new THREE.Float32BufferAttribute(seeds, 1));
        const bright = new THREE.Points(g, starMaterial);
        bright.renderOrder = -8;
        skyGroup.add(bright);
        const lg = new THREE.BufferGeometry();
        lg.setAttribute("position", new THREE.Float32BufferAttribute(linePositions, 3));
        const lines = new THREE.LineSegments(
          lg,
          new THREE.LineBasicMaterial({ color: 0x9fb8ee, transparent: true, opacity: 0.17, depthWrite: false, fog: false, blending: THREE.AdditiveBlending })
        );
        lines.renderOrder = -8;
        skyGroup.add(lines);
      }

      // Luna llena: mapa real de la superficie lunar (mares y cráteres de verdad)
      // sobre una esfera, con un halo suave alrededor.
      const MOON_DIST = 300;
      const moon = new THREE.Group();
      {
        const geometry = new THREE.SphereGeometry(13, 48, 32);
        geometry.rotateY(-Math.PI / 2); // la cara visible mira hacia nosotros
        const texture = new THREE.TextureLoader().load("assets/images/luna.jpg");
        texture.colorSpace = THREE.SRGBColorSpace;
        const material = new THREE.ShaderMaterial({
          uniforms: { map: { value: texture } },
          fog: false,
          vertexShader: `
            varying vec2 vUv; varying vec3 vN; varying vec3 vV;
            void main() {
              vUv = uv;
              vN = normalize(normalMatrix * normal);
              vec4 mv = modelViewMatrix * vec4(position, 1.0);
              vV = normalize(-mv.xyz);
              gl_Position = projectionMatrix * mv;
            }
          `,
          fragmentShader: `
            uniform sampler2D map;
            varying vec2 vUv; varying vec3 vN; varying vec3 vV;
            void main() {
              vec3 albedo = texture2D(map, vUv).rgb;
              // luna llena: casi sin sombra, con el borde un poco más tenue
              float mu = max(dot(normalize(vN), normalize(vV)), 0.0);
              float limb = 0.72 + 0.28 * pow(mu, 0.5);
              vec3 col = albedo * vec3(1.02, 1.0, 0.95) * limb * 2.1 + vec3(0.02, 0.025, 0.04);
              gl_FragColor = vec4(col, 1.0);
              #include <tonemapping_fragment>
              #include <colorspace_fragment>
            }
          `
        });
        const sphere = new THREE.Mesh(geometry, material);
        moon.add(sphere);
        // halo de dispersión en la atmósfera
        const canvas = document.createElement("canvas");
        canvas.width = canvas.height = 256;
        const ctx = canvas.getContext("2d");
        const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
        g.addColorStop(0, "rgba(200, 215, 255, 0.55)");
        g.addColorStop(0.22, "rgba(170, 190, 245, 0.22)");
        g.addColorStop(0.5, "rgba(130, 155, 225, 0.06)");
        g.addColorStop(1, "rgba(110, 135, 210, 0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 256, 256);
        const haloTexture = new THREE.CanvasTexture(canvas);
        haloTexture.colorSpace = THREE.SRGBColorSpace;
        const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: haloTexture, fog: false, depthWrite: false, transparent: true, blending: THREE.AdditiveBlending }));
        halo.scale.setScalar(120);
        halo.renderOrder = -8;
        moon.add(halo);
      }
      moon.position.copy(moonSkyDir).multiplyScalar(MOON_DIST);
      moon.lookAt(0, 0, 0);
      moon.renderOrder = -7;
      skyGroup.add(moon);

      // ---------- LUCES ----------
      scene.add(new THREE.HemisphereLight(0x5f7ec4, 0x1a2a1a, 0.95));
      const moonLight = new THREE.DirectionalLight(0xb9cdff, 1.35);
      moonLight.castShadow = TIER.shadows;
      moonLight.shadow.mapSize.set(2048, 2048);
      moonLight.shadow.camera.left = -16;
      moonLight.shadow.camera.right = 16;
      moonLight.shadow.camera.top = 16;
      moonLight.shadow.camera.bottom = -16;
      moonLight.shadow.camera.near = 5;
      moonLight.shadow.camera.far = 80;
      moonLight.shadow.bias = -0.0004;
      moonLight.shadow.normalBias = 0.03;
      moonLight.shadow.radius = 4;
      scene.add(moonLight, moonLight.target);
      // relleno suave para que las flores no se vean opacas
      const fillLight = new THREE.DirectionalLight(0x9fb4ff, 0.35);
      fillLight.position.set(6, 8, 14);
      scene.add(fillLight);

      // ---------- MATERIALES: VIENTO Y LUZ DE FAROLES ----------
      const windUniforms = { uTime: { value: 0 } };
      // Ramo central: balanceo por planta y crecimiento inicial, calculados en la GPU
      const plantUniforms = { uSway: { value: 0 }, uBloomTime: { value: 0 } };
      const LAMP_COLOR = new THREE.Vector3(1.0, 0.62, 0.3);
      // Los faroles no se mueven, así que su luz sobre cada planta se calcula una
      // sola vez (atributo aGlow) en vez de recorrer todos los faroles en cada píxel.
      const lampPositions = [];
      const LAMP_HEIGHT = 2.35;
      const LAMP_POWER = 1.35;
      function lampGlowAt(x, y, z) {
        let sum = 0;
        for (const p of lampPositions) {
          const dx = x - p.x, dz = z - p.z;
          const h2 = dx * dx + dz * dz;
          if (h2 > 42) continue;
          const dy = y - LAMP_HEIGHT;
          const d2 = h2 + dy * dy;
          if (d2 > 42) continue;
          const t = THREE.MathUtils.clamp((42 - d2) / 36, 0, 1);
          sum += (LAMP_POWER / (1 + d2 * 0.9)) * t * t * (3 - 2 * t);
        }
        return sum;
      }
      // Posición de los faroles (se necesita antes de calcular su luz sobre las plantas)
      {
        const add = (x, z) => lampPositions.push(new THREE.Vector3(x, 0, z));
        // alrededor del sendero central, entre los parterres
        for (let i = 0; i < 6; i += 1) {
          const a = SECTOR / 2 + i * SECTOR + SECTOR / 2;
          if (Math.abs(Math.cos(a)) < 0.2) continue;
          add(Math.cos(a) * (GARDEN.pathOuter + 0.25), Math.sin(a) * (GARDEN.pathOuter + 0.25));
        }
        // a los lados de las entradas del seto
        for (const zs of [-1, 1]) for (const xs of [-1, 1]) add(xs * 1.0, zs * (GARDEN.hedge + 0.6));
        // anillos de paseo
        for (const [ring, count] of [[GARDEN.ring1[1] + 0.35, 12], [GARDEN.ring2[1] + 0.35, 24]]) {
          for (let i = 0; i < count; i += 1) {
            const a = (i + 0.5) * ((Math.PI * 2) / count);
            add(Math.cos(a) * ring, Math.sin(a) * ring);
          }
        }
        // avenidas en cruz, alternando lados
        for (let d = 17; d < GARDEN.edge; d += 7) {
          if (Math.abs(d - (GARDEN.ring2[0] + GARDEN.ring2[1]) / 2) < 3) continue;
          const side = Math.round(d / 7) % 2 ? 1 : -1;
          const off = GARDEN.avenueHalf + 0.35;
          add(side * off, d); add(-side * off, -d);
          add(d, side * off); add(-d, -side * off);
        }
      }
      // Inyecta viento (balanceo en el vértice) y/o luz cálida de los faroles cercanos.
      function enhance(material, { wind = null, lamps = true, anchored = false } = {}) {
        material.onBeforeCompile = (shader) => {
          shader.uniforms.uTime = windUniforms.uTime;
          shader.uniforms.uSway = plantUniforms.uSway;
          shader.uniforms.uBloomTime = plantUniforms.uBloomTime;
          shader.uniforms.uAmp = { value: wind ? wind.amp : 0 };
          shader.uniforms.uHeight = { value: wind ? wind.height : 1 };
          let begin = "#include <begin_vertex>";
          if (wind) {
            begin += `
              #ifdef USE_INSTANCING
                vec3 ip = instanceMatrix[3].xyz;
              #else
                vec3 ip = (modelMatrix * vec4(0.0, 0.0, 0.0, 1.0)).xyz;
              #endif
              float hN = clamp(position.y / uHeight, 0.0, 1.5);
              float gust = sin(uTime * 0.55 + ip.x * 0.16 + ip.z * 0.09) * 0.5 + 0.5;
              float sway = sin(uTime * 1.6 + ip.x * 0.8 + ip.z * 0.55) * 0.65
                + sin(uTime * 2.7 + ip.z * 1.3 - ip.x * 0.4) * 0.25;
              float bend = (sway * (0.35 + gust) + gust * 0.6) * uAmp * hN * hN;
              transformed.x += bend;
              transformed.z += bend * 0.45;
              transformed.y -= abs(bend) * 0.25 * hN;`;
          }
          if (anchored) {
            // cada planta crece desde su base y se mece alrededor de ella
            begin += `
              vec3 rel = transformed - vec3(aAnchor.x, 0.0, aAnchor.y);
              float bp = clamp((uBloomTime - aBloom.x) * aBloom.y, 0.0, 1.0);
              float be = 1.0 - pow(1.0 - bp, 3.0);
              rel *= vec3(0.6 + be * 0.4, max(0.0001, be), 0.6 + be * 0.4);
              float ph = aAnchor.z + aAnchor.x * 0.35;
              float rz = sin(uTime * 1.1 + ph) * uSway * aAnchor.w;
              float rx = cos(uTime * 0.8 + ph * 1.3) * uSway * 0.7 * aAnchor.w;
              rel = vec3(rel.x - rel.y * rz, rel.y + rel.x * rz - rel.z * rx, rel.z + rel.y * rx);
              transformed = vec3(aAnchor.x, 0.0, aAnchor.y) + rel;`;
          }
          shader.vertexShader = shader.vertexShader
            .replace(
              "#include <common>",
              `#include <common>
              uniform float uTime; uniform float uAmp; uniform float uHeight;
              uniform float uSway; uniform float uBloomTime;
              attribute float aGlow; varying float vGlow;
              ${anchored ? "attribute vec4 aAnchor; attribute vec2 aBloom;" : ""}`
            )
            .replace("#include <begin_vertex>", begin + "\nvGlow = aGlow;");
          shader.fragmentShader = shader.fragmentShader
            .replace("#include <common>", "#include <common>\nvarying float vGlow;")
            .replace(
              "#include <emissivemap_fragment>",
              lamps
                ? "#include <emissivemap_fragment>\ntotalEmissiveRadiance += diffuseColor.rgb * vGlow * vec3(1.0, 0.62, 0.3);"
                : "#include <emissivemap_fragment>"
            );
        };
        material.customProgramCacheKey = () => `enhance-${wind ? 1 : 0}-${lamps ? 1 : 0}-${anchored ? 1 : 0}`;
        return material;
      }
      const addWind = (material, amp, height) => enhance(material, { wind: { amp, height } });

      // Copia ligera de una geometría (comparte los buffers) con la luz de faroles por instancia
      function withInstanceGlow(base, glow) {
        const g = new THREE.BufferGeometry();
        g.setIndex(base.index);
        for (const name of Object.keys(base.attributes)) g.setAttribute(name, base.attributes[name]);
        g.setAttribute("aGlow", new THREE.InstancedBufferAttribute(glow, 1));
        return g;
      }
      function withVertexGlow(geometry, glowFn) {
        const pos = geometry.attributes.position;
        const glow = new Float32Array(pos.count);
        for (let i = 0; i < pos.count; i += 1) glow[i] = glowFn(pos.getX(i), pos.getY(i), pos.getZ(i));
        geometry.setAttribute("aGlow", new THREE.BufferAttribute(glow, 1));
        return geometry;
      }

      // Divide instancias por zonas para que el navegador solo dibuje lo que se ve.
      // Con `far`, las zonas lejanas usan una versión simplificada (nivel de detalle).
      const chunkedMeshes = [];
      function chunkedInstances(geometry, material, items, { chunk = 14, castShadow = false, glowY = 0.6, far = null, cull = "flower" } = {}) {
        const buckets = new Map();
        for (const item of items) {
          const key = Math.floor(item.x / chunk) + "," + Math.floor(item.z / chunk);
          if (!buckets.has(key)) buckets.set(key, []);
          buckets.get(key).push(item);
        }
        const m = new THREE.Matrix4();
        const q = new THREE.Quaternion();
        const e = new THREE.Euler();
        const color = new THREE.Color();
        const p = new THREE.Vector3();
        const sc = new THREE.Vector3();
        for (const list of buckets.values()) {
          const glow = new Float32Array(list.length);
          list.forEach((item, i) => { glow[i] = lampGlowAt(item.x, (item.y || 0) + glowY, item.z); });
          const mesh = new THREE.InstancedMesh(withInstanceGlow(geometry, glow), material, list.length);
          let cx = 0, cz = 0;
          list.forEach((item, i) => {
            e.set(item.tiltX || 0, item.yaw || 0, item.tiltZ || 0, "YXZ");
            q.setFromEuler(e);
            p.set(item.x, item.y || 0, item.z);
            sc.set(item.s, item.sy || item.s, item.s);
            m.compose(p, q, sc);
            mesh.setMatrixAt(i, m);
            if (item.color) color.copy(item.color);
            else color.setScalar(item.shade || 1);
            mesh.setColorAt(i, color);
            cx += item.x;
            cz += item.z;
          });
          mesh.computeBoundingSphere();
          mesh.castShadow = castShadow && TIER.shadows;
          mesh.receiveShadow = TIER.shadows;
          const entry = { mesh, farMesh: null, center: new THREE.Vector3(cx / list.length, 0, cz / list.length), cull, radius: chunk * 0.7 };
          scene.add(mesh);
          if (far) {
            const farMesh = new THREE.InstancedMesh(withInstanceGlow(far, glow), material, list.length);
            farMesh.instanceMatrix = mesh.instanceMatrix;
            farMesh.instanceColor = mesh.instanceColor;
            farMesh.computeBoundingSphere();
            farMesh.receiveShadow = TIER.shadows;
            farMesh.visible = false;
            scene.add(farMesh);
            entry.farMesh = farMesh;
          }
          chunkedMeshes.push(entry);
        }
      }

      // ---------- SUELO ----------
      // El dibujo del suelo (césped, tierra de parterres, grava de senderos) y el
      // charco de luz de cada farol se pintan UNA vez en una textura grande.
      // Cada cuadro solo lee esa textura más una textura pequeña de detalle.
      const groundSize = 300;
      const BAKE_SIZE = 160; // metros cubiertos por la textura (todo el jardín)
      const groundSegments = lowPower ? 120 : 220;
      const groundGeometry = new THREE.PlaneGeometry(groundSize, groundSize, groundSegments, groundSegments);
      groundGeometry.rotateX(-Math.PI / 2);
      {
        const pos = groundGeometry.attributes.position;
        for (let i = 0; i < pos.count; i += 1) {
          pos.setY(i, groundHeight(pos.getX(i), pos.getZ(i)));
        }
        groundGeometry.computeVertexNormals();
      }
      const f2 = (v) => v.toFixed(2);
      const groundRT = new THREE.WebGLRenderTarget(2048, 2048, {
        generateMipmaps: true,
        minFilter: THREE.LinearMipmapLinearFilter,
        magFilter: THREE.LinearFilter,
        depthBuffer: false
      });
      groundRT.texture.colorSpace = THREE.SRGBColorSpace;
      groundRT.texture.anisotropy = Math.min(lowPower ? 2 : 8, renderer.capabilities.getMaxAnisotropy());
      groundRT.texture.repeat.setScalar(groundSize / BAKE_SIZE);
      groundRT.texture.offset.setScalar(-(groundSize / 2 - BAKE_SIZE / 2) / BAKE_SIZE);
      function bakeGround() {
        const lamps = lampPositions.slice(0, 160);
        const material = new THREE.ShaderMaterial({
          uniforms: {
            uLamps: { value: lamps.map((p) => new THREE.Vector4(p.x, LAMP_HEIGHT, p.z, LAMP_POWER)).concat(Array.from({ length: 160 - lamps.length }, () => new THREE.Vector4(0, -100, 0, 0))) },
            uLampCount: { value: lamps.length }

          }

        const drawTree = (x) => {
          const kind = rand();
          const h = H * (0.42 + rand() * 0.5);
          const base = H;
          ctx.fillRect(x - 2, base - h * 0.45, 4, h * 0.45);
          if (kind < 0.35) {
            // conífera: capas dentadas
            const w = h * (0.28 + rand() * 0.1);

            for (let l = 0; l < layers; l += 1) {

              ctx.lineTo(x, y - h * 0.06);
              ctx.lineTo(x + ww, y + h * 0.09);
              ctx.fill();
            }
          } else if (kind < 0.5) {
            // álamo: copa alta y estrecha
            const rx = h * 0.13, ry = h * 0.42;
            for (let k = 0; k < 4; k += 1) leafy(x + (rand() - 0.5) * rx * 0.5, base - h * (0.4 + k * 0.14), rx, ry * 0.4, 30);
          } else {
            // frondoso: varias masas redondeadas
            const rx = h * (0.22 + rand() * 0.14);
            const cy = base - h * 0.68;
            const lobes = 3 + Math.floor(rand() * 3);

        texture.repeat.x = 3;
        texture.anisotropy = 4;
