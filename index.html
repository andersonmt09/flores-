      function createTulip(config) {
        const group = new THREE.Group();
        group.position.set(config.x, 0, config.z);
        const rnd = (n) => {
          const s = Math.sin(n * 127.1 + config.seed * 311.7) * 43758.5453;
          return s - Math.floor(s);
        };
        const curve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(config.bendX * 0.18, config.height * 0.32, config.bendZ * 0.18),
          new THREE.Vector3(config.bendX * 0.6, config.height * 0.68, config.bendZ * 0.6),
          new THREE.Vector3(config.bendX, config.height, config.bendZ)
        ]);
        group.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 14, 0.045 * config.scale, 6, false), tulipStemPaint));

        const leafCount = 2 + (rnd(1) > 0.5 ? 1 : 0);
        for (let i = 0; i < leafCount; i++) {
          const leaf = new THREE.Mesh(tulipLeafGeometry, tulipLeafPaint);
          leaf.position.set(0, 0.01 + i * 0.04 * config.height, 0);
          leaf.rotation.y = config.seed * 6.28 + i * ((Math.PI * 2) / leafCount) + (rnd(i + 1) - 0.5) * 0.5;
          leaf.rotation.x = (rnd(i + 7) - 0.5) * 0.15;
          const len = config.height * (0.5 - i * 0.08) * (0.9 + rnd(i + 3) * 0.2);
          leaf.scale.set(len * 1.25, len, len);
          group.add(leaf);
        }

        const head = new THREE.Group();
        head.position.copy(curve.getPoint(1));
        head.rotation.set(-Math.PI / 2 + config.tilt, 0, config.spin);
        head.scale.setScalar(config.scale);
        const petalPaint = paint(config.color);
        const open = config.open !== undefined ? config.open : 0.2 + rnd(11) * 0.3;
        const calyx = new THREE.Mesh(calyxGeometry, tulipStemPaint);
        calyx.scale.set(1, 1, 0.8);
        calyx.position.z = -0.01;
        head.add(calyx);
        addTepals(head, petalPaint, outerPetalGeometry, rnd(21) * 0.2, 0.05 + open * 0.28, rnd);
        addTepals(head, petalPaint, innerPetalGeometry, Math.PI / 3 + rnd(22) * 0.2, 0.01 + open * 0.16, rnd);
        const inner = new THREE.Mesh(tulipInnerGeometry, tulipCenterPaint);
        inner.scale.set(1, 1, 0.55);
        inner.position.z = 0.03;
        head.add(inner);
        if (config.detail) addTulipStamens(head, rnd);
        group.add(head);
        return bakePlant(group);
      }

      // ---------- LIRIOS ARAÑA (Lycoris) ----------
      function createSpiderPetalGeometry() {
        const shape = new THREE.Shape();
        shape.moveTo(0, 0);
        shape.bezierCurveTo(0.1, 0.12, 0.15, 0.58, 0.08, 1.08);
        shape.bezierCurveTo(0.045, 1.38, 0.02, 1.55, 0, 1.64);
        shape.bezierCurveTo(-0.02, 1.55, -0.045, 1.38, -0.08, 1.08);
        shape.bezierCurveTo(-0.15, 0.58, -0.1, 0.12, 0, 0);
        const geometry = new THREE.ShapeGeometry(shape, 8);
        const position = geometry.attributes.position;
        const colors = [];
        for (let i = 0; i < position.count; i += 1) {
          const y = position.getY(i);
          const x = position.getX(i);
          const progress = THREE.MathUtils.clamp(y / 1.64, 0, 1);
          // el pétalo sale hacia arriba y se curva hacia atrás, como en Lycoris real
          const curl = -progress * progress * 1.25;
          const ripple = Math.sin(progress * Math.PI * 4) * 0.03 * progress;
          position.setZ(i, curl + (0.1 - Math.abs(x)) * 0.1);
          position.setX(i, x + ripple);
          const c = 0.78 + 0.22 * Math.min(1, progress * 2);
          colors.push(c, c, c);
        }
        geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
        geometry.computeVertexNormals();
        return geometry;
      }
      const spiderPetalGeometry = createSpiderPetalGeometry();
      const spiderStamenCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(0, 0.34, 0.1),
        new THREE.Vector3(0, 0.74, 0.4),
        new THREE.Vector3(0, 0.92, 0.76),
        new THREE.Vector3(0, 0.88, 1.06)
      ]);
      const spiderStamenGeometry = new THREE.TubeGeometry(spiderStamenCurve, 10, 0.011, 4, false);
      const spiderAntherGeometry = new THREE.SphereGeometry(0.035, 6, 4);
      const spiderCenterGeometry = new THREE.SphereGeometry(0.085, 8, 6);
      const LYCORIS_COLORS = [0xd0182b, 0xe02a2d, 0xb8121f];
      const spiderStemPaint = paint(0x4f7a32);
      const spiderCenterPaint = paint(0x7a1a14);
      const spiderStamenPaint = paint(0xd23a3a);
      const spiderAntherPaint = paint(0x5a3a12);

      function createSpiderLily(config) {
        const group = new THREE.Group();
        group.position.set(config.x, 0, config.z);
        const curve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(config.bendX * 0.18, config.height * 0.35, config.bendZ * 0.18),
          new THREE.Vector3(config.bendX * 0.6, config.height * 0.7, config.bendZ * 0.6),
          new THREE.Vector3(config.bendX, config.height, config.bendZ)
        ]);
        group.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 12, 0.03 * config.scale, 6, false), spiderStemPaint));
        const head = new THREE.Group();
        head.position.copy(curve.getPoint(1));
        head.rotation.set(-Math.PI / 2 + config.tilt, 0, config.spin);
        head.scale.setScalar(config.scale);
        const petalPaint = paint(config.color);
        // Umbela: 5–6 florecillas que miran hacia afuera, cada una con 6 tépalos
        // estrechos que se curvan hacia atrás y estambres largos que sobresalen.
        const florets = 5 + (config.seed > 0.5 ? 1 : 0);
        head.add(new THREE.Mesh(spiderCenterGeometry, spiderCenterPaint));
        for (let f = 0; f < florets; f += 1) {
          const floret = new THREE.Group();
          floret.rotation.z = (f / florets) * Math.PI * 2 + config.seed;
          const inner = new THREE.Group();
          inner.rotation.x = -0.95; // inclina la flor hacia afuera
          inner.position.y = 0.06;
          inner.scale.setScalar(0.48);
          for (let i = 0; i < 6; i += 1) {
            const holder = new THREE.Group();
            holder.rotation.z = (i / 6) * Math.PI * 2 + f;
            const petal = new THREE.Mesh(spiderPetalGeometry, petalPaint);
            petal.rotation.x = 0.55 + ((i * 7 + f) % 3) * 0.08;
            petal.scale.set(0.9, 0.95, 1);
            holder.add(petal);
            inner.add(holder);
          }
          for (let i = 0; i < 6; i += 1) {
            const holder = new THREE.Group();
            holder.rotation.z = Math.PI / 6 + (i / 6) * Math.PI * 2;
            const stamen = new THREE.Mesh(spiderStamenGeometry, spiderStamenPaint);
            stamen.rotation.x = -0.35;
            stamen.scale.setScalar(1.55);
            holder.add(stamen);
            const anther = new THREE.Mesh(spiderAntherGeometry, spiderAntherPaint);
            anther.position.copy(spiderStamenCurve.getPoint(1)).multiplyScalar(1.55).applyAxisAngle(new THREE.Vector3(1, 0, 0), -0.35);
            holder.add(anther);
            inner.add(holder);
          }
          floret.add(inner);
          head.add(floret);
        }
        group.add(head);
        return bakePlant(group);
      }

      // ---------- PLANTAS INSTANCIADAS ----------
      function plantInstances(geometry, material, items, opts = {}) {
        const mesh = new THREE.InstancedMesh(geometry, material, items.length);
        const m = new THREE.Matrix4();
        const q = new THREE.Quaternion();
        const e = new THREE.Euler();
        const color = new THREE.Color();
        items.forEach((item, i) => {
          e.set(item.tiltX || 0, item.yaw || 0, item.tiltZ || 0, "YXZ");
          q.setFromEuler(e);
          m.compose(new THREE.Vector3(item.x, item.y || 0, item.z), q, new THREE.Vector3(item.s, item.sy || item.s, item.s));
          mesh.setMatrixAt(i, m);
          const v = item.shade || 1;
          mesh.setColorAt(i, color.setRGB(v, v, v));
        });
        mesh.castShadow = opts.castShadow ?? false;
        mesh.receiveShadow = true;
        scene.add(mesh);
        return mesh;
      }

      // ---------- DISTRIBUCIÓN DE PLANTAS ----------
      function scatterInArea(count, spacing, test, rMin, rMax, avoid = []) {
        const placed = [];
        let attempts = 0;
        while (placed.length < count && attempts < count * 120) {
          attempts += 1;
          const r = Math.sqrt(rMin * rMin + random() * (rMax * rMax - rMin * rMin));
          const a = random() * Math.PI * 2;
          const x = Math.cos(a) * r;
          const z = Math.sin(a) * r;
          if (!test(x, z)) continue;
          let ok = true;
          for (const p of placed) {
            if ((p.x - x) ** 2 + (p.z - z) ** 2 < spacing * spacing) { ok = false; break; }
          }
          if (ok) {
            for (const p of avoid) {
              if ((p.x - x) ** 2 + (p.z - z) ** 2 < (p.spacing || spacing) ** 2) { ok = false; break; }
            }
          }
          if (ok) placed.push({ x, z });
        }
        return placed;
      }

      const plants = [];
      function registerPlant(group, phase, sway) {
        group.scale.setScalar(0.0001);
        scene.add(group);
        plants.push({
          group,
          phase,
          sway,
          bloomProgress: 0,
          bloomDelay: Math.hypot(group.position.x, group.position.z) * 0.12 + random() * 0.6,
          bloomSpeed: 0.45 + random() * 0.35
        });
      }

      // Macizo central: anillos de color, del rojo intenso al amarillo.
      const centerRings = [
        { rMin: 0, rMax: 0.55, colors: ["red"], spacing: 0.38, height: [1.75, 2.05], scale: [0.44, 0.5] },
        { rMin: 0.55, rMax: 1.35, colors: ["red", "scarlet"], spacing: 0.4, height: [1.5, 1.8], scale: [0.4, 0.46] },
        { rMin: 1.35, rMax: 2.15, colors: ["pink", "blush"], spacing: 0.42, height: [1.25, 1.55], scale: [0.38, 0.43] },
        { rMin: 2.15, rMax: 2.95, colors: ["white", "cream"], spacing: 0.42, height: [1.0, 1.3], scale: [0.35, 0.4] }
      ];
      const centerPoints = [];
      for (const ring of centerRings) {
        const area = Math.PI * (ring.rMax ** 2 - ring.rMin ** 2);
        const target = Math.max(1, Math.round((area / (ring.spacing * ring.spacing * 1.25)) * (lowPower ? 0.7 : 1)));
        const pts = scatterInArea(target, ring.spacing, () => true, ring.rMin, ring.rMax, centerPoints);
        if (ring.rMin === 0 && pts.length === 0) pts.push({ x: 0, z: 0 });
        for (const p of pts) {
          centerPoints.push({ ...p, spacing: ring.spacing });
          const r = Math.hypot(p.x, p.z);
          const lean = 0.12 + r * 0.05;
          const height = THREE.MathUtils.lerp(ring.height[0], ring.height[1], random());
          const colorName = ring.colors[Math.floor(random() * ring.colors.length)];
          const seed = random();
          const group = createTulip({
            x: p.x,
            z: p.z,
            height,
            scale: THREE.MathUtils.lerp(ring.scale[0], ring.scale[1], random()),
            tilt: 0.05 + random() * 0.15,
            bendX: (p.x / (r || 1)) * lean + (random() - 0.5) * 0.12,
            bendZ: (p.z / (r || 1)) * lean + (random() - 0.5) * 0.12,
            spin: random() * Math.PI * 2,
            color: TULIP_COLORS[colorName],
            seed,
            detail: !lowPower && ring.rMin < 1,
            open: 0.15 + random() * 0.35
          });
          registerPlant(group, seed * Math.PI * 2, 1);
        }
      }

      // Parterres exteriores, uno por especie.
      // Alternan lirios araña rojos con tulipanes en manchas de color: cálidos, claros y morados.
      const bedTest = (index) => (x, z) => inBed(x, z, 0.12) === index;

      function tulipBed(index, palette) {
        const pts = scatterInArea(Math.round(85 * Q), lowPower ? 0.45 : 0.36, bedTest(index), GARDEN.bedInner, GARDEN.bedOuter);
        for (const p of pts) {
          const seed = random();
          // drifts: el color depende de la posición para formar manchas naturales
          const drift = fbm(p.x * 0.45 + index * 3, p.z * 0.45);
          const colorName = palette[Math.min(palette.length - 1, Math.floor(drift * palette.length * 1.15))];
          const r = Math.hypot(p.x, p.z);
          const depth = (r - GARDEN.bedInner) / (GARDEN.bedOuter - GARDEN.bedInner);
          registerPlant(
            createTulip({
              x: p.x,
              z: p.z,
              height: 0.95 + depth * 0.45 + random() * 0.25,
              scale: 0.33 + random() * 0.07,
              tilt: 0.05 + random() * 0.2,
              bendX: (random() - 0.5) * 0.3,
              bendZ: (random() - 0.5) * 0.3,
              spin: random() * Math.PI * 2,
              color: TULIP_COLORS[colorName],
              seed,
              detail: false
            }),
            seed * Math.PI * 2,
            1.1
          );
        }
      }

      function lycorisBed(index) {
        const pts = scatterInArea(Math.round(80 * Q), lowPower ? 0.46 : 0.36, bedTest(index), GARDEN.bedInner, GARDEN.bedOuter);
        for (const p of pts) {
          const seed = random();
          const r = Math.hypot(p.x, p.z);
          const depth = (r - GARDEN.bedInner) / (GARDEN.bedOuter - GARDEN.bedInner);
          registerPlant(
            createSpiderLily({
              x: p.x,
              z: p.z,
              height: 0.85 + depth * 0.35 + random() * 0.25,
              scale: 0.3 + random() * 0.06,
              tilt: 0.12 + random() * 0.25,
              bendX: (random() - 0.5) * 0.35,
              bendZ: (random() - 0.5) * 0.35,
              spin: random() * Math.PI * 2,
              color: LYCORIS_COLORS[Math.floor(random() * LYCORIS_COLORS.length)],
              seed
            }),
            seed * Math.PI * 2,
            1.25
          );
        }
      }

      const grassClumpGeometry = createGrassClumpGeometry();
      const coverMaterial = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.85, side: THREE.DoubleSide });
      addWind(coverMaterial, 0.05, 0.45);

      lycorisBed(0);
      tulipBed(1, ["yellow", "apricot", "orange", "scarlet"]);
      lycorisBed(2);
      tulipBed(3, ["white", "cream", "blush", "pink"]);
      lycorisBed(4);
      tulipBed(5, ["lilac", "purple", "night", "pink"]);

      // Cobertura verde baja entre las flores para que los parterres se vean llenos
      {
        const cover = scatterInArea(
          Math.round(1500 * Q),
          0.22,
          (x, z) => inBed(x, z, 0.05) !== null,
          0,
          GARDEN.bedOuter
        ).map((p) => ({ x: p.x, z: p.z, s: 1.2 + random() * 0.6, sy: 0.9 + random() * 0.4, yaw: random() * 6, shade: 0.6 + random() * 0.25 }));
        plantInstances(grassClumpGeometry, coverMaterial, cover);
      }

      // ---------- POLEN Y POLVO EN EL AIRE ----------
      const particleUniforms = {
        uTime: { value: 0 },
        uPixelRatio: { value: renderer.getPixelRatio() },
        uSunDir: { value: sunSkyDir }
      };
      {
        const count = Math.round(900 * Q);
        const positions = new Float32Array(count * 3);
        const seeds = new Float32Array(count * 3);
        for (let i = 0; i < count; i += 1) {
          const r = Math.sqrt(random()) * 16;
          const a = random() * Math.PI * 2;
          positions[i * 3] = Math.cos(a) * r;
          positions[i * 3 + 1] = 0.2 + Math.pow(random(), 1.6) * 6;
          positions[i * 3 + 2] = Math.sin(a) * r;
          seeds[i * 3] = random();
          seeds[i * 3 + 1] = random();
          seeds[i * 3 + 2] = random();
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute("seed", new THREE.BufferAttribute(seeds, 3));
        const material = new THREE.ShaderMaterial({
          uniforms: particleUniforms,
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          vertexShader: `
            attribute vec3 seed;
            uniform float uTime; uniform float uPixelRatio; uniform vec3 uSunDir;
            varying float vBright;
            void main() {
              vec3 p = position;
              float t = uTime;
              // deriva lenta, como motas de polen llevadas por una brisa
              p.x += sin(t * (0.07 + seed.x * 0.08) + seed.y * 6.28) * 1.1 + t * 0.05 * (seed.z - 0.3);
              p.z += cos(t * (0.06 + seed.y * 0.07) + seed.z * 6.28) * 1.1;
              p.y += sin(t * (0.11 + seed.z * 0.1) + seed.x * 6.28) * 0.35;
              p.x = mod(p.x + 18.0, 36.0) - 18.0;
              vec4 world = modelMatrix * vec4(p, 1.0);
              vec4 mv = viewMatrix * world;
              vec3 view = normalize(world.xyz - cameraPosition);
              float forward = pow(max(dot(view, uSunDir), 0.0), 3.0);
              float twinkle = 0.65 + 0.35 * sin(t * (1.2 + seed.y * 2.5) + seed.x * 40.0);
              vBright = (0.14 + forward * 1.4) * twinkle;
              float size = 0.022 + seed.z * 0.03;
              gl_PointSize = size * uPixelRatio * (520.0 / -mv.z);
              gl_Position = projectionMatrix * mv;
            }
          `,
          fragmentShader: `
            varying float vBright;
            void main() {
              float d = length(gl_PointCoord - 0.5);
              float a = smoothstep(0.5, 0.0, d);
              a *= a;
              vec3 col = vec3(1.0, 0.86, 0.6) * vBright;
              gl_FragColor = vec4(col, a);
              #include <tonemapping_fragment>
              #include <colorspace_fragment>
            }
          `
        });
        scene.add(new THREE.Points(geometry, material));
      }

      // ---------- LUCIÉRNAGAS ----------
      {
        const count = Math.round(70 * Q);
        const positions = new Float32Array(count * 3);
        const seeds = new Float32Array(count * 4);
        for (let i = 0; i < count; i += 1) {
          const r = 2 + Math.sqrt(random()) * 13;
          const a = random() * Math.PI * 2;
          positions[i * 3] = Math.cos(a) * r;
          positions[i * 3 + 1] = 0.3 + random() * 1.6;
          positions[i * 3 + 2] = Math.sin(a) * r;
          seeds[i * 4] = random();
          seeds[i * 4 + 1] = random();
          seeds[i * 4 + 2] = random();
          seeds[i * 4 + 3] = random();
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute("seed", new THREE.BufferAttribute(seeds, 4));
        const material = new THREE.ShaderMaterial({
          uniforms: particleUniforms,
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          vertexShader: `
            attribute vec4 seed;
            uniform float uTime; uniform float uPixelRatio;
            varying float vFlash;
            void main() {
              vec3 p = position;
              float t = uTime;
              float s1 = 0.18 + seed.x * 0.25;
              p.x += sin(t * s1 + seed.y * 6.28) * 0.9 + sin(t * s1 * 2.3 + seed.z * 9.0) * 0.25;
              p.z += cos(t * s1 * 0.85 + seed.z * 6.28) * 0.9 + cos(t * s1 * 1.9 + seed.w * 7.0) * 0.25;
              p.y += sin(t * s1 * 1.4 + seed.w * 6.28) * 0.35;
              // destello real: encendido corto, luego varios segundos apagado
              float cycle = fract(t / (2.4 + seed.w * 3.2) + seed.x);
              float flash = smoothstep(0.0, 0.06, cycle) * (1.0 - smoothstep(0.08, 0.3, cycle));
              vFlash = flash * 0.95 + 0.04;
              vec4 mv = modelViewMatrix * vec4(p, 1.0);
              gl_PointSize = 0.42 * uPixelRatio * (300.0 / -mv.z);
              gl_Position = projectionMatrix * mv;
            }
          `,
          fragmentShader: `
            varying float vFlash;
            void main() {
              float d = length(gl_PointCoord - 0.5);
              float core = exp(-d * d * 260.0);
              float halo = exp(-d * d * 22.0) * 0.35;
              float a = (core + halo) * vFlash;
              vec3 col = vec3(0.82, 1.0, 0.42) * (core * 2.6 + halo);
              gl_FragColor = vec4(col * vFlash, clamp(a, 0.0, 1.0));
              #include <tonemapping_fragment>
              #include <colorspace_fragment>
            }
          `
        });
        scene.add(new THREE.Points(geometry, material));
      }

      // ---------- MARIPOSAS ----------
      function createWingTexture(style) {
        const canvas = document.createElement("canvas");
        canvas.width = canvas.height = 256;
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, 256, 256);
        const drawWing = (fill, cx, cy, rx, ry, rot) => {
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(rot);
          ctx.beginPath();
          ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
          ctx.fillStyle = fill;
          ctx.fill();
          ctx.restore();
        };
        // ala anterior (arriba) y posterior (abajo); el borde x=0 es la bisagra
        const fore = { cx: 110, cy: 92, rx: 112, ry: 70, rot: -0.35 };
        const hind = { cx: 92, cy: 178, rx: 84, ry: 62, rot: 0.3 };
        if (style.border) {
          drawWing(style.border, fore.cx, fore.cy, fore.rx, fore.ry, fore.rot);
          drawWing(style.border, hind.cx, hind.cy, hind.rx, hind.ry, hind.rot);
        }
        const inset = style.border ? 12 : 0;
        drawWing(style.fill, fore.cx - 6, fore.cy + 2, fore.rx - inset, fore.ry - inset, fore.rot);
        drawWing(style.fill2 || style.fill, hind.cx - 6, hind.cy - 2, hind.rx - inset, hind.ry - inset, hind.rot);
        if (style.veins) {
          ctx.strokeStyle = style.veins;
          ctx.lineWidth = 3.2;
          for (let i = 0; i < 7; i += 1) {
            const a = -0.9 + i * 0.32;
            ctx.beginPath();
            ctx.moveTo(4, 128);
            ctx.quadraticCurveTo(80 * Math.cos(a) + 20, 128 + 60 * Math.sin(a), 200 * Math.cos(a), 128 + 140 * Math.sin(a));
            ctx.stroke();
          }
        }
        if (style.dots) {
          ctx.fillStyle = style.dots;
          for (let i = 0; i < 16; i += 1) {
            const a = -1.2 + i * 0.16;
            ctx.beginPath();
            ctx.arc(110 + Math.cos(a) * 112, 128 + Math.sin(a) * 110, 3.2, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        if (style.spot) {
          ctx.fillStyle = style.spot;
          ctx.beginPath();
          ctx.arc(150, 70, 13, 0, Math.PI * 2);
          ctx.fill();
        }
        // recorta todo lo que quede fuera de las alas
        ctx.globalCompositeOperation = "destination-in";
        drawWing("#000", fore.cx, fore.cy, fore.rx, fore.ry, fore.rot);
        drawWing("#000", hind.cx, hind.cy, hind.rx, hind.ry, hind.rot);
        const tex = new THREE.CanvasTexture(canvas);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = 4;
        return tex;
      }
      const butterflyStyles = [
        { fill: "#e9771c", fill2: "#f08a2a", border: "#1b1310", veins: "#1b1310", dots: "#fff7ea" }, // monarca
        { fill: "#f4f0e2", border: "#3a3530", spot: "#3a3530" }, // blanquita de la col
        { fill: "#f2dc6b", fill2: "#efd35a", veins: "rgba(120, 100, 40, 0.5)", spot: "#e98a2a" }, // limonera
        { fill: "#e9771c", fill2: "#f08a2a", border: "#1b1310", veins: "#1b1310", dots: "#fff7ea" }
      ];
      const wingGeometry = new THREE.PlaneGeometry(1, 1);
      wingGeometry.rotateX(Math.PI / 2);
      wingGeometry.translate(0.5, 0, 0);
      const bodyGeometry = new THREE.CapsuleGeometry(0.07, 0.75, 3, 6);
      bodyGeometry.rotateX(Math.PI / 2);
      const bodyMaterial = new THREE.MeshStandardMaterial({ color: 0x1d1611, roughness: 0.7 });
      const butterflies = [];
      const butterflyCount = lowPower ? 4 : 7;
      for (let i = 0; i < butterflyCount; i += 1) {
        const style = butterflyStyles[i % butterflyStyles.length];
        const material = new THREE.MeshStandardMaterial({
          map: createWingTexture(style),
          alphaTest: 0.5,
          side: THREE.DoubleSide,
          roughness: 0.65
        });
        const group = new THREE.Group();
        const right = new THREE.Mesh(wingGeometry, material);
        const left = new THREE.Mesh(wingGeometry, material);
        left.scale.x = -1;
        right.castShadow = left.castShadow = true;
        const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
        group.add(right, left, body);
        const size = 0.13 + random() * 0.06;
        group.scale.setScalar(size / 0.13 * 0.15);
        scene.add(group);
        butterflies.push({
          group,
          left,
          right,
          cx: (random() - 0.5) * 9,
          cz: (random() - 0.5) * 9,
          ax: 2.5 + random() * 3.5,
          az: 2.5 + random() * 3.5,
          fx: 0.08 + random() * 0.06,
          fz: 0.07 + random() * 0.06,
          px: random() * 6.28,
          pz: random() * 6.28,
          baseY: 1.0 + random() * 1.2,
          flap: 10 + random() * 5,
          phase: random() * 100
        });
      }
      const butterflyNext = new THREE.Vector3();
      function butterflyPosition(b, t, out) {
        out.set(
          b.cx + Math.sin(t * b.fx + b.px) * b.ax + Math.sin(t * b.fx * 3.1 + b.pz) * 0.6,
          b.baseY + Math.sin(t * 0.7 + b.phase) * 0.35 + Math.sin(t * 2.3 + b.phase) * 0.08,
          b.cz + Math.sin(t * b.fz + b.pz) * b.az + Math.cos(t * b.fz * 2.7 + b.px) * 0.6
        );
        return out;
      }

      // ---------- POSTPROCESO ----------
      let composer = null;
      let bloomPass = null;
      if (!lowPower) {
        composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.32, 0.55, 0.88);
        composer.addPass(bloomPass);
        composer.addPass(new OutputPass());
      }

      // ---------- CONTROLES ----------
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.enablePan = false;
      controls.rotateSpeed = 0.7;
      controls.zoomSpeed = 0.8;
      controls.minDistance = 3.2;
      controls.maxDistance = 21;
      controls.minPolarAngle = 0.25;
      controls.maxPolarAngle = Math.PI * 0.47;
      controls.target.set(0, 0.9, 0);
      controls.autoRotateSpeed = 0.35;
      controls.update();

      let isPaused = reduceMotion;
      let idleTimer = null;

      function setMotionState(paused) {
        isPaused = paused;
        controls.autoRotate = !paused;
        motionToggle.setAttribute("aria-label", paused ? "Reanudar movimiento" : "Pausar movimiento");
        motionToggle.title = paused ? "Reanudar movimiento" : "Pausar movimiento";
        pauseIcon.innerHTML = paused
          ? '<path d="m8 5 11 7-11 7V5Z"/>'
          : '<path d="M8 5v14M16 5v14"/>';
      }

      setMotionState(isPaused);

      motionToggle.addEventListener("click", () => {
        if (idleTimer) clearTimeout(idleTimer);
        setMotionState(!isPaused);
      });

      controls.addEventListener("start", () => {
        if (idleTimer) clearTimeout(idleTimer);
        controls.autoRotate = false;
        gestureHint.style.opacity = "0";
        gestureHint.style.transform = "translateY(8px)";
      });

      controls.addEventListener("end", () => {
        if (isPaused) return;
        idleTimer = window.setTimeout(() => {
          if (!isPaused) controls.autoRotate = true;
        }, 3300);
      });

      function resize() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        const aspect = width / height;
        camera.aspect = aspect;
        camera.fov = aspect < 1 ? Math.min(78, 42 * Math.pow(1 / aspect, 0.5)) : 42;
        camera.updateProjectionMatrix();
        controls.target.set(0, aspect < 1 ? 1.05 : 0.9, 0);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, maxPixelRatio));
        renderer.setSize(width, height);
        particleUniforms.uPixelRatio.value = renderer.getPixelRatio();
        if (composer) {
          composer.setPixelRatio(renderer.getPixelRatio());
          composer.setSize(width, height);
        }
      }

      window.addEventListener("resize", resize, { passive: true });
      window.addEventListener("orientationchange", () => window.setTimeout(resize, 120));
      resize();

      const clock = new THREE.Clock();
      let elapsed = 0;
      let bloomClock = 0;

      function animate() {
        requestAnimationFrame(animate);

        // No renderizar mientras el reproductor cubre la escena (ahorra batería)
        const isOverlayActive =
          document.getElementById("playlistOverlay")?.classList.contains("active") ||
          document.getElementById("musicOverlay")?.classList.contains("active");
        const delta = Math.min(clock.getDelta(), 0.05);
        if (isOverlayActive) return;

        if (!isPaused) elapsed += delta;
        bloomClock += delta;
        windUniforms.uTime.value = elapsed;
        particleUniforms.uTime.value = elapsed;
        skyUniforms.uTime.value = elapsed;

        const wind = Math.sin(elapsed * 0.18) * 0.5 + 0.5;
        const windAmplitude = (0.018 + 0.016 * wind) * (isPaused ? 0 : 1);

        for (const plant of plants) {
          const phase = plant.phase + plant.group.position.x * 0.35;
          plant.group.rotation.z = Math.sin(elapsed * 1.1 + phase) * windAmplitude * plant.sway;
          plant.group.rotation.x = Math.cos(elapsed * 0.8 + phase * 1.3) * windAmplitude * 0.7 * plant.sway;
          if (plant.bloomProgress < 1) {
            const t = bloomClock - plant.bloomDelay;
            if (t > 0) {
              plant.bloomProgress = Math.min(1, plant.bloomProgress + delta * plant.bloomSpeed);
              const ease = 1 - Math.pow(1 - plant.bloomProgress, 3);
              plant.group.scale.set(0.6 + ease * 0.4, Math.max(0.0001, ease), 0.6 + ease * 0.4);
            }
          }
        }

        for (const b of butterflies) {
          const t = elapsed + b.phase;
          butterflyPosition(b, t, b.group.position);
          butterflyPosition(b, t + 0.15, butterflyNext);
          b.group.lookAt(butterflyNext);
          const flap = Math.sin(t * b.flap) * 0.85 + 0.25;
          b.right.rotation.z = flap;
          b.left.rotation.z = -flap;
        }

        controls.update();
        if (composer) composer.render();
        else renderer.render(scene, camera);
      }

      const STORAGE_KEY = 'jardin-musica';

      // Recordar la última canción y el punto donde iba (si el navegador lo permite)
      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ src: playlist[currentSongIndex].src, time: audioPlayer.currentTime || 0 }));
        } catch (e) {}
      }
      function readState() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        } catch (e) {
          return null;
        }
      }
      // Búsqueda sin importar tildes ni mayúsculas
      const normalize = (text) => text.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

      function updateNowPlaying() {
        if (!nowPlayingBtn) return;
        const song = playlist[currentSongIndex];
        nowPlayingTitle.textContent = song.title;
        nowPlayingCover.style.backgroundImage = 'url("' + song.cover + '")';
        const started = !audioPlayer.paused || audioPlayer.currentTime > 0;
        nowPlayingBtn.classList.toggle('visible', started);
        nowPlayingBtn.classList.toggle('playing', !audioPlayer.paused);
      }

      const musicOverlay = document.getElementById('musicOverlay');
      const closeMusicBtn = document.getElementById('closeMusicBtn');
      const openMusicBtn = document.getElementById('openMusicBtn'); 

      
        const playlistOverlay = document.getElementById('playlistOverlay');

        if(openMusicBtn) {
          openMusicBtn.addEventListener('click', (e) => {
            e.preventDefault();
            playlistOverlay.classList.add('active');

          });

        if(closePlaylistBtn) {

        if(closeMusicBtn) {
          closeMusicBtn.addEventListener('click', () => {
            musicOverlay.classList.remove('active');
            playlistOverlay.classList.add('active');
          });

function loadSong(index) {
          if(loadingSpinner) loadingSpinner.classList.add("active");
          currentSongIndex = index;
          const song = playlist[currentSongIndex];
          songTitle.textContent = song.title;
          songArtist.textContent = song.artist;
          audioPlayer.src = song.src;
          albumArt.style.backgroundImage = 'url("' + song.cover + '")';
          dynamicBg.style.backgroundImage = 'url("' + song.cover + '")';
          
        if ('mediaSession' in navigator) {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: song.title,
            artist: song.artist,
            album: 'Catálogo Penyair',
            artwork: [
              { src: song.cover, sizes: '512x512', type: 'image/jpeg' }
            ]
          });

          navigator.mediaSession.setActionHandler('play', function() { playAudio(); });
          navigator.mediaSession.setActionHandler('pause', function() { audioPlayer.pause(); });
          navigator.mediaSession.setActionHandler('previoustrack', function() { prevSong(); });
          navigator.mediaSession.setActionHandler('nexttrack', function() { nextSong(false); });
        }
        updateActivePlaylistSong();
        }

        function updateActivePlaylistSong() {
          const items = document.querySelectorAll('#playlistItems .playlist-item');
          items.forEach(item => {
            if (parseInt(item.dataset.index) === currentSongIndex) {
              item.classList.add('active-song');
            } else {
              item.classList.remove('active-song');
            }
          });
        }

      function playAudio() {
        // play() devuelve una promesa que falla si el navegador bloquea el audio
        const attempt = audioPlayer.play();
        if (attempt && attempt.catch) attempt.catch(() => updatePlayState());
      }

      function togglePlay() {
        if (audioPlayer.paused) {
          playAudio();
        } else {
          audioPlayer.pause();
        }
      }

      function updatePlayState() {
        if (audioPlayer.paused) {
          isPlaying = false;
          playIcon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"></polygon>';
          albumArt.classList.remove('playing');
        } else {
          isPlaying = true;
          playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';
          albumArt.classList.add('playing');
        }
        updateNowPlaying();
        saveState();
      }

      function prevSong() {
        const idx = (currentSongIndex - 1 + playlist.length) % playlist.length;
        const wasPlaying = !audioPlayer.paused;
        loadSong(idx);
        if (wasPlaying) playAudio();
      }

      function nextSong(fromEnded) {
        // Repetir solo aplica cuando la canción termina sola; el botón siempre avanza.
        if (isLoop && fromEnded === true) {
          audioPlayer.currentTime = 0;
          playAudio();
          return;
        }
        // Al terminar, el navegador ya marcó el audio como pausado: hay que seguir sonando.
        const wasPlaying = fromEnded === true || !audioPlayer.paused;
        let idx;
        if (isShuffle) {
          idx = Math.floor(Math.random() * playlist.length);
          if (idx === currentSongIndex && playlist.length > 1) {
            idx = (idx + 1) % playlist.length;
          }
        } else {
          idx = (currentSongIndex + 1) % playlist.length;
        }
        loadSong(idx);
        if (wasPlaying) playAudio();
      }

      function updateProgress(e) {
        const duration = e.target.duration;
        const currentTime = e.target.currentTime;
        if(isNaN(duration)) return;
        if (!seeking) progressBar.style.width = (currentTime / duration) * 100 + '%';

        let currentMins = Math.floor(currentTime / 60);
        let currentSecs = Math.floor(currentTime % 60);
        if (currentSecs < 10) currentSecs = '0' + currentSecs;
        currentTimeEl.textContent = currentMins + ':' + currentSecs;
        
        let durationMins = Math.floor(duration / 60);
        let durationSecs = Math.floor(duration % 60);
        if (durationSecs < 10) durationSecs = '0' + durationSecs;
        durationTimeEl.textContent = durationMins + ':' + durationSecs;
      }

      // Tocar o arrastrar la barra (también con el dedo) para mover la canción
      let seeking = false;
      function seekTo(clientX) {
        const rect = progressContainer.getBoundingClientRect();
        const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
        progressBar.style.width = ratio * 100 + '%';
        if (isFinite(audioPlayer.duration)) audioPlayer.currentTime = ratio * audioPlayer.duration;
      }

      function renderPlaylist(filter) {
        filter = filter || "";
        if(!playlistItemsContainer) return;
        playlistItemsContainer.innerHTML = '';
        const query = normalize(filter.trim());
        let shown = 0;
        playlist.forEach((song, index) => {
          if (normalize(song.title).includes(query) || normalize(song.artist).includes(query)) {
            shown += 1;
            const li = document.createElement('li');
            li.className = 'playlist-item ' + (index === currentSongIndex ? 'active-song' : '');
              li.dataset.index = index;
            const img = document.createElement('div');
            img.className = 'playlist-item-img';
            img.style.backgroundImage = 'url("' + song.cover + '")';
            const info = document.createElement('div');
            info.className = 'playlist-item-info';
            const titleEl = document.createElement('p');
            titleEl.className = 'playlist-item-title';
            titleEl.textContent = song.title;
            const artistEl = document.createElement('p');
            artistEl.className = 'playlist-item-artist';
            artistEl.textContent = song.artist;
            info.append(titleEl, artistEl);
            li.append(img, info);
            li.addEventListener('click', () => {
                if (index !== currentSongIndex || audioPlayer.paused) {
                  if (index !== currentSongIndex) {
                    loadSong(index);
                  }
                  playAudio();
                }
                document.getElementById('playlistOverlay').classList.remove('active');
                document.getElementById('musicOverlay').classList.add('active');
              });
            playlistItemsContainer.appendChild(li);
          }
        });
        if (playlistCount) {
          playlistCount.textContent = query ? shown + ' de ' + playlist.length + ' canciones' : playlist.length + ' canciones';
        }
        if (shown === 0) {
          const empty = document.createElement('li');
          empty.className = 'playlist-empty';
          empty.textContent = 'No encontré esa canción';
          playlistItemsContainer.appendChild(empty);
        }
      }

      

      if(playlistSearch) {
        playlistSearch.addEventListener('input', (e) => {
          renderPlaylist(e.target.value);
        });
      }

      if(playBtn) playBtn.addEventListener('click', togglePlay);
      
        const loadingSpinner = document.getElementById('loadingSpinner');
        
        if (audioPlayer) {
          audioPlayer.addEventListener('waiting', () => {
            if (loadingSpinner) loadingSpinner.classList.add('active');
          });
          audioPlayer.addEventListener('playing', () => {
            if (loadingSpinner) loadingSpinner.classList.remove('active');
          });
          audioPlayer.addEventListener('canplay', () => {
            if (loadingSpinner) loadingSpinner.classList.remove('active');
          });

            if (loadingSpinner && audioPlayer.paused) loadingSpinner.classList.remove('active');

          audioPlayer.addEventListener('error', () => {
            if (loadingSpinner) loadingSpinner.classList.remove('active');
          });
        }

        if(audioPlayer) {
        audioPlayer.addEventListener('play', updatePlayState);

        audioPlayer.addEventListener('timeupdate', updateProgress);
        audioPlayer.addEventListener('ended', () => nextSong(true));
        audioPlayer.addEventListener('loadedmetadata', () => {
          let durationMins = Math.floor(audioPlayer.duration / 60);
          let durationSecs = Math.floor(audioPlayer.duration % 60);
          if (durationSecs < 10) durationSecs = '0' + durationSecs;
          if(!isNaN(durationMins)) {
            durationTimeEl.textContent = durationMins + ':' + durationSecs;
          }
        });
      }
      if(prevBtn) prevBtn.addEventListener('click', prevSong);
      if(nextBtn) nextBtn.addEventListener('click', () => nextSong(false));
      if (progressContainer) {

          seeking = true;

          seekTo(e.clientX);

        progressContainer.addEventListener('pointermove', (e) => { if (seeking) seekTo(e.clientX); });

        progressContainer.addEventListener('pointerup', endSeek);

      if (nowPlayingBtn) {

      // Barra espaciadora: reproducir/pausar mientras el reproductor está abierto

        if (e.code !== 'Space' || !musicOverlay.classList.contains('active')) return;

        togglePlay();

      if (savedIndex >= 0 && saved.time > 0) {
        audioPlayer.addEventListener('loadedmetadata', () => {
          if (audioPlayer.currentTime === 0 && saved.time < audioPlayer.duration) audioPlayer.currentTime = saved.time;
        }, { once: true });
      }
      updateNowPlaying();

      animate();
    </script>
  </body>
</html>
