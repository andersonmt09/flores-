<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#071616" />
    <meta
      name="description"
      content="Una experiencia floral tridimensional de luz, movimiento y color."
    />
    <title>Jardín en 3D</title>
    <style>
      :root {
        color-scheme: dark;
        --cream: #fff7df;
        --muted: rgba(255, 247, 223, 0.68);
        --gold: #ffd45a;
        --line: rgba(255, 224, 126, 0.24);
        --glass: rgba(9, 29, 29, 0.32);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }

      body {
        background:
          radial-gradient(circle at 50% 34%, #285c55 0%, #123635 37%, #071616 74%),
          #071616;
        color: var(--cream);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      #app,
      canvas,
      .atmosphere,
      .vignette,
      .grain {
        position: fixed;
        inset: 0;
      }

      #app {
        z-index: 1;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      .atmosphere {
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse 42% 30% at 50% 38%, rgba(255, 201, 58, 0.15), transparent 70%),
          radial-gradient(ellipse 28% 22% at 18% 78%, rgba(92, 177, 130, 0.12), transparent 75%);
      }

      .vignette {
        z-index: 2;
        pointer-events: none;
        background:
          linear-gradient(180deg, rgba(2, 12, 13, 0.22), transparent 30%, transparent 68%, rgba(2, 12, 13, 0.5)),
          radial-gradient(ellipse at center, transparent 36%, rgba(1, 10, 11, 0.54) 100%);
      }

      .grain {
        z-index: 2;
        pointer-events: none;
        opacity: 0.09;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
        mix-blend-mode: soft-light;
      }

      .ui {
        position: fixed;
        inset: 0;
        z-index: 3;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding:
          max(1.25rem, env(safe-area-inset-top, 0px))
          clamp(1.15rem, 4vw, 3.5rem)
          max(1.25rem, env(safe-area-inset-bottom, 0px));
        pointer-events: none;
        opacity: 0;
        animation: arrive 1.15s cubic-bezier(0.22, 1, 0.36, 1) 180ms forwards;
      }

      @keyframes arrive {
        to {
          opacity: 1;
        }
      }

      .masthead {
        max-width: min(31rem, 80vw);
        animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) 280ms both;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(0.8rem);
        }
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        margin: 0 0 0.8rem;
        color: var(--gold);
        font-size: clamp(0.61rem, 1.5vw, 0.72rem);
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 1.75rem;
        height: 1px;
        background: currentColor;
        content: "";
        opacity: 0.76;
      }

      h1 {
        max-width: 11ch;
        margin: 0;
        color: var(--cream);
        font-family: Iowan Old Style, Baskerville, "Times New Roman", Georgia, serif;
        font-size: clamp(2.5rem, 7.1vw, 5.35rem);
        font-weight: 500;
        letter-spacing: -0.052em;
        line-height: 0.91;
        text-wrap: balance;
        text-shadow: 0 0 42px rgba(255, 208, 79, 0.11);
      }

      .message {
        max-width: 24rem;
        margin: 1rem 0 0;
        color: var(--muted);
        font-family: Iowan Old Style, Baskerville, Georgia, serif;
        font-size: clamp(1rem, 2vw, 1.18rem);
        font-style: italic;
        letter-spacing: 0.01em;
        line-height: 1.45;
      }

      .footer {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 1rem;
        width: 100%;
      }

      .interaction {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        max-width: 28rem;
        padding: 0.62rem 0.84rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--glass);
        box-shadow: 0 0.5rem 2.2rem rgba(0, 0, 0, 0.14);
        color: rgba(255, 247, 223, 0.76);
        font-size: clamp(0.68rem, 1.8vw, 0.78rem);
        letter-spacing: 0.025em;
        line-height: 1.2;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition: opacity 500ms ease, transform 500ms ease;
      }

      .interaction svg {
        flex: 0 0 auto;
        width: 1rem;
        height: 1rem;
        color: var(--gold);
      }

      .controls {
        display: flex;
        gap: 0.6rem;
        pointer-events: auto;
      }

      .round-button {
        display: inline-grid;
        width: 2.45rem;
        height: 2.45rem;
        place-items: center;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: var(--glass);
        color: var(--cream);
        cursor: pointer;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
      }

      .round-button:hover {
        border-color: rgba(255, 224, 126, 0.52);
        background: rgba(255, 218, 109, 0.13);
        transform: translateY(-2px);
      }

      .round-button:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 3px;
      }

      .round-button svg {
        width: 1rem;
        height: 1rem;
      }

      .fallback {
        position: fixed;
        inset: 0;
        z-index: 4;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background:
          radial-gradient(circle at 50% 42%, #2d6c56 0%, #123735 40%, #071616 100%),
          #071616;
        opacity: 1;
        transition: opacity 500ms ease, visibility 500ms ease;
      }

      .fallback__card {
        max-width: 25rem;
        text-align: center;
      }

      .fallback__flower {
        display: block;
        margin-bottom: 1.15rem;
        color: var(--gold);
        font-size: 3.8rem;
        filter: drop-shadow(0 0 1.8rem rgba(255, 202, 57, 0.5));
      }

      .fallback p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }

      .webgl-ready .fallback {
        visibility: hidden;
        opacity: 0;
      }

      @media (max-width: 540px) {
        .ui {
          padding-left: 1.15rem;
          padding-right: 1.15rem;
        }

        .masthead {
          max-width: 16rem;
        }

        .footer {
          align-items: center;
        }

        .interaction {
          max-width: calc(100vw - 5.5rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="atmosphere"></div>
    <main id="app" aria-label="Jardín tridimensional de luz y flores"></main>
    <div class="vignette"></div>
    <div class="grain"></div>

    <div class="ui">
      <header class="masthead">
        <p class="eyebrow">Un pequeño jardín</p>
      </header>

      <footer class="footer">
        <div class="interaction" id="gestureHint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
            <path d="M4 12.3c1.9-2.2 4.6-3.3 8-3.3s6.1 1.1 8 3.3c-1.9 2.2-4.6 3.3-8 3.3s-6.1-1.1-8-3.3Z"/>
            <path d="M12 9v6M9 12h6"/>
          </svg>
          <span>Arrastra para explorar · pellizca para acercar</span>
        </div>
        <div class="controls">
          <button class="round-button" id="motionToggle" type="button" aria-label="Pausar movimiento" title="Pausar movimiento">
            <svg id="pauseIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M8 5v14M16 5v14"/>
            </svg>
          </button>
        </div>
      </footer>
    </div>

    <div class="fallback" id="fallback" role="status" aria-live="polite">
      <div class="fallback__card">
        <span class="fallback__flower" aria-hidden="true">✦</span>
        <p>Preparando el jardín…</p>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      const container = document.getElementById("app");
      const motionToggle = document.getElementById("motionToggle");
      const pauseIcon = document.getElementById("pauseIcon");
      const gestureHint = document.getElementById("gestureHint");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        powerPreference: "high-performance"
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      container.appendChild(renderer.domElement);
      document.documentElement.classList.add("webgl-ready");

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x103330, 0.042);

      const camera = new THREE.PerspectiveCamera(43, window.innerWidth / window.innerHeight, 0.1, 240);
      camera.position.set(0.8, 5.3, 12.4);

      scene.add(new THREE.HemisphereLight(0xfff3c0, 0x07211e, 1.38));

      const keyLight = new THREE.DirectionalLight(0xffe6a2, 2.55);
      keyLight.position.set(6.5, 12, 7);
      scene.add(keyLight);

      const fillLight = new THREE.DirectionalLight(0x76c9bd, 0.78);
      fillLight.position.set(-8, 5, -8);
      scene.add(fillLight);

      const haloLight = new THREE.PointLight(0xffc94d, 38, 27, 2);
      haloLight.position.set(0, 5.8, -5.6);
      scene.add(haloLight);

      const frontLight = new THREE.PointLight(0xffaa35, 15, 15, 2);
      frontLight.position.set(1.3, 2.6, 5.3);
      scene.add(frontLight);

      const softAmber = new THREE.PointLight(0xffc978, 14, 20, 2);
      softAmber.position.set(-4, 3.2, -2);
      scene.add(softAmber);

      const redAccentLight = new THREE.PointLight(0xff3b30, 10, 19, 2);
      redAccentLight.position.set(3.6, 2.6, -2.4);
      scene.add(redAccentLight);

      const redAccentLight2 = new THREE.PointLight(0xff4433, 8, 17, 2);
      redAccentLight2.position.set(-3.4, 2.4, 2);
      scene.add(redAccentLight2);

      const petalMaterials = [
        new THREE.MeshStandardMaterial({
          color: 0xffc928,
          roughness: 0.46,
          metalness: 0.02,
          emissive: 0x6e4200,
          emissiveIntensity: 0.32,
          side: THREE.DoubleSide
        }),
        new THREE.MeshStandardMaterial({
          color: 0xffdf64,
          roughness: 0.5,
          metalness: 0.02,
          emissive: 0x693f07,
          emissiveIntensity: 0.25,
          side: THREE.DoubleSide
        }),
        new THREE.MeshStandardMaterial({
          color: 0xf6b91d,
          roughness: 0.42,
          metalness: 0.025,
          emissive: 0x5f3900,
          emissiveIntensity: 0.34,
          side: THREE.DoubleSide
        }),
        new THREE.MeshStandardMaterial({
          color: 0xffe873,
          roughness: 0.45,
          metalness: 0.025,
          emissive: 0x6d4308,
          emissiveIntensity: 0.25,
          side: THREE.DoubleSide
        })
      ];

      const centerMaterial = new THREE.MeshStandardMaterial({
        color: 0x4a2d0e,
        roughness: 0.9,
        metalness: 0
      });
      const centerTopMaterial = new THREE.MeshStandardMaterial({
        color: 0x81521b,
        roughness: 0.82,
        metalness: 0
      });
      const seedMaterial = new THREE.MeshStandardMaterial({
        color: 0x201104,
        roughness: 0.86,
        metalness: 0
      });
      const stemMaterial = new THREE.MeshStandardMaterial({
        color: 0x2d7843,
        roughness: 0.76,
        metalness: 0
      });
      const leafMaterial = new THREE.MeshStandardMaterial({
        color: 0x40834b,
        roughness: 0.72,
        metalness: 0,
        side: THREE.DoubleSide
      });

      const spiderPetalMaterials = [
        new THREE.MeshStandardMaterial({
          color: 0xe61a2e,
          roughness: 0.36,
          metalness: 0.05,
          emissive: 0x55000a,
          emissiveIntensity: 0.58,
          side: THREE.DoubleSide
        }),
        new THREE.MeshStandardMaterial({
          color: 0xff3327,
          roughness: 0.38,
          metalness: 0.05,
          emissive: 0x5c0008,
          emissiveIntensity: 0.55,
          side: THREE.DoubleSide
        }),
        new THREE.MeshStandardMaterial({
          color: 0xc4101f,
          roughness: 0.34,
          metalness: 0.06,
          emissive: 0x3e0004,
          emissiveIntensity: 0.62,
          side: THREE.DoubleSide
        })
      ];
      const spiderStemMaterial = new THREE.MeshStandardMaterial({
        color: 0x5c1a1a,
        roughness: 0.68,
        metalness: 0
      });
      const spiderCenterMaterial = new THREE.MeshStandardMaterial({
        color: 0x6e0f14,
        roughness: 0.6,
        metalness: 0
      });
      const stamenMaterial = new THREE.MeshStandardMaterial({
        color: 0xb3202a,
        roughness: 0.48,
        metalness: 0.02
      });
      const antherMaterial = new THREE.MeshStandardMaterial({
        color: 0x4a0a0d,
        roughness: 0.55,
        metalness: 0
      });

      function createPetalGeometry() {
        const shape = new THREE.Shape();
        shape.moveTo(0, 0);
        shape.bezierCurveTo(0.27, 0.16, 0.47, 0.74, 0.03, 1.28);
        shape.bezierCurveTo(-0.42, 0.82, -0.3, 0.18, 0, 0);

        const geometry = new THREE.ExtrudeGeometry(shape, {
          depth: 0.05,
          bevelEnabled: true,
          bevelThickness: 0.025,
          bevelSize: 0.042,
          bevelOffset: 0,
          bevelSegments: 2,
          curveSegments: 16,
          steps: 1
        });

        const position = geometry.attributes.position;
        const vertex = new THREE.Vector3();
        for (let i = 0; i < position.count; i += 1) {
          vertex.fromBufferAttribute(position, i);
          const progress = THREE.MathUtils.clamp(vertex.y / 1.28, 0, 1);
          position.setZ(i, vertex.z + progress * progress * 0.29);
        }
        position.needsUpdate = true;
        geometry.computeVertexNormals();
        return geometry;
      }

      function createLeafGeometry() {
        const shape = new THREE.Shape();
        shape.moveTo(0, 0);
        shape.bezierCurveTo(0.35, 0.22, 0.48, 0.88, 0, 1.34);
        shape.bezierCurveTo(-0.43, 0.85, -0.34, 0.22, 0, 0);

        const geometry = new THREE.ExtrudeGeometry(shape, {
          depth: 0.028,
          bevelEnabled: true,
          bevelThickness: 0.012,
          bevelSize: 0.028,
          bevelOffset: 0,
          bevelSegments: 2,
          curveSegments: 12,
          steps: 1
        });

        const position = geometry.attributes.position;
        const vertex = new THREE.Vector3();
        for (let i = 0; i < position.count; i += 1) {
          vertex.fromBufferAttribute(position, i);
          const progress = THREE.MathUtils.clamp(vertex.y / 1.34, 0, 1);
          position.setZ(i, vertex.z - progress * progress * 0.3);
        }
        position.needsUpdate = true;
        geometry.computeVertexNormals();
        return geometry;
      }

      function createSpiderPetalGeometry() {
        const shape = new THREE.Shape();
        shape.moveTo(0, 0);
        shape.bezierCurveTo(0.1, 0.12, 0.15, 0.58, 0.08, 1.08);
        shape.bezierCurveTo(0.045, 1.38, 0.02, 1.55, 0, 1.64);
        shape.bezierCurveTo(-0.02, 1.55, -0.045, 1.38, -0.08, 1.08);
        shape.bezierCurveTo(-0.15, 0.58, -0.1, 0.12, 0, 0);

        const geometry = new THREE.ExtrudeGeometry(shape, {
          depth: 0.02,
          bevelEnabled: true,
          bevelThickness: 0.008,
          bevelSize: 0.012,
          bevelOffset: 0,
          bevelSegments: 1,
          curveSegments: 16,
          steps: 1
        });

        const position = geometry.attributes.position;
        const vertex = new THREE.Vector3();
        for (let i = 0; i < position.count; i += 1) {
          vertex.fromBufferAttribute(position, i);
          const progress = THREE.MathUtils.clamp(vertex.y / 1.64, 0, 1);
          const curl = progress * progress * progress * 1.55;
          const ripple = Math.sin(progress * Math.PI * 3) * 0.028 * progress;
          position.setZ(i, vertex.z + curl);
          position.setX(i, vertex.x + ripple);
        }
        position.needsUpdate = true;
        geometry.computeVertexNormals();
        return geometry;
      }

      function createStamenCurve() {
        return new THREE.CatmullRomCurve3([
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(0, 0.34, 0.1),
          new THREE.Vector3(0, 0.74, 0.4),
          new THREE.Vector3(0, 0.92, 0.76),
          new THREE.Vector3(0, 0.88, 1.06)
        ]);
      }

      const petalGeometry = createPetalGeometry();
      const leafGeometry = createLeafGeometry();
      const seedGeometry = new THREE.SphereGeometry(0.037, 8, 6);
      const spiderPetalGeometry = createSpiderPetalGeometry();
      const stamenCurve = createStamenCurve();
      const stamenGeometry = new THREE.TubeGeometry(stamenCurve, 18, 0.011, 6, false);
      const antherGeometry = new THREE.SphereGeometry(0.035, 8, 6);
      const flowers = [];

      function addPetalLayer(head, material, count, scale, angleOffset, tilt, zOffset) {
        for (let i = 0; i < count; i += 1) {
          const holder = new THREE.Group();
          holder.rotation.z = angleOffset + (i / count) * Math.PI * 2;

          const petal = new THREE.Mesh(petalGeometry, material);
          petal.rotation.x = tilt;
          petal.scale.setScalar(scale * (0.93 + ((i * 17) % 5) * 0.018));
          petal.position.z = zOffset;
          holder.add(petal);
          head.add(holder);
        }
      }

      function addStamenLayer(head, count, scale, angleOffset, tilt) {
        const tipPosition = stamenCurve.getPoint(1).clone().multiplyScalar(scale);
        tipPosition.applyAxisAngle(new THREE.Vector3(1, 0, 0), tilt);

        for (let i = 0; i < count; i += 1) {
          const holder = new THREE.Group();
          holder.rotation.z = angleOffset + (i / count) * Math.PI * 2;

          const stamen = new THREE.Mesh(stamenGeometry, stamenMaterial);
          stamen.rotation.x = tilt;
          stamen.scale.setScalar(scale);
          holder.add(stamen);

          const anther = new THREE.Mesh(antherGeometry, antherMaterial);
          anther.position.copy(tipPosition);
          anther.scale.setScalar(Math.max(0.7, scale));
          holder.add(anther);
          head.add(holder);
        }
      }

      function addSeeds(head, scale) {
        const seeds = new THREE.Group();
        const count = 58;
        const goldenAngle = Math.PI * (3 - Math.sqrt(5));

        for (let i = 0; i < count; i += 1) {
          const fraction = (i + 0.5) / count;
          const radius = Math.sqrt(fraction) * 0.31 * scale;
          const angle = i * goldenAngle;
          const seed = new THREE.Mesh(seedGeometry, seedMaterial);
          seed.position.set(
            Math.cos(angle) * radius,
            Math.sin(angle) * radius,
            0.225 * scale + (1 - fraction) * 0.018
          );
          seed.scale.setScalar(0.55 + (i % 4) * 0.1);
          seeds.add(seed);
        }
        head.add(seeds);
      }

      function createFlower(config) {
        const group = new THREE.Group();
        group.position.set(config.x, 0, config.z);

        const curve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(config.bendX * 0.18, config.height * 0.32, config.bendZ * 0.18),
          new THREE.Vector3(config.bendX * 0.6, config.height * 0.68, config.bendZ * 0.6),
          new THREE.Vector3(config.bendX, config.height, config.bendZ)
        ]);

        const stem = new THREE.Mesh(
          new THREE.TubeGeometry(curve, 24, 0.047 * config.scale, 8, false),
          stemMaterial
        );
        group.add(stem);

        [0.24, 0.5, 0.72].forEach((point, index) => {
          if (index === 2 && config.scale < 0.6) return;
          const leaf = new THREE.Mesh(leafGeometry, leafMaterial);
          leaf.position.copy(curve.getPoint(point));
          leaf.rotation.order = "YXZ";
          leaf.rotation.y = config.seed * 3.6 + index * 2.48;
          leaf.rotation.x = -Math.PI / 2 + 0.46 + index * 0.1;
          leaf.scale.setScalar(config.scale * (0.74 - index * 0.11));
          group.add(leaf);
        });

        const head = new THREE.Group();
        head.position.copy(curve.getPoint(1));
        head.rotation.set(-Math.PI / 2 + config.tilt, 0, config.spin);
        const material = petalMaterials[config.materialIndex % petalMaterials.length];

        addPetalLayer(head, material, config.petals, config.scale, 0, 0.1, 0.02);
        addPetalLayer(
          head,
          material,
          Math.max(7, config.petals - 3),
          config.scale * 0.69,
          Math.PI / config.petals,
          0.33,
          0.1
        );
        addPetalLayer(
          head,
          material,
          Math.max(5, config.petals - 6),
          config.scale * 0.4,
          (Math.PI / config.petals) * 0.5,
          0.62,
          0.17
        );

        const center = new THREE.Mesh(
          new THREE.SphereGeometry(0.5 * config.scale, 24, 16),
          centerMaterial
        );
        center.scale.set(1, 1, 0.44);
        center.position.z = 0.02;
        head.add(center);

        const centerTop = new THREE.Mesh(
          new THREE.SphereGeometry(0.34 * config.scale, 20, 14),
          centerTopMaterial
        );
        centerTop.scale.set(1, 1, 0.4);
        centerTop.position.z = 0.14 * config.scale;
        head.add(centerTop);
        if (config.detail !== false) addSeeds(head, config.scale);
        group.add(head);

        return { group, head, phase: config.seed * Math.PI * 2, spin: config.spin };
      }

      function createSpiderLily(config) {
        const group = new THREE.Group();
        group.position.set(config.x, 0, config.z);

        const curve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(config.bendX * 0.18, config.height * 0.35, config.bendZ * 0.18),
          new THREE.Vector3(config.bendX * 0.6, config.height * 0.7, config.bendZ * 0.6),
          new THREE.Vector3(config.bendX, config.height, config.bendZ)
        ]);

        const stem = new THREE.Mesh(
          new THREE.TubeGeometry(curve, 20, 0.03 * config.scale, 8, false),
          spiderStemMaterial
        );
        group.add(stem);

        const head = new THREE.Group();
        head.position.copy(curve.getPoint(1));
        head.rotation.set(-Math.PI / 2 + config.tilt, 0, config.spin);
        const material = spiderPetalMaterials[config.materialIndex % spiderPetalMaterials.length];

        for (const layer of [
          { count: 6, scale: config.scale, angle: 0, tilt: -0.06, offset: 0.015 },
          { count: 6, scale: config.scale * 0.82, angle: Math.PI / 6, tilt: 0.1, offset: 0.03 }
        ]) {
          for (let i = 0; i < layer.count; i += 1) {
            const holder = new THREE.Group();
            holder.rotation.z = layer.angle + (i / layer.count) * Math.PI * 2;
            const petal = new THREE.Mesh(spiderPetalGeometry, material);
            petal.rotation.x = layer.tilt;
            petal.scale.setScalar(layer.scale);
            petal.position.z = layer.offset;
            holder.add(petal);
            head.add(holder);
          }
        }

        const center = new THREE.Mesh(
          new THREE.SphereGeometry(0.085 * config.scale, 10, 8),
          spiderCenterMaterial
        );
        head.add(center);
        addStamenLayer(head, 6, 1.18 * config.scale, Math.PI / 12, 0);
        group.add(head);

        return { group, head, phase: config.seed * Math.PI * 2, spin: config.spin };
      }

      const heroLayout = [
        { x: 0, z: 0, height: 3.92, petals: 16, scale: 1.1, tilt: 0.1, bendX: 0.05, bendZ: 0.1, spin: 0.2, materialIndex: 0, seed: 0.13, detail: true },
        { x: -1.92, z: 0.66, height: 2.78, petals: 14, scale: 0.91, tilt: 0.3, bendX: 0.55, bendZ: 0.22, spin: 0.9, materialIndex: 1, seed: 0.41, detail: true },
        { x: 2.08, z: -0.5, height: 3.05, petals: 14, scale: 0.97, tilt: 0.26, bendX: -0.6, bendZ: -0.18, spin: 1.7, materialIndex: 2, seed: 0.67, detail: true },
        { x: -1.18, z: -1.72, height: 2.15, petals: 12, scale: 0.79, tilt: 0.46, bendX: 0.38, bendZ: -0.55, spin: 2.4, materialIndex: 0, seed: 0.22, detail: true },
        { x: 1.34, z: 1.61, height: 2.37, petals: 12, scale: 0.84, tilt: 0.4, bendX: -0.45, bendZ: 0.52, spin: 3.1, materialIndex: 1, seed: 0.85, detail: true },
        { x: -2.75, z: -0.88, height: 1.87, petals: 11, scale: 0.69, tilt: 0.56, bendX: 0.72, bendZ: -0.32, spin: 3.9, materialIndex: 2, seed: 0.55, detail: true },
        { x: 2.78, z: 1.04, height: 1.98, petals: 11, scale: 0.75, tilt: 0.5, bendX: -0.68, bendZ: 0.38, spin: 4.6, materialIndex: 0, seed: 0.93, detail: true },
        { x: 0.4, z: 2.6, height: 2.05, petals: 12, scale: 0.78, tilt: 0.44, bendX: -0.2, bendZ: 0.6, spin: 5.3, materialIndex: 3, seed: 0.31, detail: true },
        { x: -0.6, z: -3, height: 1.9, petals: 11, scale: 0.72, tilt: 0.52, bendX: 0.15, bendZ: -0.62, spin: 6, materialIndex: 3, seed: 0.71, detail: true }
      ];

      function seededRandom(seed) {
        let state = seed % 2147483647;
        if (state <= 0) state += 2147483646;
        return () => {
          state = (state * 16807) % 2147483647;
          return (state - 1) / 2147483646;
        };
      }

      function scatterPoints(
        count,
        random,
        { centerX = 0, centerZ = 0, minRadius = 0, maxRadius, minSpacing, avoid = [] }
      ) {
        const placed = [];
        let attempts = 0;
        const maxAttempts = count * 80;

        while (placed.length < count && attempts < maxAttempts) {
          attempts += 1;
          const angle = random() * Math.PI * 2;
          const radius = minRadius + random() * (maxRadius - minRadius);
          const x = centerX + Math.cos(angle) * radius;
          const z = centerZ + Math.sin(angle) * radius;
          const hasConflict = [...avoid, ...placed].some((point) => {
            const spacing = point.spacing ?? minSpacing;
            return Math.hypot(point.x - x, point.z - z) < spacing;
          });

          if (!hasConflict) placed.push({ x, z, spacing: minSpacing });
        }

        return placed;
      }

      function makeFieldFlowers(count, random) {
        const heroAvoid = heroLayout.map((flower) => ({
          x: flower.x,
          z: flower.z,
          spacing: 1.05
        }));

        return scatterPoints(count, random, {
          minRadius: 3.4,
          maxRadius: 8.2,
          minSpacing: 0.98,
          avoid: heroAvoid
        }).map((point) => ({
          x: point.x,
          z: point.z,
          height: 1.05 + random() * 1.15,
          petals: 8 + Math.floor(random() * 5),
          scale: 0.34 + random() * 0.34,
          tilt: 0.34 + random() * 0.34,
          bendX: (random() - 0.5) * 1.2,
          bendZ: (random() - 0.5) * 1.2,
          spin: random() * Math.PI * 2,
          materialIndex: Math.floor(random() * petalMaterials.length),
          seed: random(),
          detail: false
        }));
      }

      const random = seededRandom(20260921);
      const fieldFlowerCount = window.matchMedia("(max-width: 640px)").matches ? 10 : 20;
      const layout = heroLayout.concat(makeFieldFlowers(fieldFlowerCount, random));

      function createSpiderLilyLayout(random) {
        const compactViewport = window.matchMedia("(max-width: 640px)").matches;
        const yellowAvoid = layout.map((flower) => ({
          x: flower.x,
          z: flower.z,
          spacing: 1.35
        }));
        const clusters = compactViewport
          ? [
              { x: 4.1, z: -2.2, count: 3, radius: 1.8 },
              { x: -3.7, z: 2.4, count: 2, radius: 1.7 },
              { x: -0.5, z: -4.3, count: 2, radius: 1.35 }
            ]
          : [
              { x: 4.1, z: -2.2, count: 5, radius: 2.1 },
              { x: -3.7, z: 2.4, count: 4, radius: 1.95 },
              { x: -0.5, z: -4.3, count: 3, radius: 1.5 }
            ];
        const points = [];

        for (const cluster of clusters) {
          const avoided = yellowAvoid.concat(
            points.map((point) => ({ x: point.x, z: point.z, spacing: 0.54 }))
          );
          const clusterPoints = scatterPoints(cluster.count, random, {
            centerX: cluster.x,
            centerZ: cluster.z,
            minRadius: 0.2,
            maxRadius: cluster.radius,
            minSpacing: 0.54,
            avoid: avoided
          }).map((point) => ({
            ...point,
            patchX: cluster.x,
            patchZ: cluster.z,
            patchRadius: cluster.radius,
            loose: false
          }));
          points.push(...clusterPoints);
        }

        const loosePoints = scatterPoints(compactViewport ? 1 : 2, random, {
          minRadius: 2.4,
          maxRadius: 8.8,
          minSpacing: 1.8,
          avoid: yellowAvoid.concat(points.map((point) => ({ x: point.x, z: point.z, spacing: 1.6 })))
        }).map((point) => ({
          ...point,
          patchX: point.x,
          patchZ: point.z,
          patchRadius: 1,
          loose: true
        }));
        points.push(...loosePoints);

        return points.map((point) => {
          const distance = Math.hypot(point.x - point.patchX, point.z - point.patchZ);
          const edge = point.loose ? 0 : Math.min(distance / point.patchRadius, 1);
          return {
            x: point.x,
            z: point.z,
            height: (point.loose ? 1.8 : 2.3) - edge * 0.85 + random() * (point.loose ? 0.35 : 0.25),
            scale: (point.loose ? 0.55 : 0.58) + (1 - edge) * 0.24 + random() * 0.08,
            tilt: 0.14 + edge * 0.24 + random() * 0.08,
            bendX: (random() - 0.5) * 0.85,
            bendZ: (random() - 0.5) * 0.85,
            spin: random() * Math.PI * 2,
            materialIndex: Math.floor(random() * spiderPetalMaterials.length),
            seed: random()
          };
        });
      }

      const spiderLayout = createSpiderLilyLayout(random);

      function createShadowTexture() {
        const canvas = document.createElement("canvas");
        canvas.width = canvas.height = 256;
        const context = canvas.getContext("2d");
        const gradient = context.createRadialGradient(128, 128, 0, 128, 128, 128);
        gradient.addColorStop(0, "rgba(0, 0, 0, 0.52)");
        gradient.addColorStop(0.46, "rgba(0, 0, 0, 0.2)");
        gradient.addColorStop(1, "rgba(0, 0, 0, 0)");
        context.fillStyle = gradient;
        context.fillRect(0, 0, 256, 256);
        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        return texture;
      }

      const shadowMaterial = new THREE.MeshBasicMaterial({
        map: createShadowTexture(),
        transparent: true,
        depthWrite: false,
        opacity: 0.8
      });
      const shadowGeometry = new THREE.PlaneGeometry(1, 1);

      layout.forEach((config) => {
        const flower = createFlower(config);
        flowers.push(flower);
        scene.add(flower.group);

        const shadow = new THREE.Mesh(shadowGeometry, shadowMaterial);
        shadow.rotation.x = -Math.PI / 2;
        shadow.position.set(
          config.x + config.bendX * 0.5,
          0.01,
          config.z + config.bendZ * 0.5
        );
        shadow.scale.setScalar(2.12 * config.scale + config.height * 0.25);
        scene.add(shadow);
      });

      spiderLayout.forEach((config) => {
        const flower = createSpiderLily(config);
        flowers.push(flower);
        scene.add(flower.group);

        const shadow = new THREE.Mesh(shadowGeometry, shadowMaterial);
        shadow.rotation.x = -Math.PI / 2;
        shadow.position.set(
          config.x + config.bendX * 0.5,
          0.01,
          config.z + config.bendZ * 0.5
        );
        shadow.scale.setScalar(1.7 * config.scale + config.height * 0.28);
        scene.add(shadow);
      });

      const particleBatches = [];
      const particleBatchCount = window.matchMedia("(max-width: 640px)").matches ? 4 : 6;
      const particlesPerBatch = window.matchMedia("(max-width: 640px)").matches ? 28 : 46;

      for (let batchIndex = 0; batchIndex < particleBatchCount; batchIndex += 1) {
        const positions = new Float32Array(particlesPerBatch * 3);
        const baseX = new Float32Array(particlesPerBatch);
        const baseZ = new Float32Array(particlesPerBatch);
        const speed = new Float32Array(particlesPerBatch);
        const driftPhase = new Float32Array(particlesPerBatch);

        for (let i = 0; i < particlesPerBatch; i += 1) {
          const x = (random() - 0.5) * 17;
          const y = random() * 8.2;
          const z = (random() - 0.5) * 17;
          positions[i * 3] = x;
          positions[i * 3 + 1] = y;
          positions[i * 3 + 2] = z;
          baseX[i] = x;
          baseZ[i] = z;
          speed[i] = 0.32 + random() * 1.05;
          driftPhase[i] = random() * Math.PI * 2;
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        const baseSize = 0.05 + random() * 0.035;
        const material = new THREE.PointsMaterial({
          color: new THREE.Color().setHSL((42 + random() * 18) / 360, 0.85, 0.64),
          size: baseSize,
          transparent: true,
          opacity: 0.75,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          sizeAttenuation: true
        });
        const points = new THREE.Points(geometry, material);
        scene.add(points);
        particleBatches.push({
          geometry,
          material,
          baseX,
          baseZ,
          speed,
          driftPhase,
          baseSize,
          phase: random() * Math.PI * 2,
          pulseSpeed: 0.6 + random() * 0.9
        });
      }

      const redParticleBatchCount = window.matchMedia("(max-width: 640px)").matches ? 1 : 2;
      const redParticlesPerBatch = window.matchMedia("(max-width: 640px)").matches ? 20 : 30;

      for (let batchIndex = 0; batchIndex < redParticleBatchCount; batchIndex += 1) {
        const positions = new Float32Array(redParticlesPerBatch * 3);
        const baseX = new Float32Array(redParticlesPerBatch);
        const baseZ = new Float32Array(redParticlesPerBatch);
        const speed = new Float32Array(redParticlesPerBatch);
        const driftPhase = new Float32Array(redParticlesPerBatch);

        for (let i = 0; i < redParticlesPerBatch; i += 1) {
          const x = (random() - 0.5) * 17;
          const y = random() * 8.2;
          const z = (random() - 0.5) * 17;
          positions[i * 3] = x;
          positions[i * 3 + 1] = y;
          positions[i * 3 + 2] = z;
          baseX[i] = x;
          baseZ[i] = z;
          speed[i] = 0.28 + random() * 0.95;
          driftPhase[i] = random() * Math.PI * 2;
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        const hue = random() < 0.5 ? random() * 0.03 : 0.97 + random() * 0.03;
        const baseSize = 0.052 + random() * 0.03;
        const material = new THREE.PointsMaterial({
          color: new THREE.Color().setHSL(hue, 0.9, 0.53),
          size: baseSize,
          transparent: true,
          opacity: 0.7,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          sizeAttenuation: true
        });
        const points = new THREE.Points(geometry, material);
        scene.add(points);
        particleBatches.push({
          geometry,
          material,
          baseX,
          baseZ,
          speed,
          driftPhase,
          baseSize,
          phase: random() * Math.PI * 2,
          pulseSpeed: 0.55 + random() * 0.9
        });
      }

      function createGlowTexture() {
        const canvas = document.createElement("canvas");
        canvas.width = canvas.height = 128;
        const context = canvas.getContext("2d");
        const gradient = context.createRadialGradient(64, 64, 0, 64, 64, 64);
        gradient.addColorStop(0, "rgba(255,244,196,1)");
        gradient.addColorStop(0.35, "rgba(255,212,112,0.55)");
        gradient.addColorStop(1, "rgba(255,180,60,0)");
        context.fillStyle = gradient;
        context.fillRect(0, 0, 128, 128);
        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        return texture;
      }

      const glowTexture = createGlowTexture();
      const fireflies = [];
      const fireflyCount = window.matchMedia("(max-width: 640px)").matches ? 12 : 22;

      for (let i = 0; i < fireflyCount; i += 1) {
        const material = new THREE.SpriteMaterial({
          map: glowTexture,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          opacity: 0.8
        });
        const sprite = new THREE.Sprite(material);
        const scale = 0.2 + random() * 0.26;
        sprite.scale.set(scale, scale, 1);

        const angle = random() * Math.PI * 2;
        const radius = 1.4 + random() * 6.6;
        const baseX = Math.cos(angle) * radius;
        const baseY = 0.35 + random() * 3.3;
        const baseZ = Math.sin(angle) * radius;
        sprite.position.set(baseX, baseY, baseZ);
        scene.add(sprite);
        fireflies.push({
          sprite,
          material,
          baseX,
          baseY,
          baseZ,
          phaseX: random() * Math.PI * 2,
          phaseY: random() * Math.PI * 2,
          phaseZ: random() * Math.PI * 2,
          speed: 0.22 + random() * 0.45,
          pulseSpeed: 0.7 + random() * 1.3,
          pulsePhase: random() * Math.PI * 2
        });
      }

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.enablePan = false;
      controls.rotateSpeed = 0.76;
      controls.zoomSpeed = 0.82;
      controls.minDistance = 4.25;
      controls.maxDistance = 28;
      controls.minPolarAngle = 0.2;
      controls.maxPolarAngle = Math.PI * 0.52;
      controls.target.set(0, 2.2, 0);
      controls.autoRotateSpeed = 0.46;
      controls.update();

      let isPaused = reduceMotion;
      let idleTimer = null;

      function setMotionState(paused) {
        isPaused = paused;
        controls.autoRotate = !paused;
        motionToggle.setAttribute("aria-label", paused ? "Reanudar movimiento" : "Pausar movimiento");
        motionToggle.title = paused ? "Reanudar movimiento" : "Pausar movimiento";
        pauseIcon.innerHTML = paused
          ? '<path d="m8 5 11 7-11 7V5Z"/>'
          : '<path d="M8 5v14M16 5v14"/>';
      }

      setMotionState(isPaused);

      motionToggle.addEventListener("click", () => {
        if (idleTimer) clearTimeout(idleTimer);
        setMotionState(!isPaused);
      });

      controls.addEventListener("start", () => {
        if (idleTimer) clearTimeout(idleTimer);
        controls.autoRotate = false;
        gestureHint.style.opacity = "0";
        gestureHint.style.transform = "translateY(8px)";
      });

      controls.addEventListener("end", () => {
        if (isPaused) return;
        idleTimer = window.setTimeout(() => {
          if (!isPaused) controls.autoRotate = true;
        }, 3300);
      });

      function resize() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        const aspect = width / height;
        camera.aspect = aspect;
        camera.fov = aspect < 1 ? Math.min(84, 43 * Math.pow(1 / aspect, 0.5)) : 43;
        camera.updateProjectionMatrix();
        controls.target.set(0, aspect < 1 ? 2.36 : 2.2, 0);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(width, height);
      }

      window.addEventListener("resize", resize, { passive: true });
      window.addEventListener("orientationchange", () => window.setTimeout(resize, 120));
      resize();

      const clock = new THREE.Clock();
      let elapsed = 0;

      function animate() {
        requestAnimationFrame(animate);
        const delta = Math.min(clock.getDelta(), 0.05);
        if (!isPaused) elapsed += delta;

        const wind = Math.sin(elapsed * 0.18) * 0.5 + 0.5;
        const windAmplitude = (0.028 + 0.022 * wind) * (isPaused ? 0 : 1);

        for (const flower of flowers) {
          const phase = flower.phase;
          flower.group.rotation.z = Math.sin(elapsed * 0.72 + phase) * windAmplitude;
          flower.group.rotation.x = Math.cos(elapsed * 0.55 + phase * 1.3) * windAmplitude * 0.85;
          flower.head.rotation.z =
            flower.spin + Math.sin(elapsed * 0.95 + phase) * 0.036 * (0.6 + wind) * (isPaused ? 0 : 1);
        }

        if (!isPaused) {
          for (const batch of particleBatches) {
            const position = batch.geometry.attributes.position;
            for (let i = 0; i < position.count; i += 1) {
              let y = position.getY(i) + delta * batch.speed[i] * 0.24;
              if (y > 8.4) y = -0.4;
              position.setY(i, y);
              position.setX(
                i,
                batch.baseX[i] + Math.sin(elapsed * 0.42 + batch.driftPhase[i]) * 0.38
              );
              position.setZ(
                i,
                batch.baseZ[i] + Math.cos(elapsed * 0.36 + batch.driftPhase[i] * 1.4) * 0.38
              );
            }
            position.needsUpdate = true;

            const twinkle = Math.sin(elapsed * batch.pulseSpeed + batch.phase) * 0.5 + 0.5;
            batch.material.size = batch.baseSize * (0.7 + twinkle * 0.7);
            batch.material.opacity = 0.5 + twinkle * 0.42;
          }

          for (const firefly of fireflies) {
            firefly.sprite.position.x =
              firefly.baseX + Math.sin(elapsed * firefly.speed + firefly.phaseX) * 0.7;
            firefly.sprite.position.y =
              firefly.baseY +
              Math.sin(elapsed * firefly.speed * 0.72 + firefly.phaseY) * 0.55 +
              Math.sin(elapsed * 0.25 + firefly.phaseY) * 0.2;
            firefly.sprite.position.z =
              firefly.baseZ + Math.cos(elapsed * firefly.speed + firefly.phaseZ) * 0.7;
            firefly.material.opacity =
              0.3 + 0.55 * Math.abs(Math.sin(elapsed * firefly.pulseSpeed + firefly.pulsePhase));
          }

          haloLight.intensity = 38 + Math.sin(elapsed * 0.8) * 4;
          frontLight.intensity = 15 + Math.sin(elapsed * 0.8) * 3;
          softAmber.intensity = 12 + Math.sin(elapsed * 0.6 + 1.4) * 5;
          redAccentLight.intensity = 10 + Math.sin(elapsed * 0.7 + 2.1) * 2.8;
          redAccentLight2.intensity = 8 + Math.sin(elapsed * 0.65 + 0.6) * 2.4;
        }

        controls.update();
        renderer.render(scene, camera);
      }

      animate();
    </script>
  </body>
</html>
