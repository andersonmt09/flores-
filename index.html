<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#030714" />
    <meta
      name="description"
      content="Una experiencia floral tridimensional de luz, movimiento y color."
    />
    <title>Jardín en 3D</title>
    <style>
      :root {
        color-scheme: dark;
        --cream: #fff7df;
        --muted: rgba(255, 247, 223, 0.68);
        --gold: #ffd45a;
        --line: rgba(255, 224, 126, 0.24);
        --glass: rgba(9, 29, 29, 0.32);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }

      body {
        background: #030714;
        color: var(--cream);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      #app,
      canvas,
      .atmosphere,
      .vignette,
      .grain {
        position: fixed;
        inset: 0;
      }

      #app {
        z-index: 1;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      .atmosphere {
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse 42% 30% at 50% 38%, rgba(255, 201, 58, 0.15), transparent 70%),
          radial-gradient(ellipse 28% 22% at 18% 78%, rgba(92, 177, 130, 0.12), transparent 75%);
      }

      .vignette {
        z-index: 2;
        pointer-events: none;
        background:
          linear-gradient(180deg, rgba(2, 12, 13, 0.22), transparent 30%, transparent 68%, rgba(2, 12, 13, 0.5)),
          radial-gradient(ellipse at center, transparent 36%, rgba(1, 10, 11, 0.54) 100%);
      }

      .grain {
        z-index: 2;
        pointer-events: none;
        opacity: 0.09;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
        mix-blend-mode: soft-light;
      }

      .ui {
        position: fixed;
        inset: 0;
        z-index: 3;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding:
          max(1.25rem, env(safe-area-inset-top, 0px))
          clamp(1.15rem, 4vw, 3.5rem)
          max(1.25rem, env(safe-area-inset-bottom, 0px));
        pointer-events: none;
        opacity: 0;
        animation: arrive 1.15s cubic-bezier(0.22, 1, 0.36, 1) 180ms forwards;
      }

      @keyframes arrive {
        to {
          opacity: 1;
        }
      }

      .masthead {
        max-width: min(31rem, 80vw);
        animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) 280ms both;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(0.8rem);
        }
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        margin: 0 0 0.8rem;
        color: var(--gold);
        font-size: clamp(0.61rem, 1.5vw, 0.72rem);
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 1.75rem;
        height: 1px;
        background: currentColor;
        content: "";
        opacity: 0.76;
      }

      h1 {
        max-width: 11ch;
        margin: 0;
        color: var(--cream);
        font-family: Iowan Old Style, Baskerville, "Times New Roman", Georgia, serif;
        font-size: clamp(2.5rem, 7.1vw, 5.35rem);
        font-weight: 500;
        letter-spacing: -0.052em;
        line-height: 0.91;
        text-wrap: balance;
        text-shadow: 0 0 42px rgba(255, 208, 79, 0.11);
      }

      .message {
        max-width: 24rem;
        margin: 1rem 0 0;
        color: var(--muted);
        font-family: Iowan Old Style, Baskerville, Georgia, serif;
        font-size: clamp(1rem, 2vw, 1.18rem);
        font-style: italic;
        letter-spacing: 0.01em;
        line-height: 1.45;
      }

      .footer {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 1rem;
        width: 100%;
      }

      .interaction {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        max-width: 24rem;
        padding: 0.62rem 0.84rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--glass);
        box-shadow: 0 0.5rem 2.2rem rgba(0, 0, 0, 0.14);
        color: rgba(255, 247, 223, 0.76);
        font-size: clamp(0.68rem, 1.8vw, 0.78rem);
        letter-spacing: 0.025em;
        line-height: 1.2;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition: opacity 500ms ease, transform 500ms ease;
      }

      .interaction svg {
        flex: 0 0 auto;
        width: 1rem;
        height: 1rem;
        color: var(--gold);
      }

      .controls {
        display: flex;
        gap: 0.6rem;
        pointer-events: auto;
      }

      .playlist-count { text-align: center; color: var(--muted); font-size: 0.85rem; margin: 0 0 1.4rem; letter-spacing: 0.04em; }
      .playlist-empty { text-align: center; color: var(--muted); padding: 2rem 0; }
      .now-playing {
        display: none;
        align-items: center;
        gap: 0.55rem;
        max-width: min(15rem, 48vw);
        height: 2.45rem;
        padding: 0 0.9rem 0 0.35rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--glass);
        color: var(--cream);
        font: inherit;
        font-size: 0.78rem;
        cursor: pointer;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .now-playing.visible { display: inline-flex; }
      .now-playing-cover { flex: 0 0 auto; width: 1.8rem; height: 1.8rem; border-radius: 50%; background: #233 center/cover; }
      .now-playing.playing .now-playing-cover { animation: spin 8s linear infinite; }
      .now-playing-title { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .progress-container { touch-action: none; }
      .round-button {
        display: inline-grid;
        width: 2.45rem;
        height: 2.45rem;
        place-items: center;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: var(--glass);
        color: var(--cream);
        cursor: pointer;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
      }

      .round-button:hover {
        border-color: rgba(255, 224, 126, 0.52);
        background: rgba(255, 218, 109, 0.13);
        transform: translateY(-2px);
      }

      .round-button:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 3px;
      }

      .round-button svg {
        width: 1rem;
        height: 1rem;
      }

      .top-menu-container {
        position: relative;
        display: block; margin: 0 auto 2rem; width: 250px; height: 250px;
        pointer-events: auto;
      }

      .music-panel {
        position: absolute;
        top: 3.2rem;
        left: 0;
        width: 200px;
        background: var(--glass);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 1rem;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-10px);
        transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
      }

      .music-panel.active {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      .music-panel .panel-title {
        margin: 0 0 0.5rem;
        font-size: 0.85rem;
        color: var(--gold);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .music-panel .song-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .music-panel .song-list li {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.8rem;
        color: var(--muted);
        padding: 0.5rem 0;
        border-bottom: 1px solid rgba(255, 224, 126, 0.1);
        cursor: pointer;
        transition: color 0.2s ease;
      }

      .music-panel .song-list li:hover {
        color: var(--cream);
      }

      .music-panel .song-list li:last-child {
        border-bottom: none;
      }

      .play-icon {
        width: 1rem;
        height: 1rem;
        color: var(--gold);
        flex-shrink: 0;
      }

      .splash-screen {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: radial-gradient(ellipse 120% 80% at 50% 110%, #1b2d55 0%, #0b1736 45%, #030714 100%), #030714;
        opacity: 1;
        visibility: visible;
        transition: opacity 1100ms ease, visibility 1100ms ease;
      }

      .splash-screen.hidden {
        opacity: 0;
        visibility: hidden;
      }

      /* cielo estrellado del inicio */
      .splash-stars,
      .splash-stars::after {
        position: absolute;
        inset: -10%;
        background-image:
          radial-gradient(1.2px 1.2px at 12% 18%, #fff, transparent 60%),
          radial-gradient(1px 1px at 27% 62%, #dfe8ff, transparent 60%),
          radial-gradient(1.6px 1.6px at 41% 24%, #fff6e8, transparent 60%),
          radial-gradient(1px 1px at 58% 78%, #fff, transparent 60%),
          radial-gradient(1.3px 1.3px at 66% 35%, #e6eeff, transparent 60%),
          radial-gradient(1px 1px at 79% 12%, #fff, transparent 60%),
          radial-gradient(1.5px 1.5px at 88% 56%, #fff3df, transparent 60%),
          radial-gradient(1px 1px at 7% 84%, #fff, transparent 60%),
          radial-gradient(1.1px 1.1px at 35% 90%, #dfe8ff, transparent 60%),
          radial-gradient(1px 1px at 93% 88%, #fff, transparent 60%);
        background-size: 360px 360px;
        content: "";
        animation: twinkle 4s ease-in-out infinite alternate;
      }
      .splash-stars::after {
        inset: 0;
        background-size: 230px 230px;
        background-position: 70px 40px;
        animation-delay: -2s;
        opacity: 0.7;
      }
      @keyframes twinkle {
        from { opacity: 0.55; }
        to { opacity: 1; }
      }

      .splash-moon {
        position: absolute;
        top: 14%;
        right: 16%;
        width: clamp(58px, 11vw, 96px);
        aspect-ratio: 1;
        border-radius: 50%;
        background:
          radial-gradient(circle at 35% 38%, rgba(140, 138, 132, 0.28) 0 12%, transparent 13%),
          radial-gradient(circle at 62% 58%, rgba(140, 138, 132, 0.22) 0 16%, transparent 17%),
          radial-gradient(circle at 48% 72%, rgba(140, 138, 132, 0.18) 0 8%, transparent 9%),
          radial-gradient(circle at 38% 35%, #fffdf6, #e8e3d6 70%, #cbc5b6);
        box-shadow: 0 0 40px 10px rgba(190, 210, 255, 0.28), 0 0 120px 40px rgba(120, 150, 230, 0.16);
        animation: moonRise 2.4s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes moonRise {
        from { transform: translateY(30px); opacity: 0; }
      }

      .splash__card {
        position: relative;
        text-align: center;
        padding: 0 1.5rem;
        animation: rise 1.4s cubic-bezier(0.22, 1, 0.36, 1) 200ms both;
      }

      .splash__card h1 {
        max-width: none;
        margin: 0;
        color: #fff7df;
        font-size: clamp(2.6rem, 9vw, 5rem);
        font-weight: 400;
        letter-spacing: 0.18em;
        line-height: 1;
        text-shadow: 0 0 30px rgba(255, 212, 140, 0.35);
      }

      .splash-subtitle {
        margin: 1rem 0 0;
        color: rgba(255, 247, 223, 0.72);
        font-family: Iowan Old Style, Baskerville, Georgia, serif;
        font-size: clamp(0.95rem, 2.6vw, 1.15rem);
        font-style: italic;
        letter-spacing: 0.06em;
      }

      .splash-bar-container {
        width: min(220px, 60vw);
        height: 2px;
        background: rgba(255, 247, 223, 0.12);
        border-radius: 2px;
        margin: 1.8rem auto 0;
        overflow: hidden;
      }

      .pretty-bar {
        width: 0;
        height: 100%;
        background: linear-gradient(90deg, #ffd45a 0%, #ff9a9e 55%, #c9d6ff 100%);
        border-radius: 2px;
        box-shadow: 0 0 10px rgba(255, 212, 90, 0.6);
        animation: loadBar 2.2s cubic-bezier(0.22, 1, 0.36, 1) forwards 0.4s;
      }

      @keyframes loadBar {
        to { width: 100%; }
      }

      /* control para caminar (pantallas táctiles) */
      .joystick {
        display: none;
        position: relative;
        width: 104px;
        height: 104px;
        flex: 0 0 auto;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 247, 223, 0.06), rgba(9, 20, 40, 0.35));
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        pointer-events: auto;
        touch-action: none;
      }
      .joystick.active { border-color: rgba(255, 212, 90, 0.6); }
      .joystick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 44px;
        height: 44px;
        margin: -22px 0 0 -22px;
        border-radius: 50%;
        background: radial-gradient(circle at 40% 35%, rgba(255, 247, 223, 0.55), rgba(255, 212, 90, 0.25));
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
        transition: transform 80ms linear;
      }
      @media (pointer: coarse) {
        .joystick { display: block; }
      }
      .hint-touch { display: none; }
      @media (pointer: coarse) {
        .hint-touch { display: inline; }
        .hint-desktop { display: none; }
      }
      .footer-left {
        display: flex;
        align-items: end;
        gap: 0.8rem;
        min-width: 0;
      }

      @media (max-width: 540px) {
        .ui {
          padding-left: 1.15rem;
          padding-right: 1.15rem;
        }

        .masthead {
          max-width: 16rem;
        }

        .footer {
          align-items: center;
        }

        .interaction {
          max-width: calc(100vw - 5.5rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
      

      

      .dynamic-bg {
        position: absolute;
        inset: -50px;
        z-index: 0;
        background-size: cover;
        background-position: center;
        filter: blur(40px) brightness(0.6);
        transition: background-image 0.5s ease;
      }

      .bg-overlay {
        position: absolute;
        inset: 0;
        z-index: 1;
        background: linear-gradient(180deg, rgba(7, 22, 22, 0.4) 0%, rgba(7, 22, 22, 0.9) 100%);
      }

      .music-nav-top {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        padding: 1.5rem;
        z-index: 10;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .close-music-btn {
        background: transparent;
        border: none;
        color: var(--cream);
        font-size: 0.9rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      }

            .player-layout {
        position: relative;
        z-index: 2;
        width: 90%;
        max-width: 500px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
        height: 100vh;
        padding-top: 4rem;
        box-sizing: border-box;
      }
      
      @media (max-width: 768px) {
              .player-layout {
        position: relative;
        z-index: 2;
        width: 90%;
        max-width: 500px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
        height: 100vh;
        padding-top: 4rem;
        box-sizing: border-box;
      }
      }

      .player-container {
        
        width: 100%;
        max-width: 380px;
        padding: 2rem;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        text-align: center;
      }

      .playlist-container {
        flex: 1;
        width: 100%;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 24px;
        padding: 1.5rem;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        display: flex;
        flex-direction: column;
        max-height: 500px;
      }

      .playlist-search {
        width: 100%;
        padding: 0.8rem 1rem;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(0,0,0,0.2);
        color: var(--cream);
        font-family: inherit;
        margin-bottom: 1rem;
        outline: none;
      }
      
      .playlist-search::placeholder {
        color: rgba(255,255,255,0.5);
      }

      
      .playlist-item {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 0.6rem 0.8rem;
        display: flex;
        flex-direction: row;
        align-items: center;
        text-align: left;
        gap: 1rem;
        cursor: pointer;
        transition: background 0.2s, transform 0.2s;
      }
      .playlist-item:hover {
        background: rgba(255, 255, 255, 0.15);
      }
      .playlist-item-img {
        width: 45px;
        height: 45px;
        border-radius: 6px;
        flex-shrink: 0;
        background-size: cover;
        background-position: center;
        border: 1px solid rgba(255,255,255,0.1);
      }
      .playlist-item-info {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        flex: 1;
        overflow: hidden;
      }
      .playlist-item-title {
        font-size: 0.95rem;
        color: var(--cream);
        margin: 0;
        font-family: 'Inter', sans-serif;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        width: 100%;
      }
      .playlist-item-artist {
        font-size: 0.75rem;
        color: rgba(255,255,255,0.6);
        margin: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        width: 100%;
      }

      .playlist-items {
        list-style: none;
        padding: 0;
        margin: 0;
        overflow-y: auto;
        flex: 1;
      }

            

      .playlist-item:hover {
        background: rgba(255,255,255,0.1);
      }

      .playlist-item.active-song {
        background: rgba(255, 212, 90, 0.15);
        border: 1px solid rgba(255, 212, 90, 0.3);
      }

            

      

            

                  

            .album-art {
        width: 100%;
        height: 100%;
        margin: 0;
        border-radius: 50%;
        background-size: cover;
        background-position: center;
        border: 4px solid rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        animation: spin 20s linear infinite paused; -webkit-animation: spin 20s linear infinite paused;
      }

      .album-art.playing { animation-play-state: running; -webkit-animation-play-state: running; }

      .album-art::after {
        content: "";
        width: 40px;
        height: 40px;
        background: #111;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.2);
      }

      

      .song-title { font-family: Iowan Old Style, Baskerville, Georgia, serif; font-size: 1.4rem; margin: 0 0 0.2rem; color: var(--cream); }
      .song-artist { font-size: 0.9rem; color: rgba(255, 255, 255, 0.7); margin: 0 0 1.5rem; }

      .controls { display: flex; align-items: center; justify-content: center; gap: 1rem; }
      .btn-control { background: transparent; border: none; color: var(--cream); cursor: pointer; padding: 0; min-width: 44px; min-height: 44px; transition: transform 0.2s, color 0.2s; display: grid; place-items: center; touch-action: manipulation; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      .btn-control:active, .btn-control.holding { transform: scale(0.92); color: var(--gold); }
      .btn-control:hover { color: var(--gold); transform: scale(1.1); }
      .btn-play { width: 3.5rem; height: 3.5rem; border-radius: 50%; background: rgba(255, 255, 255, 0.15); color: #fff; }
      .btn-play:hover { background: rgba(255, 255, 255, 0.25); }

      .progress-wrapper { margin: 1rem 0 1.5rem; }
      .progress-container { width: 100%; height: 6px; background: rgba(255, 255, 255, 0.2); border-radius: 3px; position: relative; cursor: pointer; }
      .progress-bar { height: 100%; width: 0%; background: var(--cream); border-radius: 3px; position: relative; }
      .progress-bar::after { content: ""; position: absolute; right: -5px; top: -3px; width: 12px; height: 12px; background: #fff; border-radius: 50%; }
      .time-info { display: flex; justify-content: space-between; font-size: 0.75rem; color: rgba(255, 255, 255, 0.6); margin-top: 0.5rem; }
    
            .full-screen-overlay {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.5s ease, visibility 0.5s;
        background-color: #071616;
      }
      .full-screen-overlay.active {
        opacity: 1;
        visibility: visible;
      }
                  .playlist-full-container {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
        overflow-y: auto;
        padding: 8rem 0rem 4rem;

    <script type="importmap">
      {
        "imports": {

    </script>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { mergeGeometries, mergeVertices } from "three/addons/utils/BufferGeometryUtils.js";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

      const container = document.getElementById("app");
      const motionToggle = document.getElementById("motionToggle");
      const pauseIcon = document.getElementById("pauseIcon");
      const gestureHint = document.getElementById("gestureHint");
      const splashScreen = document.getElementById("splashScreen");
      const topMenuToggle = document.getElementById("topMenuToggle");
      const topMenuPanel = document.getElementById("topMenuPanel");
      const joystick = document.getElementById("joystick");
      const joystickKnob = document.getElementById("joystickKnob");
      const homeButton = document.getElementById("homeButton");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const compactViewport = window.matchMedia("(max-width: 640px)").matches;
      const coarsePointer = window.matchMedia("(pointer: coarse)").matches;
      const lowPower = compactViewport || coarsePointer || (navigator.hardwareConcurrency || 8) <= 4;
      // Escala de cantidades: el móvil recibe el mismo jardín pero más ligero.
      const Q = lowPower ? 0.45 : 1;

      if (topMenuToggle && topMenuPanel) {
        topMenuToggle.addEventListener("click", () => {
          topMenuPanel.classList.toggle("active");
        });
      }

      // La pantalla de inicio se va cuando el jardín ya está construido
      function hideSplash() {
        if (splashScreen) splashScreen.classList.add("hidden");
      }

      // ---------- RENDER ----------
      const renderer = new THREE.WebGLRenderer({
        antialias: !lowPower,
        powerPreference: "high-performance"
      });
      const maxPixelRatio = lowPower ? 1.5 : 1.75;
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, maxPixelRatio));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.25;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);
      document.documentElement.classList.add("webgl-ready");

      const scene = new THREE.Scene();
      const fogColor = new THREE.Color("#0d1b38");
      scene.fog = new THREE.Fog(fogColor, 22, 95);
      scene.background = fogColor;

      const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 600);
      camera.position.set(0.6, 3.1, 15.5);

      // Luna baja delante de la entrada: se ve desde la vista inicial
      const moonSkyDir = new THREE.Vector3(-0.3, 0.3, -1).normalize();
      const moonLightDir = new THREE.Vector3(-0.35, 0.75, -1).normalize();

      // ---------- RUIDO (JS) ----------
      function hash2(x, z) {
        const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453;
        return s - Math.floor(s);
      }
      function valueNoise(x, z) {
        const ix = Math.floor(x), iz = Math.floor(z);
        const fx = x - ix, fz = z - iz;
        const ux = fx * fx * (3 - 2 * fx), uz = fz * fz * (3 - 2 * fz);
        const a = hash2(ix, iz), b = hash2(ix + 1, iz), c = hash2(ix, iz + 1), d = hash2(ix + 1, iz + 1);
        return a + (b - a) * ux + (c - a) * uz + (a - b - c + d) * ux * uz;
      }
      function fbm(x, z) {
        let v = 0, amp = 0.5, f = 1;
        for (let i = 0; i < 4; i += 1) {
          v += valueNoise(x * f, z * f) * amp;
          f *= 2.03;
          amp *= 0.5;
        }
        return v;
      }
      function groundHeight(x, z) {
        const r = Math.hypot(x, z);
        const rise = THREE.MathUtils.smoothstep(r, 64, 110);
        return rise * (fbm(x * 0.03 + 7, z * 0.03 - 3) * 12 - 1.5);
      }

      function seededRandom(seed) {
        let state = seed % 2147483647;
        if (state <= 0) state += 2147483646;
        return () => {
          state = (state * 16807) % 2147483647;
          return (state - 1) / 2147483646;
        };
      }
      const random = seededRandom(20260921);

      // ---------- DISEÑO DEL JARDÍN ----------
      // Centro: macizo de tulipanes, sendero en anillo y seis parterres con seto.
      // Alrededor: un gran jardín con avenidas en cruz, dos anillos de paseo,
      // campos de tulipanes en franjas de colores y praderas de lirios araña.
      const GARDEN = {
        centerBed: 3.2,
        pathInner: 3.45,
        pathOuter: 4.65,
        bedInner: 5.0,
        bedOuter: 8.7,
        hedge: 10.3,
        sectorCount: 6,
        walkHalf: 0.55,
        ring1: [12.2, 13.6],
        ring2: [34.4, 35.8],
        avenueHalf: 1.1,
        tulipField: [15.5, 33.2],
        lilyField: [37.5, 58],
        edge: 62
      };
      const SECTOR = (Math.PI * 2) / GARDEN.sectorCount;

      function sectorInfo(x, z) {
        const r = Math.hypot(x, z);
        // desfase de 30°: los pasillos quedan en el eje z, donde están las entradas
        const theta = Math.atan2(z, x) - SECTOR / 2;
        let a = theta % SECTOR;
        if (a < 0) a += SECTOR;
        const index = Math.round((theta - a) / SECTOR + 6) % 6;
        const local = a - SECTOR / 2;
        const edge = (SECTOR / 2 - Math.abs(local)) * r;
        return { r, theta, index, edge };
      }
      function onAvenue(x, z, margin = 0) {
        const r = Math.hypot(x, z);
        const half = GARDEN.avenueHalf + margin;
        const zAxis = Math.abs(x) < half && r > GARDEN.pathOuter - 0.2 && r < GARDEN.edge + 1;
        const xAxis = Math.abs(z) < half && r > GARDEN.ring1[0] && r < GARDEN.edge + 1;
        return zAxis || xAxis;
      }
      function onPath(x, z, margin = 0.12) {
        const r = Math.hypot(x, z);
        if (r > GARDEN.pathInner - margin && r < GARDEN.pathOuter + margin) return true;
        if (r > GARDEN.ring1[0] - margin && r < GARDEN.ring1[1] + margin) return true;
        if (r > GARDEN.ring2[0] - margin && r < GARDEN.ring2[1] + margin) return true;
        if (r < GARDEN.hedge + 1) return Math.abs(x) < 0.62 && r > GARDEN.pathOuter - 0.2;
        return onAvenue(x, z, margin);
      }
      function inBed(x, z, margin = 0) {
        const s = sectorInfo(x, z);
        if (s.r < GARDEN.centerBed - margin) return "center";
        if (s.r > GARDEN.bedInner + margin && s.r < GARDEN.bedOuter - margin && s.edge > GARDEN.walkHalf + margin) {
          return s.index;
        }
        return null;
      }
      // Franjas de tierra de los campos de tulipanes (en los cuatro cuadrantes)
      const STRIPE = 2.3;
      const STRIPE_SOIL = 1.45;
      function tulipStripe(x, z, margin = 0) {
        const r = Math.hypot(x, z);
        if (r < GARDEN.tulipField[0] + margin || r > GARDEN.tulipField[1] - margin) return -1;
        if (Math.abs(x) < GARDEN.avenueHalf + 1.4 + margin || Math.abs(z) < GARDEN.avenueHalf + 1.4 + margin) return -1;
        const v = (Math.abs(z) % STRIPE);
        if (v < margin || v > STRIPE_SOIL - margin) return -1;
        return Math.floor(Math.abs(z) / STRIPE);
      }

      // ---------- CIELO NOCTURNO ----------
      const NOISE_GLSL = `
        float gHash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float gNoise(vec2 p) {
          vec2 i = floor(p); vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          float a = gHash(i), b = gHash(i + vec2(1.0, 0.0));
          float c = gHash(i + vec2(0.0, 1.0)), d = gHash(i + vec2(1.0, 1.0));
          return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
        }
        float gFbm(vec2 p) {
          float v = 0.0; float a = 0.5;
          for (int i = 0; i < 5; i++) { v += gNoise(p) * a; p = p * 2.03 + 17.0; a *= 0.5; }
          return v;
        }
      `;

      const skyUniforms = {
        uMoonDir: { value: moonSkyDir },
        uTop: { value: new THREE.Color("#030714") },
        uMid: { value: new THREE.Color("#0b1736") },
        uHorizon: { value: fogColor.clone() },
        uTime: { value: 0 }
      };
      const sky = new THREE.Mesh(
        new THREE.SphereGeometry(400, 48, 24),
        new THREE.ShaderMaterial({
          uniforms: skyUniforms,
          side: THREE.BackSide,
          depthWrite: false,
          fog: false,
          vertexShader: `
            varying vec3 vDir;
            void main() {
              vDir = normalize(position);
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform vec3 uMoonDir; uniform vec3 uTop; uniform vec3 uMid; uniform vec3 uHorizon;
            uniform float uTime;
            varying vec3 vDir;
            ${NOISE_GLSL}
            void main() {
              vec3 dir = normalize(vDir);
              float h = dir.y;
              vec3 col = mix(uHorizon, uMid, smoothstep(-0.02, 0.22, h));
              col = mix(col, uTop, smoothstep(0.2, 0.9, h));
              // resplandor de la luna sobre el cielo
              float md = max(dot(dir, uMoonDir), 0.0);
              col += vec3(0.35, 0.45, 0.75) * (pow(md, 6.0) * 0.18 + pow(md, 60.0) * 0.35);
              // Vía Láctea: banda difusa inclinada atravesando el cielo
              vec3 axis = normalize(vec3(0.55, 0.35, 0.76));
              float band = 1.0 - abs(dot(dir, axis));
              float milky = pow(band, 14.0);
              vec2 muv = vec2(atan(dir.z, dir.x) * 3.0, dir.y * 6.0);
              float dust = gFbm(muv * 1.4) ;
              float lanes = smoothstep(0.35, 0.75, gFbm(muv * 3.1 + 5.0));
              milky *= (0.45 + dust * 0.9) * (1.0 - lanes * 0.55);
              col += vec3(0.42, 0.45, 0.62) * milky * 0.32 * smoothstep(0.02, 0.3, h);
              // nubes nocturnas muy tenues, iluminadas por la luna
              vec2 cuv = dir.xz / (h + 0.15);
              float n = gFbm(cuv * 0.7 + vec2(uTime * 0.004, 0.0));
              float cloud = smoothstep(0.58, 0.85, n) * smoothstep(0.02, 0.2, h) * (1.0 - smoothstep(0.4, 0.8, h));
              col = mix(col, vec3(0.07, 0.09, 0.17) + vec3(0.2, 0.22, 0.3) * pow(md, 4.0), cloud * 0.45);
              col = mix(col, uHorizon, smoothstep(0.0, -0.1, h));
              gl_FragColor = vec4(col, 1.0);
              #include <tonemapping_fragment>
              #include <colorspace_fragment>
            }
          `
        })
      );
      sky.renderOrder = -10;
      // el cielo entero (estrellas, luna) viaja con la cámara
      const skyGroup = new THREE.Group();
      scene.add(skyGroup);
      skyGroup.add(sky);

      // Estrellas: brillo y color según su magnitud, con titileo suave
      const starUniforms = { uTime: { value: 0 }, uPixelRatio: { value: renderer.getPixelRatio() } };
      const starMaterial = new THREE.ShaderMaterial({
        uniforms: starUniforms,
        transparent: true,
        depthWrite: false,
        fog: false,
        blending: THREE.AdditiveBlending,
        vertexShader: `
          attribute float size; attribute vec3 tint; attribute float seed;
          uniform float uTime; uniform float uPixelRatio;
          varying vec3 vColor;
          void main() {
            float tw = 0.75 + 0.25 * sin(uTime * (1.5 + seed * 3.0) + seed * 50.0);
            vColor = tint * tw;
            vec4 mv = modelViewMatrix * vec4(position, 1.0);
            gl_PointSize = size * uPixelRatio;
            gl_Position = projectionMatrix * mv;
          }
        `,
        fragmentShader: `
          varying vec3 vColor;
          void main() {
            float d = length(gl_PointCoord - 0.5);
            float core = exp(-d * d * 60.0);
            float halo = exp(-d * d * 12.0) * 0.25;
            gl_FragColor = vec4(vColor * (core + halo), 1.0);
            #include <tonemapping_fragment>
            #include <colorspace_fragment>
          }
        `
      });
      const SKY_R = 330;
      function skyDirection(azimuthDeg, altitudeDeg) {
        // azimut 0 = hacia la luna (-z), positivo hacia la derecha (+x)
        const az = THREE.MathUtils.degToRad(azimuthDeg);
        const alt = THREE.MathUtils.degToRad(altitudeDeg);
        return new THREE.Vector3(Math.sin(az) * Math.cos(alt), Math.sin(alt), -Math.cos(az) * Math.cos(alt));
      }
      function starColor(t) {
        // de azulado a dorado, como las temperaturas reales

      // Inyecta viento (balanceo en el vértice) y/o luz cálida de los faroles cercanos.
      function enhance(material, { wind = null, lamps = true } = {}) {

            )

              "#include <begin_vertex>",
              `#include <begin_vertex>
              #ifdef USE_INSTANCING
                vec3 ip = instanceMatrix[3].xyz;
              #else
                vec3 ip = (modelMatrix * vec4(0.0, 0.0, 0.0, 1.0)).xyz;
              #endif
              float hN = clamp(position.y / uHeight, 0.0, 1.5);
              float gust = sin(uTime * 0.55 + ip.x * 0.16 + ip.z * 0.09) * 0.5 + 0.5;
              float sway = sin(uTime * 1.6 + ip.x * 0.8 + ip.z * 0.55) * 0.65
                + sin(uTime * 2.7 + ip.z * 1.3 - ip.x * 0.4) * 0.25;
              float bend = (sway * (0.35 + gust) + gust * 0.6) * uAmp * hN * hN;
              transformed.x += bend;
              transformed.z += bend * 0.45;
              transformed.y -= abs(bend) * 0.25 * hN;`
            )
            .replace(
              "#include <project_vertex>",
              `#include <project_vertex>
              #ifdef USE_INSTANCING
                vLampW = (modelMatrix * instanceMatrix * vec4(transformed, 1.0)).xyz;
              #else
                vLampW = (modelMatrix * vec4(transformed, 1.0)).xyz;

            .replace("#include <common>", `#include <common>\nvarying vec3 vLampW;\n${LAMP_GLSL}`)

      const chunkedMeshes = [];
      function chunkedInstances(geometry, material, items, { chunk = 14, castShadow = false } = {}) {
        const buckets = new Map();
        for (const item of items) {
          const key = Math.floor(item.x / chunk) + "," + Math.floor(item.z / chunk);
          if (!buckets.has(key)) buckets.set(key, []);
          buckets.get(key).push(item);

        const q = new THREE.Quaternion();

        const p = new THREE.Vector3();
        const sc = new THREE.Vector3();
        for (const list of buckets.values()) {
          const mesh = new THREE.InstancedMesh(geometry, material, list.length);
          let cx = 0, cz = 0;
          list.forEach((item, i) => {
            e.set(item.tiltX || 0, item.yaw || 0, item.tiltZ || 0, "YXZ");
            q.setFromEuler(e);
            p.set(item.x, item.y || 0, item.z);
            sc.set(item.s, item.sy || item.s, item.s);
            m.compose(p, q, sc);
            mesh.setMatrixAt(i, m);
            if (item.color) color.copy(item.color);
            else color.setScalar(item.shade || 1);
            mesh.setColorAt(i, color);
            cx += item.x;
            cz += item.z;

      function blobGeometry(detail, roughness, seed) {

        const v = new THREE.Vector3();

          const n = fbm(v.x * 2.2 + seed, v.z * 2.2 + v.y * 1.7 - seed);

          pos.setXYZ(i, v.x, v.y, v.z);
        }
        g.computeVertexNormals();
        return g;

      function createTreeTexture(kind, seed) {
        const rand = seededRandom(seed);
        const W = 256, H = 384;
        const canvas = document.createElement("canvas");
        canvas.width = W;
        canvas.height = H;
        const ctx = canvas.getContext("2d");
        const trunkTop = kind === "poplar" ? H * 0.3 : H * 0.45;
        // tronco y ramas
        ctx.strokeStyle = "#2a1d15";
        ctx.lineCap = "round";
        ctx.lineWidth = kind === "oak" ? 16 : 11;
        ctx.beginPath();
        ctx.moveTo(W / 2, H);
        ctx.quadraticCurveTo(W / 2 + (rand() - 0.5) * 20, H * 0.75, W / 2 + (rand() - 0.5) * 14, trunkTop);
        ctx.stroke();
        ctx.lineWidth = 5;
        for (let b = 0; b < 5; b += 1) {
          const y = H - (H - trunkTop) * (0.45 + rand() * 0.5);
          const dir = rand() < 0.5 ? -1 : 1;
          ctx.beginPath();
          ctx.moveTo(W / 2, y);
          ctx.quadraticCurveTo(W / 2 + dir * 30, y - 30, W / 2 + dir * (40 + rand() * 40), y - 60 - rand() * 50);
          ctx.stroke();
        }
        // masas de follaje
        const clusters = [];
        const count = kind === "poplar" ? 7 : 9;
        for (let c = 0; c < count; c += 1) {
          let cx, cy, rx, ry;
          if (kind === "poplar") {
            cy = H * 0.08 + (c / count) * H * 0.62;
            cx = W / 2 + (rand() - 0.5) * 30;
            rx = 34 + Math.sin((c / count) * Math.PI) * 26;
            ry = 46;
          } else {
            const a = rand() * Math.PI * 2;
            const spread = kind === "oak" ? 0.36 : 0.28;
            cx = W / 2 + Math.cos(a) * W * spread * rand();
            cy = H * (kind === "oak" ? 0.3 : 0.27) + Math.sin(a) * H * 0.17 * rand();
            rx = 44 + rand() * 30;
            ry = 38 + rand() * 24;
          }
          clusters.push({ cx, cy, rx, ry });
        }
        const leaves = kind === "poplar" ? 2600 : 3400;
        for (let l = 0; l < leaves; l += 1) {
          const c = clusters[Math.floor(rand() * clusters.length)];
          const a = rand() * Math.PI * 2;
          const d = Math.sqrt(rand());
          const x = c.cx + Math.cos(a) * c.rx * d;
          const y = c.cy + Math.sin(a) * c.ry * d;
          // borde superior/izquierdo iluminado por el sol bajo
          const rim = Math.max(0, -Math.cos(a) * 0.5 - Math.sin(a) * 0.7) * d;
          const light = 12 + rim * 26 + rand() * 7;
          const hue = 78 + rand() * 30 - rim * 25;
          ctx.fillStyle = `hsl(${hue}, ${30 + rim * 30}%, ${light}%)`;
          ctx.beginPath();
          ctx.ellipse(x, y, 2.4 + rand() * 3.2, 1.8 + rand() * 2.2, rand() * Math.PI, 0, Math.PI * 2);
          ctx.fill();
        }
        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        return texture;
      }

      function createGrassClumpGeometry() {
        const positions = [], normals = [], colors = [], indices = [];
        const blades = 6;
        const segs = 3;
        let base = 0;
        const rand = seededRandom(77);
        for (let b = 0; b < blades; b += 1) {
          const ox = (rand() - 0.5) * 0.12;
          const oz = (rand() - 0.5) * 0.12;
          const h = 0.13 + rand() * 0.15;
          const w = 0.011 + rand() * 0.007;
          const rot = rand() * Math.PI;
          const lean = (rand() - 0.3) * 0.5;
          const cs = Math.cos(rot), sn = Math.sin(rot);
          const tipTint = rand();
          for (let s = 0; s <= segs; s += 1) {
            const t = s / segs;
            const y = t * h;
            const bendOut = lean * t * t * h;
            const half = w * (1 - t * 0.92);
            for (const side of [-1, 1]) {
              const lx = side * half;
              const lz = bendOut;
              positions.push(ox + lx * cs - lz * sn, y, oz + lx * sn + lz * cs);
              normals.push(0, 1, 0);
              const k = 0.35 + 0.65 * t;
              colors.push(
                0.1 + 0.17 * k + tipTint * 0.06 * t,
                0.19 + 0.27 * k,
                0.05 + 0.07 * k
              );
            }
            if (s < segs) {
              const i0 = base + s * 2;
              indices.push(i0, i0 + 1, i0 + 2, i0 + 1, i0 + 3, i0 + 2);
            }
          }
          base += (segs + 1) * 2;
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        g.setAttribute("normal", new THREE.Float32BufferAttribute(normals, 3));
        g.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
        g.setIndex(indices);
        return g;
      }

      function createTulipPetalGeometry(outer, segU = 14, segV = 7) {
        const H = outer ? 1.0 : 0.93;
        const halfW = outer ? 0.31 : 0.29;
        const cup = outer ? 1.45 : 1.65;
        const flick = outer ? 0.16 : 0.04;
        const positions = [], colors = [], indices = [];
        for (let i = 0; i <= segU; i++) {
          const u = i / segU;
          const w = Math.max(Math.pow(Math.sin(Math.PI * Math.pow(u, 0.8)), 0.6), 0.14 * (1 - u));
          const R = 0.06 + 0.27 * Math.sin(Math.PI * Math.pow(u, 0.88)) + flick * Math.pow(u, 6);
          for (let j = 0; j <= segV; j++) {
            const v = (j / segV) * 2 - 1;
            const y = v * w * halfW;
            const x = R - cup * y * y;
            const z = u * H;
            positions.push(x, y, z);
            // base del pétalo más oscura/verdosa, borde más luminoso
            const base = 0.62 + 0.38 * Math.min(1, u / 0.4);
            const edge = 1 + 0.08 * Math.pow(Math.abs(v), 2) * u;
            const c = Math.min(1.05, base * edge);
            colors.push(c * (u < 0.15 ? 0.92 : 1), c * (u < 0.15 ? 1.02 : 1), c * 0.97);
          }
        }
        const row = segV + 1;
        for (let i = 0; i < segU; i++) {
          for (let j = 0; j < segV; j++) {
            const a = i * row + j, b = a + 1, c = a + row, d = c + 1;
            indices.push(a, c, b, b, c, d);
          }
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        g.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
        g.setIndex(indices);
        g.computeVertexNormals();
        return g;
      }

        const du = 1 / segU;
        for (let i = 0; i <= segU; i++) {
          const u = i / segU;
          if (i > 0) {
            const theta = 0.12 + 1.15 * Math.pow(u, 1.6);
            yy += Math.cos(theta) * du;
            zz += Math.sin(theta) * du;

          const w = 0.15 * Math.pow(Math.sin(Math.PI * Math.pow(u, 0.5)), 0.9) * (1 - 0.25 * u);
          for (let j = 0; j <= segV; j++) {

            const shade = 0.7 + 0.3 * u + 0.08 * (1 - Math.abs(v));
            colors.push(shade * 0.95, shade, shade * 0.95);

        }
        const row = segV + 1;
        for (let i = 0; i < segU; i++) {
          for (let j = 0; j < segV; j++) {

        group.updateMatrixWorld(true);
        const inverse = new THREE.Matrix4().copy(group.matrixWorld).invert();
        const parts = [];
        const relative = new THREE.Matrix4();
        group.traverse((obj) => {
          if (!obj.isMesh) return;
          relative.multiplyMatrices(inverse, obj.matrixWorld);
          let g = obj.geometry.index ? obj.geometry.toNonIndexed() : obj.geometry.clone();
          g.applyMatrix4(relative);
          const count = g.attributes.position.count;
          const tint = obj.material.color;
          const colors = new Float32Array(count * 3);
          const source = g.attributes.color;
          for (let i = 0; i < count; i += 1) {
            const k = source ? source.getX(i) : 1;
            const k2 = source ? source.getY(i) : 1;
            const k3 = source ? source.getZ(i) : 1;
            colors[i * 3] = tint.r * k;
            colors[i * 3 + 1] = tint.g * k2;
            colors[i * 3 + 2] = tint.b * k3;
          }
          const clean = new THREE.BufferGeometry();
          clean.setAttribute("position", g.attributes.position);
          clean.setAttribute("normal", g.attributes.normal);
          clean.setAttribute("color", new THREE.BufferAttribute(colors, 3));
          parts.push(clean);

        group.position.set(config.x, 0, config.z);
        const rnd = (n) => {
          const s = Math.sin(n * 127.1 + config.seed * 311.7) * 43758.5453;
          return s - Math.floor(s);
        };
        const curve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(config.bendX * 0.18, config.height * 0.32, config.bendZ * 0.18),
          new THREE.Vector3(config.bendX * 0.6, config.height * 0.68, config.bendZ * 0.6),
          new THREE.Vector3(config.bendX, config.height, config.bendZ)
        ]);
        const lp = !!config.lowPoly;
        group.add(new THREE.Mesh(new THREE.TubeGeometry(curve, lp ? 5 : 14, 0.045 * config.scale, lp ? 4 : 6, false), tulipStemPaint));

        const leafCount = 2 + (rnd(1) > 0.5 ? 1 : 0);
        for (let i = 0; i < leafCount; i++) {
          const leaf = new THREE.Mesh(lp ? lowLeaf : tulipLeafGeometry, tulipLeafPaint);
          leaf.position.set(0, 0.01 + i * 0.04 * config.height, 0);
          leaf.rotation.y = config.seed * 6.28 + i * ((Math.PI * 2) / leafCount) + (rnd(i + 1) - 0.5) * 0.5;
          leaf.rotation.x = (rnd(i + 7) - 0.5) * 0.15;
          const len = config.height * (0.5 - i * 0.08) * (0.9 + rnd(i + 3) * 0.2);
          leaf.scale.set(len * 1.25, len, len);
          group.add(leaf);
        }

        const head = new THREE.Group();
        head.position.copy(curve.getPoint(1));
        head.rotation.set(-Math.PI / 2 + config.tilt, 0, config.spin);
        head.scale.setScalar(config.scale);
        const petalPaint = paint(config.color);
        const open = config.open !== undefined ? config.open : 0.2 + rnd(11) * 0.3;
        const calyx = new THREE.Mesh(calyxGeometry, tulipStemPaint);
        calyx.scale.set(1, 1, 0.8);
        calyx.position.z = -0.01;
        head.add(calyx);
        addTepals(head, petalPaint, lp ? lowOuterPetal : outerPetalGeometry, rnd(21) * 0.2, 0.05 + open * 0.28, rnd);
        addTepals(head, petalPaint, lp ? lowInnerPetal : innerPetalGeometry, Math.PI / 3 + rnd(22) * 0.2, 0.01 + open * 0.16, rnd);
        const inner = new THREE.Mesh(tulipInnerGeometry, tulipCenterPaint);
        inner.scale.set(1, 1, 0.55);
        inner.position.z = 0.03;
        head.add(inner);
        if (config.detail) addTulipStamens(head, rnd);
        group.add(head);
        return bakePlant(group);
      }


      // ---------- LIRIOS ARAÑA (Lycoris) ----------
      function createSpiderPetalGeometry(curveSegments = 8) {
        const shape = new THREE.Shape();
        shape.moveTo(0, 0);
        shape.bezierCurveTo(0.1, 0.12, 0.15, 0.58, 0.08, 1.08);
        shape.bezierCurveTo(0.045, 1.38, 0.02, 1.55, 0, 1.64);
        shape.bezierCurveTo(-0.02, 1.55, -0.045, 1.38, -0.08, 1.08);
        shape.bezierCurveTo(-0.15, 0.58, -0.1, 0.12, 0, 0);
        const geometry = new THREE.ShapeGeometry(shape, curveSegments);
        const position = geometry.attributes.position;
        const colors = [];
        for (let i = 0; i < position.count; i += 1) {
          const y = position.getY(i);
          const x = position.getX(i);
          const progress = THREE.MathUtils.clamp(y / 1.64, 0, 1);
          // el pétalo sale hacia arriba y se curva hacia atrás, como en Lycoris real
          const curl = -progress * progress * 1.25;
          const ripple = Math.sin(progress * Math.PI * 4) * 0.03 * progress;
          position.setZ(i, curl + (0.1 - Math.abs(x)) * 0.1);
          position.setX(i, x + ripple);
          const c = 0.78 + 0.22 * Math.min(1, progress * 2);
          colors.push(c, c, c);
        }
        geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
        geometry.computeVertexNormals();
        return geometry;
      }
      const spiderPetalGeometry = createSpiderPetalGeometry();
      const lowSpiderPetal = createSpiderPetalGeometry(3);
      const spiderStamenCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(0, 0.34, 0.1),
        new THREE.Vector3(0, 0.74, 0.4),
        new THREE.Vector3(0, 0.92, 0.76),
        new THREE.Vector3(0, 0.88, 1.06)
      ]);
      const spiderStamenGeometry = new THREE.TubeGeometry(spiderStamenCurve, 10, 0.011, 4, false);
      const lowStamen = new THREE.TubeGeometry(spiderStamenCurve, 5, 0.013, 3, false);
      const spiderAntherGeometry = new THREE.SphereGeometry(0.035, 6, 4);
      const spiderCenterGeometry = new THREE.SphereGeometry(0.085, 8, 6);
      const LYCORIS_COLORS = [0xd0182b, 0xe02a2d, 0xb8121f];
      const spiderStemPaint = paint(0x4f7a32);
      const spiderCenterPaint = paint(0x7a1a14);
      const spiderStamenPaint = paint(0xd23a3a);
      const spiderAntherPaint = paint(0x5a3a12);

      function createSpiderLily(config) {
        const group = new THREE.Group();
        group.position.set(config.x, 0, config.z);
        const curve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(config.bendX * 0.18, config.height * 0.35, config.bendZ * 0.18),
          new THREE.Vector3(config.bendX * 0.6, config.height * 0.7, config.bendZ * 0.6),
          new THREE.Vector3(config.bendX, config.height, config.bendZ)
        ]);
        const lp = !!config.lowPoly;
        group.add(new THREE.Mesh(new THREE.TubeGeometry(curve, lp ? 5 : 12, 0.03 * config.scale, lp ? 4 : 6, false), spiderStemPaint));
        const head = new THREE.Group();
        head.position.copy(curve.getPoint(1));
        head.rotation.set(-Math.PI / 2 + config.tilt, 0, config.spin);
        head.scale.setScalar(config.scale);
        const petalPaint = paint(config.color);
        // Umbela: 5–6 florecillas que miran hacia afuera, cada una con 6 tépalos
        // estrechos que se curvan hacia atrás y estambres largos que sobresalen.
        const florets = lp ? 4 : 5 + (config.seed > 0.5 ? 1 : 0);
        head.add(new THREE.Mesh(spiderCenterGeometry, spiderCenterPaint));
        for (let f = 0; f < florets; f += 1) {
          const floret = new THREE.Group();
          floret.rotation.z = (f / florets) * Math.PI * 2 + config.seed;
          const inner = new THREE.Group();
          inner.rotation.x = -0.95; // inclina la flor hacia afuera
          inner.position.y = 0.06;
          inner.scale.setScalar(0.48);
          for (let i = 0; i < 6; i += 1) {
            const holder = new THREE.Group();
            holder.rotation.z = (i / 6) * Math.PI * 2 + f;
            const petal = new THREE.Mesh(lp ? lowSpiderPetal : spiderPetalGeometry, petalPaint);
            petal.rotation.x = 0.55 + ((i * 7 + f) % 3) * 0.08;
            petal.scale.set(0.9, 0.95, 1);
            holder.add(petal);
            inner.add(holder);
          }
          const stamens = lp ? 3 : 6;
          for (let i = 0; i < stamens; i += 1) {
            const holder = new THREE.Group();
            holder.rotation.z = Math.PI / 6 + (i / stamens) * Math.PI * 2;
            const stamen = new THREE.Mesh(lp ? lowStamen : spiderStamenGeometry, spiderStamenPaint);
            stamen.rotation.x = -0.35;
            stamen.scale.setScalar(1.55);
            holder.add(stamen);
            const anther = new THREE.Mesh(spiderAntherGeometry, spiderAntherPaint);
            anther.position.copy(spiderStamenCurve.getPoint(1)).multiplyScalar(1.55).applyAxisAngle(new THREE.Vector3(1, 0, 0), -0.35);
            holder.add(anther);
            inner.add(holder);
          }
          floret.add(inner);
          head.add(floret);
        }
        group.add(head);
        return bakePlant(group);
      }


      // ---------- PLANTAS INSTANCIADAS ----------
      function plantInstances(geometry, material, items, opts = {}) {
        const mesh = new THREE.InstancedMesh(geometry, material, items.length);
        const m = new THREE.Matrix4();
        const q = new THREE.Quaternion();
        const e = new THREE.Euler();
        const color = new THREE.Color();
        items.forEach((item, i) => {
          e.set(item.tiltX || 0, item.yaw || 0, item.tiltZ || 0, "YXZ");
          q.setFromEuler(e);
          m.compose(new THREE.Vector3(item.x, item.y || 0, item.z), q, new THREE.Vector3(item.s, item.sy || item.s, item.s));
          mesh.setMatrixAt(i, m);
          const v = item.shade || 1;
          mesh.setColorAt(i, color.setRGB(v, v, v));
        });
        mesh.castShadow = opts.castShadow ?? false;
        mesh.receiveShadow = true;
        scene.add(mesh);
        return mesh;
      }

      // ---------- DISTRIBUCIÓN DE PLANTAS ----------
      function scatterInArea(count, spacing, test, rMin, rMax, avoid = []) {
        const placed = [];
        let attempts = 0;
        while (placed.length < count && attempts < count * 120) {
          attempts += 1;
          const r = Math.sqrt(rMin * rMin + random() * (rMax * rMax - rMin * rMin));
          const a = random() * Math.PI * 2;
          const x = Math.cos(a) * r;
          const z = Math.sin(a) * r;
          if (!test(x, z)) continue;
          let ok = true;
          for (const p of placed) {
            if ((p.x - x) ** 2 + (p.z - z) ** 2 < spacing * spacing) { ok = false; break; }
          }
          if (ok) {
            for (const p of avoid) {
              if ((p.x - x) ** 2 + (p.z - z) ** 2 < (p.spacing || spacing) ** 2) { ok = false; break; }
            }
          }
          if (ok) placed.push({ x, z });
        }
        return placed;
      }

      const plants = [];
      function registerPlant(group, phase, sway) {
        group.scale.setScalar(0.0001);
        scene.add(group);
        plants.push({
          group,
          phase,
          sway,
          bloomProgress: 0,
          bloomDelay: Math.hypot(group.position.x, group.position.z) * 0.12 + random() * 0.6,
          bloomSpeed: 0.45 + random() * 0.35
        });
      }

      // Macizo central: anillos de color, del rojo intenso al amarillo.
      const centerRings = [
        { rMin: 0, rMax: 0.55, colors: ["red"], spacing: 0.38, height: [1.75, 2.05], scale: [0.44, 0.5] },
        { rMin: 0.55, rMax: 1.35, colors: ["red", "scarlet"], spacing: 0.4, height: [1.5, 1.8], scale: [0.4, 0.46] },
        { rMin: 1.35, rMax: 2.15, colors: ["pink", "blush"], spacing: 0.42, height: [1.25, 1.55], scale: [0.38, 0.43] },
        { rMin: 2.15, rMax: 2.95, colors: ["white", "cream"], spacing: 0.42, height: [1.0, 1.3], scale: [0.35, 0.4] }
      ];
      const centerPoints = [];
      for (const ring of centerRings) {
        const area = Math.PI * (ring.rMax ** 2 - ring.rMin ** 2);
        const target = Math.max(1, Math.round((area / (ring.spacing * ring.spacing * 1.25)) * (lowPower ? 0.7 : 1)));
        const pts = scatterInArea(target, ring.spacing, () => true, ring.rMin, ring.rMax, centerPoints);
        if (ring.rMin === 0 && pts.length === 0) pts.push({ x: 0, z: 0 });
        for (const p of pts) {
          centerPoints.push({ ...p, spacing: ring.spacing });
          const r = Math.hypot(p.x, p.z);
          const lean = 0.12 + r * 0.05;
          const height = THREE.MathUtils.lerp(ring.height[0], ring.height[1], random());
          const colorName = ring.colors[Math.floor(random() * ring.colors.length)];
          const seed = random();
          const group = createTulip({
            x: p.x,
            z: p.z,
            height,
            scale: THREE.MathUtils.lerp(ring.scale[0], ring.scale[1], random()),
            tilt: 0.05 + random() * 0.15,
            bendX: (p.x / (r || 1)) * lean + (random() - 0.5) * 0.12,
            bendZ: (p.z / (r || 1)) * lean + (random() - 0.5) * 0.12,
            spin: random() * Math.PI * 2,
            color: TULIP_COLORS[colorName],
            seed,
            detail: !lowPower && ring.rMin < 1,
            open: 0.15 + random() * 0.35
          });
          registerPlant(group, seed * Math.PI * 2, 1);
        }
      }

      // Parterres exteriores, uno por especie.
      // Alternan lirios araña rojos con tulipanes en manchas de color: cálidos, claros y morados.
      const bedTest = (index) => (x, z) => inBed(x, z, 0.12) === index;

      function tulipBed(index, palette) {
        const pts = scatterInArea(Math.round(85 * Q), lowPower ? 0.45 : 0.36, bedTest(index), GARDEN.bedInner, GARDEN.bedOuter);
        for (const p of pts) {
          const seed = random();
          // drifts: el color depende de la posición para formar manchas naturales
          const drift = fbm(p.x * 0.45 + index * 3, p.z * 0.45);
          const colorName = palette[Math.min(palette.length - 1, Math.floor(drift * palette.length * 1.15))];
          const r = Math.hypot(p.x, p.z);
          const depth = (r - GARDEN.bedInner) / (GARDEN.bedOuter - GARDEN.bedInner);
          registerPlant(
            createTulip({
              x: p.x,
              z: p.z,
              height: 0.95 + depth * 0.45 + random() * 0.25,
              scale: 0.33 + random() * 0.07,
              tilt: 0.05 + random() * 0.2,
              bendX: (random() - 0.5) * 0.3,
              bendZ: (random() - 0.5) * 0.3,
              spin: random() * Math.PI * 2,
              color: TULIP_COLORS[colorName],
              seed,
              detail: false
            }),
            seed * Math.PI * 2,
            1.1
          );
        }
      }

      function lycorisBed(index) {
        const pts = scatterInArea(Math.round(80 * Q), lowPower ? 0.46 : 0.36, bedTest(index), GARDEN.bedInner, GARDEN.bedOuter);
        for (const p of pts) {
          const seed = random();
          const r = Math.hypot(p.x, p.z);
          const depth = (r - GARDEN.bedInner) / (GARDEN.bedOuter - GARDEN.bedInner);
          registerPlant(
            createSpiderLily({
              x: p.x,
              z: p.z,
              height: 0.85 + depth * 0.35 + random() * 0.25,
              scale: 0.3 + random() * 0.06,
              tilt: 0.12 + random() * 0.25,
              bendX: (random() - 0.5) * 0.35,
              bendZ: (random() - 0.5) * 0.35,
              spin: random() * Math.PI * 2,
              color: LYCORIS_COLORS[Math.floor(random() * LYCORIS_COLORS.length)],
              seed
            }),
            seed * Math.PI * 2,
            1.25
          );
        }
      }

      const grassClumpGeometry = createGrassClumpGeometry();
      const coverMaterial = enhance(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.85, side: THREE.DoubleSide }), { wind: { amp: 0.05, height: 0.45 } });

      lycorisBed(0);
      tulipBed(1, ["yellow", "apricot", "orange", "scarlet"]);
      lycorisBed(2);
      tulipBed(3, ["white", "cream", "blush", "pink"]);
      lycorisBed(4);
      tulipBed(5, ["lilac", "purple", "night", "pink"]);

      // Cobertura verde baja entre las flores para que los parterres se vean llenos
      {
        const cover = scatterInArea(
          Math.round(1500 * Q),
          0.22,
          (x, z) => inBed(x, z, 0.05) !== null,
          0,
          GARDEN.bedOuter
        ).map((p) => ({ x: p.x, z: p.z, s: 1.2 + random() * 0.6, sy: 0.9 + random() * 0.4, yaw: random() * 6, shade: 0.6 + random() * 0.25 }));
        plantInstances(grassClumpGeometry, coverMaterial, cover);
      }


      // ---------- CAMPOS GRANDES (instanciados) ----------
      // Variantes horneadas de cada flor; cada campo usa miles de copias.
      const fieldFlowerMaterial = enhance(flowerMaterial.clone(), { wind: { amp: 0.05, height: 1.3 } });
      fieldFlowerMaterial.side = THREE.DoubleSide;
      function tulipVariant(colorHex, seed) {
        const rnd = seededRandom(Math.floor(seed * 100000) + 7);
        return createTulip({
          x: 0, z: 0,
          height: 1.0,
          scale: 0.36,
          tilt: 0.05 + rnd() * 0.15,
          bendX: (rnd() - 0.5) * 0.2,
          bendZ: (rnd() - 0.5) * 0.2,
          spin: rnd() * Math.PI * 2,
          color: colorHex,
          seed,
          detail: false,
          lowPoly: true,
          open: 0.15 + rnd() * 0.3
        }).children[0].geometry;
      }
      function lilyVariant(colorHex, seed) {
        const rnd = seededRandom(Math.floor(seed * 100000) + 11);
        return createSpiderLily({
          x: 0, z: 0,
          height: 1.0,
          scale: 0.3,
          tilt: 0.12 + rnd() * 0.2,
          bendX: (rnd() - 0.5) * 0.25,
          bendZ: (rnd() - 0.5) * 0.25,
          spin: rnd() * Math.PI * 2,
          color: colorHex,
          seed,
          lowPoly: true
        }).children[0].geometry;
      }

      // Franjas de colores de los campos de tulipanes (estilo Keukenhof)
      const STRIPE_PALETTE = ["red", "yellow", "pink", "white", "orange", "purple", "scarlet", "blush", "apricot", "lilac", "cream", "night"];
      {
        const variants = {};
        for (const name of STRIPE_PALETTE) {
          variants[name] = [0, 1, 2].map((k) => tulipVariant(TULIP_COLORS[name], 0.13 + k * 0.29 + name.length * 0.01));
        }
        const items = {};
        const stepX = lowPower ? 0.5 : 0.36;
        const rows = lowPower ? 2 : 3;
        const maxR = lowPower ? 28 : GARDEN.tulipField[1];
        for (let zi = 0; zi * STRIPE < maxR; zi += 1) {
          for (const sign of [-1, 1]) {
            const stripeZ = zi * STRIPE;
            // las franjas de cada cuadrante tienen su propio orden de colores
            for (const sx of [-1, 1]) {
              const quadrant = (sign > 0 ? 0 : 2) + (sx > 0 ? 0 : 1);
              const name = STRIPE_PALETTE[(zi + quadrant * 3) % STRIPE_PALETTE.length];
              for (let row = 0; row < rows; row += 1) {
                const zLocal = 0.22 + (row + 0.5) * ((STRIPE_SOIL - 0.44) / rows);
                const z = sign * (stripeZ + zLocal);
                for (let x = GARDEN.avenueHalf + 1.6; x < maxR; x += stepX) {
                  const jx = sx * (x + (random() - 0.5) * stepX * 0.5);
                  const jz = z + (random() - 0.5) * 0.12;
                  if (tulipStripe(jx, jz, 0.1) < 0 || Math.hypot(jx, jz) > maxR) continue;
                  const v = Math.floor(random() * 3);
                  const key = name + v;
                  if (!items[key]) items[key] = { geometry: variants[name][v], list: [] };
                  items[key].list.push({
                    x: jx,
                    z: jz,
                    s: 0.9 + random() * 0.25,
                    sy: 0.85 + random() * 0.35,
                    yaw: random() * Math.PI * 2,
                    tiltX: (random() - 0.5) * 0.08,
                    tiltZ: (random() - 0.5) * 0.08,
                    shade: 0.88 + random() * 0.18
                  });
                }
              }
            }
          }
        }
        for (const entry of Object.values(items)) chunkedInstances(entry.geometry, fieldFlowerMaterial, entry.list, { chunk: 12 });
      }

      // Praderas de lirios araña: manchas naturales entre el césped
      {
        const variants = LYCORIS_COLORS.flatMap((c, i) => [lilyVariant(c, 0.2 + i * 0.17), lilyVariant(c, 0.61 + i * 0.11)]);
        const lists = variants.map(() => []);
        const target = Math.round(2600 * Q);
        let placed = 0;
        let guard = 0;
        const [r0, r1] = GARDEN.lilyField;
        while (placed < target && guard < target * 30) {
          guard += 1;
          const r = Math.sqrt(r0 * r0 + random() * (r1 * r1 - r0 * r0));
          const a = random() * Math.PI * 2;
          const x = Math.cos(a) * r;
          const z = Math.sin(a) * r;
          if (onPath(x, z, 0.6)) continue;
          const patch = fbm(x * 0.09 + 3, z * 0.09 - 5);
          if (patch < 0.47 || random() > (patch - 0.4) * 2.2) continue;
          const k = Math.floor(random() * variants.length);
          lists[k].push({
            x, z,
            s: 0.95 + random() * 0.3,
            sy: 0.85 + random() * 0.35,
            yaw: random() * Math.PI * 2,
            tiltX: (random() - 0.5) * 0.12,
            tiltZ: (random() - 0.5) * 0.12,
            shade: 0.85 + random() * 0.2
          });
          placed += 1;
        }
        variants.forEach((g, k) => chunkedInstances(g, fieldFlowerMaterial, lists[k], { chunk: 14 }));
      }

      // ---------- FAROLES ----------
      const lampPositions = [];
      {
        const add = (x, z) => lampPositions.push(new THREE.Vector3(x, 0, z));
        // alrededor del sendero central, entre los parterres
        for (let i = 0; i < 6; i += 1) {
          const a = SECTOR / 2 + i * SECTOR + SECTOR / 2;
          if (Math.abs(Math.cos(a)) < 0.2) continue;
          add(Math.cos(a) * (GARDEN.pathOuter + 0.25), Math.sin(a) * (GARDEN.pathOuter + 0.25));
        }
        // a los lados de las entradas del seto
        for (const zs of [-1, 1]) for (const xs of [-1, 1]) add(xs * 1.0, zs * (GARDEN.hedge + 0.6));
        // anillos de paseo
        for (const [ring, count] of [[GARDEN.ring1[1] + 0.35, 12], [GARDEN.ring2[1] + 0.35, 24]]) {
          for (let i = 0; i < count; i += 1) {
            const a = (i + 0.5) * ((Math.PI * 2) / count);
            add(Math.cos(a) * ring, Math.sin(a) * ring);
          }
        }
        // avenidas en cruz, alternando lados
        for (let d = 17; d < GARDEN.edge; d += 7) {
          if (Math.abs(d - (GARDEN.ring2[0] + GARDEN.ring2[1]) / 2) < 3) continue;
          const side = Math.round(d / 7) % 2 ? 1 : -1;
          const off = GARDEN.avenueHalf + 0.35;
          add(side * off, d); add(-side * off, -d);
          add(d, side * off); add(-d, -side * off);
        }
      }
      lampUniforms.uLampCount.value = Math.min(MAX_LAMPS, lampPositions.length);
      const LAMP_HEIGHT = 2.35;
      lampPositions.slice(0, MAX_LAMPS).forEach((p, i) => {
        lampUniforms.uLamps.value[i].set(p.x, LAMP_HEIGHT, p.z, 1.35);
      });
      {
        // farol clásico: base, poste, linterna de vidrio y tejadillo
        const metal = [];
        const base = new THREE.CylinderGeometry(0.12, 0.16, 0.25, 8);
        base.translate(0, 0.125, 0);
        const pole = new THREE.CylinderGeometry(0.035, 0.05, LAMP_HEIGHT - 0.2, 8);
        pole.translate(0, (LAMP_HEIGHT - 0.2) / 2 + 0.2, 0);
        const ring = new THREE.TorusGeometry(0.08, 0.02, 6, 12);
        ring.rotateX(Math.PI / 2);
        ring.translate(0, LAMP_HEIGHT - 0.22, 0);
        const cap = new THREE.ConeGeometry(0.2, 0.18, 4);
        cap.rotateY(Math.PI / 4);
        cap.translate(0, LAMP_HEIGHT + 0.27, 0);
        const finial = new THREE.SphereGeometry(0.035, 8, 6);
        finial.translate(0, LAMP_HEIGHT + 0.39, 0);
        for (const g of [base, pole, ring, cap, finial]) {
          g.deleteAttribute("uv");
          metal.push(g.index ? g.toNonIndexed() : g);
        }
        const metalGeometry = mergeGeometries(metal, false);
        const glassGeometry = new THREE.CylinderGeometry(0.15, 0.1, 0.36, 4, 1);
        glassGeometry.rotateY(Math.PI / 4);
        glassGeometry.translate(0, LAMP_HEIGHT, 0);
        const metalMaterial = new THREE.MeshStandardMaterial({ color: 0x1c1f24, roughness: 0.45, metalness: 0.7 });
        const glassMaterial = new THREE.MeshBasicMaterial({ color: new THREE.Color(2.4, 1.35, 0.55), fog: true });
        const items = lampPositions.map((p) => ({ x: p.x, z: p.z, s: 1, yaw: Math.atan2(p.x, p.z) }));
        chunkedInstances(metalGeometry, metalMaterial, items, { chunk: 20, castShadow: true });
        chunkedInstances(glassGeometry, glassMaterial, items, { chunk: 20 });

        // halo de luz alrededor de cada linterna
        const canvas = document.createElement("canvas");
        canvas.width = canvas.height = 128;
        const ctx = canvas.getContext("2d");
        const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
        g.addColorStop(0, "rgba(255, 220, 160, 0.9)");
        g.addColorStop(0.2, "rgba(255, 180, 100, 0.35)");
        g.addColorStop(1, "rgba(255, 150, 60, 0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 128, 128);
        const glowTexture = new THREE.CanvasTexture(canvas);
        glowTexture.colorSpace = THREE.SRGBColorSpace;
        const glowMaterial = new THREE.SpriteMaterial({ map: glowTexture, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: true });
        for (const p of lampPositions) {
          const s = new THREE.Sprite(glowMaterial);
          s.position.set(p.x, LAMP_HEIGHT, p.z);
          s.scale.setScalar(1.7);
          scene.add(s);
        }
      }
      // Luces reales solo en los faroles más cercanos (las demás se simulan en el suelo)
      const lampLights = [];
      for (let i = 0; i < (lowPower ? 3 : 6); i += 1) {
        const light = new THREE.PointLight(0xffb46a, 7, 10, 1.8);
        light.position.set(0, -50, 0);
        scene.add(light);
        lampLights.push(light);
      }
      function updateLampLights(center) {
        const sorted = lampPositions
          .map((p) => ({ p, d: (p.x - center.x) ** 2 + (p.z - center.z) ** 2 }))
          .sort((a, b) => a.d - b.d);
        lampLights.forEach((light, i) => {
          const entry = sorted[i];
          if (entry) light.position.set(entry.p.x, LAMP_HEIGHT - 0.05, entry.p.z);
        });
      }

      // ---------- LUCIÉRNAGAS ----------
      const particleUniforms = {
        uTime: { value: 0 },
        uPixelRatio: { value: renderer.getPixelRatio() }
      };
      {
        const count = Math.round(700 * Q);
        const positions = new Float32Array(count * 3);
        const seeds = new Float32Array(count * 4);
        for (let i = 0; i < count; i += 1) {
          const r = 2 + Math.sqrt(random()) * 58;
          const a = random() * Math.PI * 2;
          positions[i * 3] = Math.cos(a) * r;
          positions[i * 3 + 1] = 0.25 + Math.pow(random(), 1.5) * 2.4;
          positions[i * 3 + 2] = Math.sin(a) * r;
          seeds[i * 4] = random();
          seeds[i * 4 + 1] = random();
          seeds[i * 4 + 2] = random();
          seeds[i * 4 + 3] = random();
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute("seed", new THREE.BufferAttribute(seeds, 4));
        const material = new THREE.ShaderMaterial({
          uniforms: particleUniforms,
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          vertexShader: `
            attribute vec4 seed;
            uniform float uTime; uniform float uPixelRatio;
            varying float vFlash;
            void main() {
              vec3 p = position;
              float t = uTime;
              float s1 = 0.18 + seed.x * 0.25;
              p.x += sin(t * s1 + seed.y * 6.28) * 0.9 + sin(t * s1 * 2.3 + seed.z * 9.0) * 0.25;
              p.z += cos(t * s1 * 0.85 + seed.z * 6.28) * 0.9 + cos(t * s1 * 1.9 + seed.w * 7.0) * 0.25;
              p.y += sin(t * s1 * 1.4 + seed.w * 6.28) * 0.35;
              // destello real: encendido corto, luego varios segundos apagado
              float cycle = fract(t / (2.2 + seed.w * 3.0) + seed.x);
              float flash = smoothstep(0.0, 0.06, cycle) * (1.0 - smoothstep(0.08, 0.32, cycle));
              vFlash = flash + 0.06;
              vec4 mv = modelViewMatrix * vec4(p, 1.0);
              gl_PointSize = 0.5 * uPixelRatio * (300.0 / -mv.z);
              gl_Position = projectionMatrix * mv;
            }
          `,
          fragmentShader: `
            varying float vFlash;
            void main() {
              float d = length(gl_PointCoord - 0.5);
              float core = exp(-d * d * 260.0);
              float halo = exp(-d * d * 18.0) * 0.4;
              float a = (core + halo) * vFlash;
              vec3 col = vec3(0.8, 1.0, 0.4) * (core * 3.0 + halo);
              gl_FragColor = vec4(col * vFlash, clamp(a, 0.0, 1.0));
              #include <tonemapping_fragment>
              #include <colorspace_fragment>
            }
          `
        });
        scene.add(new THREE.Points(geometry, material));
      }

      // ---------- POSTPROCESO ----------
      let composer = null;

        composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));

        composer.addPass(new OutputPass());
      }

      // ---------- CONTROLES: MIRAR Y CAMINAR ----------

      controls.enableDamping = true;

      controls.enablePan = false;
