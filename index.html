<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#071616" />
    <meta
      name="description"
      content="Una experiencia floral tridimensional de luz, movimiento y color."
    />
    <title>Jardín en 3D</title>
    <style>
      :root {
        color-scheme: dark;
        --cream: #fff7df;
        --muted: rgba(255, 247, 223, 0.68);
        --gold: #ffd45a;
        --line: rgba(255, 224, 126, 0.24);
        --glass: rgba(9, 29, 29, 0.32);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }

      body {
        background:
          radial-gradient(circle at 50% 34%, #285c55 0%, #123635 37%, #071616 74%),
          #071616;
        color: var(--cream);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      #app,
      canvas,
      .atmosphere,
      .vignette,
      .grain {
        position: fixed;
        inset: 0;
      }

      #app {
        z-index: 1;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      .atmosphere {
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse 42% 30% at 50% 38%, rgba(255, 201, 58, 0.15), transparent 70%),
          radial-gradient(ellipse 28% 22% at 18% 78%, rgba(92, 177, 130, 0.12), transparent 75%);
      }

      .vignette {
        z-index: 2;
        pointer-events: none;
        background:
          linear-gradient(180deg, rgba(2, 12, 13, 0.22), transparent 30%, transparent 68%, rgba(2, 12, 13, 0.5)),
          radial-gradient(ellipse at center, transparent 36%, rgba(1, 10, 11, 0.54) 100%);
      }

      .grain {
        z-index: 2;
        pointer-events: none;
        opacity: 0.09;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
        mix-blend-mode: soft-light;
      }

      .ui {
        position: fixed;
        inset: 0;
        z-index: 3;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding:
          max(1.25rem, env(safe-area-inset-top, 0px))
          clamp(1.15rem, 4vw, 3.5rem)
          max(1.25rem, env(safe-area-inset-bottom, 0px));
        pointer-events: none;
        opacity: 0;
        animation: arrive 1.15s cubic-bezier(0.22, 1, 0.36, 1) 180ms forwards;
      }

      @keyframes arrive {
        to {
          opacity: 1;
        }
      }

      .masthead {
        max-width: min(31rem, 80vw);
        animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) 280ms both;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(0.8rem);
        }
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        margin: 0 0 0.8rem;
        color: var(--gold);
        font-size: clamp(0.61rem, 1.5vw, 0.72rem);
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 1.75rem;
        height: 1px;
        background: currentColor;
        content: "";
        opacity: 0.76;
      }

      h1 {
        max-width: 11ch;
        margin: 0;
        color: var(--cream);
        font-family: Iowan Old Style, Baskerville, "Times New Roman", Georgia, serif;
        font-size: clamp(2.5rem, 7.1vw, 5.35rem);
        font-weight: 500;
        letter-spacing: -0.052em;
        line-height: 0.91;
        text-wrap: balance;
        text-shadow: 0 0 42px rgba(255, 208, 79, 0.11);
      }

      .message {
        max-width: 24rem;
        margin: 1rem 0 0;
        color: var(--muted);
        font-family: Iowan Old Style, Baskerville, Georgia, serif;
        font-size: clamp(1rem, 2vw, 1.18rem);
        font-style: italic;
        letter-spacing: 0.01em;
        line-height: 1.45;
      }

      .footer {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 1rem;
        width: 100%;
      }

      .interaction {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        max-width: 28rem;
        padding: 0.62rem 0.84rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--glass);
        box-shadow: 0 0.5rem 2.2rem rgba(0, 0, 0, 0.14);
        color: rgba(255, 247, 223, 0.76);
        font-size: clamp(0.68rem, 1.8vw, 0.78rem);
        letter-spacing: 0.025em;
        line-height: 1.2;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition: opacity 500ms ease, transform 500ms ease;
      }

      .interaction svg {
        flex: 0 0 auto;
        width: 1rem;
        height: 1rem;
        color: var(--gold);
      }

      .controls {
        display: flex;
        gap: 0.6rem;
        pointer-events: auto;
      }

      .round-button {
        display: inline-grid;
        width: 2.45rem;
        height: 2.45rem;
        place-items: center;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: var(--glass);
        color: var(--cream);
        cursor: pointer;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
      }

      .round-button:hover {
        border-color: rgba(255, 224, 126, 0.52);
        background: rgba(255, 218, 109, 0.13);
        transform: translateY(-2px);
      }

      .round-button:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 3px;
      }

      .round-button svg {
        width: 1rem;
        height: 1rem;
      }

      .top-menu-container {
        position: relative;
        display: block; margin: 0 auto 2rem; width: 250px; height: 250px;
        pointer-events: auto;
      }

      .music-panel {
        position: absolute;
        top: 3.2rem;
        left: 0;
        width: 200px;
        background: var(--glass);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 1rem;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-10px);
        transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
      }

      .music-panel.active {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      .music-panel .panel-title {
        margin: 0 0 0.5rem;
        font-size: 0.85rem;
        color: var(--gold);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .music-panel .song-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .music-panel .song-list li {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.8rem;
        color: var(--muted);
        padding: 0.5rem 0;
        border-bottom: 1px solid rgba(255, 224, 126, 0.1);
        cursor: pointer;
        transition: color 0.2s ease;
      }

      .music-panel .song-list li:hover {
        color: var(--cream);
      }

      .music-panel .song-list li:last-child {
        border-bottom: none;
      }

      .play-icon {
        width: 1rem;
        height: 1rem;
        color: var(--gold);
        flex-shrink: 0;
      }

      .splash-screen {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 42%, #2d6c56 0%, #123735 40%, #071616 100%), #071616;
        opacity: 1;
        visibility: visible;
        transition: opacity 800ms ease, visibility 800ms ease;
      }

      .splash-screen.hidden {
        opacity: 0;
        visibility: hidden;
      }

      .splash__card {
        text-align: center;
      }

      .splash-bar-container {
        width: 220px;
        height: 4px;
        background: rgba(255, 247, 223, 0.1);
        border-radius: 2px;
        margin: 1.5rem auto 0;
        overflow: hidden;
      }

      .pretty-bar {
        width: 0;
        height: 100%;
        background: linear-gradient(90deg, #ffd45a 0%, #ff9a9e 50%, #fecfef 100%);
        border-radius: 2px;
        animation: loadBar 2s cubic-bezier(0.22, 1, 0.36, 1) forwards 0.5s;
      }

      @keyframes loadBar {
        to { width: 100%; }
      }

      @media (max-width: 540px) {
        .ui {
          padding-left: 1.15rem;
          padding-right: 1.15rem;
        }

        .masthead {
          max-width: 16rem;
        }

        .footer {
          align-items: center;
        }

        .interaction {
          max-width: calc(100vw - 5.5rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
      

      

      .dynamic-bg {
        position: absolute;
        inset: -50px;
        z-index: 0;
        background-size: cover;
        background-position: center;
        filter: blur(40px) brightness(0.6);
        transition: background-image 0.5s ease;
      }

      .bg-overlay {
        position: absolute;
        inset: 0;
        z-index: 1;
        background: linear-gradient(180deg, rgba(7, 22, 22, 0.4) 0%, rgba(7, 22, 22, 0.9) 100%);
      }

      .music-nav-top {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        padding: 1.5rem;
        z-index: 10;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .close-music-btn {
        background: transparent;
        border: none;
        color: var(--cream);
        font-size: 0.9rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      }

            .player-layout {
        position: relative;
        z-index: 2;
        width: 90%;
        max-width: 500px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
        height: 100vh;
        padding-top: 4rem;
        box-sizing: border-box;
      }
      
      @media (max-width: 768px) {
              .player-layout {
        position: relative;
        z-index: 2;
        width: 90%;
        max-width: 500px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
        height: 100vh;
        padding-top: 4rem;
        box-sizing: border-box;
      }
      }

      .player-container {
        
        width: 100%;
        max-width: 380px;
        padding: 2rem;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        text-align: center;
      }

      .playlist-container {
        flex: 1;
        width: 100%;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 24px;
        padding: 1.5rem;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        display: flex;
        flex-direction: column;
        max-height: 500px;
      }

      .playlist-search {
        width: 100%;
        padding: 0.8rem 1rem;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(0,0,0,0.2);
        color: var(--cream);
        font-family: inherit;
        margin-bottom: 1rem;
        outline: none;
      }
      
      .playlist-search::placeholder {
        color: rgba(255,255,255,0.5);
      }

      .playlist-items {
        list-style: none;
        padding: 0;
        margin: 0;
        overflow-y: auto;
        flex: 1;
      }

            .playlist-item {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 1.5rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 0.8rem;
        cursor: pointer;
        transition: background 0.2s, transform 0.2s;
      }

      .playlist-item:hover {
        background: rgba(255,255,255,0.1);
      }

      .playlist-item.active-song {
        background: rgba(255, 212, 90, 0.15);
        border: 1px solid rgba(255, 212, 90, 0.3);
      }

            .playlist-item-img {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background-size: cover;
        background-position: center;
        border: 2px solid rgba(255,255,255,0.1);
      }

      .playlist-item-info {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }

            .playlist-item-title {
        font-size: 1rem;
        color: var(--cream);
        margin: 0;
        font-family: Iowan Old Style, serif;
        text-align: center;
        line-height: 1.2;
      }

                  .playlist-item-artist {
        font-size: 0.85rem;
        color: rgba(255,255,255,0.6);
        margin: 0;
        text-align: center;
        width: 100%;
        display: block;
      }

            .album-art {
        width: 100%;
        height: 100%;
        margin: 0;
        border-radius: 50%;
        background-size: cover;
        background-position: center;
        border: 4px solid rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        animation: spin 20s linear infinite paused; -webkit-animation: spin 20s linear infinite paused;
      }

      .album-art.playing { animation-play-state: running; -webkit-animation-play-state: running; }

      .album-art::after {
        content: "";
        width: 40px;
        height: 40px;
        background: #111;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.2);
      }

      

      .song-title { font-family: Iowan Old Style, Baskerville, Georgia, serif; font-size: 1.4rem; margin: 0 0 0.2rem; color: var(--cream); }
      .song-artist { font-size: 0.9rem; color: rgba(255, 255, 255, 0.7); margin: 0 0 1.5rem; }

      .controls { display: flex; align-items: center; justify-content: center; gap: 1.5rem; }
      .btn-control { background: transparent; border: none; color: var(--cream); cursor: pointer; padding: 0; transition: transform 0.2s, color 0.2s; display: grid; place-items: center; }
      .btn-control:hover { color: var(--gold); transform: scale(1.1); }
      .btn-play { width: 4rem; height: 4rem; border-radius: 50%; background: rgba(255, 255, 255, 0.15); color: #fff; }
      .btn-play:hover { background: rgba(255, 255, 255, 0.25); }

      .progress-wrapper { margin: 1rem 0 1.5rem; }
      .progress-container { width: 100%; height: 6px; background: rgba(255, 255, 255, 0.2); border-radius: 3px; position: relative; cursor: pointer; }
      .progress-bar { height: 100%; width: 0%; background: var(--cream); border-radius: 3px; position: relative; }
      .progress-bar::after { content: ""; position: absolute; right: -5px; top: -3px; width: 12px; height: 12px; background: #fff; border-radius: 50%; }
      .time-info { display: flex; justify-content: space-between; font-size: 0.75rem; color: rgba(255, 255, 255, 0.6); margin-top: 0.5rem; }
    
            .full-screen-overlay {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.5s ease, visibility 0.5s;
        background-color: #071616;
      }
      .full-screen-overlay.active {
        opacity: 1;
        visibility: visible;
      }
                  .playlist-full-container {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
        overflow-y: auto;
        padding: 8rem 0rem 4rem;
      }
            .playlist-item {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 1.5rem 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 0.8rem;
        cursor: pointer;
        transition: background 0.2s, transform 0.2s;
      }
      .playlist-item:hover {
        background: rgba(255, 255, 255, 0.1);
        transform: translateY(-2px);
      }
            .playlist-item-img {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background-size: cover;
        background-position: center;
        border: 2px solid rgba(255,255,255,0.1);
      }
            .playlist-item-title {
        font-size: 1rem;
        color: var(--cream);
        margin: 0;
        font-family: Iowan Old Style, serif;
        text-align: center;
        line-height: 1.2;
      }
                  .playlist-item-artist {
        font-size: 0.85rem;
        color: rgba(255,255,255,0.6);
        margin: 0;
        text-align: center;
        width: 100%;
        display: block;
      }

    
      .loading-spinner {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255,255,255,0.2);
        border-top-color: var(--gold);
        border-radius: 50%;
        animation: spin-spinner 1s linear infinite;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s;
        z-index: 10;
        pointer-events: none;
      }
      .loading-spinner.active {
        opacity: 1;
        visibility: visible;
      }
      @keyframes spin-spinner { to { transform: translate(-50%, -50%) rotate(360deg); } }
            .album-container-wrapper {
        position: relative;
        display: block; 
        margin: 0 auto 2rem; 
        width: 250px; 
        height: 250px;
        border-radius: 50%;
      }

          @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="atmosphere"></div>
    <main id="app" aria-label="Jardín tridimensional de luz y flores"></main>
    <div class="vignette"></div>
    <div class="grain"></div>

    <div class="ui">
      <header class="masthead">
        <div class="top-menu-container">
          <button class="round-button" id="topMenuToggle" type="button" aria-label="Menú">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="4" y1="12" x2="20" y2="12"></line>
              <line x1="4" y1="6" x2="20" y2="6"></line>
              <line x1="4" y1="18" x2="20" y2="18"></line>
            </svg>
          </button>
          <div class="music-panel" id="topMenuPanel">
            <p class="panel-title">Menú</p>
            <ul class="song-list">
              <li>
                <a href="#" id="openMusicBtn" style="color: inherit; text-decoration: none; display: flex; align-items: center; gap: 0.5rem; width: 100%;">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="play-icon" width="20" height="20"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
                  <span>Música de Penyair</span>
                </a>
              </li>
            </ul>
          </div>
          </div>
        </div>
      </header>

      <footer class="footer">
        <div class="interaction" id="gestureHint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
            <path d="M4 12.3c1.9-2.2 4.6-3.3 8-3.3s6.1 1.1 8 3.3c-1.9 2.2-4.6 3.3-8 3.3s-6.1-1.1-8-3.3Z"/>
            <path d="M12 9v6M9 12h6"/>
          </svg>
          <span>Arrastra para explorar · pellizca para acercar</span>
        </div>
        <div class="controls">
          <button class="round-button" id="motionToggle" type="button" aria-label="Pausar movimiento" title="Pausar movimiento">
            <svg id="pauseIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M8 5v14M16 5v14"/>
            </svg>
          </button>
        </div>
      </footer>
    </div>

    <div class="splash-screen" id="splashScreen" role="status" aria-live="polite">
      <div class="splash__card">
        <h1>PARA TI</h1>
        <div class="splash-bar-container">
          <div class="pretty-bar"></div>
        </div>
      </div>
    </div>

    <!-- Music Overlay -->
    
    <!-- Playlist Overlay (Pantalla completa de canciones) -->
    <div id="playlistOverlay" class="full-screen-overlay">
      <div class="dynamic-bg" style="background-image: url('assets/music/cover_placeholder.jpg');"></div>
      <div class="bg-overlay"></div>
      <nav class="music-nav-top">
        <button class="close-music-btn" id="closePlaylistBtn">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          Volver al jardín
        </button>
      </nav>
      <div class="playlist-full-container">

      function createPetalGeometry() {
        const shape = new THREE.Shape();
        shape.moveTo(0, 0);
        shape.bezierCurveTo(0.27, 0.16, 0.47, 0.74, 0.03, 1.28);
        shape.bezierCurveTo(-0.42, 0.82, -0.3, 0.18, 0, 0);

        const geometry = new THREE.ExtrudeGeometry(shape, {
          depth: 0.05,
          bevelEnabled: true,
          bevelThickness: 0.025,
          bevelSize: 0.042,
          bevelOffset: 0,
          bevelSegments: 2,
          curveSegments: 16,
          steps: 1
        });

        const position = geometry.attributes.position;
        const vertex = new THREE.Vector3();
        for (let i = 0; i < position.count; i += 1) {
          vertex.fromBufferAttribute(position, i);
          const progress = THREE.MathUtils.clamp(vertex.y / 1.28, 0, 1);
          position.setZ(i, vertex.z + progress * progress * 0.29);
        }
        position.needsUpdate = true;
        geometry.computeVertexNormals();
        return geometry;
      }

      function createLeafGeometry() {
        const shape = new THREE.Shape();
        shape.moveTo(0, 0);
        shape.bezierCurveTo(0.35, 0.22, 0.48, 0.88, 0, 1.34);
        shape.bezierCurveTo(-0.43, 0.85, -0.34, 0.22, 0, 0);

        const geometry = new THREE.ExtrudeGeometry(shape, {
          depth: 0.028,
          bevelEnabled: true,
          bevelThickness: 0.012,
          bevelSize: 0.028,
          bevelOffset: 0,

        }
        position.needsUpdate = true;
        geometry.computeVertexNormals();
        return geometry;
      }

      function createSpiderPetalGeometry() {
        const shape = new THREE.Shape();
        shape.moveTo(0, 0);
        shape.bezierCurveTo(0.1, 0.12, 0.15, 0.58, 0.08, 1.08);
        shape.bezierCurveTo(0.045, 1.38, 0.02, 1.55, 0, 1.64);
        shape.bezierCurveTo(-0.02, 1.55, -0.045, 1.38, -0.08, 1.08);
        shape.bezierCurveTo(-0.15, 0.58, -0.1, 0.12, 0, 0);

        const geometry = new THREE.ExtrudeGeometry(shape, {
          depth: 0.02,
          bevelEnabled: true,
          bevelThickness: 0.008,
          bevelSize: 0.012,
          bevelOffset: 0,
          bevelSegments: 1,
          curveSegments: 16,
          steps: 1
        });

        const position = geometry.attributes.position;
        const vertex = new THREE.Vector3();
        for (let i = 0; i < position.count; i += 1) {
          vertex.fromBufferAttribute(position, i);
          const progress = THREE.MathUtils.clamp(vertex.y / 1.64, 0, 1);
          const curl = progress * progress * progress * 1.55;
          const ripple = Math.sin(progress * Math.PI * 3) * 0.028 * progress;
          position.setZ(i, vertex.z + curl);
          position.setX(i, vertex.x + ripple);
        }
        position.needsUpdate = true;
        geometry.computeVertexNormals();
        return geometry;
      }

      function createStamenCurve() {
        return new THREE.CatmullRomCurve3([

          holder.add(stamen);

          const anther = new THREE.Mesh(antherGeometry, antherMaterial);
          anther.position.copy(tipPosition);
          anther.scale.setScalar(Math.max(0.7, scale));
          holder.add(anther);
          head.add(holder);
        }

        }
        head.add(seeds);
      }

function createTulipPetalGeometry(outer) {
  const segU = 22, segV = 10;
  const H = outer ? 1.0 : 0.93;
  const halfW = outer ? 0.31 : 0.29;
  const cup = outer ? 1.45 : 1.65;
  const flick = outer ? 0.16 : 0.04;
 
  const positions = [], colors = [], indices = [];
 
  for (let i = 0; i <= segU; i++) {
    const u = i / segU;
    const w = Math.max(Math.pow(Math.sin(Math.PI * Math.pow(u, 0.8)), 0.6), 0.14 * (1 - u));
    const R = 0.06 + 0.27 * Math.sin(Math.PI * Math.pow(u, 0.88)) + flick * Math.pow(u, 6);
 
    for (let j = 0; j <= segV; j++) {
      const v = (j / segV) * 2 - 1;
      const y = v * w * halfW;
      const x = R - cup * y * y;
      const z = u * H;
      positions.push(x, y, z);
 
      const base = 0.7 + 0.3 * Math.min(1, u / 0.35);
      const edge = 1 + 0.07 * Math.pow(Math.abs(v), 2);
      const streak = 0.95 + 0.05 * Math.abs(v);
      const c = Math.min(1, base * edge * streak);
      colors.push(c, c * 0.98, c * 0.98);
    }
  }
  const row = segV + 1;
  for (let i = 0; i < segU; i++) {
    for (let j = 0; j < segV; j++) {
      const a = i * row + j, b = a + 1, c = a + row, d = c + 1;
      indices.push(a, c, b, b, c, d);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  g.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
  g.setIndex(indices);
  g.computeVertexNormals();
  return g;
}

function createTulipLeafGeometry() {
  const segU = 24, segV = 8;
  const positions = [], colors = [], indices = [];
  let yy = 0, zz = 0.03;
  const du = 1 / segU;
 
  for (let i = 0; i <= segU; i++) {
    const u = i / segU;
    if (i > 0) {
      const theta = 0.12 + 1.15 * Math.pow(u, 1.6);
      yy += Math.cos(theta) * du;
      zz += Math.sin(theta) * du;
    }
    const w = 0.15 * Math.pow(Math.sin(Math.PI * Math.pow(u, 0.5)), 0.9) * (1 - 0.25 * u);
 
    for (let j = 0; j <= segV; j++) {
      const v = (j / segV) * 2 - 1;
      const x = v * w;
      const fold = -0.9 * Math.abs(x) * (1 - u * 0.5);
      const wave = 0.012 * Math.sin(u * 14 + v * 3);
      positions.push(x, yy, zz + fold + wave);
 
      const shade = 0.72 + 0.28 * u + 0.06 * (1 - Math.abs(v));
      colors.push(shade * 0.95, shade, shade * 0.95);
    }
  }
  const row = segV + 1;
  for (let i = 0; i < segU; i++) {
    for (let j = 0; j < segV; j++) {
      const a = i * row + j, b = a + 1, c = a + row, d = c + 1;
      indices.push(a, b, c, b, d, c);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
  g.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
  g.setIndex(indices);
  g.computeVertexNormals();
  return g;
}

function addTepals(head, material, geometry, angleOffset, openAngle, rnd) {

    const petal = new THREE.Mesh(geometry, material);

    petal.rotation.x = (rnd(i * 3 + 40) - 0.5) * 0.06;
    const s = 0.96 + rnd(i * 9 + 5) * 0.08;
    petal.scale.set(s, s, 0.96 + rnd(i * 4 + 2) * 0.08);
    holder.add(petal);
    head.add(holder);
  }
}

function addStamens(head, rnd) {
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * Math.PI * 2 + rnd(i + 60) * 0.3;
    const holder = new THREE.Group();
    holder.rotation.z = a;
    const filament = new THREE.Mesh(tulipFilamentGeometry, tulipFilamentMaterial);
    filament.position.x = 0.075;
    filament.rotation.y = 0.07 + rnd(i + 70) * 0.05;
    holder.add(filament);
    const anther = new THREE.Mesh(tulipAntherGeometry, tulipAntherMaterial);
    anther.position.set(0.075 + Math.sin(filament.rotation.y) * 0.4, 0, 0.4);
    holder.add(anther);
    head.add(holder);
  }
  const pistil = new THREE.Group();
  const pStem = new THREE.Mesh(pistilStemGeometry, tulipPistilMaterial);
  const pTop = new THREE.Mesh(pistilTopGeometry, tulipPistilMaterial);
  pTop.scale.set(1, 1, 0.8);
  pTop.position.z = 0.38;
  pistil.add(pStem, pTop);
  head.add(pistil);
}

function createFlower(config) {
  const group = new THREE.Group();
  group.position.set(config.x, 0, config.z);
 
  const rnd = (n) => {
    const s = Math.sin(n * 127.1 + config.seed * 311.7) * 43758.5453;
    return s - Math.floor(s);
  };
 
  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3(config.bendX * 0.18, config.height * 0.32, config.bendZ * 0.18),
    new THREE.Vector3(config.bendX * 0.6, config.height * 0.68, config.bendZ * 0.6),
    new THREE.Vector3(config.bendX, config.height, config.bendZ)
  ]);
  const stem = new THREE.Mesh(
    new THREE.TubeGeometry(curve, 32, 0.04 * config.scale, 8, false),
    tulipStemMaterial
  );
  group.add(stem);
 
  const leafCount = config.scale < 0.6 ? 2 : 3;
  for (let i = 0; i < leafCount; i++) {
    const leaf = new THREE.Mesh(tulipLeafGeometry, tulipLeafMaterial);
    leaf.position.set(0, 0.02 + i * 0.05 * config.height, 0);

      const closeMusicBtn = document.getElementById('closeMusicBtn');
      const openMusicBtn = document.getElementById('openMusicBtn'); 

      
        const playlistOverlay = document.getElementById('playlistOverlay');
        const closePlaylistBtn = document.getElementById('closePlaylistBtn');

        if(openMusicBtn) {
          openMusicBtn.addEventListener('click', (e) => {
            e.preventDefault();
            playlistOverlay.classList.add('active');
            if (document.getElementById('topMenuPanel')) document.getElementById('topMenuPanel').classList.remove('active'); 
          });
        }
        if(closePlaylistBtn) {
          closePlaylistBtn.addEventListener('click', () => {
            playlistOverlay.classList.remove('active');
          });
        }
        if(closeMusicBtn) {
          closeMusicBtn.addEventListener('click', () => {
            musicOverlay.classList.remove('active');
            playlistOverlay.classList.add('active');
          });
        }
function loadSong(index) {
          if(loadingSpinner) loadingSpinner.classList.add("active");
        currentSongIndex = index;
        const song = playlist[currentSongIndex];
        songTitle.textContent = song.title;
        songArtist.textContent = song.artist;
        audioPlayer.src = song.src;
        albumArt.style.backgroundImage = 'url("' + song.cover + '")';
        dynamicBg.style.backgroundImage = 'url("' + song.cover + '")';
        renderPlaylist(playlistSearch ? playlistSearch.value : "");
      }

      function togglePlay() {
        if (isPlaying) {
          audioPlayer.pause();
        } else {
          audioPlayer.play();
        }
      }

      function updatePlayState() {
        if (audioPlayer.paused) {
          isPlaying = false;
          playIcon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"></polygon>';
          albumArt.classList.remove('playing');
        } else {
          isPlaying = true;
          playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';
          albumArt.classList.add('playing');
        }
      }

      function prevSong() {
        const idx = (currentSongIndex - 1 + playlist.length) % playlist.length;
        loadSong(idx);
        if (isPlaying) audioPlayer.play();
      }

      function nextSong() {
        const idx = (currentSongIndex + 1) % playlist.length;
        loadSong(idx);
        if (isPlaying) audioPlayer.play();
      }

      function updateProgress(e) {
        const duration = e.target.duration;
        const currentTime = e.target.currentTime;
        if(isNaN(duration)) return;
        const progressPercent = (currentTime / duration) * 100;
        progressBar.style.width = progressPercent + '%';

        let currentMins = Math.floor(currentTime / 60);
        let currentSecs = Math.floor(currentTime % 60);
        if (currentSecs < 10) currentSecs = '0' + currentSecs;
        currentTimeEl.textContent = currentMins + ':' + currentSecs;
        
        let durationMins = Math.floor(duration / 60);
        let durationSecs = Math.floor(duration % 60);
        if (durationSecs < 10) durationSecs = '0' + durationSecs;
        durationTimeEl.textContent = durationMins + ':' + durationSecs;
      }

      function setProgress(e) {
        const width = this.clientWidth;
        const clickX = e.offsetX;
        const duration = audioPlayer.duration;
        audioPlayer.currentTime = (clickX / width) * duration;
      }

      function renderPlaylist(filter) {
        filter = filter || "";
        if(!playlistItemsContainer) return;
        playlistItemsContainer.innerHTML = '';
        playlist.forEach((song, index) => {
          if (song.title.toLowerCase().includes(filter.toLowerCase()) || song.artist.toLowerCase().includes(filter.toLowerCase())) {
            const li = document.createElement('li');
            li.className = 'playlist-item ' + (index === currentSongIndex ? 'active-song' : '');
            li.innerHTML = '<div class="playlist-item-img" style="background-image: url(\'' + song.cover + '\')"></div><div class="playlist-item-info"><p class="playlist-item-title">' + song.title + '</p><p class="playlist-item-artist">' + song.artist + '</p></div>';
            li.addEventListener('click', () => {
                loadSong(index);
                audioPlayer.play();
                document.getElementById('playlistOverlay').classList.remove('active');
                document.getElementById('musicOverlay').classList.add('active');
              });
            playlistItemsContainer.appendChild(li);
          }
        });
      }

      

      if(playlistSearch) {
        playlistSearch.addEventListener('input', (e) => {
          renderPlaylist(e.target.value);
        });
      }

      if(playBtn) playBtn.addEventListener('click', togglePlay);
      
        const loadingSpinner = document.getElementById('loadingSpinner');
        
        if (audioPlayer) {
          audioPlayer.addEventListener('waiting', () => {
            if (loadingSpinner) loadingSpinner.classList.add('active');
          });
          audioPlayer.addEventListener('playing', () => {
            if (loadingSpinner) loadingSpinner.classList.remove('active');
          });
          audioPlayer.addEventListener('canplay', () => {
            if (loadingSpinner) loadingSpinner.classList.remove('active');
          });
          audioPlayer.addEventListener('error', () => {
            if (loadingSpinner) loadingSpinner.classList.remove('active');
          });
        }

        if(audioPlayer) {
        audioPlayer.addEventListener('play', updatePlayState);
        audioPlayer.addEventListener('pause', updatePlayState);
        audioPlayer.addEventListener('timeupdate', updateProgress);
        audioPlayer.addEventListener('ended', nextSong);
        audioPlayer.addEventListener('loadedmetadata', () => {
          let durationMins = Math.floor(audioPlayer.duration / 60);
          let durationSecs = Math.floor(audioPlayer.duration % 60);
          if (durationSecs < 10) durationSecs = '0' + durationSecs;
          if(!isNaN(durationMins)) {
            durationTimeEl.textContent = durationMins + ':' + durationSecs;
          }
        });
      }
      if(prevBtn) prevBtn.addEventListener('click', prevSong);
      if(nextBtn) nextBtn.addEventListener('click', nextSong);
      if(progressContainer) progressContainer.addEventListener('click', setProgress);
      
      
      loadSong(0);

      animate();
    </script>
  </body>
</html>
