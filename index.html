<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#071616" />
    <meta
      name="description"
      content="Una experiencia floral tridimensional de luz, movimiento y color."
    />
    <title>Jardín en 3D</title>
    <style>
      :root {
        color-scheme: dark;
        --cream: #fff7df;
        --muted: rgba(255, 247, 223, 0.68);
        --gold: #ffd45a;
        --line: rgba(255, 224, 126, 0.24);
        --glass: rgba(9, 29, 29, 0.32);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }

      body {
        background:
          radial-gradient(circle at 50% 34%, #285c55 0%, #123635 37%, #071616 74%),
          #071616;
        color: var(--cream);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      #app,
      canvas,
      .atmosphere,
      .vignette,
      .grain {
        position: fixed;
        inset: 0;
      }

      #app {
        z-index: 1;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      .atmosphere {
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse 42% 30% at 50% 38%, rgba(255, 201, 58, 0.15), transparent 70%),
          radial-gradient(ellipse 28% 22% at 18% 78%, rgba(92, 177, 130, 0.12), transparent 75%);
      }

      .vignette {
        z-index: 2;
        pointer-events: none;
        background:
          linear-gradient(180deg, rgba(2, 12, 13, 0.22), transparent 30%, transparent 68%, rgba(2, 12, 13, 0.5)),
          radial-gradient(ellipse at center, transparent 36%, rgba(1, 10, 11, 0.54) 100%);
      }

      .grain {
        z-index: 2;
        pointer-events: none;
        opacity: 0.09;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
        mix-blend-mode: soft-light;
      }

      .ui {
        position: fixed;
        inset: 0;
        z-index: 3;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding:
          max(1.25rem, env(safe-area-inset-top, 0px))
          clamp(1.15rem, 4vw, 3.5rem)
          max(1.25rem, env(safe-area-inset-bottom, 0px));
        pointer-events: none;
        opacity: 0;
        animation: arrive 1.15s cubic-bezier(0.22, 1, 0.36, 1) 180ms forwards;
      }

      @keyframes arrive {
        to {
          opacity: 1;
        }
      }

      .masthead {
        max-width: min(31rem, 80vw);
        animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) 280ms both;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(0.8rem);
        }
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        margin: 0 0 0.8rem;
        color: var(--gold);
        font-size: clamp(0.61rem, 1.5vw, 0.72rem);
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 1.75rem;
        height: 1px;
        background: currentColor;
        content: "";
        opacity: 0.76;
      }

      h1 {
        max-width: 11ch;
        margin: 0;
        color: var(--cream);
        font-family: Iowan Old Style, Baskerville, "Times New Roman", Georgia, serif;
        font-size: clamp(2.5rem, 7.1vw, 5.35rem);
        font-weight: 500;
        letter-spacing: -0.052em;
        line-height: 0.91;
        text-wrap: balance;
        text-shadow: 0 0 42px rgba(255, 208, 79, 0.11);
      }

      .message {
        max-width: 24rem;
        margin: 1rem 0 0;
        color: var(--muted);
        font-family: Iowan Old Style, Baskerville, Georgia, serif;
        font-size: clamp(1rem, 2vw, 1.18rem);
        font-style: italic;
        letter-spacing: 0.01em;
        line-height: 1.45;
      }

      .footer {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 1rem;
        width: 100%;
      }

      .interaction {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        max-width: 28rem;
        padding: 0.62rem 0.84rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--glass);
        box-shadow: 0 0.5rem 2.2rem rgba(0, 0, 0, 0.14);
        color: rgba(255, 247, 223, 0.76);
        font-size: clamp(0.68rem, 1.8vw, 0.78rem);
        letter-spacing: 0.025em;
        line-height: 1.2;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition: opacity 500ms ease, transform 500ms ease;
      }

      .interaction svg {
        flex: 0 0 auto;
        width: 1rem;
        height: 1rem;
        color: var(--gold);
      }

      .controls {
        display: flex;
        gap: 0.6rem;
        pointer-events: auto;
      }

      .round-button {
        display: inline-grid;
        width: 2.45rem;
        height: 2.45rem;
        place-items: center;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: var(--glass);
        color: var(--cream);
        cursor: pointer;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
      }

      .round-button:hover {
        border-color: rgba(255, 224, 126, 0.52);
        background: rgba(255, 218, 109, 0.13);
        transform: translateY(-2px);
      }

      .round-button:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 3px;
      }

      .round-button svg {
        width: 1rem;
        height: 1rem;
      }

      .top-menu-container {
        position: relative;
        display: inline-block;
        pointer-events: auto;
      }

      .music-panel {
        position: absolute;
        top: 3.2rem;
        left: 0;
        width: 200px;
        background: var(--glass);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 1rem;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-10px);
        transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
      }

      .music-panel.active {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      .music-panel .panel-title {
        margin: 0 0 0.5rem;
        font-size: 0.85rem;
        color: var(--gold);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .music-panel .song-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .music-panel .song-list li {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.8rem;
        color: var(--muted);
        padding: 0.5rem 0;
        border-bottom: 1px solid rgba(255, 224, 126, 0.1);
        cursor: pointer;
        transition: color 0.2s ease;
      }

      .music-panel .song-list li:hover {
        color: var(--cream);
      }

      .music-panel .song-list li:last-child {
        border-bottom: none;
      }

      .play-icon {
        width: 1rem;
        height: 1rem;
        color: var(--gold);
        flex-shrink: 0;
      }

      .splash-screen {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 42%, #2d6c56 0%, #123735 40%, #071616 100%), #071616;
        opacity: 1;
        visibility: visible;
        transition: opacity 800ms ease, visibility 800ms ease;
      }

      .splash-screen.hidden {
        opacity: 0;
        visibility: hidden;
      }

      .splash__card {
        text-align: center;
      }

      .splash-bar-container {
        width: 220px;
        height: 4px;
        background: rgba(255, 247, 223, 0.1);
        border-radius: 2px;
        margin: 1.5rem auto 0;
        overflow: hidden;
      }

      .pretty-bar {
        width: 0;
        height: 100%;
        background: linear-gradient(90deg, #ffd45a 0%, #ff9a9e 50%, #fecfef 100%);
        border-radius: 2px;
        animation: loadBar 2s cubic-bezier(0.22, 1, 0.36, 1) forwards 0.5s;
      }

      @keyframes loadBar {
        to { width: 100%; }
      }

      @media (max-width: 540px) {
        .ui {
          padding-left: 1.15rem;
          padding-right: 1.15rem;
        }

        .masthead {
          max-width: 16rem;
        }

        .footer {
          align-items: center;
        }

        .interaction {
          max-width: calc(100vw - 5.5rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
      

      

      .dynamic-bg {
        position: absolute;
        inset: -50px;
        z-index: 0;
        background-size: cover;
        background-position: center;
        filter: blur(40px) brightness(0.6);
        transition: background-image 0.5s ease;
      }

      .bg-overlay {
        position: absolute;
        inset: 0;
        z-index: 1;
        background: linear-gradient(180deg, rgba(7, 22, 22, 0.4) 0%, rgba(7, 22, 22, 0.9) 100%);
      }

      .music-nav-top {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        padding: 1.5rem;
        z-index: 10;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .close-music-btn {
        background: transparent;
        border: none;
        color: var(--cream);
        font-size: 0.9rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      }

      .player-layout {
        position: relative;
        z-index: 2;
        width: 90%;
        max-width: 500px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
        height: 100vh;
      }
      
      @media (max-width: 768px) {
        .player-layout {
          flex-direction: column;
          align-items: center;
          height: 80vh;
          overflow-y: auto;
          gap: 1.5rem;
        }
      }

      .player-container {
        flex: 1;
        width: 100%;
        max-width: 380px;
        padding: 2rem;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        text-align: center;
      }

      .playlist-container {
        flex: 1;
        width: 100%;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 24px;
        padding: 1.5rem;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        display: flex;
        flex-direction: column;
        max-height: 500px;
      }

      .playlist-search {
        width: 100%;
        padding: 0.8rem 1rem;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(0,0,0,0.2);
        color: var(--cream);
        font-family: inherit;
        margin-bottom: 1rem;
        outline: none;
      }
      
      .playlist-search::placeholder {
        color: rgba(255,255,255,0.5);
      }

      .playlist-items {
        list-style: none;
        padding: 0;
        margin: 0;
        overflow-y: auto;
        flex: 1;
      }

      .playlist-item {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.8rem;
        border-radius: 12px;
        cursor: pointer;
        transition: background 0.2s;
      }

      .playlist-item:hover {
        background: rgba(255,255,255,0.1);
      }

      .playlist-item.active-song {
        background: rgba(255, 212, 90, 0.15);
        border: 1px solid rgba(255, 212, 90, 0.3);
      }

      .playlist-item-img {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        background-size: cover;
        background-position: center;
      }

      .playlist-item-info {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }

      .playlist-item-title {
        font-size: 0.95rem;
        color: var(--cream);
        margin: 0;
        text-align: left;
      }

      .playlist-item-artist {
        font-size: 0.8rem;
        color: rgba(255,255,255,0.6);
        margin: 0;
        text-align: left;
      }

      .album-art {
        width: 200px;
        height: 200px;
        margin: 0 auto 1.5rem;
        border-radius: 50%;
        background-size: cover;
        background-position: center;
        border: 4px solid rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        animation: spin 20s linear infinite paused;
      }

      .album-art.playing { animation-play-state: running; }

      .album-art::after {
        content: "";
        width: 40px;
        height: 40px;
        background: #111;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.2);
      }

      @keyframes spin { 100% { transform: rotate(360deg); } }

      .song-title { font-family: Iowan Old Style, Baskerville, Georgia, serif; font-size: 1.4rem; margin: 0 0 0.2rem; color: var(--cream); }
      .song-artist { font-size: 0.9rem; color: rgba(255, 255, 255, 0.7); margin: 0 0 1.5rem; }

      .controls { display: flex; align-items: center; justify-content: center; gap: 1.5rem; }
      .btn-control { background: transparent; border: none; color: var(--cream); cursor: pointer; padding: 0; transition: transform 0.2s, color 0.2s; display: grid; place-items: center; }
      .btn-control:hover { color: var(--gold); transform: scale(1.1); }
      .btn-play { width: 4rem; height: 4rem; border-radius: 50%; background: rgba(255, 255, 255, 0.15); color: #fff; }
      .btn-play:hover { background: rgba(255, 255, 255, 0.25); }

      .progress-wrapper { margin: 1rem 0 1.5rem; }
      .progress-container { width: 100%; height: 6px; background: rgba(255, 255, 255, 0.2); border-radius: 3px; position: relative; cursor: pointer; }
      .progress-bar { height: 100%; width: 0%; background: var(--cream); border-radius: 3px; position: relative; }
      .progress-bar::after { content: ""; position: absolute; right: -5px; top: -3px; width: 12px; height: 12px; background: #fff; border-radius: 50%; }
      .time-info { display: flex; justify-content: space-between; font-size: 0.75rem; color: rgba(255, 255, 255, 0.6); margin-top: 0.5rem; }
    
      .full-screen-overlay {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      .full-screen-overlay.active {
        opacity: 1;
        visibility: visible;
      }
      .playlist-full-container {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
        overflow-y: auto;
        padding: 6rem 0rem 4rem;
      }
      .playlist-item {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 1rem;
        display: flex;
        align-items: center;
        gap: 1.5rem;
        cursor: pointer;
        transition: background 0.2s, transform 0.2s;
      }
      .playlist-item:hover {
        background: rgba(255, 255, 255, 0.1);
        transform: translateY(-2px);
      }
      .playlist-item-img {
        width: 60px;
        height: 60px;
        border-radius: 8px;
        background-size: cover;
        background-position: center;
      }
      .playlist-item-title {
        font-size: 1.1rem;
        color: var(--cream);
        margin: 0 0 0.4rem;
        font-family: Iowan Old Style, serif;
      }
      .playlist-item-artist {
        font-size: 0.9rem;
        color: rgba(255,255,255,0.6);
        margin: 0;
      }

    </style>
  </head>
  <body>
    <div class="atmosphere"></div>
    <main id="app" aria-label="Jardín tridimensional de luz y flores"></main>
    <div class="vignette"></div>
    <div class="grain"></div>

    <div class="ui">
      <header class="masthead">
        <div class="top-menu-container">
          <button class="round-button" id="topMenuToggle" type="button" aria-label="Menú">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="4" y1="12" x2="20" y2="12"></line>
              <line x1="4" y1="6" x2="20" y2="6"></line>
              <line x1="4" y1="18" x2="20" y2="18"></line>
            </svg>
          </button>
          <div class="music-panel" id="topMenuPanel">
            <p class="panel-title">Menú</p>
            <ul class="song-list">
              <li>
                <a href="#" id="openMusicBtn" style="color: inherit; text-decoration: none; display: flex; align-items: center; gap: 0.5rem; width: 100%;">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="play-icon" width="20" height="20"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
                  <span>Música de Penyair</span>
                </a>
              </li>
            </ul>
          </div>
          </div>
        </div>
      </header>

      <footer class="footer">
        <div class="interaction" id="gestureHint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
            <path d="M4 12.3c1.9-2.2 4.6-3.3 8-3.3s6.1 1.1 8 3.3c-1.9 2.2-4.6 3.3-8 3.3s-6.1-1.1-8-3.3Z"/>
            <path d="M12 9v6M9 12h6"/>
          </svg>
          <span>Arrastra para explorar · pellizca para acercar</span>
        </div>
        <div class="controls">
          <button class="round-button" id="motionToggle" type="button" aria-label="Pausar movimiento" title="Pausar movimiento">
            <svg id="pauseIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M8 5v14M16 5v14"/>
            </svg>
          </button>
        </div>
      </footer>
    </div>

    <div class="splash-screen" id="splashScreen" role="status" aria-live="polite">
      <div class="splash__card">
        <h1>PARA TI</h1>
        <div class="splash-bar-container">
          <div class="pretty-bar"></div>
        </div>
      </div>
    </div>

    <!-- Music Overlay -->
    
    <!-- Playlist Overlay (Pantalla completa de canciones) -->
    <div id="playlistOverlay" class="full-screen-overlay">
      <div class="dynamic-bg" style="background-image: url('assets/music/cover_placeholder.jpg');"></div>
      <div class="bg-overlay"></div>
      <nav class="music-nav-top">
        <button class="close-music-btn" id="closePlaylistBtn">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          Volver al jardín
        </button>
      </nav>
      <div class="playlist-full-container">
        <h1 style="color: var(--gold); text-align: center; font-family: Iowan Old Style, serif; margin-bottom: 2rem;">Catálogo de Penyair</h1>
        <input type="text" class="playlist-search" id="playlistSearch" placeholder="Buscar canción..." style="max-width: 600px; margin: 0 auto 2rem; display: block; width: 90%; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); padding: 0.8rem 1rem; border-radius: 20px; color: white;">
        <ul class="playlist-items" id="playlistItems" style="max-width: 800px; margin: 0 auto; display: grid; gap: 1rem; padding: 0 1rem; list-style: none;">
        </ul>
      </div>
    </div>

    <div id="musicOverlay" class="full-screen-overlay">
      <div class="dynamic-bg" id="dynamicBg"></div>
      <div class="bg-overlay"></div>

      <nav class="music-nav-top">
        <button class="close-music-btn" id="closeMusicBtn">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          Volver a la lista
        </button>
      </nav>

      <div class="player-layout">
        <!-- Reproductor -->
        <div class="player-container">
          <div class="album-art" id="albumArt"></div>
          <h2 class="song-title" id="songTitle">Título</h2>
          <p class="song-artist" id="songArtist">Artista</p>

          <audio id="audioPlayer"></audio>

          <div class="progress-wrapper">
            <div class="progress-container" id="progressContainer">
              <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="time-info">
              <span id="currentTime">00:00</span>
              <span id="durationTime">00:00</span>
            </div>
          </div>

          <div class="controls">
            <button class="btn-control" id="prevBtn" aria-label="Anterior">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
                <polygon points="19 20 9 12 19 4 19 20"></polygon>
                <line x1="5" y1="19" x2="5" y2="5"></line>
              </svg>
            </button>
            <button class="btn-control btn-play" id="playBtn" aria-label="Reproducir">

      const petalMaterials = [

      const spiderPetalMaterials = [
        new THREE.MeshStandardMaterial({
          color: 0xe61a2e,

        metalness: 0
      });

      function createPetalGeometry() {
        const shape = new THREE.Shape();
        shape.moveTo(0, 0);
        shape.bezierCurveTo(0.27, 0.16, 0.47, 0.74, 0.03, 1.28);
        shape.bezierCurveTo(-0.42, 0.82, -0.3, 0.18, 0, 0);

        const geometry = new THREE.ExtrudeGeometry(shape, {
          depth: 0.05,
          bevelEnabled: true,
          bevelThickness: 0.025,
          bevelSize: 0.042,
          bevelOffset: 0,
          bevelSegments: 2,
          curveSegments: 16,
          steps: 1
        });

        const position = geometry.attributes.position;
        const vertex = new THREE.Vector3();
        for (let i = 0; i < position.count; i += 1) {
          vertex.fromBufferAttribute(position, i);
          const progress = THREE.MathUtils.clamp(vertex.y / 1.28, 0, 1);
          position.setZ(i, vertex.z + progress * progress * 0.29);
        }
        position.needsUpdate = true;
        geometry.computeVertexNormals();
        return geometry;
      }

      function createLeafGeometry() {
        const shape = new THREE.Shape();
        shape.moveTo(0, 0);
        shape.bezierCurveTo(0.35, 0.22, 0.48, 0.88, 0, 1.34);
        shape.bezierCurveTo(-0.43, 0.85, -0.34, 0.22, 0, 0);

        const geometry = new THREE.ExtrudeGeometry(shape, {
          depth: 0.028,
          bevelEnabled: true,
          bevelThickness: 0.012,
          bevelSize: 0.028,
          bevelOffset: 0,
          bevelSegments: 2,
          curveSegments: 12,
          steps: 1
        });

        const position = geometry.attributes.position;
        const vertex = new THREE.Vector3();
        for (let i = 0; i < position.count; i += 1) {
          vertex.fromBufferAttribute(position, i);
          const progress = THREE.MathUtils.clamp(vertex.y / 1.34, 0, 1);
          position.setZ(i, vertex.z - progress * progress * 0.3);
        }
        position.needsUpdate = true;
        geometry.computeVertexNormals();
        return geometry;
      }

      function createSpiderPetalGeometry() {
        const shape = new THREE.Shape();
        shape.moveTo(0, 0);
        shape.bezierCurveTo(0.1, 0.12, 0.15, 0.58, 0.08, 1.08);
        shape.bezierCurveTo(0.045, 1.38, 0.02, 1.55, 0, 1.64);
        shape.bezierCurveTo(-0.02, 1.55, -0.045, 1.38, -0.08, 1.08);
        shape.bezierCurveTo(-0.15, 0.58, -0.1, 0.12, 0, 0);

        const geometry = new THREE.ExtrudeGeometry(shape, {
          depth: 0.02,
          bevelEnabled: true,
          bevelThickness: 0.008,
          bevelSize: 0.012,
          bevelOffset: 0,
          bevelSegments: 1,
          curveSegments: 16,
          steps: 1
        });

        const position = geometry.attributes.position;
        const vertex = new THREE.Vector3();
        for (let i = 0; i < position.count; i += 1) {
          vertex.fromBufferAttribute(position, i);
          const progress = THREE.MathUtils.clamp(vertex.y / 1.64, 0, 1);
          const curl = progress * progress * progress * 1.55;
          const ripple = Math.sin(progress * Math.PI * 3) * 0.028 * progress;
          position.setZ(i, vertex.z + curl);
          position.setX(i, vertex.x + ripple);
        }
        position.needsUpdate = true;
        geometry.computeVertexNormals();
        return geometry;
      }

      function createStamenCurve() {
        return new THREE.CatmullRomCurve3([
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(0, 0.34, 0.1),
          new THREE.Vector3(0, 0.74, 0.4),
          new THREE.Vector3(0, 0.92, 0.76),
          new THREE.Vector3(0, 0.88, 1.06)
        ]);
      }

      const petalGeometry = createPetalGeometry();
      const leafGeometry = createLeafGeometry();
      const seedGeometry = new THREE.SphereGeometry(0.037, 8, 6);
      const spiderPetalGeometry = createSpiderPetalGeometry();
      const stamenCurve = createStamenCurve();
      const stamenGeometry = new THREE.TubeGeometry(stamenCurve, 18, 0.011, 6, false);
      const antherGeometry = new THREE.SphereGeometry(0.035, 8, 6);
      const flowers = [];

      function addPetalLayer(head, material, count, scale, angleOffset, tilt, zOffset) {
        for (let i = 0; i < count; i += 1) {
          const holder = new THREE.Group();
          holder.rotation.z = angleOffset + (i / count) * Math.PI * 2;

          const petal = new THREE.Mesh(petalGeometry, material);
          petal.rotation.x = tilt;
          petal.scale.setScalar(scale * (0.93 + ((i * 17) % 5) * 0.018));
          petal.position.z = zOffset;
          holder.add(petal);
          head.add(holder);
        }
      }

      function addStamenLayer(head, count, scale, angleOffset, tilt) {
        const tipPosition = stamenCurve.getPoint(1).clone().multiplyScalar(scale);
        tipPosition.applyAxisAngle(new THREE.Vector3(1, 0, 0), tilt);

        for (let i = 0; i < count; i += 1) {
          const holder = new THREE.Group();
          holder.rotation.z = angleOffset + (i / count) * Math.PI * 2;

          const stamen = new THREE.Mesh(stamenGeometry, stamenMaterial);
          stamen.rotation.x = tilt;
          stamen.scale.setScalar(scale);
          holder.add(stamen);

          const anther = new THREE.Mesh(antherGeometry, antherMaterial);
          anther.position.copy(tipPosition);
          anther.scale.setScalar(Math.max(0.7, scale));
          holder.add(anther);
          head.add(holder);
        }
      }

      function addSeeds(head, scale) {
        const seeds = new THREE.Group();
        const count = 58;
        const goldenAngle = Math.PI * (3 - Math.sqrt(5));

        for (let i = 0; i < count; i += 1) {
          const fraction = (i + 0.5) / count;
          const radius = Math.sqrt(fraction) * 0.31 * scale;
          const angle = i * goldenAngle;
          const seed = new THREE.Mesh(seedGeometry, seedMaterial);
          seed.position.set(
            Math.cos(angle) * radius,
            Math.sin(angle) * radius,
            0.225 * scale + (1 - fraction) * 0.018
          );
          seed.scale.setScalar(0.55 + (i % 4) * 0.1);
          seeds.add(seed);
        }
        head.add(seeds);
      }

      function createFlower(config) {
        const group = new THREE.Group();
        group.position.set(config.x, 0, config.z);

        const curve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(config.bendX * 0.18, config.height * 0.32, config.bendZ * 0.18),
          new THREE.Vector3(config.bendX * 0.6, config.height * 0.68, config.bendZ * 0.6),
          new THREE.Vector3(config.bendX, config.height, config.bendZ)
        ]);

        const stem = new THREE.Mesh(
          new THREE.TubeGeometry(curve, 24, 0.047 * config.scale, 8, false),
          stemMaterial
        );
        group.add(stem);

        [0.24, 0.5, 0.72].forEach((point, index) => {
          if (index === 2 && config.scale < 0.6) return;
          const leaf = new THREE.Mesh(leafGeometry, leafMaterial);
          leaf.position.copy(curve.getPoint(point));
          leaf.rotation.order = "YXZ";
          leaf.rotation.y = config.seed * 3.6 + index * 2.48;
          leaf.rotation.x = -Math.PI / 2 + 0.46 + index * 0.1;
          leaf.scale.setScalar(config.scale * (0.74 - index * 0.11));
          group.add(leaf);
        });

        const head = new THREE.Group();
        head.position.copy(curve.getPoint(1));
        head.rotation.set(-Math.PI / 2 + config.tilt, 0, config.spin);
        const material = petalMaterials[config.materialIndex % petalMaterials.length];

        addPetalLayer(head, material, config.petals, config.scale, 0, 0.1, 0.02);
        addPetalLayer(
          head,
          material,
          Math.max(7, config.petals - 3),
          config.scale * 0.69,
          Math.PI / config.petals,
          0.33,
          0.1
        );
        addPetalLayer(
          head,
          material,
          Math.max(5, config.petals - 6),
          config.scale * 0.4,
          (Math.PI / config.petals) * 0.5,
          0.62,
          0.17
        );

        const center = new THREE.Mesh(
          new THREE.SphereGeometry(0.5 * config.scale, 24, 16),
          centerMaterial
        );
        center.scale.set(1, 1, 0.44);
        center.position.z = 0.02;
        head.add(center);

        const centerTop = new THREE.Mesh(
          new THREE.SphereGeometry(0.34 * config.scale, 20, 14),
          centerTopMaterial
        );
        centerTop.scale.set(1, 1, 0.4);
        centerTop.position.z = 0.14 * config.scale;
        head.add(centerTop);
        if (config.detail !== false) addSeeds(head, config.scale);
        group.add(head);

        return { group, head, phase: config.seed * Math.PI * 2, spin: config.spin };
      }

      function createSpiderLily(config) {
        const group = new THREE.Group();
        group.position.set(config.x, 0, config.z);

        const curve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(config.bendX * 0.18, config.height * 0.35, config.bendZ * 0.18),
          new THREE.Vector3(config.bendX * 0.6, config.height * 0.7, config.bendZ * 0.6),
          new THREE.Vector3(config.bendX, config.height, config.bendZ)
        ]);

        const stem = new THREE.Mesh(
          new THREE.TubeGeometry(curve, 20, 0.03 * config.scale, 8, false),
          spiderStemMaterial
        );
        group.add(stem);

        const head = new THREE.Group();
        head.position.copy(curve.getPoint(1));
        head.rotation.set(-Math.PI / 2 + config.tilt, 0, config.spin);
        const material = spiderPetalMaterials[config.materialIndex % spiderPetalMaterials.length];

        for (const layer of [
          { count: 6, scale: config.scale, angle: 0, tilt: -0.06, offset: 0.015 },
          { count: 6, scale: config.scale * 0.82, angle: Math.PI / 6, tilt: 0.1, offset: 0.03 }
        ]) {
          for (let i = 0; i < layer.count; i += 1) {
            const holder = new THREE.Group();
            holder.rotation.z = layer.angle + (i / layer.count) * Math.PI * 2;
            const petal = new THREE.Mesh(spiderPetalGeometry, material);
            petal.rotation.x = layer.tilt;
            petal.scale.setScalar(layer.scale);
            petal.position.z = layer.offset;
            holder.add(petal);
            head.add(holder);
          }
        }

        const center = new THREE.Mesh(
          new THREE.SphereGeometry(0.085 * config.scale, 10, 8),
          spiderCenterMaterial
        );
        head.add(center);
        addStamenLayer(head, 6, 1.18 * config.scale, Math.PI / 12, 0);
        group.add(head);

        return { group, head, phase: config.seed * Math.PI * 2, spin: config.spin };
      }

      const heroLayout = [
        { x: 0, z: 0, height: 3.92, petals: 16, scale: 1.1, tilt: 0.1, bendX: 0.05, bendZ: 0.1, spin: 0.2, materialIndex: 0, seed: 0.13, detail: true },
        { x: -1.92, z: 0.66, height: 2.78, petals: 14, scale: 0.91, tilt: 0.3, bendX: 0.55, bendZ: 0.22, spin: 0.9, materialIndex: 1, seed: 0.41, detail: true },
        { x: 2.08, z: -0.5, height: 3.05, petals: 14, scale: 0.97, tilt: 0.26, bendX: -0.6, bendZ: -0.18, spin: 1.7, materialIndex: 2, seed: 0.67, detail: true },
        { x: -1.18, z: -1.72, height: 2.15, petals: 12, scale: 0.79, tilt: 0.46, bendX: 0.38, bendZ: -0.55, spin: 2.4, materialIndex: 0, seed: 0.22, detail: true },
        { x: 1.34, z: 1.61, height: 2.37, petals: 12, scale: 0.84, tilt: 0.4, bendX: -0.45, bendZ: 0.52, spin: 3.1, materialIndex: 1, seed: 0.85, detail: true },
        { x: -2.75, z: -0.88, height: 1.87, petals: 11, scale: 0.69, tilt: 0.56, bendX: 0.72, bendZ: -0.32, spin: 3.9, materialIndex: 2, seed: 0.55, detail: true },
        { x: 2.78, z: 1.04, height: 1.98, petals: 11, scale: 0.75, tilt: 0.5, bendX: -0.68, bendZ: 0.38, spin: 4.6, materialIndex: 0, seed: 0.93, detail: true },
        { x: 0.4, z: 2.6, height: 2.05, petals: 12, scale: 0.78, tilt: 0.44, bendX: -0.2, bendZ: 0.6, spin: 5.3, materialIndex: 3, seed: 0.31, detail: true },
        { x: -0.6, z: -3, height: 1.9, petals: 11, scale: 0.72, tilt: 0.52, bendX: 0.15, bendZ: -0.62, spin: 6, materialIndex: 3, seed: 0.71, detail: true }
      ];

      function seededRandom(seed) {
        let state = seed % 2147483647;
        if (state <= 0) state += 2147483646;
        return () => {
          state = (state * 16807) % 2147483647;
          return (state - 1) / 2147483646;
        };
      }

      function scatterPoints(
        count,
        random,
        { centerX = 0, centerZ = 0, minRadius = 0, maxRadius, minSpacing, avoid = [] }
      ) {
        const placed = [];
        let attempts = 0;
        const maxAttempts = count * 80;

        while (placed.length < count && attempts < maxAttempts) {
          attempts += 1;
          const angle = random() * Math.PI * 2;
          const radius = minRadius + random() * (maxRadius - minRadius);
          const x = centerX + Math.cos(angle) * radius;
          const z = centerZ + Math.sin(angle) * radius;
          const hasConflict = [...avoid, ...placed].some((point) => {
            const spacing = point.spacing ?? minSpacing;
            return Math.hypot(point.x - x, point.z - z) < spacing;
          });

          if (!hasConflict) placed.push({ x, z, spacing: minSpacing });
        }

        return placed;
      }

      function makeFieldFlowers(count, random) {
        const heroAvoid = heroLayout.map((flower) => ({
          x: flower.x,
          z: flower.z,
          spacing: 1.05
        }));

        return scatterPoints(count, random, {
          minRadius: 3.4,
          maxRadius: 8.2,
          minSpacing: 0.98,
          avoid: heroAvoid
        }).map((point) => ({
          x: point.x,
          z: point.z,
          height: 1.05 + random() * 1.15,
          petals: 8 + Math.floor(random() * 5),
          scale: 0.34 + random() * 0.34,
          tilt: 0.34 + random() * 0.34,
          bendX: (random() - 0.5) * 1.2,
          bendZ: (random() - 0.5) * 1.2,
          spin: random() * Math.PI * 2,
          materialIndex: Math.floor(random() * petalMaterials.length),
          seed: random(),
          detail: false
        }));
      }

      const random = seededRandom(20260921);
      const fieldFlowerCount = window.matchMedia("(max-width: 640px)").matches ? 10 : 20;
      const layout = heroLayout.concat(makeFieldFlowers(fieldFlowerCount, random));

      function createSpiderLilyLayout(random) {
        const compactViewport = window.matchMedia("(max-width: 640px)").matches;
        const yellowAvoid = layout.map((flower) => ({
          x: flower.x,
          z: flower.z,
          spacing: 1.35
        }));
        const clusters = compactViewport
          ? [
              { x: 4.1, z: -2.2, count: 3, radius: 1.8 },
              { x: -3.7, z: 2.4, count: 2, radius: 1.7 },
              { x: -0.5, z: -4.3, count: 2, radius: 1.35 }
            ]
          : [
              { x: 4.1, z: -2.2, count: 5, radius: 2.1 },
              { x: -3.7, z: 2.4, count: 4, radius: 1.95 },
              { x: -0.5, z: -4.3, count: 3, radius: 1.5 }
            ];
        const points = [];

        for (const cluster of clusters) {
          const avoided = yellowAvoid.concat(
            points.map((point) => ({ x: point.x, z: point.z, spacing: 0.54 }))
          );
          const clusterPoints = scatterPoints(cluster.count, random, {
            centerX: cluster.x,
            centerZ: cluster.z,
            minRadius: 0.2,
            maxRadius: cluster.radius,
            minSpacing: 0.54,
            avoid: avoided
          }).map((point) => ({
            ...point,
            patchX: cluster.x,
            patchZ: cluster.z,
            patchRadius: cluster.radius,
            loose: false
          }));
          points.push(...clusterPoints);
        }

        const loosePoints = scatterPoints(compactViewport ? 1 : 2, random, {
          minRadius: 2.4,
          maxRadius: 8.8,
          minSpacing: 1.8,
          avoid: yellowAvoid.concat(points.map((point) => ({ x: point.x, z: point.z, spacing: 1.6 })))
        }).map((point) => ({
          ...point,
          patchX: point.x,
          patchZ: point.z,
          patchRadius: 1,
          loose: true
        }));
        points.push(...loosePoints);

        return points.map((point) => {
          const distance = Math.hypot(point.x - point.patchX, point.z - point.patchZ);
          const edge = point.loose ? 0 : Math.min(distance / point.patchRadius, 1);
          return {
            x: point.x,
            z: point.z,
            height: (point.loose ? 1.8 : 2.3) - edge * 0.85 + random() * (point.loose ? 0.35 : 0.25),

        progressBar.style.width = progressPercent + '%';

        let currentMins = Math.floor(currentTime / 60);
        let currentSecs = Math.floor(currentTime % 60);
        if (currentSecs < 10) currentSecs = '0' + currentSecs;
        currentTimeEl.textContent = currentMins + ':' + currentSecs;
        
        let durationMins = Math.floor(duration / 60);
        let durationSecs = Math.floor(duration % 60);
        if (durationSecs < 10) durationSecs = '0' + durationSecs;
        durationTimeEl.textContent = durationMins + ':' + durationSecs;
      }

      function setProgress(e) {
        const width = this.clientWidth;
        const clickX = e.offsetX;
        const duration = audioPlayer.duration;
        audioPlayer.currentTime = (clickX / width) * duration;
      }

      function renderPlaylist(filter) {
        filter = filter || "";
        if(!playlistItemsContainer) return;
        playlistItemsContainer.innerHTML = '';
        playlist.forEach((song, index) => {
          if (song.title.toLowerCase().includes(filter.toLowerCase()) || song.artist.toLowerCase().includes(filter.toLowerCase())) {
            const li = document.createElement('li');
            li.className = 'playlist-item ' + (index === currentSongIndex ? 'active-song' : '');
            li.innerHTML = '<div class="playlist-item-img" style="background-image: url(\'' + song.cover + '\')"></div><div class="playlist-item-info"><p class="playlist-item-title">' + song.title + '</p><p class="playlist-item-artist">' + song.artist + '</p></div>';
            li.addEventListener('click', () => {
                loadSong(index);
                audioPlayer.play();
                document.getElementById('playlistOverlay').classList.remove('active');
                document.getElementById('musicOverlay').classList.add('active');
              });
            playlistItemsContainer.appendChild(li);
          }
        });
      }

      

      if(playlistSearch) {
        playlistSearch.addEventListener('input', (e) => {
          renderPlaylist(e.target.value);
        });
      }

      if(playBtn) playBtn.addEventListener('click', togglePlay);
      if(audioPlayer) {
        audioPlayer.addEventListener('play', updatePlayState);
        audioPlayer.addEventListener('pause', updatePlayState);
        audioPlayer.addEventListener('timeupdate', updateProgress);
        audioPlayer.addEventListener('ended', nextSong);
        audioPlayer.addEventListener('loadedmetadata', () => {
          let durationMins = Math.floor(audioPlayer.duration / 60);
          let durationSecs = Math.floor(audioPlayer.duration % 60);
          if (durationSecs < 10) durationSecs = '0' + durationSecs;
          if(!isNaN(durationMins)) {
            durationTimeEl.textContent = durationMins + ':' + durationSecs;
          }
        });
      }
      if(prevBtn) prevBtn.addEventListener('click', prevSong);
      if(nextBtn) nextBtn.addEventListener('click', nextSong);
      if(progressContainer) progressContainer.addEventListener('click', setProgress);
      
      
      loadSong(0);

      animate();
    </script>
  </body>
</html>
