<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#071616" />
    <meta
      name="description"
      content="Una experiencia floral tridimensional de luz, movimiento y color."
    />
    <title>Jardín en 3D</title>
    <style>
      :root {
        color-scheme: dark;
        --cream: #fff7df;
        --muted: rgba(255, 247, 223, 0.68);
        --gold: #ffd45a;
        --line: rgba(255, 224, 126, 0.24);
        --glass: rgba(9, 29, 29, 0.32);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }

      body {
        background:
          radial-gradient(circle at 50% 34%, #285c55 0%, #123635 37%, #071616 74%),
          #071616;
        color: var(--cream);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      #app,
      canvas,
      .atmosphere,
      .vignette,
      .grain {
        position: fixed;
        inset: 0;
      }

      #app {
        z-index: 1;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      .atmosphere {
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse 42% 30% at 50% 38%, rgba(255, 201, 58, 0.15), transparent 70%),
          radial-gradient(ellipse 28% 22% at 18% 78%, rgba(92, 177, 130, 0.12), transparent 75%);
      }

      .vignette {
        z-index: 2;
        pointer-events: none;
        background:
          linear-gradient(180deg, rgba(2, 12, 13, 0.22), transparent 30%, transparent 68%, rgba(2, 12, 13, 0.5)),
          radial-gradient(ellipse at center, transparent 36%, rgba(1, 10, 11, 0.54) 100%);
      }

      .grain {
        z-index: 2;
        pointer-events: none;
        opacity: 0.09;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
        mix-blend-mode: soft-light;
      }

      .ui {
        position: fixed;
        inset: 0;
        z-index: 3;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding:
          max(1.25rem, env(safe-area-inset-top, 0px))
          clamp(1.15rem, 4vw, 3.5rem)
          max(1.25rem, env(safe-area-inset-bottom, 0px));
        pointer-events: none;
        opacity: 0;
        animation: arrive 1.15s cubic-bezier(0.22, 1, 0.36, 1) 180ms forwards;
      }

      @keyframes arrive {
        to {
          opacity: 1;
        }
      }

      .masthead {
        max-width: min(31rem, 80vw);
        animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) 280ms both;
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(0.8rem);
        }
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        margin: 0 0 0.8rem;
        color: var(--gold);
        font-size: clamp(0.61rem, 1.5vw, 0.72rem);
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 1.75rem;
        height: 1px;
        background: currentColor;
        content: "";
        opacity: 0.76;
      }

      h1 {
        max-width: 11ch;
        margin: 0;
        color: var(--cream);
        font-family: Iowan Old Style, Baskerville, "Times New Roman", Georgia, serif;
        font-size: clamp(2.5rem, 7.1vw, 5.35rem);
        font-weight: 500;
        letter-spacing: -0.052em;
        line-height: 0.91;
        text-wrap: balance;
        text-shadow: 0 0 42px rgba(255, 208, 79, 0.11);
      }

      .message {
        max-width: 24rem;
        margin: 1rem 0 0;
        color: var(--muted);
        font-family: Iowan Old Style, Baskerville, Georgia, serif;
        font-size: clamp(1rem, 2vw, 1.18rem);
        font-style: italic;
        letter-spacing: 0.01em;
        line-height: 1.45;
      }

      .footer {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 1rem;
        width: 100%;
      }

      .interaction {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        max-width: 24rem;
        padding: 0.62rem 0.84rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--glass);
        box-shadow: 0 0.5rem 2.2rem rgba(0, 0, 0, 0.14);
        color: rgba(255, 247, 223, 0.76);
        font-size: clamp(0.68rem, 1.8vw, 0.78rem);
        letter-spacing: 0.025em;
        line-height: 1.2;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition: opacity 500ms ease, transform 500ms ease;
      }

      .interaction svg {
        flex: 0 0 auto;
        width: 1rem;
        height: 1rem;
        color: var(--gold);
      }

      .controls {
        display: flex;
        gap: 0.6rem;
        pointer-events: auto;
      }

      .playlist-count { text-align: center; color: var(--muted); font-size: 0.85rem; margin: 0 0 1.4rem; letter-spacing: 0.04em; }
      .playlist-empty { text-align: center; color: var(--muted); padding: 2rem 0; }
      .now-playing {
        display: none;
        align-items: center;
        gap: 0.55rem;
        max-width: min(15rem, 48vw);
        height: 2.45rem;
        padding: 0 0.9rem 0 0.35rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--glass);
        color: var(--cream);
        font: inherit;
        font-size: 0.78rem;
        cursor: pointer;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .now-playing.visible { display: inline-flex; }
      .now-playing-cover { flex: 0 0 auto; width: 1.8rem; height: 1.8rem; border-radius: 50%; background: #233 center/cover; }
      .now-playing.playing .now-playing-cover { animation: spin 8s linear infinite; }
      .now-playing-title { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .progress-container { touch-action: none; }
      .round-button {
        display: inline-grid;
        width: 2.45rem;
        height: 2.45rem;
        place-items: center;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: var(--glass);
        color: var(--cream);
        cursor: pointer;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition: transform 180ms ease, background 180ms ease, border-color 180ms ease;
      }

      .round-button:hover {
        border-color: rgba(255, 224, 126, 0.52);
        background: rgba(255, 218, 109, 0.13);
        transform: translateY(-2px);
      }

      .round-button:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 3px;
      }

      .round-button svg {
        width: 1rem;
        height: 1rem;
      }

      .top-menu-container {
        position: relative;
        display: block; margin: 0 auto 2rem; width: 250px; height: 250px;
        pointer-events: auto;
      }

      .music-panel {
        position: absolute;
        top: 3.2rem;
        left: 0;
        width: 200px;
        background: var(--glass);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 1rem;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-10px);
        transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s ease;
      }

      .music-panel.active {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }

      .music-panel .panel-title {
        margin: 0 0 0.5rem;
        font-size: 0.85rem;
        color: var(--gold);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .music-panel .song-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .music-panel .song-list li {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.8rem;
        color: var(--muted);
        padding: 0.5rem 0;
        border-bottom: 1px solid rgba(255, 224, 126, 0.1);
        cursor: pointer;
        transition: color 0.2s ease;
      }

      .music-panel .song-list li:hover {
        color: var(--cream);
      }

      .music-panel .song-list li:last-child {
        border-bottom: none;
      }

      .play-icon {
        width: 1rem;
        height: 1rem;
        color: var(--gold);
        flex-shrink: 0;
      }

      .splash-screen {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 42%, #2d6c56 0%, #123735 40%, #071616 100%), #071616;
        opacity: 1;
        visibility: visible;
        transition: opacity 800ms ease, visibility 800ms ease;
      }

      .splash-screen.hidden {
        opacity: 0;
        visibility: hidden;
      }

      .splash__card {
        text-align: center;
      }

      .splash-bar-container {
        width: 220px;
        height: 4px;
        background: rgba(255, 247, 223, 0.1);
        border-radius: 2px;
        margin: 1.5rem auto 0;
        overflow: hidden;
      }

      .pretty-bar {
        width: 0;
        height: 100%;
        background: linear-gradient(90deg, #ffd45a 0%, #ff9a9e 50%, #fecfef 100%);
        border-radius: 2px;
        animation: loadBar 2s cubic-bezier(0.22, 1, 0.36, 1) forwards 0.5s;
      }

      @keyframes loadBar {
        to { width: 100%; }
      }

      @media (max-width: 540px) {
        .ui {
          padding-left: 1.15rem;
          padding-right: 1.15rem;
        }

        .masthead {
          max-width: 16rem;
        }

        .footer {
          align-items: center;
        }

        .interaction {
          max-width: calc(100vw - 5.5rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
      

      

      .dynamic-bg {
        position: absolute;
        inset: -50px;
        z-index: 0;
        background-size: cover;
        background-position: center;
        filter: blur(40px) brightness(0.6);
        transition: background-image 0.5s ease;
      }

      .bg-overlay {
        position: absolute;
        inset: 0;
        z-index: 1;
        background: linear-gradient(180deg, rgba(7, 22, 22, 0.4) 0%, rgba(7, 22, 22, 0.9) 100%);
      }

      .music-nav-top {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        padding: 1.5rem;
        z-index: 10;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .close-music-btn {
        background: transparent;
        border: none;
        color: var(--cream);
        font-size: 0.9rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      }

            .player-layout {
        position: relative;
        z-index: 2;
        width: 90%;
        max-width: 500px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
        height: 100vh;
        padding-top: 4rem;
        box-sizing: border-box;
      }
      
      @media (max-width: 768px) {
              .player-layout {
        position: relative;
        z-index: 2;
        width: 90%;
        max-width: 500px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
        height: 100vh;
        padding-top: 4rem;
        box-sizing: border-box;
      }
      }

      .player-container {
        
        width: 100%;
        max-width: 380px;
        padding: 2rem;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        text-align: center;
      }

      .playlist-container {
        flex: 1;
        width: 100%;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 24px;
        padding: 1.5rem;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        display: flex;
        flex-direction: column;
        max-height: 500px;
      }

      .playlist-search {
        width: 100%;
        padding: 0.8rem 1rem;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(0,0,0,0.2);
        color: var(--cream);
        font-family: inherit;
        margin-bottom: 1rem;
        outline: none;
      }
      
      .playlist-search::placeholder {
        color: rgba(255,255,255,0.5);
      }

      
      .playlist-item {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 0.6rem 0.8rem;
        display: flex;
        flex-direction: row;
        align-items: center;
        text-align: left;
        gap: 1rem;
        cursor: pointer;
        transition: background 0.2s, transform 0.2s;
      }
      .playlist-item:hover {
        background: rgba(255, 255, 255, 0.15);
      }
      .playlist-item-img {
        width: 45px;
        height: 45px;
        border-radius: 6px;
        flex-shrink: 0;
        background-size: cover;
        background-position: center;
        border: 1px solid rgba(255,255,255,0.1);
      }
      .playlist-item-info {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        flex: 1;
        overflow: hidden;
      }
      .playlist-item-title {
        font-size: 0.95rem;
        color: var(--cream);
        margin: 0;
        font-family: 'Inter', sans-serif;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        width: 100%;
      }
      .playlist-item-artist {
        font-size: 0.75rem;
        color: rgba(255,255,255,0.6);
        margin: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        width: 100%;
      }

      .playlist-items {
        list-style: none;
        padding: 0;
        margin: 0;
        overflow-y: auto;
        flex: 1;
      }

            

      .playlist-item:hover {
        background: rgba(255,255,255,0.1);
      }

      .playlist-item.active-song {
        background: rgba(255, 212, 90, 0.15);
        border: 1px solid rgba(255, 212, 90, 0.3);
      }

            

      

            

                  

            .album-art {
        width: 100%;
        height: 100%;
        margin: 0;
        border-radius: 50%;
        background-size: cover;
        background-position: center;
        border: 4px solid rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        animation: spin 20s linear infinite paused; -webkit-animation: spin 20s linear infinite paused;
      }

      .album-art.playing { animation-play-state: running; -webkit-animation-play-state: running; }

      .album-art::after {
        content: "";
        width: 40px;
        height: 40px;
        background: #111;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.2);
      }

      

      .song-title { font-family: Iowan Old Style, Baskerville, Georgia, serif; font-size: 1.4rem; margin: 0 0 0.2rem; color: var(--cream); }
      .song-artist { font-size: 0.9rem; color: rgba(255, 255, 255, 0.7); margin: 0 0 1.5rem; }

      .controls { display: flex; align-items: center; justify-content: center; gap: 1rem; }
      .btn-control { background: transparent; border: none; color: var(--cream); cursor: pointer; padding: 0; transition: transform 0.2s, color 0.2s; display: grid; place-items: center; }
      .btn-control:hover { color: var(--gold); transform: scale(1.1); }
      .btn-play { width: 3.5rem; height: 3.5rem; border-radius: 50%; background: rgba(255, 255, 255, 0.15); color: #fff; }
      .btn-play:hover { background: rgba(255, 255, 255, 0.25); }

      .progress-wrapper { margin: 1rem 0 1.5rem; }
      .progress-container { width: 100%; height: 6px; background: rgba(255, 255, 255, 0.2); border-radius: 3px; position: relative; cursor: pointer; }
      .progress-bar { height: 100%; width: 0%; background: var(--cream); border-radius: 3px; position: relative; }
      .progress-bar::after { content: ""; position: absolute; right: -5px; top: -3px; width: 12px; height: 12px; background: #fff; border-radius: 50%; }
      .time-info { display: flex; justify-content: space-between; font-size: 0.75rem; color: rgba(255, 255, 255, 0.6); margin-top: 0.5rem; }
    
            .full-screen-overlay {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.5s ease, visibility 0.5s;
        background-color: #071616;
      }
      .full-screen-overlay.active {
        opacity: 1;
        visibility: visible;
      }
                  .playlist-full-container {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
        overflow-y: auto;
        padding: 8rem 0rem 4rem;
      }
            
      .playlist-item:hover {
        background: rgba(255, 255, 255, 0.1);
        transform: translateY(-2px);
      }
            
            
                  

    
      .loading-spinner {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255,255,255,0.2);
        border-top-color: var(--gold);
        border-radius: 50%;
        animation: spin-spinner 1s linear infinite;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s;
        z-index: 10;
        pointer-events: none;
      }
      .loading-spinner.active {
        opacity: 1;
        visibility: visible;
      }
      @keyframes spin-spinner { to { transform: translate(-50%, -50%) rotate(360deg); } }
            .album-container-wrapper {
        position: relative;
        display: block; 
        margin: 0 auto 2rem; 
        width: 250px; 
        height: 250px;
        border-radius: 50%;
      }

          @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="atmosphere"></div>
    <main id="app" aria-label="Jardín tridimensional de luz y flores"></main>
    <div class="vignette"></div>
    <div class="grain"></div>

    <div class="ui">
      <header class="masthead">
        <div class="top-menu-container">
          <button class="round-button" id="topMenuToggle" type="button" aria-label="Menú">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="4" y1="12" x2="20" y2="12"></line>
              <line x1="4" y1="6" x2="20" y2="6"></line>
              <line x1="4" y1="18" x2="20" y2="18"></line>
            </svg>
          </button>
          <div class="music-panel" id="topMenuPanel">
            <p class="panel-title">Menú</p>
            <ul class="song-list">
              <li>
                <a href="#" id="openMusicBtn" style="color: inherit; text-decoration: none; display: flex; align-items: center; gap: 0.5rem; width: 100%;">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="play-icon" width="20" height="20"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
                  <span>Música de Penyair</span>
                </a>
              </li>
            </ul>
          </div>
        </div>
      </header>

      <footer class="footer">
        <div class="interaction" id="gestureHint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
            <path d="M4 12.3c1.9-2.2 4.6-3.3 8-3.3s6.1 1.1 8 3.3c-1.9 2.2-4.6 3.3-8 3.3s-6.1-1.1-8-3.3Z"/>
            <path d="M12 9v6M9 12h6"/>
          </svg>
          <span>Arrastra para explorar · pellizca para acercar</span>
        </div>
        <div class="controls">
          <button class="now-playing" id="nowPlayingBtn" type="button" aria-label="Abrir reproductor">
            <span class="now-playing-cover" id="nowPlayingCover"></span>
            <span class="now-playing-title" id="nowPlayingTitle"></span>
          </button>
          <button class="round-button" id="motionToggle" type="button" aria-label="Pausar movimiento" title="Pausar movimiento">
            <svg id="pauseIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M8 5v14M16 5v14"/>
            </svg>
          </button>
        </div>
      </footer>
    </div>

    <div class="splash-screen" id="splashScreen" role="status" aria-live="polite">
      <div class="splash__card">
        <h1>PARA TI</h1>
        <div class="splash-bar-container">
          <div class="pretty-bar"></div>
        </div>
      </div>
    </div>

    <!-- Music Overlay -->
    
    <!-- Playlist Overlay (Pantalla completa de canciones) -->
    <div id="playlistOverlay" class="full-screen-overlay">
      <div class="dynamic-bg" style="background-image: url('assets/images/saber_amar_cover.jpg');"></div>
      <div class="bg-overlay"></div>
      <nav class="music-nav-top">
        <button class="close-music-btn" id="closePlaylistBtn">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          Volver al jardín
        </button>
      </nav>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { mergeGeometries, mergeVertices } from "three/addons/utils/BufferGeometryUtils.js";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

      const container = document.getElementById("app");
      const motionToggle = document.getElementById("motionToggle");
      const pauseIcon = document.getElementById("pauseIcon");
      const gestureHint = document.getElementById("gestureHint");
      const splashScreen = document.getElementById("splashScreen");
      const topMenuToggle = document.getElementById("topMenuToggle");
      const topMenuPanel = document.getElementById("topMenuPanel");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const compactViewport = window.matchMedia("(max-width: 640px)").matches;
      const lowPower = compactViewport || (navigator.hardwareConcurrency || 8) <= 4;
      // Escala de cantidades: el móvil recibe un jardín igual de lleno pero más ligero.
      const Q = lowPower ? 0.5 : 1;

      if (topMenuToggle && topMenuPanel) {
        topMenuToggle.addEventListener("click", () => {
          topMenuPanel.classList.toggle("active");
        });
      }

      setTimeout(() => {
        if (splashScreen) splashScreen.classList.add("hidden");
      }, 2600);

      // ---------- RENDER ----------
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: "high-performance"
      });
      const maxPixelRatio = lowPower ? 1.5 : 2;
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, maxPixelRatio));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.08;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);
      document.documentElement.classList.add("webgl-ready");

      const scene = new THREE.Scene();
      const horizonColor = new THREE.Color("#f7d2a2");
      scene.fog = new THREE.Fog(new THREE.Color("#efc9a0"), 26, 190);

      const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 400);
      camera.position.set(1.4, 2.9, 11.6);

      // Sol bajo de atardecer, detrás del jardín: contraluz cálido en los pétalos.
      const sunLightDir = new THREE.Vector3(-0.42, 0.46, -1).normalize();
      const sunSkyDir = new THREE.Vector3(-0.42, 0.075, -1).normalize();

      // ---------- RUIDO (JS) ----------
      function hash2(x, z) {
        const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453;
        return s - Math.floor(s);
      }
      function valueNoise(x, z) {
        const ix = Math.floor(x), iz = Math.floor(z);
        const fx = x - ix, fz = z - iz;
        const ux = fx * fx * (3 - 2 * fx), uz = fz * fz * (3 - 2 * fz);
        const a = hash2(ix, iz), b = hash2(ix + 1, iz), c = hash2(ix, iz + 1), d = hash2(ix + 1, iz + 1);
        return a + (b - a) * ux + (c - a) * uz + (a - b - c + d) * ux * uz;
      }
      function fbm(x, z) {
        let v = 0, amp = 0.5, f = 1;
        for (let i = 0; i < 4; i += 1) {
          v += valueNoise(x * f, z * f) * amp;
          f *= 2.03;
          amp *= 0.5;
        }
        return v;
      }
      function groundHeight(x, z) {
        const r = Math.hypot(x, z);
        const rise = THREE.MathUtils.smoothstep(r, 15, 48);
        return rise * (fbm(x * 0.035 + 7, z * 0.035 - 3) * 7.5 - 1.2);
      }

      function seededRandom(seed) {
        let state = seed % 2147483647;
        if (state <= 0) state += 2147483646;
        return () => {
          state = (state * 16807) % 2147483647;
          return (state - 1) / 2147483646;
        };
      }
      const random = seededRandom(20260921);

      // ---------- DISEÑO DEL JARDÍN ----------
      // Jardín circular: macizo central de tulipanes, sendero de grava en anillo,
      // seis parterres por especie separados por pasillos de césped, y un seto bajo.
      const GARDEN = {
        centerBed: 3.2,
        pathInner: 3.45,
        pathOuter: 4.65,
        bedInner: 5.0,
        bedOuter: 8.7,
        hedge: 10.3,
        sectorCount: 6,
        walkHalf: 0.55
      };
      const SECTOR = (Math.PI * 2) / GARDEN.sectorCount;

      function sectorInfo(x, z) {
        const r = Math.hypot(x, z);
        // desfase de 30°: los pasillos quedan en el eje z, donde están las entradas
        const theta = Math.atan2(z, x) - SECTOR / 2;
        let a = theta % SECTOR;
        if (a < 0) a += SECTOR;
        const index = Math.round((theta - a) / SECTOR + 6) % 6;
        // distancia (en arco) al borde del parterre
        const local = a - SECTOR / 2;
        const edge = (SECTOR / 2 - Math.abs(local)) * r;
        return { r, theta, index, edge };
      }
      function onPath(x, z) {
        const r = Math.hypot(x, z);
        if (r > GARDEN.pathInner - 0.12 && r < GARDEN.pathOuter + 0.12) return true;
        return Math.abs(x) < 0.62 && r > GARDEN.pathOuter - 0.2 && r < GARDEN.hedge + 1.6;
      }
      function inBed(x, z, margin = 0) {
        const s = sectorInfo(x, z);
        if (s.r < GARDEN.centerBed - margin) return "center";
        if (s.r > GARDEN.bedInner + margin && s.r < GARDEN.bedOuter - margin && s.edge > GARDEN.walkHalf + margin) {
          return s.index;
        }
        return null;
      }

      // ---------- CIELO ----------
      const NOISE_GLSL = `
        float gHash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float gNoise(vec2 p) {
          vec2 i = floor(p); vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          float a = gHash(i), b = gHash(i + vec2(1.0, 0.0));
          float c = gHash(i + vec2(0.0, 1.0)), d = gHash(i + vec2(1.0, 1.0));
          return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
        }
        float gFbm(vec2 p) {
          float v = 0.0; float a = 0.5;
          for (int i = 0; i < 5; i++) { v += gNoise(p) * a; p = p * 2.03 + 17.0; a *= 0.5; }
          return v;
        }
      `;

      const skyUniforms = {
        uSunDir: { value: sunSkyDir },
        uTop: { value: new THREE.Color("#3d6fb6") },
        uMid: { value: new THREE.Color("#f3a77f") },
        uHorizon: { value: horizonColor.clone() },
        uSunColor: { value: new THREE.Color("#ffb46b") },
        uTime: { value: 0 }
      };
      const sky = new THREE.Mesh(
        new THREE.SphereGeometry(300, 48, 24),
        new THREE.ShaderMaterial({
          uniforms: skyUniforms,
          side: THREE.BackSide,
          depthWrite: false,
          fog: false,
          vertexShader: `
            varying vec3 vDir;
            void main() {
              vDir = normalize(position);
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform vec3 uSunDir; uniform vec3 uTop; uniform vec3 uMid; uniform vec3 uHorizon; uniform vec3 uSunColor;
            uniform float uTime;
            varying vec3 vDir;
            ${NOISE_GLSL}
            void main() {
              vec3 dir = normalize(vDir);
              float h = dir.y;
              vec3 mauve = vec3(0.86, 0.5, 0.52);
              vec3 col = mix(uHorizon, uMid, smoothstep(0.0, 0.14, h));
              col = mix(col, mauve, smoothstep(0.12, 0.36, h));
              col = mix(col, uTop, smoothstep(0.3, 0.85, h));
              col = mix(col, uHorizon, smoothstep(0.0, -0.15, h));
              float sd = max(dot(dir, uSunDir), 0.0);
              col += uSunColor * (pow(sd, 4.0) * 0.4 + pow(sd, 32.0) * 0.6 + pow(sd, 400.0) * 1.4);
              col += vec3(1.0, 0.93, 0.78) * smoothstep(0.99935, 0.99965, sd) * 5.0;
              // nubes altas y finas
              vec2 cuv = dir.xz / (h + 0.12);
              float n = gFbm(cuv * 0.9 + vec2(uTime * 0.006, uTime * 0.002));
              float band = smoothstep(0.015, 0.14, h) * (1.0 - smoothstep(0.35, 0.8, h));
              float cloud = smoothstep(0.52, 0.82, n) * band;
              vec3 cloudCol = mix(vec3(0.85, 0.5, 0.48), vec3(1.0, 0.78, 0.52), pow(sd, 3.0));
              col = mix(col, cloudCol, cloud * 0.65);
              gl_FragColor = vec4(col, 1.0);
              #include <tonemapping_fragment>
              #include <colorspace_fragment>
            }
          `
        })
      );
      scene.add(sky);

      // ---------- LUCES ----------
      scene.add(new THREE.HemisphereLight(0xc4d6f2, 0x5b5a2c, 0.95));

      const sunLight = new THREE.DirectionalLight(0xffc690, 3.4);
      sunLight.position.copy(sunLightDir).multiplyScalar(30);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.set(lowPower ? 1024 : 2048, lowPower ? 1024 : 2048);
      sunLight.shadow.camera.left = -13;
      sunLight.shadow.camera.right = 13;
      sunLight.shadow.camera.top = 13;
      sunLight.shadow.camera.bottom = -13;
      sunLight.shadow.camera.near = 5;
      sunLight.shadow.camera.far = 60;
      sunLight.shadow.bias = -0.0004;
      sunLight.shadow.normalBias = 0.025;
      sunLight.shadow.radius = 3;
      scene.add(sunLight);

      // Luz de rebote suave desde el lado de la cámara para que nada quede negro.
      const bounceLight = new THREE.DirectionalLight(0xffe2c4, 0.8);
      bounceLight.position.set(4, 6, 12);
      scene.add(bounceLight);

      // ---------- VIENTO COMPARTIDO ----------
      const windUniforms = { uTime: { value: 0 } };
      function addWind(material, amplitude, height) {
        material.onBeforeCompile = (shader) => {
          shader.uniforms.uTime = windUniforms.uTime;
          shader.uniforms.uAmp = { value: amplitude };
          shader.uniforms.uHeight = { value: height };
          shader.vertexShader = shader.vertexShader
            .replace(
              "#include <common>",
              "#include <common>\nuniform float uTime; uniform float uAmp; uniform float uHeight;"
            )
            .replace(
              "#include <begin_vertex>",
              `#include <begin_vertex>
              #ifdef USE_INSTANCING
                vec3 ip = instanceMatrix[3].xyz;
              #else
                vec3 ip = vec3(0.0);
              #endif
              float hN = clamp(position.y / uHeight, 0.0, 1.5);
              float gust = sin(uTime * 0.55 + ip.x * 0.16 + ip.z * 0.09) * 0.5 + 0.5;
              float sway = sin(uTime * 1.6 + ip.x * 0.8 + ip.z * 0.55) * 0.65
                + sin(uTime * 2.7 + ip.z * 1.3 - ip.x * 0.4) * 0.25;
              float bend = (sway * (0.35 + gust) + gust * 0.6) * uAmp * hN * hN;
              transformed.x += bend;
              transformed.z += bend * 0.45;
              transformed.y -= abs(bend) * 0.25 * hN;`
            );
        };
      }

      // ---------- SUELO PROCEDURAL ----------
      const groundSize = 260;
      const groundSegments = lowPower ? 140 : 220;
      const groundGeometry = new THREE.PlaneGeometry(groundSize, groundSize, groundSegments, groundSegments);
      groundGeometry.rotateX(-Math.PI / 2);
      {
        const pos = groundGeometry.attributes.position;
        for (let i = 0; i < pos.count; i += 1) {
          pos.setY(i, groundHeight(pos.getX(i), pos.getZ(i)));
        }
        groundGeometry.computeVertexNormals();
      }
      const groundMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, metalness: 0 });
      groundMaterial.onBeforeCompile = (shader) => {
        shader.vertexShader = shader.vertexShader
          .replace("#include <common>", "#include <common>\nvarying vec3 vGW;")
          .replace("#include <worldpos_vertex>", "#include <worldpos_vertex>\nvGW = (modelMatrix * vec4(transformed, 1.0)).xyz;");
        shader.fragmentShader = shader.fragmentShader
          .replace("#include <common>", `#include <common>\nvarying vec3 vGW;\n${NOISE_GLSL}\nfloat gRough = 1.0;`)
          .replace(
            "#include <color_fragment>",
            `#include <color_fragment>
            {
              vec2 p = vGW.xz;
              float r = length(p);
              float th = atan(p.y, p.x);
              float nBig = gFbm(p * 0.22);
              float nMid = gFbm(p * 1.4);
              float nFine = gNoise(p * 38.0);
              float edgeN = (gFbm(p * 2.6) - 0.5) * 0.22;

              // césped
              vec3 grassA = pow(vec3(0.24, 0.33, 0.11), vec3(2.2));
              vec3 grassB = pow(vec3(0.38, 0.45, 0.17), vec3(2.2));
              vec3 dry = pow(vec3(0.55, 0.5, 0.27), vec3(2.2));
              vec3 col = mix(grassA, grassB, nMid);
              col = mix(col, dry, smoothstep(0.6, 0.82, nBig) * 0.45 + smoothstep(20.0, 70.0, r) * 0.2);
              col *= 0.82 + nFine * 0.28;
              float rough = 0.95;

              // tierra / mantillo de los parterres
              float sectorA = 6.2831853 / 6.0;
              float a = mod(th - sectorA * 0.5, sectorA);
              float edgeArc = (sectorA * 0.5 - abs(a - sectorA * 0.5)) * r;
              float bed = (1.0 - smoothstep(${GARDEN.centerBed.toFixed(2)} - 0.05, ${GARDEN.centerBed.toFixed(2)} + 0.12, r + edgeN));
              float outerBed = smoothstep(${GARDEN.bedInner.toFixed(2)} - 0.1, ${GARDEN.bedInner.toFixed(2)} + 0.05, r + edgeN)
                * (1.0 - smoothstep(${GARDEN.bedOuter.toFixed(2)} - 0.05, ${GARDEN.bedOuter.toFixed(2)} + 0.12, r + edgeN))
                * smoothstep(${GARDEN.walkHalf.toFixed(2)} - 0.08, ${GARDEN.walkHalf.toFixed(2)} + 0.06, edgeArc + edgeN);
              bed = max(bed, outerBed);
              vec3 soilA = pow(vec3(0.17, 0.11, 0.07), vec3(2.2));
              vec3 soilB = pow(vec3(0.3, 0.2, 0.13), vec3(2.2));
              vec3 soil = mix(soilA, soilB, gNoise(p * 9.0) * 0.6 + nFine * 0.4);
              soil = mix(soil, grassA * 0.9, smoothstep(0.55, 0.9, gNoise(p * 3.0)) * 0.35);
              col = mix(col, soil, bed);
              rough = mix(rough, 1.0, bed);

              // sendero de grava: anillo + entradas norte/sur
              float ring = smoothstep(${GARDEN.pathInner.toFixed(2)} - 0.04, ${GARDEN.pathInner.toFixed(2)} + 0.06, r + edgeN * 0.25)
                * (1.0 - smoothstep(${GARDEN.pathOuter.toFixed(2)} - 0.06, ${GARDEN.pathOuter.toFixed(2)} + 0.04, r + edgeN * 0.25));
              float spoke = (1.0 - smoothstep(0.46, 0.56, abs(p.x) + edgeN * 0.2))
                * smoothstep(${GARDEN.pathOuter.toFixed(2)} - 0.3, ${GARDEN.pathOuter.toFixed(2)}, r)
                * (1.0 - smoothstep(${(GARDEN.hedge + 1.2).toFixed(2)}, ${(GARDEN.hedge + 2.2).toFixed(2)}, r));
              float path = max(ring, spoke);
              float pebble = gNoise(p * 55.0);
              float pebble2 = gNoise(p * 23.0 + 4.0);
              vec3 gravel = mix(pow(vec3(0.5, 0.46, 0.4), vec3(2.2)), pow(vec3(0.74, 0.69, 0.6), vec3(2.2)), pebble);
              gravel *= 0.82 + pebble2 * 0.3;
              gravel = mix(gravel, pow(vec3(0.36, 0.32, 0.27), vec3(2.2)), smoothstep(0.78, 0.95, gNoise(p * 70.0)) * 0.6);
              col = mix(col, gravel, path);
              rough = mix(rough, 0.88, path);

              diffuseColor.rgb = col;
              gRough = rough;
            }`
          )
          .replace("#include <roughnessmap_fragment>", "#include <roughnessmap_fragment>\nroughnessFactor = gRough;");
      };
      const ground = new THREE.Mesh(groundGeometry, groundMaterial);
      ground.receiveShadow = true;
      scene.add(ground);

      // ---------- ÁRBOLES Y ARBUSTOS ----------
      function blobGeometry(detail, roughness, seed) {
        let g = new THREE.IcosahedronGeometry(1, detail);
        g.deleteAttribute("normal");
        g.deleteAttribute("uv");
        g = mergeVertices(g);
        const pos = g.attributes.position;
        const v = new THREE.Vector3();
        for (let i = 0; i < pos.count; i += 1) {
          v.fromBufferAttribute(pos, i);
          const n = fbm(v.x * 2.2 + seed, v.z * 2.2 + v.y * 1.7 - seed);
          v.multiplyScalar(1 + (n - 0.5) * roughness);
          pos.setXYZ(i, v.x, v.y, v.z);
        }
        g.computeVertexNormals();
        return g;
      }

      // Árboles del fondo pintados como siluetas a contraluz: miles de hojas
      // pequeñas con borde dorado donde las toca el sol.
      function createTreeTexture(kind, seed) {
        const rand = seededRandom(seed);
        const W = 256, H = 384;
        const canvas = document.createElement("canvas");
        canvas.width = W;
        canvas.height = H;
        const ctx = canvas.getContext("2d");
        const trunkTop = kind === "poplar" ? H * 0.3 : H * 0.45;
        // tronco y ramas
        ctx.strokeStyle = "#2a1d15";
        ctx.lineCap = "round";
        ctx.lineWidth = kind === "oak" ? 16 : 11;
        ctx.beginPath();
        ctx.moveTo(W / 2, H);
        ctx.quadraticCurveTo(W / 2 + (rand() - 0.5) * 20, H * 0.75, W / 2 + (rand() - 0.5) * 14, trunkTop);
        ctx.stroke();
        ctx.lineWidth = 5;
        for (let b = 0; b < 5; b += 1) {
          const y = H - (H - trunkTop) * (0.45 + rand() * 0.5);
          const dir = rand() < 0.5 ? -1 : 1;
          ctx.beginPath();
          ctx.moveTo(W / 2, y);
          ctx.quadraticCurveTo(W / 2 + dir * 30, y - 30, W / 2 + dir * (40 + rand() * 40), y - 60 - rand() * 50);
          ctx.stroke();
        }
        // masas de follaje
        const clusters = [];
        const count = kind === "poplar" ? 7 : 9;
        for (let c = 0; c < count; c += 1) {
          let cx, cy, rx, ry;
          if (kind === "poplar") {
            cy = H * 0.08 + (c / count) * H * 0.62;
            cx = W / 2 + (rand() - 0.5) * 30;
            rx = 34 + Math.sin((c / count) * Math.PI) * 26;

      // ---------- CÉSPED (briznas instanciadas que se mecen) ----------
      function createGrassClumpGeometry() {
        const positions = [], normals = [], colors = [], indices = [];
        const blades = 7;
        const segs = 3;
        let base = 0;
        const rand = seededRandom(77);
        for (let b = 0; b < blades; b += 1) {
          const ox = (rand() - 0.5) * 0.12;
          const oz = (rand() - 0.5) * 0.12;
          const h = 0.13 + rand() * 0.15;
          const w = 0.011 + rand() * 0.007;
          const rot = rand() * Math.PI;
          const lean = (rand() - 0.3) * 0.5;
          const cs = Math.cos(rot), sn = Math.sin(rot);
          const tipTint = rand();
          for (let s = 0; s <= segs; s += 1) {
            const t = s / segs;
            const y = t * h;
            const bendOut = lean * t * t * h;
            const half = w * (1 - t * 0.92);
            for (const side of [-1, 1]) {
              const lx = side * half;
              const lz = bendOut;
              positions.push(ox + lx * cs - lz * sn, y, oz + lx * sn + lz * cs);
              normals.push(0, 1, 0);
              const k = 0.35 + 0.65 * t;
              colors.push(
                0.1 + 0.17 * k + tipTint * 0.06 * t,
                0.19 + 0.27 * k,
                0.05 + 0.07 * k
              );
            }
            if (s < segs) {
              const i0 = base + s * 2;
              indices.push(i0, i0 + 1, i0 + 2, i0 + 1, i0 + 3, i0 + 2);
            }
          }
          base += (segs + 1) * 2;
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        g.setAttribute("normal", new THREE.Float32BufferAttribute(normals, 3));
        g.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
        g.setIndex(indices);
        return g;
      }

      // ---------- TULIPANES ----------

      const TULIP_COLORS = {

      function createTulipPetalGeometry(outer) {
        const segU = 14, segV = 7;
        const H = outer ? 1.0 : 0.93;
        const halfW = outer ? 0.31 : 0.29;
        const cup = outer ? 1.45 : 1.65;
        const flick = outer ? 0.16 : 0.04;
        const positions = [], colors = [], indices = [];
        for (let i = 0; i <= segU; i++) {
          const u = i / segU;
          const w = Math.max(Math.pow(Math.sin(Math.PI * Math.pow(u, 0.8)), 0.6), 0.14 * (1 - u));
          const R = 0.06 + 0.27 * Math.sin(Math.PI * Math.pow(u, 0.88)) + flick * Math.pow(u, 6);
          for (let j = 0; j <= segV; j++) {
            const v = (j / segV) * 2 - 1;
            const y = v * w * halfW;
            const x = R - cup * y * y;
            const z = u * H;
            positions.push(x, y, z);
            // base del pétalo más oscura/verdosa, borde más luminoso
            const base = 0.62 + 0.38 * Math.min(1, u / 0.4);
            const edge = 1 + 0.08 * Math.pow(Math.abs(v), 2) * u;
            const c = Math.min(1.05, base * edge);
            colors.push(c * (u < 0.15 ? 0.92 : 1), c * (u < 0.15 ? 1.02 : 1), c * 0.97);
          }
        }
        const row = segV + 1;
        for (let i = 0; i < segU; i++) {
          for (let j = 0; j < segV; j++) {
            const a = i * row + j, b = a + 1, c = a + row, d = c + 1;
            indices.push(a, c, b, b, c, d);
          }
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        g.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
        g.setIndex(indices);
        g.computeVertexNormals();
        return g;
      }

      function createTulipLeafGeometry() {
        const segU = 14, segV = 4;
        const positions = [], colors = [], indices = [];
        let yy = 0, zz = 0.03;
        const du = 1 / segU;
        for (let i = 0; i <= segU; i++) {
          const u = i / segU;
          if (i > 0) {
            const theta = 0.12 + 1.15 * Math.pow(u, 1.6);
            yy += Math.cos(theta) * du;
            zz += Math.sin(theta) * du;
          }
          const w = 0.15 * Math.pow(Math.sin(Math.PI * Math.pow(u, 0.5)), 0.9) * (1 - 0.25 * u);
          for (let j = 0; j <= segV; j++) {
            const v = (j / segV) * 2 - 1;
            const x = v * w;
            const fold = -0.9 * Math.abs(x) * (1 - u * 0.5);
            positions.push(x, yy, zz + fold);
            const shade = 0.7 + 0.3 * u + 0.08 * (1 - Math.abs(v));
            colors.push(shade * 0.95, shade, shade * 0.95);
          }
        }
        const row = segV + 1;
        for (let i = 0; i < segU; i++) {
          for (let j = 0; j < segV; j++) {
            const a = i * row + j, b = a + 1, c = a + row, d = c + 1;
            indices.push(a, b, c, b, d, c);
          }
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        g.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
        g.setIndex(indices);
        g.computeVertexNormals();
        return g;
      }

      function bakePlant(group) {
        group.updateMatrixWorld(true);
        const inverse = new THREE.Matrix4().copy(group.matrixWorld).invert();
        const parts = [];
        const relative = new THREE.Matrix4();
        group.traverse((obj) => {
          if (!obj.isMesh) return;
          relative.multiplyMatrices(inverse, obj.matrixWorld);
          let g = obj.geometry.index ? obj.geometry.toNonIndexed() : obj.geometry.clone();
          g.applyMatrix4(relative);
          const count = g.attributes.position.count;
          const tint = obj.material.color;
          const colors = new Float32Array(count * 3);
          const source = g.attributes.color;
          for (let i = 0; i < count; i += 1) {
            const k = source ? source.getX(i) : 1;
            const k2 = source ? source.getY(i) : 1;
            const k3 = source ? source.getZ(i) : 1;
            colors[i * 3] = tint.r * k;
            colors[i * 3 + 1] = tint.g * k2;
            colors[i * 3 + 2] = tint.b * k3;
          }
          const clean = new THREE.BufferGeometry();
          clean.setAttribute("position", g.attributes.position);
          clean.setAttribute("normal", g.attributes.normal);
          clean.setAttribute("color", new THREE.BufferAttribute(colors, 3));
          parts.push(clean);
        });
        const merged = mergeGeometries(parts, false);
        const mesh = new THREE.Mesh(merged, flowerMaterial);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        const baked = new THREE.Group();
        baked.position.copy(group.position);
        baked.add(mesh);
        return baked;
      }

      function addTepals(head, material, geometry, angleOffset, openAngle, rnd) {
        for (let i = 0; i < 3; i++) {
          const holder = new THREE.Group();
          holder.rotation.z = angleOffset + (i / 3) * Math.PI * 2;
          const petal = new THREE.Mesh(geometry, material);
          petal.rotation.y = openAngle + (rnd(i * 5 + angleOffset * 10) - 0.5) * 0.08;
          petal.rotation.x = (rnd(i * 3 + 40) - 0.5) * 0.06;
          const s = 0.96 + rnd(i * 9 + 5) * 0.08;
          petal.scale.set(s, s, 0.96 + rnd(i * 4 + 2) * 0.08);
          holder.add(petal);
          head.add(holder);
        }
      }

      function addTulipStamens(head, rnd) {
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * Math.PI * 2 + rnd(i + 60) * 0.3;
          const holder = new THREE.Group();
          holder.rotation.z = a;
          const filament = new THREE.Mesh(tulipFilamentGeometry, tulipFilamentPaint);
          filament.position.x = 0.075;
          filament.rotation.y = 0.07 + rnd(i + 70) * 0.05;
          holder.add(filament);
          const anther = new THREE.Mesh(tulipAntherGeometry, tulipAntherPaint);
          anther.position.set(0.075 + Math.sin(filament.rotation.y) * 0.4, 0, 0.4);
          holder.add(anther);
          head.add(holder);
        }
        const pStem = new THREE.Mesh(pistilStemGeometry, tulipPistilPaint);
        const pTop = new THREE.Mesh(pistilTopGeometry, tulipPistilPaint);
        pTop.scale.set(1, 1, 0.8);
        pTop.position.z = 0.38;
        head.add(pStem, pTop);
