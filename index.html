          const cs = Math.cos(rot), sn = Math.sin(rot);
          const tipTint = rand();
          for (let s = 0; s <= segs; s += 1) {
            const t = s / segs;
            const y = t * h;
            const bendOut = lean * t * t * h;
            const half = w * (1 - t * 0.92);
            for (const side of [-1, 1]) {
              const lx = side * half;
              const lz = bendOut;
              positions.push(ox + lx * cs - lz * sn, y, oz + lx * sn + lz * cs);
              normals.push(0, 1, 0);
              const k = 0.35 + 0.65 * t;
              colors.push(
                0.09 + 0.13 * k + tipTint * 0.05 * t,
                0.17 + 0.22 * k,
                0.05 + 0.06 * k
              );
            }
            if (s < segs) {
              const i0 = base + s * 2;
              indices.push(i0, i0 + 1, i0 + 2, i0 + 1, i0 + 3, i0 + 2);
            }
          }
          base += (segs + 1) * 2;
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        g.setAttribute("normal", new THREE.Float32BufferAttribute(normals, 3));
        g.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
        g.setIndex(indices);
        return g;
      }
      {
        const grassMaterial = enhance(lit({
          vertexColors: true,
          roughness: 0.82,
          side: THREE.DoubleSide
        }), { wind: { amp: 0.05, height: 0.28 } });
        const clumpCount = Math.round(60000 * Q);
        const items = [];
        let guard = 0;
        while (items.length < clumpCount && guard < clumpCount * 6) {
          guard += 1;
          const r = Math.pow(random(), 0.7) * (GARDEN.edge + 6);
          const a = random() * Math.PI * 2;
          const x = Math.cos(a) * r;
          const z = Math.sin(a) * r;
          if (onPath(x, z)) continue;
          const bed = inBed(x, z, -0.15);
          if (bed !== null && random() > 0.04) continue;
          if (tulipStripe(x, z, -0.1) >= 0 && random() > 0.05) continue;
          if (Math.abs(r - GARDEN.hedge) < 0.45 && random() > 0.3) continue;
          const s = 0.8 + random() * 0.6;
          const v = 0.75 + random() * 0.35;
          items.push({ x, z, y: groundHeight(x, z), s, sy: s * (0.85 + random() * 0.4), yaw: random() * Math.PI * 2, shade: v });
        }
        chunkedInstances(lowPower ? createGrassClumpGeometry(4, 2) : createGrassClumpGeometry(), grassMaterial, items, { chunk: 10, glowY: 0.15, cull: "grass" });
      }

      // ---------- TULIPANES ----------
      // Colores reales de tulipán (rojos, rosas, blancos, amarillos, naranjas, morados)
      const TULIP_COLORS = {
        red: 0xc8102e,
        scarlet: 0xe0362c,
        pink: 0xef7d9a,
        blush: 0xf6b7c6,
        white: 0xf5efe2,
        cream: 0xf3e3b5,
        yellow: 0xf3c12c,
        orange: 0xf27a22,
        apricot: 0xf6a161,
        purple: 0x6e2a72,
        lilac: 0xb487c4,
        night: 0x3e1238
      };

      function createTulipPetalGeometry(outer, segU = 14, segV = 7) {
        const H = outer ? 1.0 : 0.93;
        const halfW = outer ? 0.31 : 0.29;
        const cup = outer ? 1.45 : 1.65;
        const flick = outer ? 0.16 : 0.04;
        const positions = [], colors = [], indices = [];
        for (let i = 0; i <= segU; i++) {
          const u = i / segU;
          const w = Math.max(Math.pow(Math.sin(Math.PI * Math.pow(u, 0.8)), 0.6), 0.14 * (1 - u));
          const R = 0.06 + 0.27 * Math.sin(Math.PI * Math.pow(u, 0.88)) + flick * Math.pow(u, 6);
          for (let j = 0; j <= segV; j++) {
            const v = (j / segV) * 2 - 1;
            const y = v * w * halfW;
            const x = R - cup * y * y;
            const z = u * H;
            positions.push(x, y, z);
            // base del pétalo más oscura/verdosa, borde más luminoso
            const base = 0.62 + 0.38 * Math.min(1, u / 0.4);
            const edge = 1 + 0.08 * Math.pow(Math.abs(v), 2) * u;
            const c = Math.min(1.05, base * edge);
            colors.push(c * (u < 0.15 ? 0.92 : 1), c * (u < 0.15 ? 1.02 : 1), c * 0.97);
          }
        }
        const row = segV + 1;
        for (let i = 0; i < segU; i++) {
          for (let j = 0; j < segV; j++) {
            const a = i * row + j, b = a + 1, c = a + row, d = c + 1;
            indices.push(a, c, b, b, c, d);
          }
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        g.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
        g.setIndex(indices);
        g.computeVertexNormals();
        return g;
      }

      function createTulipLeafGeometry(segU = 14, segV = 4) {
        const positions = [], colors = [], indices = [];
        let yy = 0, zz = 0.03;
        const du = 1 / segU;
        for (let i = 0; i <= segU; i++) {
          const u = i / segU;
          if (i > 0) {
            const theta = 0.12 + 1.15 * Math.pow(u, 1.6);
            yy += Math.cos(theta) * du;
            zz += Math.sin(theta) * du;
          }
          const w = 0.15 * Math.pow(Math.sin(Math.PI * Math.pow(u, 0.5)), 0.9) * (1 - 0.25 * u);
          for (let j = 0; j <= segV; j++) {
            const v = (j / segV) * 2 - 1;
            const x = v * w;
            const fold = -0.9 * Math.abs(x) * (1 - u * 0.5);
            positions.push(x, yy, zz + fold);
            const shade = 0.7 + 0.3 * u + 0.08 * (1 - Math.abs(v));
            colors.push(shade * 0.95, shade, shade * 0.95);
          }
        }
        const row = segV + 1;
        for (let i = 0; i < segU; i++) {
          for (let j = 0; j < segV; j++) {
            const a = i * row + j, b = a + 1, c = a + row, d = c + 1;
            indices.push(a, b, c, b, d, c);
          }
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
        g.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
        g.setIndex(indices);
        g.computeVertexNormals();
        return g;
      }

      const outerPetalGeometry = createTulipPetalGeometry(true);
      const innerPetalGeometry = createTulipPetalGeometry(false);
      const tulipLeafGeometry = createTulipLeafGeometry();
      // versiones ligeras para los campos grandes
      const lowOuterPetal = createTulipPetalGeometry(true, 6, 3);
      const lowInnerPetal = createTulipPetalGeometry(false, 5, 2);
      const lowLeaf = createTulipLeafGeometry(6, 2);
      // versiones mínimas para lo que se ve de lejos
      const farOuterPetal = createTulipPetalGeometry(true, 3, 2);
      const farLeaf = createTulipLeafGeometry(3, 1);
      const lowCalyx = new THREE.SphereGeometry(0.075, 6, 4);
      const lowTulipInner = new THREE.SphereGeometry(0.17, 6, 4);
      const tulipFilamentGeometry = new THREE.CylinderGeometry(0.008, 0.01, 0.4, 5);
      tulipFilamentGeometry.rotateX(Math.PI / 2);
      tulipFilamentGeometry.translate(0, 0, 0.2);
      const tulipAntherGeometry = new THREE.BoxGeometry(0.03, 0.02, 0.09);
      const pistilStemGeometry = new THREE.CylinderGeometry(0.02, 0.026, 0.38, 6);
      pistilStemGeometry.rotateX(Math.PI / 2);
      pistilStemGeometry.translate(0, 0, 0.19);
      const pistilTopGeometry = new THREE.SphereGeometry(0.045, 8, 6);
      const calyxGeometry = new THREE.SphereGeometry(0.075, 10, 8);
      const tulipInnerGeometry = new THREE.SphereGeometry(0.17, 10, 8);

      // Los colores se guardan como "materiales" ligeros: al hornear la flor
      // cada pieza aporta su color al vértice y todo se dibuja en una sola llamada.
      const paint = (hex) => ({ color: new THREE.Color(hex) });
      const tulipStemPaint = paint(0x5e8f3a);
      const tulipLeafPaint = paint(0x5a8a5c);
      const tulipCenterPaint = paint(0x2f2418);
      const tulipFilamentPaint = paint(0xe4dba0);
      const tulipAntherPaint = paint(0x2b1b2a);
      const tulipPistilPaint = paint(0xb8c860);

      // Pétalos con brillo aterciopelado en computador; en celular, sombreado simple.
      const makeFlowerMaterial = () => lowPower
        ? new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide })
        : new THREE.MeshPhysicalMaterial({
          vertexColors: true,
          roughness: 0.62,
          metalness: 0,
          sheen: 0.55,
          sheenRoughness: 0.55,
          sheenColor: new THREE.Color(0xffffff),
          side: THREE.DoubleSide
        });
      const flowerMaterial = enhance(makeFlowerMaterial(), { anchored: true });

      function bakePlant(group) {
        group.updateMatrixWorld(true);
        const inverse = new THREE.Matrix4().copy(group.matrixWorld).invert();
        const parts = [];
        const relative = new THREE.Matrix4();
        group.traverse((obj) => {
          if (!obj.isMesh) return;
          relative.multiplyMatrices(inverse, obj.matrixWorld);
          let g = obj.geometry.index ? obj.geometry.toNonIndexed() : obj.geometry.clone();
          g.applyMatrix4(relative);
          const count = g.attributes.position.count;
          const tint = obj.material.color;
          const colors = new Float32Array(count * 3);
          const source = g.attributes.color;
          for (let i = 0; i < count; i += 1) {
            const k = source ? source.getX(i) : 1;
            const k2 = source ? source.getY(i) : 1;
            const k3 = source ? source.getZ(i) : 1;
            colors[i * 3] = tint.r * k;
            colors[i * 3 + 1] = tint.g * k2;
            colors[i * 3 + 2] = tint.b * k3;
          }
          const clean = new THREE.BufferGeometry();
          clean.setAttribute("position", g.attributes.position);
          clean.setAttribute("normal", g.attributes.normal);
          clean.setAttribute("color", new THREE.BufferAttribute(colors, 3));
          parts.push(clean);
        });
        const merged = mergeGeometries(parts, false);
        const mesh = new THREE.Mesh(merged, flowerMaterial);
        const baked = new THREE.Group();
        baked.position.copy(group.position);
        baked.add(mesh);
        return baked;
      }

      function addTepals(head, material, geometry, angleOffset, openAngle, rnd) {
        for (let i = 0; i < 3; i++) {
          const holder = new THREE.Group();
          holder.rotation.z = angleOffset + (i / 3) * Math.PI * 2;
          const petal = new THREE.Mesh(geometry, material);
          petal.rotation.y = openAngle + (rnd(i * 5 + angleOffset * 10) - 0.5) * 0.08;
          petal.rotation.x = (rnd(i * 3 + 40) - 0.5) * 0.06;
          const s = 0.96 + rnd(i * 9 + 5) * 0.08;
          petal.scale.set(s, s, 0.96 + rnd(i * 4 + 2) * 0.08);
          holder.add(petal);
          head.add(holder);
        }
      }

      function addTulipStamens(head, rnd) {
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * Math.PI * 2 + rnd(i + 60) * 0.3;
          const holder = new THREE.Group();
          holder.rotation.z = a;
          const filament = new THREE.Mesh(tulipFilamentGeometry, tulipFilamentPaint);
          filament.position.x = 0.075;
          filament.rotation.y = 0.07 + rnd(i + 70) * 0.05;
          holder.add(filament);
          const anther = new THREE.Mesh(tulipAntherGeometry, tulipAntherPaint);
          anther.position.set(0.075 + Math.sin(filament.rotation.y) * 0.4, 0, 0.4);
          holder.add(anther);
          head.add(holder);
        }
        const pStem = new THREE.Mesh(pistilStemGeometry, tulipPistilPaint);
        const pTop = new THREE.Mesh(pistilTopGeometry, tulipPistilPaint);
        pTop.scale.set(1, 1, 0.8);
        pTop.position.z = 0.38;
        head.add(pStem, pTop);
      }

      function createTulip(config) {
        const group = new THREE.Group();
        group.position.set(config.x, 0, config.z);
        const rnd = (n) => {
          const s = Math.sin(n * 127.1 + config.seed * 311.7) * 43758.5453;
          return s - Math.floor(s);
        };
        const curve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(config.bendX * 0.18, config.height * 0.32, config.bendZ * 0.18),
          new THREE.Vector3(config.bendX * 0.6, config.height * 0.68, config.bendZ * 0.6),
          new THREE.Vector3(config.bendX, config.height, config.bendZ)
        ]);
        const lp = !!config.lowPoly;
        const far = !!config.far;
        group.add(new THREE.Mesh(new THREE.TubeGeometry(curve, far ? 2 : lp ? 4 : 14, 0.045 * config.scale * (far ? 1.4 : 1), far ? 3 : lp ? 4 : 6, false), tulipStemPaint));

        const leafCount = far ? 1 : 2 + (rnd(1) > 0.5 ? 1 : 0);
        for (let i = 0; i < leafCount; i++) {
          const leaf = new THREE.Mesh(far ? farLeaf : lp ? lowLeaf : tulipLeafGeometry, tulipLeafPaint);
          leaf.position.set(0, 0.01 + i * 0.04 * config.height, 0);
          leaf.rotation.y = config.seed * 6.28 + i * ((Math.PI * 2) / leafCount) + (rnd(i + 1) - 0.5) * 0.5;
          leaf.rotation.x = (rnd(i + 7) - 0.5) * 0.15;
          const len = config.height * (0.5 - i * 0.08) * (0.9 + rnd(i + 3) * 0.2);
          leaf.scale.set(len * 1.25, len, len);
          group.add(leaf);
        }

        const head = new THREE.Group();
        head.position.copy(curve.getPoint(1));
        head.rotation.set(-Math.PI / 2 + config.tilt, 0, config.spin);
        head.scale.setScalar(config.scale);
        const petalPaint = paint(config.color);
        const open = config.open !== undefined ? config.open : 0.2 + rnd(11) * 0.3;
        if (far) {
          // de lejos basta la copa de tres pétalos
          addTepals(head, petalPaint, farOuterPetal, rnd(21) * 0.2, 0.02 + open * 0.2, rnd);
          group.add(head);
          return bakePlant(group);
        }
        const calyx = new THREE.Mesh(lp ? lowCalyx : calyxGeometry, tulipStemPaint);
        calyx.scale.set(1, 1, 0.8);
        calyx.position.z = -0.01;
        head.add(calyx);
        addTepals(head, petalPaint, lp ? lowOuterPetal : outerPetalGeometry, rnd(21) * 0.2, 0.05 + open * 0.28, rnd);
        addTepals(head, petalPaint, lp ? lowInnerPetal : innerPetalGeometry, Math.PI / 3 + rnd(22) * 0.2, 0.01 + open * 0.16, rnd);
        const inner = new THREE.Mesh(lp ? lowTulipInner : tulipInnerGeometry, tulipCenterPaint);
        inner.scale.set(1, 1, 0.55);
        inner.position.z = 0.03;
        head.add(inner);
        if (config.detail) addTulipStamens(head, rnd);
        group.add(head);
        return bakePlant(group);
      }


      // ---------- LIRIOS ARAÑA (Lycoris) ----------
      function createSpiderPetalGeometry(curveSegments = 8) {
        const shape = new THREE.Shape();
        shape.moveTo(0, 0);
        shape.bezierCurveTo(0.1, 0.12, 0.15, 0.58, 0.08, 1.08);
        shape.bezierCurveTo(0.045, 1.38, 0.02, 1.55, 0, 1.64);
        shape.bezierCurveTo(-0.02, 1.55, -0.045, 1.38, -0.08, 1.08);
        shape.bezierCurveTo(-0.15, 0.58, -0.1, 0.12, 0, 0);
        const geometry = new THREE.ShapeGeometry(shape, curveSegments);
        const position = geometry.attributes.position;
        const colors = [];
        for (let i = 0; i < position.count; i += 1) {
          const y = position.getY(i);
          const x = position.getX(i);
          const progress = THREE.MathUtils.clamp(y / 1.64, 0, 1);
          // el pétalo sale hacia arriba y se curva hacia atrás, como en Lycoris real
          const curl = -progress * progress * 1.25;
          const ripple = Math.sin(progress * Math.PI * 4) * 0.03 * progress;
          position.setZ(i, curl + (0.1 - Math.abs(x)) * 0.1);
          position.setX(i, x + ripple);
          const c = 0.78 + 0.22 * Math.min(1, progress * 2);
          colors.push(c, c, c);
        }
        geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
        geometry.computeVertexNormals();
        return geometry;
      }
      const spiderPetalGeometry = createSpiderPetalGeometry();
      const lowSpiderPetal = createSpiderPetalGeometry(2);
      const farSpiderPetal = createSpiderPetalGeometry(1);
      const spiderStamenCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(0, 0.34, 0.1),
        new THREE.Vector3(0, 0.74, 0.4),
        new THREE.Vector3(0, 0.92, 0.76),
        new THREE.Vector3(0, 0.88, 1.06)
      ]);
      const spiderStamenGeometry = new THREE.TubeGeometry(spiderStamenCurve, 10, 0.011, 4, false);
      const lowStamen = new THREE.TubeGeometry(spiderStamenCurve, 3, 0.016, 2, false);
      const spiderAntherGeometry = new THREE.SphereGeometry(0.035, 6, 4);
      const spiderCenterGeometry = new THREE.SphereGeometry(0.085, 8, 6);
      const LYCORIS_COLORS = [0xd0182b, 0xe02a2d, 0xb8121f];
      const spiderStemPaint = paint(0x4f7a32);
      const spiderCenterPaint = paint(0x7a1a14);
      const spiderStamenPaint = paint(0xd23a3a);
      const spiderAntherPaint = paint(0x5a3a12);

      function createSpiderLily(config) {
        const group = new THREE.Group();
        group.position.set(config.x, 0, config.z);
        const curve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(0, 0, 0),
          new THREE.Vector3(config.bendX * 0.18, config.height * 0.35, config.bendZ * 0.18),
          new THREE.Vector3(config.bendX * 0.6, config.height * 0.7, config.bendZ * 0.6),
          new THREE.Vector3(config.bendX, config.height, config.bendZ)
        ]);
        const lp = !!config.lowPoly;
        const far = !!config.far;
        group.add(new THREE.Mesh(new THREE.TubeGeometry(curve, far ? 2 : lp ? 4 : 12, 0.03 * config.scale * (far ? 1.5 : 1), far ? 3 : 4, false), spiderStemPaint));
        const head = new THREE.Group();
        head.position.copy(curve.getPoint(1));
        head.rotation.set(-Math.PI / 2 + config.tilt, 0, config.spin);
        head.scale.setScalar(config.scale);
        const petalPaint = paint(config.color);
        // Umbela: 5–6 florecillas que miran hacia afuera, cada una con 6 tépalos
        // estrechos que se curvan hacia atrás y estambres largos que sobresalen.
        const florets = far ? 3 : lp ? 4 : 5 + (config.seed > 0.5 ? 1 : 0);
        if (!lp && !far) head.add(new THREE.Mesh(spiderCenterGeometry, spiderCenterPaint));
        for (let f = 0; f < florets; f += 1) {
          const floret = new THREE.Group();
          floret.rotation.z = (f / florets) * Math.PI * 2 + config.seed;
          const inner = new THREE.Group();
          inner.rotation.x = -0.95; // inclina la flor hacia afuera
          inner.position.y = 0.06;
          inner.scale.setScalar(0.48);
          for (let i = 0; i < 6; i += 1) {
            const holder = new THREE.Group();
            holder.rotation.z = (i / 6) * Math.PI * 2 + f;
            const petal = new THREE.Mesh(far ? farSpiderPetal : lp ? lowSpiderPetal : spiderPetalGeometry, petalPaint);
            petal.rotation.x = 0.55 + ((i * 7 + f) % 3) * 0.08;
            petal.scale.set(0.9, 0.95, 1);
            holder.add(petal);
            inner.add(holder);
          }
          const stamens = far ? 0 : lp ? 3 : 6;
          for (let i = 0; i < stamens; i += 1) {
            const holder = new THREE.Group();
            holder.rotation.z = Math.PI / 6 + (i / stamens) * Math.PI * 2;
            const stamen = new THREE.Mesh(lp ? lowStamen : spiderStamenGeometry, spiderStamenPaint);
            stamen.rotation.x = -0.35;
            stamen.scale.setScalar(1.55);
            holder.add(stamen);
            if (lp) {
              inner.add(holder);
              continue;
            }
            const anther = new THREE.Mesh(spiderAntherGeometry, spiderAntherPaint);
            anther.position.copy(spiderStamenCurve.getPoint(1)).multiplyScalar(1.55).applyAxisAngle(new THREE.Vector3(1, 0, 0), -0.35);
            holder.add(anther);
            inner.add(holder);
          }
          floret.add(inner);
          head.add(floret);
        }
        group.add(head);
        return bakePlant(group);
      }


      // ---------- DISTRIBUCIÓN DE PLANTAS ----------
      function scatterInArea(count, spacing, test, rMin, rMax, avoid = []) {
        const placed = [];
        let attempts = 0;
        while (placed.length < count && attempts < count * 120) {
          attempts += 1;
          const r = Math.sqrt(rMin * rMin + random() * (rMax * rMax - rMin * rMin));
          const a = random() * Math.PI * 2;
          const x = Math.cos(a) * r;
          const z = Math.sin(a) * r;
          if (!test(x, z)) continue;
          let ok = true;
          for (const p of placed) {
            if ((p.x - x) ** 2 + (p.z - z) ** 2 < spacing * spacing) { ok = false; break; }
          }
          if (ok) {
            for (const p of avoid) {
              if ((p.x - x) ** 2 + (p.z - z) ** 2 < (p.spacing || spacing) ** 2) { ok = false; break; }
            }
          }
          if (ok) placed.push({ x, z });
        }
        return placed;
      }

      // Las flores del centro y de los parterres se juntan en pocas piezas grandes
      // (una por parterre): cientos de flores, pocas llamadas de dibujo.
      const plantBuckets = new Map();
      function registerPlant(group, phase, sway, bucket = "center") {
        const geometry = group.children[0].geometry;
        const { x, z } = group.position;
        geometry.translate(x, 0, z);
        const n = geometry.attributes.position.count;
        const anchor = new Float32Array(n * 4);
        const bloom = new Float32Array(n * 2);
        const glow = new Float32Array(n);
        const delay = Math.hypot(x, z) * 0.12 + random() * 0.6;
        const speed = 0.45 + random() * 0.35;
        const glowBase = lampGlowAt(x, 0.3, z);
        const glowHead = lampGlowAt(x, 1.2, z);
        const posY = geometry.attributes.position;
        for (let i = 0; i < n; i += 1) {
          anchor.set([x, z, phase, sway], i * 4);
          bloom[i * 2] = delay;
          bloom[i * 2 + 1] = speed;
          glow[i] = THREE.MathUtils.lerp(glowBase, glowHead, THREE.MathUtils.clamp(posY.getY(i) / 1.2, 0, 1));
        }
        geometry.setAttribute("aAnchor", new THREE.BufferAttribute(anchor, 4));
        geometry.setAttribute("aBloom", new THREE.BufferAttribute(bloom, 2));
        geometry.setAttribute("aGlow", new THREE.BufferAttribute(glow, 1));
        if (!plantBuckets.has(bucket)) plantBuckets.set(bucket, []);
        plantBuckets.get(bucket).push(geometry);
      }
      function flushPlants() {
        for (const parts of plantBuckets.values()) {
          const mesh = new THREE.Mesh(mergeGeometries(parts, false), flowerMaterial);
          mesh.castShadow = TIER.shadows;
          mesh.receiveShadow = TIER.shadows;
          scene.add(mesh);
          parts.forEach((g) => g.dispose());
        }
        plantBuckets.clear();
      }

      // Macizo central: anillos de color, del rojo intenso al amarillo.
      const centerRings = [
        { rMin: 0, rMax: 0.55, colors: ["red"], spacing: 0.38, height: [1.75, 2.05], scale: [0.44, 0.5] },
        { rMin: 0.55, rMax: 1.35, colors: ["red", "scarlet"], spacing: 0.4, height: [1.5, 1.8], scale: [0.4, 0.46] },
        { rMin: 1.35, rMax: 2.15, colors: ["pink", "blush"], spacing: 0.42, height: [1.25, 1.55], scale: [0.38, 0.43] },
        { rMin: 2.15, rMax: 2.95, colors: ["white", "cream"], spacing: 0.42, height: [1.0, 1.3], scale: [0.35, 0.4] }
      ];
      const centerPoints = [];
      for (const ring of centerRings) {
        const area = Math.PI * (ring.rMax ** 2 - ring.rMin ** 2);
        const target = Math.max(1, Math.round((area / (ring.spacing * ring.spacing * 1.25)) * (lowPower ? 0.7 : 1)));
        const pts = scatterInArea(target, ring.spacing, () => true, ring.rMin, ring.rMax, centerPoints);
        if (ring.rMin === 0 && pts.length === 0) pts.push({ x: 0, z: 0 });
        for (const p of pts) {
          centerPoints.push({ ...p, spacing: ring.spacing });
          const r = Math.hypot(p.x, p.z);
          const lean = 0.12 + r * 0.05;
          const height = THREE.MathUtils.lerp(ring.height[0], ring.height[1], random());
          const colorName = ring.colors[Math.floor(random() * ring.colors.length)];
          const seed = random();
          const group = createTulip({
            x: p.x,
            z: p.z,
            height,
            scale: THREE.MathUtils.lerp(ring.scale[0], ring.scale[1], random()),
            tilt: 0.05 + random() * 0.15,
            bendX: (p.x / (r || 1)) * lean + (random() - 0.5) * 0.12,
            bendZ: (p.z / (r || 1)) * lean + (random() - 0.5) * 0.12,
            spin: random() * Math.PI * 2,
            color: TULIP_COLORS[colorName],
            seed,
            detail: !lowPower && ring.rMin < 1,
            lowPoly: lowPower,
            open: 0.15 + random() * 0.35
          });
          registerPlant(group, seed * Math.PI * 2, 1);
        }
      }

      // Parterres exteriores, uno por especie.
      // Alternan lirios araña rojos con tulipanes en manchas de color: cálidos, claros y morados.
      const bedTest = (index) => (x, z) => inBed(x, z, 0.12) === index;

      function tulipBed(index, palette) {
        const pts = scatterInArea(Math.round(85 * Q), lowPower ? 0.45 : 0.36, bedTest(index), GARDEN.bedInner, GARDEN.bedOuter);
        for (const p of pts) {
          const seed = random();
          // drifts: el color depende de la posición para formar manchas naturales
          const drift = fbm(p.x * 0.45 + index * 3, p.z * 0.45);
          const colorName = palette[Math.min(palette.length - 1, Math.floor(drift * palette.length * 1.15))];
          const r = Math.hypot(p.x, p.z);
          const depth = (r - GARDEN.bedInner) / (GARDEN.bedOuter - GARDEN.bedInner);
          registerPlant(
            createTulip({
              x: p.x,
              z: p.z,
              height: 0.95 + depth * 0.45 + random() * 0.25,
              scale: 0.33 + random() * 0.07,
              tilt: 0.05 + random() * 0.2,
              bendX: (random() - 0.5) * 0.3,
              bendZ: (random() - 0.5) * 0.3,
              spin: random() * Math.PI * 2,
              color: TULIP_COLORS[colorName],
              seed,
              detail: false,
              lowPoly: lowPower
            }),
            seed * Math.PI * 2,
            1.1,
            "bed" + index
          );
        }
      }

      function lycorisBed(index) {
        const pts = scatterInArea(Math.round(80 * Q), lowPower ? 0.46 : 0.36, bedTest(index), GARDEN.bedInner, GARDEN.bedOuter);
        for (const p of pts) {
          const seed = random();
          const r = Math.hypot(p.x, p.z);
          const depth = (r - GARDEN.bedInner) / (GARDEN.bedOuter - GARDEN.bedInner);
          registerPlant(
            createSpiderLily({
              x: p.x,
              z: p.z,
              height: 0.85 + depth * 0.35 + random() * 0.25,
              scale: 0.3 + random() * 0.06,
              tilt: 0.12 + random() * 0.25,
              bendX: (random() - 0.5) * 0.35,
              bendZ: (random() - 0.5) * 0.35,
              spin: random() * Math.PI * 2,
              color: LYCORIS_COLORS[Math.floor(random() * LYCORIS_COLORS.length)],
              seed,
              lowPoly: lowPower
            }),
            seed * Math.PI * 2,
            1.25,
            "bed" + index
          );
        }
      }

      const grassClumpGeometry = createGrassClumpGeometry();
      const coverMaterial = enhance(lit({ vertexColors: true, roughness: 0.85, side: THREE.DoubleSide }), { wind: { amp: 0.05, height: 0.45 } });

      lycorisBed(0);
      tulipBed(1, ["yellow", "apricot", "orange", "scarlet"]);
      lycorisBed(2);
      tulipBed(3, ["white", "cream", "blush", "pink"]);
      lycorisBed(4);
      tulipBed(5, ["lilac", "purple", "night", "pink"]);
      flushPlants();

      // Cobertura verde baja entre las flores para que los parterres se vean llenos
      {
        const cover = scatterInArea(
          Math.round(1500 * Q),
          0.22,
          (x, z) => inBed(x, z, 0.05) !== null,
          0,
          GARDEN.bedOuter
        ).map((p) => ({ x: p.x, z: p.z, s: 1.2 + random() * 0.6, sy: 0.9 + random() * 0.4, yaw: random() * 6, shade: 0.6 + random() * 0.25 }));
        chunkedInstances(grassClumpGeometry, coverMaterial, cover, { chunk: 9, glowY: 0.2, cull: "grass" });
      }


      // ---------- CAMPOS GRANDES (instanciados) ----------
      // Variantes horneadas de cada flor; cada campo usa miles de copias.
      const fieldFlowerMaterial = enhance(makeFlowerMaterial(), { wind: { amp: 0.05, height: 1.3 } });
      function tulipVariant(colorHex, seed, far = false) {
        const rnd = seededRandom(Math.floor(seed * 100000) + 7);
        return createTulip({
          x: 0, z: 0,
          height: 1.0,
          scale: 0.36,
          tilt: 0.05 + rnd() * 0.15,
          bendX: (rnd() - 0.5) * 0.2,
          bendZ: (rnd() - 0.5) * 0.2,
          spin: rnd() * Math.PI * 2,
          color: colorHex,
          seed,
          detail: false,
          lowPoly: true,
          far,
          open: 0.15 + rnd() * 0.3
        }).children[0].geometry;
      }
      function lilyVariant(colorHex, seed, far = false) {
        const rnd = seededRandom(Math.floor(seed * 100000) + 11);
        return createSpiderLily({
          x: 0, z: 0,
          height: 1.0,
          scale: 0.3,
          tilt: 0.12 + rnd() * 0.2,
          bendX: (rnd() - 0.5) * 0.25,
          bendZ: (rnd() - 0.5) * 0.25,
          spin: rnd() * Math.PI * 2,
          color: colorHex,
          seed,
          lowPoly: true,
          far
        }).children[0].geometry;
      }

      // Franjas de colores de los campos de tulipanes (estilo Keukenhof)
      const STRIPE_PALETTE = ["red", "yellow", "pink", "white", "orange", "purple", "scarlet", "blush", "apricot", "lilac", "cream", "night"];
      {
        const variants = {};
        for (const name of STRIPE_PALETTE) {
          variants[name] = [0, 1, 2].map((k) => {
            const seed = 0.13 + k * 0.29 + name.length * 0.01;
            return { near: tulipVariant(TULIP_COLORS[name], seed), far: tulipVariant(TULIP_COLORS[name], seed, true) };
          });
        }
        const items = {};
        const stepX = lowPower ? 0.5 : 0.36;
        const rows = lowPower ? 2 : 3;
        const maxR = lowPower ? 28 : GARDEN.tulipField[1];
        for (let zi = 0; zi * STRIPE < maxR; zi += 1) {
          for (const sign of [-1, 1]) {
            const stripeZ = zi * STRIPE;
            // las franjas de cada cuadrante tienen su propio orden de colores
            for (const sx of [-1, 1]) {
              const quadrant = (sign > 0 ? 0 : 2) + (sx > 0 ? 0 : 1);
              const name = STRIPE_PALETTE[(zi + quadrant * 3) % STRIPE_PALETTE.length];
              for (let row = 0; row < rows; row += 1) {
                const zLocal = 0.22 + (row + 0.5) * ((STRIPE_SOIL - 0.44) / rows);
                const z = sign * (stripeZ + zLocal);
                for (let x = GARDEN.avenueHalf + 1.6; x < maxR; x += stepX) {
                  const jx = sx * (x + (random() - 0.5) * stepX * 0.5);
                  const jz = z + (random() - 0.5) * 0.12;
                  if (tulipStripe(jx, jz, 0.1) < 0 || Math.hypot(jx, jz) > maxR) continue;
                  const v = Math.floor(random() * 3);
                  const key = name + v;
                  if (!items[key]) items[key] = { geometry: variants[name][v], list: [] };
                  items[key].list.push({
                    x: jx,
                    z: jz,
                    s: 0.9 + random() * 0.25,
                    sy: 0.85 + random() * 0.35,
                    yaw: random() * Math.PI * 2,
                    tiltX: (random() - 0.5) * 0.08,
                    tiltZ: (random() - 0.5) * 0.08,
                    shade: 0.88 + random() * 0.18
                  });
                }
              }
            }
          }
        }
        for (const entry of Object.values(items)) {
          chunkedInstances(entry.geometry.near, fieldFlowerMaterial, entry.list, { chunk: 16, far: entry.geometry.far, glowY: 0.9 });
        }
      }

      // Praderas de lirios araña: manchas naturales entre el césped
      {
        const variants = LYCORIS_COLORS.flatMap((c, i) => [0.2 + i * 0.17, 0.61 + i * 0.11].map((seed) => ({ near: lilyVariant(c, seed), far: lilyVariant(c, seed, true) })));
        const lists = variants.map(() => []);
        const target = Math.round(2600 * Q);
        let placed = 0;
        let guard = 0;
        const [r0, r1] = GARDEN.lilyField;
        while (placed < target && guard < target * 30) {
          guard += 1;
          const r = Math.sqrt(r0 * r0 + random() * (r1 * r1 - r0 * r0));
          const a = random() * Math.PI * 2;
          const x = Math.cos(a) * r;
          const z = Math.sin(a) * r;
          if (onPath(x, z, 0.6)) continue;
          const patch = fbm(x * 0.09 + 3, z * 0.09 - 5);
          if (patch < 0.47 || random() > (patch - 0.4) * 2.2) continue;
          const k = Math.floor(random() * variants.length);
          lists[k].push({
            x, z,
            s: 0.95 + random() * 0.3,
            sy: 0.85 + random() * 0.35,
            yaw: random() * Math.PI * 2,
            tiltX: (random() - 0.5) * 0.12,
            tiltZ: (random() - 0.5) * 0.12,
            shade: 0.85 + random() * 0.2
          });
          placed += 1;
        }
        variants.forEach((g, k) => chunkedInstances(g.near, fieldFlowerMaterial, lists[k], { chunk: 18, far: g.far, glowY: 0.9 }));
      }

      // ---------- FAROLES ----------
      const lampGlowUniforms = { uScale: { value: 400 }, uFogFar: { value: TIER.fog[1] } };
      {
        // farol victoriano de parque: zócalo, poste con anillos, linterna con
        // marco de hierro y cristal esmerilado, tejadillo y remate
        const metal = [];
        const add = (g, y = 0) => { g.translate(0, y, 0); metal.push(g); };
        add(new THREE.CylinderGeometry(0.15, 0.2, 0.3, 8), 0.15);
        add(new THREE.CylinderGeometry(0.11, 0.15, 0.08, 8), 0.34);
        add(new THREE.CylinderGeometry(0.038, 0.055, LAMP_HEIGHT - 0.6, 8), (LAMP_HEIGHT - 0.6) / 2 + 0.36);
        for (const y of [0.62, 1.55]) add(new THREE.CylinderGeometry(0.065, 0.065, 0.05, 8), y);
        add(new THREE.CylinderGeometry(0.14, 0.045, 0.16, 8), LAMP_HEIGHT - 0.3);
        add(new THREE.BoxGeometry(0.3, 0.035, 0.3), LAMP_HEIGHT - 0.2);
        add(new THREE.BoxGeometry(0.38, 0.035, 0.38), LAMP_HEIGHT + 0.2);
        for (const [cx, cz] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) {
          const post = new THREE.BoxGeometry(0.022, 0.42, 0.022);
          post.translate(cx * 0.14, LAMP_HEIGHT, cz * 0.14);
          metal.push(post);
        }
        const roof = new THREE.ConeGeometry(0.27, 0.2, 4);
        roof.rotateY(Math.PI / 4);
        add(roof, LAMP_HEIGHT + 0.32);
        add(new THREE.CylinderGeometry(0.03, 0.05, 0.08, 6), LAMP_HEIGHT + 0.45);
        add(new THREE.SphereGeometry(0.04, 6, 4), LAMP_HEIGHT + 0.52);
        const metalGeometry = mergeGeometries(metal.map((g) => {
          g.deleteAttribute("uv");
          return g.index ? g.toNonIndexed() : g;
        }), false);
        // cristal: más caliente y brillante en el centro, donde está la bombilla
        const glassGeometry = new THREE.CylinderGeometry(0.175, 0.13, 0.38, 4, 2, true);
        glassGeometry.rotateY(Math.PI / 4);
        glassGeometry.translate(0, LAMP_HEIGHT, 0);
        {
          const pos = glassGeometry.attributes.position;
          const colors = [];
          for (let i = 0; i < pos.count; i += 1) {
            const t = 1 - Math.abs(pos.getY(i) - LAMP_HEIGHT) / 0.19;
            colors.push(0.72 + t * 0.45, 0.3 + t * 0.22, 0.07 + t * 0.04);
          }
          glassGeometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
        }
        const metalMaterial = enhance(lit({ color: 0x1b1e23, roughness: 0.4, metalness: 0.65 }));
        const glassMaterial = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide, fog: true });
        const items = lampPositions.map((p) => ({ x: p.x, z: p.z, s: 1, yaw: Math.atan2(p.x, p.z) }));
        chunkedInstances(metalGeometry, metalMaterial, items, { chunk: 20, castShadow: true, glowY: 1.2, cull: "lamp" });
        chunkedInstances(glassGeometry, glassMaterial, items, { chunk: 20, cull: "lamp" });

        // Resplandor de todas las linternas en UNA sola pieza (puntos con halo)
        const positions = new Float32Array(lampPositions.length * 3);
        lampPositions.forEach((p, i) => positions.set([p.x, LAMP_HEIGHT, p.z], i * 3));
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        const material = new THREE.ShaderMaterial({
          uniforms: lampGlowUniforms,
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          vertexShader: `
            uniform float uScale; uniform float uFogFar;
            varying float vFade;
            void main() {
              vec4 mv = modelViewMatrix * vec4(position, 1.0);
              float d = -mv.z;
              // las lejanas siguen viéndose como puntitos de luz entre la bruma
              vFade = mix(1.0, 0.45, smoothstep(10.0, uFogFar, d));
              gl_PointSize = clamp(1.9 * uScale / d, 3.0, 380.0);
              gl_Position = projectionMatrix * mv;
            }
          `,
          fragmentShader: `
            varying float vFade;
            void main() {
              float d = length(gl_PointCoord - 0.5) * 2.0;
              float core = exp(-d * d * 28.0);
              float halo = exp(-d * d * 5.0) * 0.32 + max(0.0, 1.0 - d) * 0.05;
              vec3 col = vec3(1.0, 0.7, 0.38) * core * 0.55 + vec3(1.0, 0.55, 0.22) * halo;
              gl_FragColor = vec4(col * vFade, 1.0);
              #include <tonemapping_fragment>
              #include <colorspace_fragment>
            }
          `
        });
        const glows = new THREE.Points(geometry, material);
        glows.frustumCulled = false;
        scene.add(glows);
      }
      // En computador, luces reales en los faroles más cercanos (en celular su luz ya está precalculada)
      const lampLights = [];
      for (let i = 0; i < TIER.lampLights; i += 1) {
        const light = new THREE.PointLight(0xffb46a, 4, 8, 1.8);
        light.position.set(0, -50, 0);
        scene.add(light);
        lampLights.push(light);
      }
      function updateLampLights(center) {
        if (!lampLights.length) return;
        const sorted = lampPositions
          .map((p) => ({ p, d: (p.x - center.x) ** 2 + (p.z - center.z) ** 2 }))
          .sort((a, b) => a.d - b.d);
        lampLights.forEach((light, i) => {
          const entry = sorted[i];
          if (entry) light.position.set(entry.p.x, LAMP_HEIGHT - 0.05, entry.p.z);
        });
      }

      // ---------- LUCIÉRNAGAS ----------
      const particleUniforms = {
        uTime: { value: 0 },
        uPixelRatio: { value: renderer.getPixelRatio() }
      };
      {
        const count = Math.round(700 * Q);
        const positions = new Float32Array(count * 3);
        const seeds = new Float32Array(count * 4);
        for (let i = 0; i < count; i += 1) {
          const r = 2 + Math.sqrt(random()) * 58;
          const a = random() * Math.PI * 2;
          positions[i * 3] = Math.cos(a) * r;
          positions[i * 3 + 1] = 0.25 + Math.pow(random(), 1.5) * 2.4;
          positions[i * 3 + 2] = Math.sin(a) * r;
          seeds[i * 4] = random();
          seeds[i * 4 + 1] = random();
          seeds[i * 4 + 2] = random();
          seeds[i * 4 + 3] = random();
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute("seed", new THREE.BufferAttribute(seeds, 4));
        const material = new THREE.ShaderMaterial({
          uniforms: particleUniforms,
          transparent: true,
          depthWrite: false,
          blending: THREE.AdditiveBlending,
          vertexShader: `
            attribute vec4 seed;
            uniform float uTime; uniform float uPixelRatio;
            varying float vFlash;
            void main() {
              vec3 p = position;
              float t = uTime;
              float s1 = 0.18 + seed.x * 0.25;
              p.x += sin(t * s1 + seed.y * 6.28) * 0.9 + sin(t * s1 * 2.3 + seed.z * 9.0) * 0.25;
              p.z += cos(t * s1 * 0.85 + seed.z * 6.28) * 0.9 + cos(t * s1 * 1.9 + seed.w * 7.0) * 0.25;
              p.y += sin(t * s1 * 1.4 + seed.w * 6.28) * 0.35;
              // destello real: encendido corto, luego varios segundos apagado
              float cycle = fract(t / (2.2 + seed.w * 3.0) + seed.x);
              float flash = smoothstep(0.0, 0.06, cycle) * (1.0 - smoothstep(0.08, 0.32, cycle));
              vFlash = flash + 0.06;
              vec4 mv = modelViewMatrix * vec4(p, 1.0);
              gl_PointSize = 0.5 * uPixelRatio * (300.0 / -mv.z);
              gl_Position = projectionMatrix * mv;
            }
          `,
          fragmentShader: `
            varying float vFlash;
            void main() {
              float d = length(gl_PointCoord - 0.5);
              float core = exp(-d * d * 260.0);
              float halo = exp(-d * d * 18.0) * 0.4;
              float a = (core + halo) * vFlash;
              vec3 col = vec3(0.8, 1.0, 0.4) * (core * 3.0 + halo);
              gl_FragColor = vec4(col * vFlash, clamp(a, 0.0, 1.0));
              #include <tonemapping_fragment>
              #include <colorspace_fragment>
            }
          `
        });
        scene.add(new THREE.Points(geometry, material));
      }

      // ---------- POSTPROCESO ----------
      let composer = null;
      if (!lowPower) {
        composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.55, 0.6, 0.82));
        composer.addPass(new OutputPass());
      }

      // ---------- CONTROLES: MIRAR Y CAMINAR ----------
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.07;
      controls.enablePan = false;
      controls.rotateSpeed = 0.6;
      controls.zoomSpeed = 0.8;
      controls.minDistance = 2.5;
      controls.maxDistance = 24;
      controls.minPolarAngle = 0.3;
      // se puede inclinar la vista hacia arriba para mirar el cielo
      controls.maxPolarAngle = Math.PI * 0.56;
      controls.target.set(0, 1.9, 0);
      controls.autoRotateSpeed = 0.3;
      controls.update();

      let isPaused = reduceMotion;
      let idleTimer = null;

      function setMotionState(paused) {
        isPaused = paused;
        controls.autoRotate = false;
        motionToggle.setAttribute("aria-label", paused ? "Reanudar movimiento" : "Pausar movimiento");
        motionToggle.title = paused ? "Reanudar movimiento" : "Pausar movimiento";
        pauseIcon.innerHTML = paused
          ? '<path d="m8 5 11 7-11 7V5Z"/>'
          : '<path d="M8 5v14M16 5v14"/>';
      }
      setMotionState(isPaused);

      motionToggle.addEventListener("click", () => setMotionState(!isPaused));

      function hideHint() {
        gestureHint.style.opacity = "0";
        gestureHint.style.transform = "translateY(8px)";
      }
      controls.addEventListener("start", hideHint);
      setTimeout(hideHint, 12000);

      // Teclado: WASD o flechas para caminar, Shift para ir más rápido
      const keys = new Set();
      window.addEventListener("keydown", (e) => {
        if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
        if (document.querySelector(".full-screen-overlay.active")) return;
        const k = e.key.toLowerCase();
        if (["w", "a", "s", "d", "arrowup", "arrowdown", "arrowleft", "arrowright", "shift"].includes(k)) {
          keys.add(k);
          if (k.startsWith("arrow")) e.preventDefault();
          hideHint();
        }
      });
      window.addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
      window.addEventListener("blur", () => keys.clear());

      // Control táctil: joystick para caminar
      const stick = { x: 0, y: 0, active: false, id: null };
      if (joystick && joystickKnob) {
        const radius = 42;
        const moveKnob = (e) => {
          const rect = joystick.getBoundingClientRect();
          let dx = e.clientX - (rect.left + rect.width / 2);
          let dy = e.clientY - (rect.top + rect.height / 2);
          const len = Math.hypot(dx, dy);
          if (len > radius) { dx *= radius / len; dy *= radius / len; }
          stick.x = dx / radius;
          stick.y = -dy / radius;
          joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
        };
        joystick.addEventListener("pointerdown", (e) => {
          stick.active = true;
          stick.id = e.pointerId;
          joystick.setPointerCapture(e.pointerId);
          joystick.classList.add("active");
          moveKnob(e);
          hideHint();
        });
        joystick.addEventListener("pointermove", (e) => { if (stick.active && e.pointerId === stick.id) moveKnob(e); });
        const release = () => {
          stick.active = false;
          stick.x = stick.y = 0;
          joystickKnob.style.transform = "translate(0px, 0px)";
          joystick.classList.remove("active");
        };
        joystick.addEventListener("pointerup", release);
        joystick.addEventListener("pointercancel", release);
      }

      const forward = new THREE.Vector3();
      const right = new THREE.Vector3();
      const step = new THREE.Vector3();
      function walk(delta) {
        let mx = stick.x, my = stick.y;
        if (keys.has("w") || keys.has("arrowup")) my += 1;
        if (keys.has("s") || keys.has("arrowdown")) my -= 1;
        if (keys.has("a") || keys.has("arrowleft")) mx -= 1;
        if (keys.has("d") || keys.has("arrowright")) mx += 1;
        const len = Math.hypot(mx, my);
        if (len < 0.05) return false;
        if (len > 1) { mx /= len; my /= len; }
        camera.getWorldDirection(forward);
        forward.y = 0;
        forward.normalize();
        right.crossVectors(forward, camera.up).normalize();
        const speed = keys.has("shift") ? 9 : 4.2;
        step.copy(forward).multiplyScalar(my * speed * delta).addScaledVector(right, mx * speed * delta);
        const next = controls.target.clone().add(step);
        const r = Math.hypot(next.x, next.z);
        if (r > GARDEN.edge) {
          // no salir del jardín: se desliza por el borde
          next.x *= GARDEN.edge / r;
          next.z *= GARDEN.edge / r;
          step.subVectors(next, controls.target);
        }
        controls.target.add(step);
        camera.position.add(step);
        return true;
      }

      function resize() {
        const width = window.innerWidth;
        const height = window.innerHeight;
        const aspect = width / height;
        camera.aspect = aspect;
        camera.fov = aspect < 1 ? Math.min(80, 50 * Math.pow(1 / aspect, 0.45)) : 50;
        camera.updateProjectionMatrix();
        renderer.setPixelRatio(pixelRatio);
        renderer.setSize(width, height);
        lampGlowUniforms.uScale.value = (height * pixelRatio) / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
        particleUniforms.uPixelRatio.value = renderer.getPixelRatio();
        starUniforms.uPixelRatio.value = renderer.getPixelRatio();
        if (composer) {
          composer.setPixelRatio(renderer.getPixelRatio());
          composer.setSize(width, height);
        }
      }

      window.addEventListener("resize", resize, { passive: true });
      window.addEventListener("orientationchange", () => window.setTimeout(resize, 120));
      resize();

      const clock = new THREE.Clock();
      let elapsed = 0;
      let bloomClock = 0;
      let lampTimer = 0;
      let cullTimer = 0;
      const lastLampCenter = new THREE.Vector3(1e9, 0, 0);

      // Calidad adaptable: mide los FPS reales y ajusta la resolución (y si hace
      // falta, la distancia de detalle) para que nunca se trabe.
      let detailScale = 1;
      const perf = { time: 0, frames: 0, good: 0, warm: 2.5 };
      function adaptQuality(delta) {
        const dt = clock.lastRaw || delta;
        if (dt > 0.5) { perf.time = 0; perf.frames = 0; return; } // pestaña oculta o reproductor abierto
        perf.time += dt;
        perf.frames += 1;
        if (perf.time < 1.2) return;
        const fps = perf.frames / perf.time;
        perf.time = 0;
        perf.frames = 0;
        if (perf.warm > 0) { perf.warm -= 1.2; return; } // ignora los primeros segundos
        if (fps < 45) {
          perf.good = 0;
          if (pixelRatio > minPixelRatio + 0.01) {
            pixelRatio = Math.max(minPixelRatio, pixelRatio - (fps < 30 ? 0.2 : 0.1));
            resize();
          } else if (detailScale > 0.55) {
            detailScale = Math.max(0.55, detailScale - 0.15);
            cullTimer = 0;
          }
        } else if (fps > 57) {
          perf.good += 1;
          if (perf.good >= 3) {
            perf.good = 0;
            if (detailScale < 1) {
              detailScale = Math.min(1, detailScale + 0.15);
              cullTimer = 0;
            } else if (pixelRatio < maxPixelRatio - 0.01) {
              pixelRatio = Math.min(maxPixelRatio, pixelRatio + 0.1);
              resize();
            }
          }
        } else {
          perf.good = 0;
        }
      }

      function animate() {
        requestAnimationFrame(animate);

        // No renderizar mientras el reproductor cubre la escena (ahorra batería)
        const isOverlayActive =
          document.getElementById("playlistOverlay")?.classList.contains("active") ||
          document.getElementById("musicOverlay")?.classList.contains("active");
        const rawDelta = clock.getDelta();
        clock.lastRaw = rawDelta;
        const delta = Math.min(rawDelta, 0.05);
        if (isOverlayActive) return;

        if (!isPaused) elapsed += delta;
        bloomClock += delta;
        windUniforms.uTime.value = elapsed;
        particleUniforms.uTime.value = elapsed;
        skyUniforms.uTime.value = elapsed;
        starUniforms.uTime.value = elapsed;

        walk(delta);

        const wind = Math.sin(elapsed * 0.18) * 0.5 + 0.5;
        plantUniforms.uSway.value = (0.018 + 0.016 * wind) * (isPaused ? 0 : 1);
        plantUniforms.uBloomTime.value = bloomClock;

        controls.update();
        // la cámara nunca baja del suelo
        const minY = groundHeight(camera.position.x, camera.position.z) + 0.45;
        if (camera.position.y < minY) camera.position.y = minY;

        // el cielo acompaña a la cámara, como en la realidad
        skyGroup.position.copy(camera.position);

        // sombras de la luna y faroles alrededor de donde estás
        moonLight.target.position.copy(controls.target).setY(0);
        moonLight.position.copy(moonLight.target.position).addScaledVector(moonLightDir, 45);
        lampTimer -= delta;
        if (lampTimer <= 0 || lastLampCenter.distanceToSquared(controls.target) > 4) {
          lampTimer = 0.4;
          lastLampCenter.copy(controls.target);
          updateLampLights(controls.target);
        }
        // solo se dibuja lo que está cerca: la niebla oculta lo lejano
        cullTimer -= delta;
        if (cullTimer <= 0) {
          cullTimer = 0.25;
          const cullFor = { flower: TIER.flowerCull * detailScale, grass: TIER.grassCull * detailScale, lamp: 140 };
          const lod = TIER.lodNear * detailScale;
          for (const entry of chunkedMeshes) {
            const d = Math.hypot(entry.center.x - camera.position.x, entry.center.z - camera.position.z) - entry.radius;
            const visible = d < cullFor[entry.cull];
            if (entry.farMesh) {
              const near = d < lod;
              entry.mesh.visible = visible && near;
              entry.farMesh.visible = visible && !near;
            } else {
              entry.mesh.visible = visible;
            }
          }
        }
        adaptQuality(delta);

        if (composer) composer.render();
        else renderer.render(scene, camera);
      }
      // la pantalla de inicio se queda al menos un momento para que se vea
      requestAnimationFrame(() => setTimeout(hideSplash, Math.max(500, 2400 - performance.now())));

      let currentSongIndex = 0;
      let isShuffle = false;
      let isLoop = false;
      let seeking = false;
      let userPicked = false;

      // Cada canción se identifica por el video de YouTube del que viene su audio
      for (const song of playlist) {
        const m = song.src.match(/([A-Za-z0-9_-]{11})\.m4a$/);
        song.id = m ? m[1] : null;
      }

      // ----- Títulos reales desde la API oEmbed de YouTube -----
      // El audio de cada canción es el de su video, así que el título que devuelve
      // YouTube para ese video es el correcto. Se guarda para no pedirlo otra vez.
      let metaCache = {};
      try { metaCache = JSON.parse(localStorage.getItem(META_KEY) || '{}') || {}; } catch (e) {}
      const saveMeta = (() => {
        let t = null;
        return () => {
          clearTimeout(t);
          t = setTimeout(() => { try { localStorage.setItem(META_KEY, JSON.stringify(metaCache)); } catch (e) {} }, 800);
        };
      })();
      function cleanArtist(author) {
        return (author || '').replace(/\s*-\s*Topic$/i, '').replace(/VEVO$/i, '').replace(/\s*(official|oficial)$/i, '').trim();
      }
      function cleanTitle(title, artist) {
        let t = ' ' + title + ' ';
        // etiquetas que no son parte del nombre de la canción
        t = t.replace(/[\(\[][^\)\]]*(oficial|official|video|vídeo|audio|lyric|letra|visuali[sz]er|4k|hd|prod\.?|en vivo)[^\)\]]*[\)\]]/gi, ' ');
        t = t.replace(/\b(video|vídeo)\s+(oficial|official)\b/gi, ' ').replace(/\bofficial\s+(music\s+)?video\b/gi, ' ');
        t = t.replace(/[|｜].*$/, ' ');
        // "Penyair - Canción" -> "Canción"
        if (artist) {
          const esc = artist.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          t = t.replace(new RegExp('^\\s*' + esc + '\\s*[-–—:]\\s*', 'i'), ' ');
        }
        t = t.replace(/^\s*penyair\s*[-–—:]\s*/i, ' ').replace(/\s*[-–—]\s*penyair\s*$/i, ' ');
        t = t.replace(/\s{2,}/g, ' ').replace(/^[\s\-–—:]+|[\s\-–—:]+$/g, '');
        return t || title.trim();
      }
      function applyMeta(song) {
        const meta = song.id && metaCache[song.id];
        if (!meta || !meta.title) return false;
        const artist = cleanArtist(meta.author) || song.artist;
        song.title = cleanTitle(meta.title, artist);
        song.artist = artist;
        return true;
      }
      playlist.forEach(applyMeta);

      function timeoutSignal(ms) {
        if (window.AbortSignal && AbortSignal.timeout) return AbortSignal.timeout(ms);
        return undefined;
      }
      async function fetchMeta(id) {
        const target = encodeURIComponent('https://www.youtube.com/watch?v=' + id);
        const sources = [];
        if (location.protocol.startsWith('http')) sources.push('/api/oembed/' + id);
        sources.push('https://www.youtube.com/oembed?url=' + target + '&format=json');
        sources.push('https://noembed.com/embed?url=' + target);
        for (const url of sources) {
          try {
            const res = await fetch(url, { signal: timeoutSignal(7000) });
            if (!res.ok) continue;
            const data = await res.json();
            if (data && data.title) return { title: data.title, author: data.author_name || '', t: Date.now() };
          } catch (e) {}
        }
        return null;
      }
      let metaStarted = false;
      async function refreshAllMeta() {
        if (metaStarted) return;
        metaStarted = true;
        const WEEK = 7 * 24 * 3600 * 1000;
        const order = [currentSongIndex, ...playlist.keys()];
        const pending = [...new Set(order)].filter((i) => {
          const m = playlist[i].id && metaCache[playlist[i].id];
          return playlist[i].id && (!m || Date.now() - (m.t || 0) > WEEK);
        });
        let failures = 0;
        const worker = async () => {
          while (pending.length && failures < 6) {
            const i = pending.shift();
            const song = playlist[i];
            const meta = await fetchMeta(song.id);
            if (!meta) { failures += 1; continue; }
            failures = 0;
            metaCache[song.id] = meta;
            saveMeta();
            if (applyMeta(song)) refreshSongViews(i);
          }
        };
        await Promise.all([worker(), worker(), worker(), worker()]);
      }
      function refreshSongViews(index) {
        const song = playlist[index];
        const li = playlistItemsContainer && playlistItemsContainer.querySelector('[data-index="' + index + '"]');
        if (li) {
          li.querySelector('.playlist-item-title').textContent = song.title;
          li.querySelector('.playlist-item-artist').textContent = song.artist;
        }
        if (index === currentSongIndex) {
          songTitle.textContent = song.title;
          songArtist.textContent = song.artist;
          updateNowPlaying();
          updateMediaSession();
        }
      }

      // ----- Estado guardado -----
      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ src: playlist[currentSongIndex].src, time: audioPlayer.currentTime || 0, shuffle: isShuffle, loop: isLoop }));
        } catch (e) {}
      }
      function readState() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (e) { return null; }
      }
      // Búsqueda sin importar tildes ni mayúsculas
      const normalize = (text) => text.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
      const coverUrl = (song) => 'url("' + song.cover + '")';
      const fmt = (t) => {
        if (!isFinite(t) || t < 0) return '0:00';
        const m = Math.floor(t / 60);
        const sec = Math.floor(t % 60);
        return m + ':' + (sec < 10 ? '0' : '') + sec;
      };

      function updateNowPlaying() {
        if (!nowPlayingBtn) return;
        const song = playlist[currentSongIndex];
        nowPlayingTitle.textContent = song.title;
        nowPlayingCover.style.backgroundImage = coverUrl(song);
        const started = userPicked || !audioPlayer.paused || audioPlayer.currentTime > 0;
        nowPlayingBtn.classList.toggle('visible', started);
        nowPlayingBtn.classList.toggle('playing', !audioPlayer.paused);
      }
      function updateMediaSession() {
        if (!('mediaSession' in navigator)) return;
        const song = playlist[currentSongIndex];
        try {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: song.title,
            artist: song.artist,
            album: 'Para ti',
            artwork: [{ src: song.cover, sizes: '480x360', type: 'image/jpeg' }]
          });
        } catch (e) {}

          play: () => playAudio(),
          pause: () => audioPlayer.pause(),
          previoustrack: () => prevSong(),
          nexttrack: () => nextSong(false),
          seekbackward: () => { audioPlayer.currentTime = Math.max(0, audioPlayer.currentTime - 10); },
          seekforward: () => { audioPlayer.currentTime = Math.min(audioPlayer.duration || 0, audioPlayer.currentTime + 10); }
        };
        for (const [action, fn] of Object.entries(handlers)) {
          try { navigator.mediaSession.setActionHandler(action, fn); } catch (e) {}
        }
      }

      // ----- Abrir y cerrar pantallas -----
      function openOverlay(overlay) {
        for (const o of [playlistOverlay, musicOverlay]) o.classList.toggle('active', o === overlay);
        const menu = $('topMenuPanel');
        if (menu) menu.classList.remove('active');
      }
      function closeOverlays() {
        playlistOverlay.classList.remove('active');
        musicOverlay.classList.remove('active');
      }
      const openMusicBtn = $('openMusicBtn');
      if (openMusicBtn) {
        openMusicBtn.addEventListener('click', (e) => {
          e.preventDefault();
          openOverlay(playlistOverlay);
          refreshAllMeta();
          const active = playlistItemsContainer.querySelector('.active-song');
          if (active) active.scrollIntoView({ block: 'center' });
        });
      }
      $('closePlaylistBtn').addEventListener('click', closeOverlays);
      $('closeMusicBtn').addEventListener('click', () => openOverlay(playlistOverlay));
      $('hidePlayerBtn').addEventListener('click', closeOverlays);
      if (nowPlayingBtn) nowPlayingBtn.addEventListener('click', () => openOverlay(musicOverlay));
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && (playlistOverlay.classList.contains('active') || musicOverlay.classList.contains('active'))) closeOverlays();
      });

      // ----- Reproducción -----
      function loadSong(index) {
        currentSongIndex = index;
        const song = playlist[index];
        songTitle.textContent = song.title;
        songArtist.textContent = song.artist;
        audioPlayer.src = song.src;
        albumArt.style.backgroundImage = coverUrl(song);
        dynamicBg.style.backgroundImage = coverUrl(song);
        if (playlistBg) playlistBg.style.backgroundImage = coverUrl(song);
        progressBar.style.width = '0%';
        currentTimeEl.textContent = '0:00';
        durationTimeEl.textContent = '0:00';
        updateMediaSession();
        updateActivePlaylistSong();
        updateNowPlaying();
      }
      function updateActivePlaylistSong() {
        playlistItemsContainer.querySelectorAll('.playlist-item').forEach((item) => {
          const active = Number(item.dataset.index) === currentSongIndex;
          item.classList.toggle('active-song', active);
          item.classList.toggle('is-playing', active && !audioPlayer.paused);
        });
      }
      function playAudio() {
        // play() devuelve una promesa que falla si el navegador bloquea el audio
        const attempt = audioPlayer.play();
        if (attempt && attempt.catch) attempt.catch(() => updatePlayState());
      }
      function togglePlay() {
        if (audioPlayer.paused) playAudio();
        else audioPlayer.pause();
      }
      const PLAY_PATH = '<path d="M7 4.5v15l13-7.5z"/>';
      const PAUSE_PATH = '<path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z"/>';
      function updatePlayState() {
        const playing = !audioPlayer.paused;
        playIcon.innerHTML = playing ? PAUSE_PATH : PLAY_PATH;
        playBtn.setAttribute('aria-label', playing ? 'Pausar' : 'Reproducir');
        albumArt.classList.toggle('playing', playing);
        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
        updateActivePlaylistSong();
        updateNowPlaying();
        saveState();
      }
      function prevSong() {
        const wasPlaying = !audioPlayer.paused;
        loadSong((currentSongIndex - 1 + playlist.length) % playlist.length);
        if (wasPlaying) playAudio();
      }
      function nextSong(fromEnded) {
        // Repetir solo aplica cuando la canción termina sola; el botón siempre avanza.
        if (isLoop && fromEnded === true) {
          audioPlayer.currentTime = 0;
          playAudio();
          return;
        }
        // Al terminar, el navegador ya marcó el audio como pausado: hay que seguir sonando.
        const wasPlaying = fromEnded === true || !audioPlayer.paused;
        let idx = (currentSongIndex + 1) % playlist.length;
        if (isShuffle && playlist.length > 1) {
          idx = Math.floor(Math.random() * (playlist.length - 1));
          if (idx >= currentSongIndex) idx += 1;
        }
        loadSong(idx);
        if (wasPlaying) playAudio();
      }
      function setToggle(button, on) {
        button.classList.toggle('on', on);
        button.setAttribute('aria-pressed', on ? 'true' : 'false');
      }
      shuffleBtn.addEventListener('click', () => { isShuffle = !isShuffle; setToggle(shuffleBtn, isShuffle); saveState(); });
      loopBtn.addEventListener('click', () => { isLoop = !isLoop; setToggle(loopBtn, isLoop); saveState(); });
      playBtn.addEventListener('click', togglePlay);

      // ----- Barra de progreso: tocar o arrastrar -----
      function showProgress() {
        const d = audioPlayer.duration;
        if (!seeking && isFinite(d) && d > 0) progressBar.style.width = (audioPlayer.currentTime / d) * 100 + '%';
        currentTimeEl.textContent = fmt(audioPlayer.currentTime);
        if (isFinite(d)) durationTimeEl.textContent = fmt(d);
      }
      function seekTo(clientX) {
        const rect = progressContainer.getBoundingClientRect();
        const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
        progressBar.style.width = ratio * 100 + '%';
        if (isFinite(audioPlayer.duration)) {
          audioPlayer.currentTime = ratio * audioPlayer.duration;
          currentTimeEl.textContent = fmt(audioPlayer.currentTime);
        }
      }
      progressContainer.addEventListener('pointerdown', (e) => {
        seeking = true;
        progressContainer.setPointerCapture(e.pointerId);
        seekTo(e.clientX);
      });
      progressContainer.addEventListener('pointermove', (e) => { if (seeking) seekTo(e.clientX); });
      const endSeek = () => { if (!seeking) return; seeking = false; saveState(); };
      progressContainer.addEventListener('pointerup', endSeek);
      progressContainer.addEventListener('pointercancel', endSeek);

      // Toque corto: cambia de canción. Mantener presionado: retrocede o adelanta
      // la canción mientras el dedo siga en el botón; al soltar, se detiene.
      function holdButton(button, onTap, direction) {
        let holdTimer = null;
        let seekTimer = null;
        let held = false;
        let down = false;
        const stop = () => {
          clearTimeout(holdTimer);
          clearInterval(seekTimer);
          holdTimer = seekTimer = null;
          button.classList.remove('holding');
        };
        button.addEventListener('pointerdown', (e) => {
          if (e.button !== undefined && e.button !== 0) return;
          down = true;
          held = false;
          try { button.setPointerCapture(e.pointerId); } catch (err) {}
          holdTimer = setTimeout(() => {
            held = true;
            button.classList.add('holding');
            if (navigator.vibrate) navigator.vibrate(10);
            const tick = () => {
              if (!isFinite(audioPlayer.duration)) return;
              audioPlayer.currentTime = Math.min(Math.max(0, audioPlayer.currentTime + direction * 3), audioPlayer.duration - 0.5);
              showProgress();
            };
            tick();
            seekTimer = setInterval(tick, 150);
          }, 400);
        });
        button.addEventListener('pointerup', () => {
          if (!down) return;
          down = false;
          const wasHeld = held;
          stop();
          if (!wasHeld) onTap();
          else saveState();
        });
        const cancel = () => { down = false; stop(); };
        button.addEventListener('pointercancel', cancel);
        button.addEventListener('lostpointercapture', () => { if (down) { down = false; const wasHeld = held; stop(); if (wasHeld) saveState(); } });
        button.addEventListener('contextmenu', (e) => e.preventDefault());
        // teclado: Enter / Espacio siguen funcionando como un toque
        button.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onTap(); }
        });
      }
      holdButton(prevBtn, () => {
        // como en cualquier reproductor: si ya avanzó, vuelve al inicio de la canción
        if (audioPlayer.currentTime > 4) { audioPlayer.currentTime = 0; showProgress(); return; }
        prevSong();
      }, -1);
      holdButton(nextBtn, () => nextSong(false), 1);

      // ----- Lista -----
      function renderPlaylist(filter) {
        filter = filter || '';
        playlistItemsContainer.innerHTML = '';
        const query = normalize(filter.trim());
        const fragment = document.createDocumentFragment();
        let shown = 0;
        playlist.forEach((song, index) => {
          if (query && !normalize(song.title).includes(query) && !normalize(song.artist).includes(query)) return;
          shown += 1;
          const li = document.createElement('li');
          li.className = 'playlist-item';
          li.dataset.index = index;
          const img = document.createElement('div');
          img.className = 'playlist-item-img';
          img.style.backgroundImage = coverUrl(song);
          const info = document.createElement('div');
          info.className = 'playlist-item-info';
          const titleEl = document.createElement('p');
          titleEl.className = 'playlist-item-title';
          titleEl.textContent = song.title;
          const artistEl = document.createElement('p');
          artistEl.className = 'playlist-item-artist';
          artistEl.textContent = song.artist;
          info.append(titleEl, artistEl);
          const eq = document.createElement('span');
          eq.className = 'playlist-item-eq';
          eq.innerHTML = '<i></i><i></i><i></i>';
          li.append(img, info, eq);
          li.addEventListener('click', () => {
            userPicked = true;
            if (index !== currentSongIndex) loadSong(index);
            if (audioPlayer.paused) playAudio();
            openOverlay(musicOverlay);
          });
          fragment.appendChild(li);
        });
        playlistItemsContainer.appendChild(fragment);
        playlistCount.textContent = query ? shown + ' de ' + playlist.length + ' canciones' : playlist.length + ' canciones';
        if (shown === 0) {
          const empty = document.createElement('li');
          empty.className = 'playlist-empty';
          empty.textContent = 'No encontré esa canción';
          playlistItemsContainer.appendChild(empty);
        }
        updateActivePlaylistSong();
      }
      playlistSearch.addEventListener('input', (e) => renderPlaylist(e.target.value));

      // ----- Eventos del audio -----
      audioPlayer.addEventListener('play', updatePlayState);
      audioPlayer.addEventListener('pause', updatePlayState);
      audioPlayer.addEventListener('timeupdate', showProgress);
      audioPlayer.addEventListener('loadedmetadata', showProgress);
      audioPlayer.addEventListener('ended', () => nextSong(true));
      audioPlayer.addEventListener('waiting', () => loadingSpinner.classList.add('active'));
      for (const ev of ['playing', 'canplay', 'pause', 'error']) {
        audioPlayer.addEventListener(ev, () => loadingSpinner.classList.remove('active'));
      }
      // Barra espaciadora: reproducir/pausar mientras el reproductor está abierto
      document.addEventListener('keydown', (e) => {
        if (e.code !== 'Space' || !musicOverlay.classList.contains('active')) return;
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON')) return;
        e.preventDefault();
        togglePlay();
      });
      let lastSaved = 0;
      audioPlayer.addEventListener('timeupdate', () => {
        if (Date.now() - lastSaved > 5000) { lastSaved = Date.now(); saveState(); }
      });

      renderPlaylist('');
      // Retoma la última canción escuchada, en el mismo punto
      const saved = readState();
      const savedIndex = saved ? playlist.findIndex((song) => song.src === saved.src) : -1;
      if (saved) {
        isShuffle = !!saved.shuffle;
        isLoop = !!saved.loop;
        setToggle(shuffleBtn, isShuffle);
        setToggle(loopBtn, isLoop);
      }
      loadSong(savedIndex >= 0 ? savedIndex : 0);
      if (savedIndex >= 0 && saved.time > 0) {
        audioPlayer.addEventListener('loadedmetadata', () => {
          if (audioPlayer.currentTime === 0 && saved.time < audioPlayer.duration) {
            audioPlayer.currentTime = saved.time;
            showProgress();
          }
        }, { once: true });
      }
      updatePlayState();
      // Los títulos reales se actualizan en segundo plano, sin frenar el jardín
      setTimeout(refreshAllMeta, 4000);

      animate();
    </script>
  </body>
</html>
